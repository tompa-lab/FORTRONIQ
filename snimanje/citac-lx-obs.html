<!doctype html>

<head>

<title>Čitač i OBS — Festo LX, Uvod u Industriju 4.0</title>
<style>
/* Čitač za drugi zaslon s upravljanjem OBS-om (obs-websocket v5). Otvara se kao lokalna datoteka u Chromeu. */
:root{--paper:#FFFFFF;--ink:#10394A;--body:#55717F;--rule:#D7E1E6;--teal:#17656E;--cyan:#2ECAD4;--bar:#132026;--bar-ink:#E7EEF1;--warn:#B54708;--ok:#1C7C54;--font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.vrh{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);padding:10px 16px}
.red{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.znak b{color:var(--cyan)}
.vr{font:700 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums}
.st{font-size:.85rem;opacity:.8}
.desno{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.vrh button,.vrh select,.vrh input{font:inherit;font-size:.88rem;background:transparent;color:var(--bar-ink);border:1px solid rgba(231,238,241,.35);border-radius:8px;padding:5px 10px}
.vrh button{cursor:pointer}
.vrh button:hover,.vrh button:focus-visible{border-color:var(--cyan);color:var(--cyan);outline:none}
.vrh button.akt{background:var(--cyan);color:#06262B;border-color:var(--cyan)}
.vrh button.rec{border-color:#F04438;color:#FDA29B}.vrh button.rec.akt{background:#F04438;color:#fff}
.vrh select option{color:#10394A}
.obs{margin-top:8px;border-top:1px solid rgba(231,238,241,.18);padding-top:8px}
.obs summary{cursor:pointer;font-size:.88rem;opacity:.9}
.obs .red{margin-top:8px}
.oznaka{font-size:.78rem;opacity:.7}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:#667085;margin-right:6px;vertical-align:middle}
.lamp.ok{background:#3CCB7F}.lamp.greska{background:#F04438}
#poruka{font-size:.82rem;opacity:.85;min-height:1.2em}
.kadrovi{display:flex;flex-wrap:wrap;gap:6px}
.popis{max-width:1100px;margin:0 auto;padding:14px 16px 60vh}
.k{scroll-margin-top:calc(var(--vrh,120px) + 12px);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.k.gotov{opacity:.35}
.gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.t{font:700 1rem var(--mono);color:var(--teal);font-variant-numeric:tabular-nums}
.dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.k h2{margin:0;font-size:1.25rem}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0 0}
.plan span{font:500 .78rem var(--mono);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;color:var(--body)}
.plan span.sad{border-color:var(--teal);color:var(--teal)}
.klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;max-width:70ch}
.dop{font-size:calc(var(--vel,1.45rem)*.82);line-height:1.5;margin:.7rem 0 0;color:var(--body);max-width:70ch}
.dop b{color:var(--ink)}
.napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.napr i{display:block;height:100%;width:0;background:var(--teal)}
/* uređivač kadrova */
#urednik{position:fixed;inset:0;z-index:20;background:rgba(5,14,18,.88);display:none;align-items:center;justify-content:center;padding:16px}
#urednik.otv{display:flex}
.ur-okvir{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;max-width:1300px;width:100%;max-height:100%;overflow:auto}
.ur-okvir h3{margin:0 0 6px}
.ur-okvir p{margin:.2rem 0 .6rem;color:var(--body);font-size:.9rem}
.ur-okvir button{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ur-okvir button.akt{background:var(--teal);color:#fff;border-color:var(--teal)}
#platno{display:block;width:auto;max-width:100%;max-height:62vh;height:auto;margin:10px 0;border-radius:8px;cursor:crosshair;background:#000;touch-action:none}
@media (max-width:680px){.tekst{font-size:1.15rem}.vr{font-size:1.2rem}.vrh{position:static}}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>

   <div class="desno"><button id="b-pogl" title="Preuzmi poglavlja za YouTube iz stvarnih vremena snimke">Poglavlja (.txt)</button><button id="b-srt" title="Preuzmi naslove koraka kao titlove">Naslovi (.srt)</button></div></div>
  <div id="poruka" role="status"></div>

</div>

<div id="urednik" role="dialog" aria-modal="true" aria-labelledby="ur-n"><div class="ur-okvir">
 <h3 id="ur-n">Namjesti kadrove</h3>
 <p>Odaberi kadar, pa na snimci povuci pravokutnik (omjer je zaključan na omjer snimke). Snimka je trenutni prikaz izvora iz OBS-a — prije toga na snimanom zaslonu otvori odgovarajuću stranicu LX-a.</p>

<script>
(function(){
'use strict';
const S=[{"t": 0, "dio": "Uvod", "naslov": "Zašto Industrija 4.0 i zašto LX", "klik": "Početna stranica LX-a (Home) nakon prijave.", "tekst": "U prošlom bloku upoznali smo kobot UR3e. Danas širimo pogled: robot je samo jedan dio pametne tvornice. Kroz tečaj „Introduction to Industry 4.0” na Festovoj platformi Festo Learning Experience, kraće LX, proći ćemo put od prve do četvrte industrijske revolucije, ključne tehnologije industrijskog interneta stvari i promjene koje to donosi poslu i svakodnevici. Usput ćete naučiti koristiti LX, jer ćete na njemu i sami učiti i rješavati zadatke.", "dopuna": "Pitanje za uvod: tko je od vas već čuo izraz Industrija 4.0 — i što mislite da znači?", "kadrovi": [[0, "naslov"], [8, "cijeli"]], "kartica": ["Uvod u Industriju 4.0", "Festo LX — kako koristiti platformu i što je Industrija 4.0"]}, {"t": 120, "dio": "Korištenje LX-a", "naslov": "Račun i prijava", "klik": "Stranica lx.festo.com: gumb „Create a free Account” i „Log In”; nakon prijave izbornik lijevo: Home, Search, My Learning, Assignments.", "tekst": "LX je Festova platforma za e-učenje iz automatizacije, pneumatike, elektrotehnike, robotike i Industrije 4.0. Račun je besplatan: na lx.festo.com odaberete „Create a free Account”, upišete e-poštu i lozinku i potvrdite poruku koja stigne. Nakon prijave lijevo je izbornik: Home s preporučenim sadržajem, Search za pretragu, My Learning s vašim tečajevima i napretkom, te Assignments — zadaci koje vam dodijeli nastavnik.", "dopuna": "Savjet: registrirajte se adresom koju ćete koristiti cijelu godinu, jer se napredak veže uz račun.", "kadrovi": [[0, "cijeli"], [30, "izbornik"], [80, "cijeli"]]}, {"t": 240, "dio": "Korištenje LX-a", "naslov": "Pretraga i stranica tečaja", "klik": "Search → upis „Industry 4.0” → tečaj „Introduction to Industry 4.0”; kartice Overview, Structure, Learning Outcomes.", "tekst": "U pretragu upisujem „Industry 4.0” i otvaram tečaj „Introduction to Industry 4.0”. Kartica Overview kaže: trajanje oko 2 sata, razina za početnike, kategorija IIoT i Industrija 4.0. Kartica Structure pokazuje tri cjeline i ukupno 45 kratkih jedinica — Festo ih zove „nuggets”, grumenčići. Kartica Learning Outcomes navodi 34 ishoda po cjelinama — dobro ih je pročitati prije početka, da znate što se od vas očekuje.", "dopuna": "Pitanje: zašto je dobro sadržaj podijeliti na jedinice od 1 do 4 minute?", "kadrovi": [[0, "cijeli"], [50, "sadrzaj"], [120, "cijeli"]]}, {"t": 390, "dio": "Korištenje LX-a", "naslov": "Preglednik sadržaja", "klik": "Gumb za početak tečaja → preglednik: gornja traka Navigation, Bookmarks, Spoken text, Sound, Export, Settings, More; strelice lijevo-desno; traka napretka ispod naslova.", "tekst": "Otvaram tečaj. Gornja traka preglednika: Navigation otvara popis svih jedinica, Bookmarks sprema oznake, Spoken text prikazuje izgovoreni tekst kao titlove, Sound uključuje zvuk, Export izvozi sadržaj, a Settings mijenja postavke, među njima i jezik. Strelicama desno gore idete na sljedeću stranicu; crta ispod naslova pokazuje koliko je stranica u jedinici. Pri prvom otvaranju LX pita želite li zvuk — u predavanju ga isključujem i komentiram na hrvatskom.", "dopuna": "Savjet za samostalni rad: uključite Spoken text — lakše je pratiti engleski uz tekst.", "kadrovi": [[0, "cijeli"], [20, "traka"], [100, "sadrzaj"]]}, {"t": 540, "dio": "Korištenje LX-a", "naslov": "Navigacija i napredak", "klik": "Navigation: popis cjelina i jedinica s trajanjem; povratak na Home → My Learning (napredak tečaja).", "tekst": "U Navigaciji su sve jedinice s trajanjem — uz svaku piše koliko minuta traje. Klikom skačete na bilo koju. LX pamti dokle ste stigli: u My Learning vidite svoje tečajeve i napredak i nastavljate gdje ste stali.", "dopuna": "", "kadrovi": [[0, "izbornik"], [35, "cijeli"]]}, {"t": 600, "dio": "Uvod u tečaj", "naslov": "Catherine i važnost Industrije 4.0", "klik": "Navigation → „What is the Industry 4.0?” → „Catherine and the significance of the Industry 4.0”; zatim „Overview — Training content”.", "tekst": "Tečaj vodi priča o Catherine i Davidu: kroz njihove razgovore i primjere iz tvornice upoznajemo pojmove. Prva jedinica postavlja pitanje: što se zapravo mijenja kad tvornica postane „pametna”? Pregled sadržaja pokazuje tri cjeline: put do četvrte revolucije, ključni elementi industrijskog interneta stvari i promjene u privatnom i profesionalnom životu.", "dopuna": "Pitanje: što bi za vas bila „pametna” tvornica — navedite jednu stvar koju bi radila drukčije od današnje.", "kadrovi": [[0, "naslov"], [6, "sadrzaj"]], "kartica": ["Uvod u tečaj", "Catherine i važnost Industrije 4.0"]}, {"t": 780, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Četiri industrijske revolucije", "klik": "Learning Unit 01 → „Catherine and David begin their journey”, zatim „The path from the first industrial revolution to Industry 4.0”.", "tekst": "Prva revolucija krajem 18. stoljeća: parni stroj i mehanizacija. Druga, krajem 19.: električna energija i masovna proizvodnja na pokretnoj traci. Treća, od sedamdesetih: elektronika, računala i PLC-ovi — automatizacija. Četvrta je umrežavanje: strojevi, proizvodi i ljudi povezani su i razmjenjuju podatke u stvarnom vremenu. Važno: prve tri revolucije imenovane su naknadno, a četvrta je proglašena unaprijed, kao cilj.", "dopuna": "Pitanje: u koju revoluciju spada robot UR3e sam za sebe, a u koju robot spojen na mrežu tvornice koji javlja svoje stanje?", "kadrovi": [[0, "naslov"], [6, "sadrzaj"]]}, {"t": 1020, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Podrijetlo izraza „Industrija 4.0”", "klik": "„Catherine and the origin of the term Industry 4.0” → „Where does the term Industry 4.0 come from?”.", "tekst": "Izraz Industrie 4.0 nastao je u Njemačkoj, javno je predstavljen na sajmu u Hannoveru 2011. kao dio njemačke strategije za visoku tehnologiju. Drugdje se koriste slični pojmovi: u SAD-u industrijski internet, a općenito se govori o pametnoj tvornici ili digitalnoj transformaciji proizvodnje.", "dopuna": "Pitanje: zašto je Njemačkoj kao izvoznici strojeva bilo važno postaviti taj cilj?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 1200, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Što omogućuje Industriju 4.0", "klik": "„Enablers of the fourth industrial revolution” → „Which technologies are contributing to the development of Industry 4.0?”.", "tekst": "Zašto baš sada? Jer su se istodobno pojeftinili i ubrzali senzori, računalna snaga, pohrana podataka i mrežna veza, a pojavili su se oblak, mobilni uređaji i bežične mreže. Kad svaki senzor može za male novce poslati podatke, a svaki stroj ima računalo, umrežavanje postaje isplativo.", "dopuna": "Poveznica s prošlim blokom: UR3e šalje stanje svakog zgloba 500 puta u sekundi i ima Ethernet s Modbus TCP-om, EtherNet/IP-om i PROFINET-om — spreman je za umrežavanje.", "kadrovi": [[0, "sadrzaj"]]}, {"t": 1380, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Industrija 4.0 i internet stvari", "klik": "„Catherine and the Internet of Things”, zatim „Industry 4.0 as part of IoT” (veza IoT, digitalizacija, Industrija 4.0).", "tekst": "Internet stvari, IoT, znači da su predmeti spojeni na mrežu i razmjenjuju podatke. Industrija 4.0 je njegov industrijski dio; uz nju su pametna kuća i zgrada, pametna mreža, pametna mobilnost i pametno društvo. Digitalizacija je širi pojam — pretvaranje podataka i postupaka u digitalni oblik — a Industrija 4.0 ide korak dalje: umreženi sustavi koji se djelomično sami organiziraju.", "dopuna": "Pitanje: je li skeniranje papirnatog radnog naloga u PDF digitalizacija ili Industrija 4.0? A nalog koji stroj sam preuzme iz sustava?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 1560, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Je li Industrija 4.0 samo pomodnost?", "klik": "„Catherine and the hype surrounding Industry 4.0”, zatim „Industry 4.0 – all just hype?” (Gartnerova krivulja).", "tekst": "Gartnerova krivulja pomodnosti opisuje kako nova tehnologija prolazi kroz pet faza: okidač, vrhunac pretjeranih očekivanja, dolina razočaranja, uspon prosvjetljenja i plato produktivnosti. Moja je procjena da je Industrija 4.0 prošla vrhunac — danas se manje priča, a više uvodi ondje gdje se isplati.", "dopuna": "Pitanje: gdje biste na krivulji danas smjestili umjetnu inteligenciju, a gdje kolaborativne robote?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 1800, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Provjera znanja — cjelina 1", "klik": "„Comprehension test”: Question: Industrial Revolution, Question: IoT, Digitalization and Industry 4.0, Question: Fourth Industrial Revolution.", "tekst": "Na kraju cjeline su tri pitanja. Rješavamo ih zajedno: prvo glasate vi, a onda ja kliknem odgovor i pogledamo rezultat.", "dopuna": "Prije klika: pustite studente da odgovore naglas ili dignu ruku za svaki ponuđeni odgovor.", "kadrovi": [[0, "cijeli"], [20, "sadrzaj"]]}, {"t": 2160, "dio": "Cjelina 1: Put do 4. industrijske revolucije", "naslov": "Sažetak cjeline 1", "klik": "Navigation (pregled prijeđenih jedinica).", "tekst": "Sažetak: četiri revolucije — mehanizacija, elektrifikacija, automatizacija, umrežavanje. Industrija 4.0 je industrijski dio interneta stvari, omogućili su je jeftini senzori, računala, mreže i oblak, a nakon pomodnog vrhunca danas je stvarnost u tvornicama koje je uvode postupno.", "dopuna": "", "kadrovi": [[0, "izbornik"], [50, "cijeli"]]}, {"t": 2280, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Industrija 4.0 u stvarnosti — pregled", "klik": "Learning Unit 02 → „Catherine and the key elements of Industry 4.0”, „Overview — Industry 4.0 in production”.", "tekst": "Druga cjelina je jezgra tečaja. U proizvodnji su ključni elementi: komunikacija stroj–stroj, nadzor stanja, pametno održavanje, digitalni blizanac, sljedivost proizvoda, podaci u stvarnom vremenu i uključivanje zaposlenika. Pregled ih prikazuje zajedno, a sljedeće jedinice obrađuju jedan po jedan.", "dopuna": "Pitanje: koji od tih elemenata postoji u vašoj tvrtki ili tvrtki koju poznajete?", "kadrovi": [[0, "naslov"], [6, "sadrzaj"]]}, {"t": 2520, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Digitalni blizanac i RFID", "klik": "„Digital twin”, zatim „RFID”.", "tekst": "Digitalni blizanac je virtualna slika stvarnog proizvoda ili stroja, povezana s njim podacima, pa se ponaša kao original. Primjer imate otprije: 3D model UR3e na našim stranicama građen je iz stvarnih DH parametara — kad bi bio spojen na pravi robot i primao kutove zglobova, bio bi njegov digitalni blizanac. RFID je beskontaktna identifikacija radio-valovima: oznaka na proizvodu nosi podatke koje čitač očita bez kontakta i bez vidljivosti, pa proizvod „zna” tko je i kamo ide.", "dopuna": "Pitanje: koja je razlika između 3D modela i digitalnog blizanca?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 2700, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Pametno održavanje i nadzor stanja", "klik": "„Smart Maintenance”, zatim „Condition monitoring”.", "tekst": "Klasično održavanje je ili nakon kvara ili u stalnim razmacima. Pametno održavanje oslanja se na nadzor stanja: senzori stalno mjere vibracije, temperaturu, struju, pa se kvar predvidi i održavanje planira prije zastoja. Primjer s UR3e: dva enkodera u zglobu stalno se uspoređuju, a test kočnica radi se pri svakom pokretanju — robot sam javlja „Brake test failed” ili grešku enkodera prije nego što kvar postane opasan.", "dopuna": "Pitanje: koje biste veličine mjerili da predvidite kvar ležaja?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 2880, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Komunikacija stroj–stroj (M2M)", "klik": "„M2M communication”.", "tekst": "M2M znači da strojevi izravno razmjenjuju podatke, bez čovjeka u sredini: stanica javi robotu da je dio spreman, robot javi traci da je uzeo dio. Za to su potrebni zajednički protokoli — OPC UA, Modbus TCP, PROFINET, EtherNet/IP.", "dopuna": "", "kadrovi": [[0, "sadrzaj"]]}, {"t": 2970, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Podrška ljudima: suradnja čovjeka i robota i proširena stvarnost", "klik": "„Overview — Industry 4.0 to support people”, „Human–robot collaboration”, „Augmented reality”.", "tekst": "Drugi skup elemenata izravno pomaže ljudima u proizvodnji. Suradnja čovjeka i robota: kolaborativni robot radi uz čovjeka bez ograde, uz ograničenje sile, brzine i snage — upravo ono što smo vidjeli na UR3e, s 23 sigurnosne funkcije. Proširena stvarnost preko stvarne slike crta digitalne podatke: upute za montažu, stanje stroja, ili cijeli robot u stvarnoj veličini — kao naš UR3e na mobitelu.", "dopuna": "Pitanje: koji posao u tvornici biste dali kobotu, a koji ostavili čovjeku?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 3180, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Upravljanje pametnom tvornicom: ERP i MES", "klik": "„Catherine and the ERP and MES planning systems”, zatim „ERP and MES — Two Important Systems with Different Objectives”.", "tekst": "Dva sustava upravljaju tvornicom na različitim razinama. ERP planira poslovanje: narudžbe, nabavu, zalihe, financije — u danima i tjednima. MES upravlja proizvodnjom na pogonu: koji nalog na kojem stroju, praćenje izvođenja, kvaliteta, sljedivost — u minutama i sekundama. U Industriji 4.0 ta dva sustava i strojevi razmjenjuju podatke bez prepisivanja.", "dopuna": "Pitanje: tko odlučuje koliko komada proizvesti ovaj tjedan, a tko na kojem stroju ide sljedeći nalog?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 3480, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Digitalna sjena", "klik": "„Digital Shadow”, zatim „Question: Digital Shadow and Digital Twin”.", "tekst": "Digitalna sjena je skup stvarnih podataka iz procesa — mjerenja, stanja, događaja — koji prati proizvodnju. Razlika: sjena samo bilježi stvarnost u jednom smjeru, a digitalni blizanac je model koji se s originalom povezuje u oba smjera i na kojem se može simulirati. Slijedi pitanje — rješavamo zajedno.", "dopuna": "", "kadrovi": [[0, "sadrzaj"]]}, {"t": 3630, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Podaci, kibernetička sigurnost, veliki podaci i oblak", "klik": "„Catherine and the significance of data”, „Data — the gold of Industry 4.0”, „Cyber security”, „Big Data”, „Cloud”.", "tekst": "Podaci su „zlato” Industrije 4.0 — ali samo ako se prikupljaju, pohranjuju i štite. Kibernetička sigurnost postaje dio sigurnosti stroja: umreženi stroj može se napasti. Veliki podaci su količine koje se ne mogu obraditi ručno — iz njih se traže obrasci, npr. najava kvara. Oblak je pohrana i računalna snaga preko mreže: javni, privatni ili hibridni.", "dopuna": "Pitanje: koje biste podatke iz robota slali u oblak, a koje nikako ne biste?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 3960, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Vanjski partneri i pametni proizvodi", "klik": "„Catherine and external players”, „Networking with external players”, „Intelligent products”, „Objectives of Industry 4.0”.", "tekst": "Pametna tvornica nije zatvorena: povezuje se s dobavljačima, koji vide zalihe i sami dopunjavaju, i s kupcima, koji prate narudžbu ili sami konfiguriraju proizvod. Pametni proizvod LX opisuje kroz četiri sastavnice — pročitajmo ih zajedno na zaslonu: proizvod sam nosi podatke, javlja svoje stanje i nudi usluge. Ciljevi su veća fleksibilnost, proizvodnja malih serija po cijeni velikih, manje zastoja i bolja kvaliteta.", "dopuna": "", "kadrovi": [[0, "sadrzaj"]]}, {"t": 4200, "dio": "Cjelina 2: Ključni elementi industrijskog IoT-a", "naslov": "Provjera znanja — cjelina 2", "klik": "„Comprehension test”: Question: Industrial Internet, Question: Key Elements of Industry 4.0.", "tekst": "Dva pitanja za kraj druge cjeline. Glasajte, pa provjeravamo.", "dopuna": "", "kadrovi": [[0, "cijeli"], [20, "sadrzaj"]]}, {"t": 4320, "dio": "Cjelina 3: Promjene u životu i poslu", "naslov": "Strah za radna mjesta i digitalizacija svakodnevice", "klik": "Learning Unit 03 → „Catherine and the fear about job security”, „Digitalization in our private life”.", "tekst": "Treća cjelina govori o ljudima. Prvo strah: hoće li roboti i automatizacija oduzeti posao? Zatim primjeri iz svakodnevice: bankarstvo, kupnja, navigacija, komunikacija — sve se promijenilo u petnaestak godina, a mnoge od tih promjena prihvatili smo bez otpora.", "dopuna": "Pitanje: koji ste posao u svakodnevici prestali raditi jer ga radi aplikacija?", "kadrovi": [[0, "naslov"], [6, "sadrzaj"]]}, {"t": 4560, "dio": "Cjelina 3: Promjene u životu i poslu", "naslov": "Digitalizacija na poslu: primjer aplikacije za utovar", "klik": "„Digitalization in everyday working life”, „Catherine and the use of apps” — „A practical example: the loading app”.", "tekst": "Na poslu se digitalizacija vidi u malim alatima. Primjer u tečaju je aplikacija za utovar: pogledajmo što radi umjesto papirnatog popisa i ručnog prepisivanja — i koje greške time nestaju.", "dopuna": "", "kadrovi": [[0, "sadrzaj"]]}, {"t": 4680, "dio": "Cjelina 3: Promjene u životu i poslu", "naslov": "Rizik automatizacije poslova", "klik": "„Catherine and changing work assignments”, „The risk of the automation of jobs”, „Question: Professions”.", "tekst": "Automatizira se zadatak, a ne zanimanje u cjelini. Visok je rizik za poslove s mnogo rutinskih, ponovljivih zadataka, a nizak za poslove koji traže kreativnost, društvene vještine, rješavanje neočekivanih problema i rad s ljudima. Slijedi pitanje o zanimanjima — procijenite rizik za svako.", "dopuna": "Pitanje: koji su zadaci u poslu inženjera mehatronike najviše izloženi automatizaciji, a koji najmanje?", "kadrovi": [[0, "sadrzaj"]]}, {"t": 4920, "dio": "Cjelina 3: Promjene u životu i poslu", "naslov": "Tržište rada i nove kompetencije", "klik": "„Impact of digitalization on the labor market”, „Digitalization in our professional lives”, „Catherine and the change of competencies”, „Competency profiles in transition”, „Question: Changes Caused by Digitalization”.", "tekst": "Digitalizacija ima prednosti i nedostatke za tržište rada: nestaju neka radna mjesta, nastaju nova — programiranje i održavanje robota, analiza podataka, integracija sustava. Mijenja se profil kompetencija: uz stručno znanje traže se digitalne vještine, razumijevanje cijelog sustava, rješavanje problema i cjeloživotno učenje. Upravo to je razlog zašto učimo i na platformama poput LX-a.", "dopuna": "", "kadrovi": [[0, "sadrzaj"]]}, {"t": 5190, "dio": "Završetak", "naslov": "Sažetak tečaja", "klik": "Navigation → „Summary — Introduction to Industry 4.0”.", "tekst": "Sažetak tečaja povezuje sve: četvrta revolucija je umrežavanje strojeva, proizvoda i ljudi; ključni elementi su digitalni blizanac, nadzor stanja i pametno održavanje, M2M, suradnja čovjeka i robota, proširena stvarnost, ERP i MES, podaci i oblak; a mijenjaju se i poslovi i kompetencije.", "dopuna": "", "kadrovi": [[0, "naslov"], [6, "izbornik"], [30, "sadrzaj"]], "kartica": ["Završetak", "Sažetak tečaja"]}, {"t": 5280, "dio": "Završetak", "naslov": "Zadatak i zaključak", "klik": "My Learning (napredak tečaja); po želji Assignments.", "tekst": "Zadatak: prijavite se na LX i prođite cijeli tečaj „Introduction to Industry 4.0”, s provjerama znanja, do roka koji ću objaviti. Ako ste u mojoj organizaciji na LX-u, vaš napredak vidim kao nastavnik. Za sljedeći sat razmislite kako bi robotska stanica s UR3e izgledala u pametnoj tvornici: što bi slala MES-u, a što bi radio njezin digitalni blizanac. Hvala na pažnji.", "dopuna": "Ako studentima zadatak dodjeljujete kroz Organization → Learners → Assignments, napomenite gdje će ga vidjeti (izbornik Assignments).", "kadrovi": [[0, "cijeli"], [95, "naslov"]], "kartica": ["Hvala na pažnji", "Zadatak: prođite cijeli tečaj na LX-u, s provjerama znanja"]}], KRAJ=5400, KD={"cijeli": {"naziv": "Cijeli zaslon", "tipka": "1"}, "sadrzaj": {"naziv": "Sadržaj", "tipka": "2", "r": [0.12, 0.13, 0.76]}, "traka": {"naziv": "Gornja traka", "tipka": "3", "r": [0.42, 0.0, 0.58]}, "izbornik": {"naziv": "Izbornik lijevo", "tipka": "4", "r": [0.0, 0.06, 0.45]}, "naslov": {"naziv": "Naslovna kartica", "tipka": "5"}}, KLJUC='ftq-citac-lx-obs';

 '<div class="plan">'+k.kadrovi.map((p,j)=>'<span data-j="'+j+'">'+mm(k.t+p[0])+' '+esc(KD[p[1]].naziv)+'</span>').join('')+'</div>'+
 '<p class="klik">'+esc(k.klik)+'</p><p class="tekst">'+esc(k.tekst)+'</p>'+(k.dopuna?'<p class="dop"><b>Dopuna / pitanje: </b>'+esc(k.dopuna)+'</p>':'')+'<div class="napr"><i></i></div></article>').join('');

 if($('c-pauzarec').checked&&obs.ok&&snima)R(igra?'ResumeRecord':'PauseRecord').catch(()=>{})}

 if(e.key===' '){e.preventDefault();igrajPauza()}else if(e.key==='ArrowRight')dalje();else if(e.key==='ArrowLeft')prije();
 else{const k=KAD.find(x=>KD[x].tipka===e.key);if(k)rucniKadar(k)}});

/* ---------- SHA-256 i base64 (za prijavu u OBS) ---------- */
function sha256(bytes){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 const w=new Uint32Array(64),r=(x,c)=>(x>>>c)|(x<<(32-c));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);

 if($('c-pamti').checked){sp('url',url);sp('loz',loz)}else{sp('loz','')}

 let ws;try{ws=new WebSocket(url,'obswebsocket.json')}catch(e){lamp('greska','Neispravna adresa');return}
 obs.ws=ws;obs.ok=false;
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const d=m.d||{};
  if(m.op===0){const id={rpcVersion:1,eventSubscriptions:4|64};
   if(d.authentication){if(!loz){lamp('greska','OBS traži lozinku');ws.close();return}id.authentication=obsAuth(loz,d.authentication.salt,d.authentication.challenge)}

const polozaj=(sc,id,x,y,dod)=>R('SetSceneItemTransform',{sceneName:sc,sceneItemId:id,sceneItemTransform:Object.assign({positionX:Math.round(x),positionY:Math.round(y),alignment:5,rotation:0,scaleX:1,scaleY:1},dod||{})});

 if(!t.sourceWidth){await new Promise(r=>setTimeout(r,400));t=(await R('GetSceneItemTransform',{sceneName:sc,sceneItemId:id})).sceneItemTransform||{}}

const pl=$('platno'),cx=pl.getContext('2d');
$('ur-kadrovi').innerHTML=ZOOM.map(k=>'<button data-k="'+k+'">'+esc(KD[k].naziv)+'</button>').join('');
function urOznaci(){document.querySelectorAll('#ur-kadrovi button').forEach(b=>b.classList.toggle('akt',b.dataset.k===urK))}
function urCrtaj(){cx.fillStyle='#000';cx.fillRect(0,0,pl.width,pl.height);if(slika)cx.drawImage(slika,0,0,pl.width,pl.height);
 for(const k of ZOOM){const o=okvirKadraU(k);cx.lineWidth=k===urK?4:2;cx.strokeStyle=k===urK?'#2ECAD4':'rgba(255,255,255,.6)';cx.setLineDash(k===urK?[]:[8,6]);
  cx.strokeRect(o.x*pl.width,o.y*pl.height,o.w*pl.width,o.h*pl.height);cx.setLineDash([]);cx.fillStyle=k===urK?'#2ECAD4':'rgba(255,255,255,.8)';cx.font='600 22px Segoe UI, sans-serif';cx.fillText(KD[k].naziv,o.x*pl.width+8,o.y*pl.height+26)}}
function okvirKadraU(k){const s=reg;reg=regU;const o=okvirKadra(k,sw0,sh0);reg=s;return o}
async function urSnimka(){if(!obs.ok){poruka('Spoji OBS za snimku izvora.');return}
 try{const izv=$('s-izvor').value;const sc=scena('cijeli');if(ids[sc]&&ids[sc].izvor!=null){[sw0,sh0]=await velicinaIzvora(sc,ids[sc].izvor)}
  pl.width=1280;pl.height=Math.round(1280*sh0/sw0);
  /* OBS iscrtava snimanje zaslona samo dok je izvor aktivan: prije snimke prebaci na scenu Cijeli zaslon */
  if(spremno&&trenScena!==scena('cijeli')){await R('SetCurrentProgramScene',{sceneName:scena('cijeli')});trenScena=scena('cijeli');zadKadar='cijeli';oznaciKadar();await new Promise(r=>setTimeout(r,600))}
  const r=await R('GetSourceScreenshot',{sourceName:izv,imageFormat:'jpg',imageWidth:1280,imageCompressionQuality:75});
  const im=new Image();im.onload=()=>{slika=im;urCrtaj()};im.src=r.imageData}catch(e){poruka('Snimka nije uspjela: '+e.message)}}
$('b-uredi').onclick=()=>{regU=JSON.parse(JSON.stringify(reg));$('urednik').classList.add('otv');urOznaci();urCrtaj();urSnimka()};
$('ur-zatvori').onclick=()=>$('urednik').classList.remove('otv');
$('ur-osvjezi').onclick=urSnimka;
$('ur-kadrovi').addEventListener('click',e=>{const b=e.target.closest('button');if(b){urK=b.dataset.k;urOznaci();urCrtaj()}});
$('ur-zadano').onclick=()=>{regU[urK]=KD[urK].r.slice();urCrtaj()};
const tocka=e=>{const r=pl.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
pl.addEventListener('pointerdown',e=>{vuce=tocka(e);pl.setPointerCapture(e.pointerId)});
pl.addEventListener('pointermove',e=>{if(!vuce)return;const[x,y]=tocka(e);let w=Math.abs(x-vuce[0]);const kh=(sw0/sh0)*(CH/CW);
 if(Math.abs(y-vuce[1])/kh>w)w=Math.abs(y-vuce[1])/kh;w=Math.max(.08,Math.min(1,w));const h=w*kh;
 let x0=x<vuce[0]?vuce[0]-w:vuce[0],y0=y<vuce[1]?vuce[1]-h:vuce[1];x0=Math.max(0,Math.min(1-w,x0));y0=Math.max(0,Math.min(1-h,y0));
 regU[urK]=[+x0.toFixed(4),+y0.toFixed(4),+w.toFixed(4)];urCrtaj()});
pl.addEventListener('pointerup',()=>{vuce=null});
$('ur-spremi').onclick=async()=>{reg=JSON.parse(JSON.stringify(regU));sp('reg',reg);
 if(obs.ok){try{const sc=scena('cijeli');if(!ids[sc]||ids[sc].izvor==null)await ucitajIds();const[sw,sh]=await velicinaIzvora(sc,ids[sc].izvor);for(const k of ZOOM)await postaviZoom(k,sw,sh);poruka('Kadrovi spremljeni i primijenjeni u OBS-u.')}catch(e){poruka('Spremljeno, ali nije primijenjeno: '+e.message)}}
 else poruka('Kadrovi spremljeni; primijenit će se kod sljedeće pripreme scena.');
 $('urednik').classList.remove('otv')};

/* ---------- glavna petlja ---------- */
function crtaj(){let s=sad();const i0=ki(s);
 if(igra&&$('c-cekaj').checked&&!ceka&&i0>zadUCekanju){const kraj=S[zadUCekanju+1]?S[zadUCekanju+1].t:KRAJ;if(s>=kraj&&zadUCekanju>=0){sat=kraj-.05;igra=false;ceka=true;s=sat}}
 const i=ki(s),sl=i+1<S.length?S[i+1].t:KRAJ;if(!ceka)zadUCekanju=i;
 if(igra&&s>=KRAJ){sat=KRAJ;igra=false}
 $('vr').textContent=mm(s)+' / '+mm(KRAJ);
 $('st').textContent=(ceka?'čeka ⏭ (sljedeći korak)':igra?'sat teče':'pauza')+' · sljedeće za '+mm(sl-s)+(snima?' · ● snima '+hms((performance.now()-rec0)/1000):'')+' · dvoklik na korak = skok';
 $('b-igraj').textContent=igra?'⏸ Pauza':'▶ Pokreni';
 if(i!==zad){document.querySelectorAll('.k').forEach((el,j)=>{el.classList.toggle('sada',j===i);el.classList.toggle('gotov',j<i)});
  const el=$('k'+i);if(el&&zad>=0)el.scrollIntoView({behavior:'smooth',block:'start'});zad=i;zabiljezi(i)}
 if(i!==zadTekst&&obs.ok){tekstovi(i);zadTekst=i}
 const kd=kadarU(s);
 document.querySelectorAll('#k'+i+' .plan span').forEach(e=>e.classList.toggle('sad',+e.dataset.j===kd.j));
 if(rucno&&(rucno.od.i!==kd.i||rucno.od.j!==kd.j))rucno=null;
 const zelja=rucno?rucno.k:kd.k;
 if($('c-auto').checked&&obs.ok&&!rucno&&zelja!==zadKadar){zadKadar=zelja;prebaci(zelja)}
 const b=document.querySelector('#k'+i+' .napr i');if(b)b.style.width=Math.min(100,(s-S[i].t)/(sl-S[i].t)*100)+'%';
 requestAnimationFrame(crtaj)}
const vrhV=()=>document.documentElement.style.setProperty('--vrh',document.querySelector('.vrh').offsetHeight+'px');vrhV();
new ResizeObserver(vrhV).observe(document.querySelector('.vrh'));
requestAnimationFrame(crtaj);
window.__citac={get sat(){return sad()},post,igraj,dalje,obs,get ids(){return ids},get reg(){return reg},R,pripremi,obsAuth,sha256,b64,utf8,poglavlja};
})();
</script>
