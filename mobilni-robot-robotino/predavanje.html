<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Predavanje — Mobilni robot Robotino | FORTRONIQ</title>
<link rel="icon" href="../favicon.ico">
<style>
:root{--paper:#fff;--ink:#10394A;--body:#5D7C90;--rule:#DCE4E8;--teal:#17656E;--teal-d:#0F4A52;--cyan:#2ECAD4;--bar:#17181A;--tanko:#EEF4F6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body.reziser{overflow:hidden;background:#000}
#okvir{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#fff}
#kursor{position:fixed;left:0;top:0;z-index:50;width:26px;height:26px;pointer-events:none;transform:translate(960px,540px);transition:transform .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#kursor svg{display:block;width:26px;height:26px}
#kursor.skriven{opacity:0}
.val{position:fixed;z-index:49;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #2ECAD4;pointer-events:none;animation:val .55s ease-out forwards}
@keyframes val{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
#traka{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:10px;background:rgba(16,24,28,.88);color:#E9EDEF;border:1px solid rgba(46,202,212,.5);border-radius:12px;padding:8px 12px;font-size:14px;transition:opacity .4s;max-width:min(760px,calc(100vw - 28px))}
#traka.skrij{opacity:0;pointer-events:none}
#traka button{font:inherit;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:4px 10px;cursor:pointer}
#traka button:hover{border-color:#2ECAD4;color:#2ECAD4}
#traka .vr{font-variant-numeric:tabular-nums;font-weight:600;min-width:110px}
#traka .nas{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(9,22,26,.86)}
#start[hidden]{display:none}
.karta{background:var(--paper);color:var(--ink);border-radius:16px;max-width:720px;width:calc(100% - 32px);padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.karta h1{margin:0 0 6px;font-size:1.6rem;letter-spacing:-.02em}
.karta .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem;color:var(--body)}.karta .znak b{color:var(--cyan)}
.karta p,.karta li{color:var(--body);line-height:1.55;font-size:.97rem}
.karta ol{padding-left:1.2rem;margin:.6rem 0 1rem}
.gumbi{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.gumb{font:inherit;font-weight:600;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.7rem 1.3rem;cursor:pointer}
.gumb.tanki{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.gumb:focus-visible,#traka button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
kbd{font:600 .85em "IBM Plex Mono",ui-monospace,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 .35em;color:var(--ink)}
/* ---------------- čitač */
body.citac{background:var(--paper)}
.c-vrh{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:var(--bar);color:#E9EDEF}
.c-vrh .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.c-vrh .znak b{color:var(--cyan)}
.c-vrh .vr{font:700 1.5rem/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.c-vrh .st{font-size:.85rem;color:#9DB6C2}
.c-vrh button{font:inherit;font-size:.9rem;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:5px 10px;cursor:pointer}
.c-vrh button:hover{border-color:#2ECAD4;color:#2ECAD4}
.c-vrh .desno{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.c-popis{max-width:1100px;margin:0 auto;padding:14px 18px 60vh}
.c-k{border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.c-k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.c-k.gotov{opacity:.35}
.c-k .gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.c-k .t{font:700 1rem "IBM Plex Mono",ui-monospace,monospace;color:var(--teal)}
.c-k .dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.c-k h2{margin:0;font-size:1.25rem;color:var(--ink)}
.c-k .klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.c-k .tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;color:var(--ink)}
.c-k .dop{font-size:calc(var(--vel,1.45rem) * .82);line-height:1.5;margin:.7rem 0 0;color:var(--body)}
.c-k .dop b{color:var(--ink)}
.c-k .napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.c-k .napr i{display:block;height:100%;width:0;background:var(--teal)}
@media (max-width:680px){.c-k .tekst{font-size:1.15rem}.c-vrh .vr{font-size:1.2rem}}
</style>
</head>
<body>
<script>window.SCENARIJ = [{"t": 0, "dio": "Uvod", "naslov": "Dobrodošlica i cilj predavanja", "str": "index", "radnje": [["str", "index"], ["cekaj", 3]], "klik": "Naslovnica područja Mobilni robot Robotino.", "tekst": "Dobar dan. Danas je tema mobilni robot koji se ne mora okretati da bi krenuo u stranu. To je Festo Robotino, robot koji stoji u didaktičkoj tvornici i vozi nosače izradaka između stanica. Prvo ćemo vidjeti na kakvim kotačima voze mobilni roboti i zašto je svesmjerni, švedski kotač poseban. Zatim ćemo Robotina rastaviti dio po dio, izračunati koliko se brzo vrti svaki motor i na kraju njime upravljati u simulatoru i staviti ga u prostor u proširenoj stvarnosti. Sve radi u običnom pregledniku, pa sve možete ponoviti sami, na računalu ili na mobitelu.", "dopuna": "Mobilni robot je robot koji mijenja mjesto, za razliku od robotske ruke koja je pričvršćena za pod. Pitanje: gdje ste u zadnje vrijeme vidjeli mobilnog robota — u trgovini, bolnici, skladištu?"}, {"t": 90, "dio": "Uvod", "naslov": "Što ćemo moći nakon predavanja", "str": "index", "radnje": [["lebdi", "#goals li:nth-child(1)"], ["cekaj", 11], ["lebdi", "#goals li:nth-child(2)"], ["cekaj", 11], ["lebdi", "#goals li:nth-child(3)"], ["cekaj", 11], ["lebdi", "#goals li:nth-child(4)"], ["cekaj", 11], ["lebdi", "#goals li:nth-child(5)"]], "klik": "Blok „Moći ću” — pet ishoda (pokazivač prelazi preko svakoga).", "tekst": "Na vrhu stranice je pet ishoda, a danas im dodajemo i šesti: razlikovati vrste kotača i rasporede pogona mobilnih robota. Nakon sata trebali biste znati nabrojati dijelove Robotina i pokazati ih na robotu; objasniti građu pogonske jedinice i svesmjernog kotača; izračunati brzine motora iz zadane brzine robota i obrnuto; objasniti rad senzora, odbojnika, laserskog skenera i sigurnosnog kruga s nužnim stopom; te voziti robota u simulatoru i pristati na stanicu za punjenje. Na kraju sata te ćemo ishode provjeriti.", "dopuna": "Ishodi su napisani glagolima koje se može provjeriti: nabrojati, objasniti, izračunati, voziti. Zapišite ih — na kraju sata svaki ćemo označiti."}, {"t": 180, "dio": "Uvod", "naslov": "Plan sata i poglavlja", "str": "index", "radnje": [["skrol", ".moduli"], ["cekaj", 3], ["lebdi", ".moduli li:nth-child(1) .gumb"], ["cekaj", 10], ["lebdi", ".moduli li:nth-child(2) .gumb"], ["cekaj", 10], ["lebdi", ".moduli li:nth-child(3) .gumb"], ["cekaj", 10]], "klik": "Popis poglavlja Robotina: Upoznavanje robota, Upravljanje robotom, Robot u proširenoj stvarnosti.", "tekst": "Sat ima sedam dijelova. Prvo kotači mobilnih robota općenito, iz područja Mobilna robotika. Zatim svesmjerni kotač izbliza, pa Robotino dio po dio u poglavlju Upoznavanje robota. Četvrti dio je kinematika — kako se iz željenog gibanja računaju brzine motora; tu ima formula, i tko želi, može ga preskočiti. Peti dio je upravljanje robotom u simulatoru laboratorija — proći ćemo svih deset nizova. Šesti dio je Robotino u pametnoj tvornici CP Factory, a sedmi robot u proširenoj stvarnosti i zadatak za vas.", "dopuna": "Sve stranice rade bez instalacije, u pregledniku, i pamte napredak. Četvrti dio s formulama može se preskočiti; sve ostalo može se pokazati učenicima istim redom."}, {"t": 270, "dio": "1 Kotači", "naslov": "Zašto kotač", "str": "kot", "radnje": [["str", "kot"], ["cekaj", 3], ["skrol", "#s1"], ["cekaj", 20], ["skrolY", 0], ["cekaj", 6], ["skrol", "#s1"]], "klik": "Mobilna robotika, jedinica 2.3 Roboti na kotačima — odjeljak „Zašto kotač pobjeđuje”.", "tekst": "Gotovo svaki mobilni robot koji doista radi — u skladištu, bolnici ili tvornici — vozi na kotačima. Razlog je jednostavan: dodirna točka kotača ne kliže po podlozi, nego se u svakom trenutku stvara nova. Zato je otpor kotrljanja po tvrdoj podlozi pet do deset puta manji nego kod hodanja, a kotač treba jedan motor i jedan enkoder umjesto tri. Pitanje zato nije hoće li robot imati kotače, nego koliko kotača, koje vrste i koji od njih imaju pogon. Ta tri odgovora određuju kako se robot giba, kako se okreće i koliko točno zna gdje je.", "dopuna": "Hodajući roboti postoje i napreduju, ali u zgradama gotovo i nema drugih izvedbi osim kotača. Pitanje: na kakvoj podlozi kotač gubi prednost pred nogama?"}, {"t": 360, "dio": "1 Kotači", "naslov": "Četiri vrste kotača: standardni", "str": "kot", "radnje": [["skrol", "#s2"], ["cekaj", 3], ["klik", "#kchips .chip:nth-child(1)"], ["cekaj", 20], ["lebdi", "#ksvg"], ["cekaj", 20], ["lebdi", "#ko"]], "klik": "Odjeljak „Četiri vrste kotača”: odabran standardni kotač; crtež i opis desno.", "tekst": "Svaki kotač mobilnog robota pripada jednoj od četiriju skupina, a razlika među njima nije u obliku nego u tome u kojim se smjerovima smije gibati. Prvi je standardni kotač: os vrtnje mu je čvrsto vezana za tijelo. Najčešći je, najjeftiniji i najizdržljiviji. Ključno je njegovo bočno ograničenje — koliko god jako bio pogonjen, ne može se pomaknuti u smjeru svoje osi, jer je trenje u tom smjeru mnogo veće nego u smjeru kotrljanja. To nije nedostatak, nego temeljno svojstvo, i cijela kinematika mobilnih robota gradi se upravo na njemu.", "dopuna": "Bočno ograničenje je razlog zašto automobil ne može parkirati postrance. Pitanje: koji biste predmet iz učionice upotrijebili da djeci pokažete bočno ograničenje kotača?"}, {"t": 450, "dio": "1 Kotači", "naslov": "Zakretni i kuglasti kotač", "str": "kot", "radnje": [["klik", "#kchips .chip:nth-child(2)"], ["cekaj", 28], ["klik", "#kchips .chip:nth-child(3)"], ["cekaj", 26]], "klik": "Odabran zakretni (castor), zatim kuglasti kotač.", "tekst": "Zakretni kotač poznajete s kolica u trgovini: skretna os mu je pomaknuta od dodirne točke, pa se pri promjeni smjera sam okrene za vozilom. Dok se poravnava, nakratko vuče vozilo u stranu — kod finog pozicioniranja to se vidi kao odstupanje od nekoliko milimetara. Zato se koristi kao oslonac, ne kao pogon. Kuglasti kotač je kugla u ležištu s valjčićima: nema povlašten smjer i ne opire se nijednom gibanju. Ali ne može se pogoniti, malo nosi i skuplja prašinu, pa je treći oslonac malih robota.", "dopuna": "Na mnogim školskim robotima kuglasti kotač je treći oslonac uz dva pogonska kotača. Pitanje: zašto taj oslonac ne smije biti pogonjen?"}, {"t": 540, "dio": "1 Kotači", "naslov": "Švedski kotač", "str": "kot", "radnje": [["klik", "#kchips .chip:nth-child(4)"], ["cekaj", 12], ["lebdi", "#ksvg"], ["cekaj", 30], ["lebdi", "#ko"]], "klik": "Odabran švedski kotač: obod s valjcima pod kutom.", "tekst": "Četvrti je švedski kotač — jedini koji uklanja bočno ograničenje, i to domišljato. Obod mu nose slobodni valjci. Kotač i dalje aktivno gura samo u smjeru vrtnje, ali se u drugom smjeru može slobodno kotrljati po valjcima. Valjci mogu stajati pod pravim kutom prema osi kotača — to je svesmjerni ili omni kotač, kakav ima Robotino — ili pod kutom od 45 stupnjeva — to je mecanum kotač, kakav imaju viličari i platforme koje se primiču polici. Naziv „švedski” dolazi od švedske tvrtke Mecanum, u kojoj je takav kotač izumljen sedamdesetih. Cijena je trošenje valjaka, buka, veća potrošnja i slabija procjena položaja iz okretaja kotača.", "dopuna": "Kut valjaka određuje kako se sile raspoređuju: pri 90° kotač bočno ne prenosi silu, pri 45° prenosi polovicu u svakom smjeru. Pitanje: zašto je svesmjerno vozilo bučnije od običnog?"}, {"t": 630, "dio": "1 Kotači", "naslov": "Rasporedi: diferencijalni i tricikl", "str": "kot", "radnje": [["skrol", "#s3"], ["cekaj", 3], ["klik", "#rseg .segb:nth-child(1)"], ["cekaj", 30], ["klik", "#rseg .segb:nth-child(2)"], ["cekaj", 26]], "klik": "Odjeljak „Rasporedi kotača i pogona”: diferencijalni pogon, zatim tricikl.", "tekst": "Vrste kotača kombiniraju se u rasporede, a pet ih pokriva gotovo sve što se susreće u praksi. Najčešći je diferencijalni pogon: dva neovisno pogonjena kotača na istoj osi i jedan ili dva slobodna oslonca. Smjer se mijenja samo razlikom brzina kotača, robot se okreće u mjestu, a račun gibanja je najjednostavniji mogući. Tricikl ima jedan prednji kotač koji je istodobno pogonjen i skretan. On se ne okreće u mjestu: pri nultoj brzini zakret prednjeg kotača ne pomiče vozilo. Tipičan je za viličare.", "dopuna": "Većina obrazovnih robota (mBot, Lego, eMIR) ima diferencijalni pogon. Pitanje: koliko motora i koliko enkodera treba diferencijalnom robotu?"}, {"t": 720, "dio": "1 Kotači", "naslov": "Ackermannov, sinkroni i svesmjerni pogon", "str": "kot", "radnje": [["klik", "#rseg .segb:nth-child(3)"], ["cekaj", 21], ["klik", "#rseg .segb:nth-child(4)"], ["cekaj", 21], ["klik", "#rseg .segb:nth-child(5)"], ["cekaj", 22]], "klik": "Ackermannov pogon, sinkroni pogon i svesmjerni pogon s četiri kotača.", "tekst": "Ackermannov pogon je automobil: dva skretna prednja kotača zakreću se za različite kutove tako da svi kotači imaju zajedničko središte zakretanja — inače bi unutarnji kotač u zavoju strugao. Sinkroni pogon zakreće sve kotače zajedno, pa tijelo zadržava orijentaciju dok vozilo mijenja smjer; mehanizam je složen i danas je rijedak. Svesmjerni pogon ima tri ili četiri švedska kotača postavljena tako da se njihove bočne komponente zbrajaju. Vozilo se giba naprijed, postrance i ukoso, a ne mora se zakretati. Na crtežu su četiri kotača s valjcima pod 45 stupnjeva — to je mecanum raspored. Robotino ima tri kotača, a valjci su mu okomiti na os kotača.", "dopuna": "Ackermannov pogon je najbolji za velike brzine na otvorenom, svesmjerni za precizno primicanje u zatvorenom. Pitanje: koji biste raspored odabrali za robota koji dostavlja hranu u bolnici, a koji za robota koji primiče paletu stroju?"}, {"t": 810, "dio": "1 Kotači", "naslov": "Od motora do kotača: prijenos i moment", "str": "kot", "radnje": [["skrol", "#s4"], ["cekaj", 3], ["raspon", "#gnrange", 3100, 3], ["cekaj", 4], ["raspon", "#girange", 30, 3], ["cekaj", 4], ["raspon", "#grrange", 6, 3], ["cekaj", 20], ["raspon", "#girange", 60, 3], ["cekaj", 12], ["raspon", "#girange", 30, 3]], "klik": "Odjeljak „Od motora do kotača”: klizači motor 3100 1/min, prijenos ≈ 32, polumjer 6 cm; zatim prijenos 60.", "tekst": "Motor gotovo nikad nije spojen izravno na kotač. Elektromotor radi najbolje pri nekoliko tisuća okretaja u minuti, a kotač treba stotinjak i velik moment — tu razliku premošćuje prijenosnik. Postavimo brojeve kao na Robotinu: motor oko 3100 okretaja u minuti, prijenos oko 32 (klizač ide u koracima po pet, pa je ovdje 30), polumjer kotača 6 centimetara. Kotač se vrti stotinjak okretaja u minuti, a robot vozi nešto manje od 0,7 metara u sekundi. Udvostručim li prijenosni omjer, vučna se sila udvostruči, a brzina prepolovi. Isti motor daje ili brzinu ili silu, nikad oboje.", "dopuna": "[R] Uz motor 3100 1/min, prijenos 32 i kotač Ø120 mm: kotač se vrti 3100/32 ≈ 97 1/min, a obodna brzina je π · 0,12 · 97 / 60 ≈ 0,61 m/s. Pitanje: koliko bi bila brzina uz prijenos 16, kao na Robotinu 2?"}, {"t": 930, "dio": "1 Kotači", "naslov": "Trenutačno središte zakretanja", "str": "man", "radnje": [["str", "man"], ["cekaj", 3], ["skrol", "#s1"], ["cekaj", 4], ["raspon", "#ilrange", 40, 2], ["raspon", "#idrange", 40, 3], ["cekaj", 8], ["raspon", "#idrange", 20, 3], ["cekaj", 8], ["raspon", "#idrange", -40, 4], ["cekaj", 10], ["raspon", "#idrange", 0, 3], ["cekaj", 8], ["raspon", "#idrange", 20, 3]], "klik": "Mobilna robotika, jedinica 3.2 Manevrabilnost — trenutačno središte zakretanja; klizači brzina lijevog i desnog kotača.", "tekst": "Svako gibanje vozila u ravnini može se u svakom trenutku opisati kao vrtnja oko jedne točke — trenutačnog središta zakretanja. Kod standardnih kotača ono leži na presjeku osi svih kotača. Gledajte: kad su brzine jednake, središte je u beskonačnosti i vozilo ide ravno. Kad su brzine različite, vozi u luku. Kad su jednake i suprotne, središte je između kotača i vozilo se okreće u mjestu. Kad jedan kotač stoji, vozilo se okreće oko njega. Kod svesmjernog robota to središte može biti bilo gdje — i to je cijela njegova prednost.", "dopuna": "Isti pojam postoji i kod mehanizama: trenutačni pol brzina. Pitanje: gdje je trenutačno središte zakretanja kad automobil vozi u krugu na parkiralištu?"}, {"t": 1020, "dio": "1 Kotači", "naslov": "Pokretljivost, upravljivost i manevrabilnost", "str": "man", "radnje": [["skrol", "#s2"], ["cekaj", 2], ["klik", "#mseg .segb:nth-child(1)"], ["cekaj", 11], ["klik", "#mseg .segb:nth-child(3)"], ["cekaj", 11], ["klik", "#mseg .segb:nth-child(5)"], ["cekaj", 16]], "klik": "Odjeljak „Dva broja”: diferencijalni, Ackermannov i svesmjerni raspored.", "tekst": "Manevarsku sposobnost opisuju dva broja. Stupanj pokretljivosti broji koliko se stupnjeva slobode može iskoristiti odmah, bez zakretanja kotača; stupanj upravljivosti broji koliko se kotača može neovisno zakretati. Zbroj je manevrabilnost. Diferencijalni pogon ima dva plus nula, Ackermannov jedan plus jedan — zbroj je isti, a ponašanje posve različito. Svesmjerni ima tri plus nula: sve tri slobode u ravnini dostupne su odmah.", "dopuna": "Najveća manevrabilnost u ravnini je 3, jer vozilo na podu ima tri stupnja slobode: x, y i zakret. Pitanje: koliko stupnjeva slobode ima dron?"}, {"t": 1080, "dio": "1 Kotači", "naslov": "Holonomnost: isti zadatak, dva vozila", "str": "man", "radnje": [["skrol", "#s3"], ["cekaj", 3], ["klik", "#hchips .chip:nth-child(1)"], ["cekaj", 22], ["klik", "#hchips .chip:nth-child(2)"], ["cekaj", 22]], "klik": "Odjeljak „Holonomnost”: zadatak „Pomak u stranu”, zatim „Parkiranje uz policu” — diferencijalno i svesmjerno vozilo.", "tekst": "Holonomno je vozilo koje se iz mirovanja može pomaknuti u bilo kojem smjeru i pritom slobodno birati zakret. Vozila sa standardnim kotačima nisu holonomna — to ne znači da neka mjesta ne mogu doseći, nego da je put do njih dulji i traži manevar, kao parkiranje automobila. Pogledajte pomak u stranu: diferencijalno vozilo mora se okrenuti, voziti i okrenuti natrag, a svesmjerno jednostavno klizne ulijevo. Zato svesmjerni robot može prići stanici bočno — a upravo to Robotino radi kad predaje nosač izratka.", "dopuna": "Za planiranje putanje holonomnost je velika olakšica: planer smije crtati ravne crte između točaka. Pitanje: koji je zadatak u učionici teži za diferencijalnog robota nego za svesmjernog?"}, {"t": 1170, "dio": "2 Svesmjerni kotač", "naslov": "Upoznavanje Robotina: raspored stranice", "str": "upoz", "radnje": [["str", "upoz"], ["cekaj", 4], ["skrolY", 420], ["cekaj", 5], ["poravnaj"], ["cekaj", 2], ["lebdi", ".uz-izbornik .karta-h"], ["cekaj", 7], ["lebdi", "#k-scena .karta-h h2"], ["cekaj", 7], ["lebdi", "#kartica .karta-h"], ["cekaj", 5], ["okret", 12]], "klik": "Mobilni robot Robotino — Upoznavanje robota: lijevo izbornik (96 dijelova u 7 skupina), u sredini 3D prikaz, desno objašnjenje.", "tekst": "Prelazimo na Robotina. Stranica je složena isto kao kod kobota: lijevo izbornik s 96 dijelova u sedam skupina, u sredini trodimenzionalni model, desno objašnjenje. Ovo je Robotino 4 u izvedbi za CP Factory: osnovica promjera 45 centimetara i mase 20 kilograma, a na njoj toranj s prihvatom nosača izratka, signalnim stupom i nužnim stopom. Uz njega je stanica za punjenje. Narančasta točka u izborniku označava dio kod kojeg je nešto procijenjeno, jer proizvođač taj podatak ne objavljuje.", "dopuna": "Kvačice uz pregledane dijelove služe kao popis: cilj je da do sljedećeg sata svih 96 dijelova ima kvačicu."}, {"t": 1230, "dio": "2 Svesmjerni kotač", "naslov": "Tri pogonske jedinice", "str": "upoz", "radnje": [["pogled", "pogon"], ["cekaj", 6], ["dio", "pogonskaJedinica1"], ["cekaj", 9], ["dio", "pogonskaJedinica2"], ["cekaj", 9], ["dio", "pogonskaJedinica3"], ["cekaj", 9], ["pogled", "odozgo"], ["cekaj", 8]], "klik": "Pogled Pogon; pogonske jedinice 1, 2 i 3; pogled odozgo.", "tekst": "Robotino ima tri neovisne pogonske jedinice, razmaknute za 120 stupnjeva. Kotač 1 je naprijed lijevo, na 60 stupnjeva od osi x robota, kotač 2 straga, na 180 stupnjeva, a kotač 3 naprijed desno, na 300 stupnjeva. Os x gleda naprijed, prema laserskom skeneru. Svaka jedinica ima motor, enkoder, reduktor, zupčasti remen i kotač. Pogled odozgo pokazuje ono najvažnije: kotači nisu usporedni, nego stoje kao stranice trokuta. Zato zbroj njihovih gibanja može dati bilo koji smjer.", "dopuna": "Tri kotača su najmanji broj za holonomno vozilo i uvijek sva tri dodiruju pod, čak i na neravnom podu. Pitanje: što bi se dogodilo s četiri kotača na neravnom podu bez ovjesa?"}, {"t": 1290, "dio": "2 Svesmjerni kotač", "naslov": "Svesmjerni kotač izbliza", "str": "upoz", "radnje": [["dio", "kotac1"], ["cekaj", 16], ["dio", "valjci1"], ["cekaj", 16], ["dio", "kotac1"], ["cekaj", 6], ["okret", 14]], "klik": "Dijelovi Omnidirekcijski kotač K1 i Valjci kotača K1 — opis, podaci i izvor desno.", "tekst": "Kotač Robotina 4 ima promjer 120 milimetara i tijelo od glodanog aluminija. Po obodu nosi 16 bačvastih valjaka s jezgrom od polikarbonata i plaštem od prozirnog poliuretana, a svaki se valjak vrti na dvije brončane čahure. Valjci su okomiti na os kotača i složeni tako da uvijek barem jedan dodiruje pod. Kad se kotač vrti, gura robota u smjeru vrtnje. Kad drugi kotači guraju robota postrance, ovaj se ne opire — kotrlja se po svojim valjcima.", "dopuna": "Valjci su prozirni poliuretanski plašt na tvrdoj jezgri: mekan plašt daje prianjanje, tvrda jezgra nosivost. Pitanje: što se događa s valjcima nakon više stotina sati vožnje po hrapavom podu?"}, {"t": 1380, "dio": "2 Svesmjerni kotač", "naslov": "Kako radi: svesmjerni kotač", "str": "upoz", "radnje": [["tema", "omniKotac"], ["cekaj", 8], ["klizac", "Smjer gibanja", 0, 3], ["cekaj", 10], ["klizac", "Smjer gibanja", 30, 3], ["cekaj", 12], ["klizac", "Smjer gibanja", 60, 3], ["cekaj", 10], ["klizac", "Smjer gibanja", 90, 3], ["cekaj", 14], ["klizac", "Smjer gibanja", 30, 3]], "klik": "Animacija „Svesmjerni (švedski) kotač” na mjestu 3D prikaza: lijevo pogled duž osi, desno odozgo; klizač smjera gibanja α 0° → 30° → 60° → 90°.", "tekst": "Otvaram animaciju. Lijevo je kotač gledan duž osi, desno odozgo, a pod se giba ispod njega. Klizač je smjer gibanja tla prema smjeru vrtnje kotača. Pri nuli kotač se vrti punom brzinom, a valjci miruju. Pri 30 stupnjeva kotač preuzima samo komponentu v puta kosinus alfa, a valjci bočnu komponentu v puta sinus alfa. Što je kut veći, kotač se vrti sporije, a valjci brže. Pri 90 stupnjeva kotač stoji, a robot klizi postrance po valjcima — kotač tada ne smeta ostalima. To je cijeli trik.", "dopuna": "Isto načelo vrijedi za svaki kotač Robotina, samo je svaki okrenut drukčije. Pitanje: pri kojem kutu α kotač pretvara cijelo gibanje u vrtnju, a pri kojem cijelo u kotrljanje valjaka?"}, {"t": 1530, "dio": "2 Svesmjerni kotač", "naslov": "Sile na kotaču i proklizavanje", "str": "upoz", "radnje": [["klikT", "Sile"], ["cekaj", 12], ["klizac", "Moment motora", 1, 3], ["cekaj", 10], ["klizac", "Moment motora", 5, 3], ["cekaj", 14], ["klikT", "Brzine"], ["cekaj", 8]], "klik": "Prikaz „Sile”: klizač momenta motora; zatim natrag na „Brzine”.", "tekst": "Prebacujem na sile. Motor preko reduktora daje moment, a kotač gura pod silom koja ide samo u smjeru vrtnje — valjci bočnu silu ne prenose. Što je moment veći, to je i potrebna sila trenja veća; kad je prijeđe, kotač proklizava. Kod svesmjernog kotača proklizavanje je češće nego kod standardnog, jer dodirna površina valjka je mala i mijenja se dok se kotač vrti. Zato procjena položaja iz okretaja kotača — odometrija — ovdje griješi više, i Robotino je ispravlja žiroskopom.", "dopuna": "Zato Robotino ima ograničeno ubrzanje u web sučelju: preveliko ubrzanje znači proklizavanje i pogrešnu odometriju. Pitanje: kako biste pokusom izmjerili proklizavanje?"}, {"t": 1620, "dio": "2 Svesmjerni kotač", "naslov": "Omni i mecanum: 90 i 45 stupnjeva", "str": "kot", "radnje": [["natrag"], ["cekaj", 1], ["str", "kot"], ["cekaj", 3], ["skrol", "#s3"], ["cekaj", 3], ["klik", "#rseg .segb:nth-child(5)"], ["cekaj", 20], ["skrol", "#s2"], ["cekaj", 3], ["klik", "#kchips .chip:nth-child(4)"], ["cekaj", 20]], "klik": "Mobilna robotika 2.3: svesmjerni raspored s četiri kotača pod 45° i kartica švedskog kotača.", "tekst": "Dvije izvedbe švedskog kotača često se miješaju, pa ih usporedimo. Kod omni kotača valjci su okomiti na os kotača; trebaju barem tri kotača pod različitim kutovima, kao na Robotinu. Kod mecanum kotača valjci stoje pod 45 stupnjeva; četiri kotača stoje usporedno, kao na automobilu, a bočno gibanje nastaje kad se lijevi i desni kotači vrte suprotno. Mecanum raspored dobro nosi teret i lako se ugrađuje u pravokutno vozilo; omni s tri kotača je jednostavniji i uvijek dodiruje pod svim kotačima. Pazite: u literaturi se Robotinov kotač ponekad pogrešno zove mecanum — to nije točno.", "dopuna": "Mecanum kotači dolaze u paru lijevih i desnih, s valjcima u zrcalnom smjeru; krivo složeni ne daju bočno gibanje. Pitanje: kako biste na gotovom vozilu provjerili jesu li kotači dobro složeni?"}, {"t": 1710, "dio": "2 Svesmjerni kotač", "naslov": "Pokazna vožnja Robotina", "str": "upoz", "radnje": [["str", "upoz"], ["cekaj", 3], ["poravnaj"], ["pogled", "odozgo"], ["cekaj", 4], ["voz", "naprijed"], ["cekaj", 16], ["voz", "bocno"], ["cekaj", 16], ["voz", "okret"], ["cekaj", 16]], "klik": "Upoznavanje Robotina, pogled odozgo: pokazna vožnja naprijed i natrag, bočno, okret na mjestu; brzine motora ispisane u prikazu.", "tekst": "Vratimo se Robotinu i pustimo ga da vozi. Gledajte brojke dolje lijevo: to su brzine triju motora izračunate inverznom kinematikom. Pri vožnji naprijed stražnji kotač, broj 2, miruje, a prednji se vrte suprotno istim iznosom. Pri bočnoj vožnji najjače radi upravo stražnji kotač, a prednja dva upola sporije. Pri okretu na mjestu sva tri motora imaju istu brzinu. Robot ne mora birati: zadate mu gibanje, a upravljanje samo razdijeli brzine na kotače.", "dopuna": "Brzine u prikazu su brzine motora, ne kotača — razlika je prijenos 32. Pitanje: koji motor najviše radi pri bočnoj vožnji i zašto baš on?"}, {"t": 1830, "dio": "3 Robotino", "naslov": "Osnovica i rastavljanje", "str": "upoz", "radnje": [["voz", "stani"], ["pogled", "foto"], ["cekaj", 3], ["dio", "sasija"], ["cekaj", 12], ["rastavi", 70, 5], ["cekaj", 14], ["okret", 12], ["rastavi", 0, 4], ["cekaj", 6]], "klik": "Dio Šasija (nosiva ploča); klizač Rastavi do 70 % pa natrag.", "tekst": "Sada dio po dio. Osnovica je okrugla, promjera 45 centimetara i visine 32,5 centimetra, s kućištem od nehrđajućeg čelika. Prazna ima 20 kilograma, a nosi do 30 kilograma tereta, centrirano. Klizačem Rastavi razmičem sklopove: pokrove, gornju ploču, upravljačku jedinicu, pogonske jedinice, baterije i nadogradnju. Šasija je nosiva ploča na koju je pričvršćeno sve ostalo — i njezina je kartica ujedno ulaz u animaciju kinematike, kojoj se vraćamo u četvrtom dijelu.", "dopuna": "Kućište od nehrđajućeg čelika i zaštita IP 00 znače: robot je za suhe, čiste prostore. Pitanje: što bi trebalo promijeniti da robot radi u prašnoj radionici?"}, {"t": 1920, "dio": "3 Robotino", "naslov": "Pogonska jedinica", "str": "upoz", "radnje": [["dio", "pogonskaJedinica1"], ["cekaj", 6], ["jedinica", 1], ["cekaj", 16], ["dio", "motor1"], ["cekaj", 12], ["dio", "reduktor1"], ["cekaj", 12], ["dio", "remen1"], ["cekaj", 12]], "klik": "Pogonska jedinica 1 rastavljena (gumb 1): motor M1, planetarni reduktor P1, zupčasti remen R1.", "tekst": "Rastavljam prvu pogonsku jedinicu. Motor je istosmjerni motor s četkicama, Dunkermotoren GR 42x40, na 24 volta: nazivno oko 3100 okretaja u minuti i moment od 5,7 newton-centimetara. Iza njega je dvostupanjski planetarni reduktor, a do kotača moment prenosi zupčasti remen. Ukupni prijenos od motora do kotača je 32 prema 1. Jedna jedinica je zaseban sklop — ako se motor pokvari, mijenja se cijela jedinica, a robot je brzo ponovno u radu.", "dopuna": "Motor s četkicama je jednostavan i jeftin za regulaciju, ali se četkice troše. Pitanje: zašto industrijski kobot ima motore bez četkica, a obrazovni mobilni robot s četkicama?"}, {"t": 2010, "dio": "3 Robotino", "naslov": "Kako radi: pogonska jedinica", "str": "upoz", "radnje": [["tema", "pogonskaJedinica"], ["cekaj", 6], ["klizac", "Brzina motora", 3000, 4], ["cekaj", 14], ["klizac", "Moment motora", 6, 3], ["cekaj", 14], ["klizac", "Brzina motora", 1500, 3], ["cekaj", 10], ["natrag"]], "klik": "Animacija „Pogonska jedinica: motor, reduktor, remen, kotač” na pozornici; klizači brzine i momenta motora.", "tekst": "Animacija pokazuje lanac od motora do kotača. Motor se vrti oko 3000 okretaja u minuti; nakon prijenosa 32 prema 1 kotač se vrti oko 94 okretaja, a obodna brzina je oko 0,6 metara u sekundi. Moment se povećava istim omjerom, umanjen za gubitke — korisnost reduktora je oko 0,8. Zato motor od 20-ak vata može gurati robota od 30 kilograma. Vraćam se na 3D prikaz gumbom „Natrag na 3D prikaz”.", "dopuna": "[R] Moment na kotaču ≈ moment motora · 32 · 0,81; uz 5,7 Ncm to je oko 1,5 Nm, a vučna sila uz polumjer 6 cm oko 25 N po kotaču. Pitanje: koliki se nagib može savladati s 30 kg tereta?"}, {"t": 2130, "dio": "3 Robotino", "naslov": "Enkoder i regulacija brzine", "str": "upoz", "radnje": [["dio", "enkoder1"], ["cekaj", 10], ["tema", "enkoder"], ["cekaj", 6], ["klikT", "Promijeni smjer"], ["cekaj", 12], ["klikT", "Promijeni smjer"], ["cekaj", 10], ["natrag"]], "klik": "Dio Enkoder E1 i animacija „Inkrementalni enkoder RE 30-2-500”.", "tekst": "Na stražnjem kraju motora je inkrementalni enkoder s 500 impulsa po okretaju i dva kanala, A i B, pomaknuta za četvrtinu razmaka. Iz redoslijeda bridova zna se smjer, a brojanjem svih bridova dobiva se 2000 inkremenata po okretaju motora — uz prijenos 32 to je 64 000 po okretaju kotača, nekoliko mikrometara puta. Mikrokontroler iz toga tisuću puta u sekundi računa brzinu i PI regulatorom podešava napon motora tako da drži zadanu brzinu, bez obzira na teret i nagib.", "dopuna": "Bez povratne veze enkodera robot bi pri istom naponu vozio sporije s teretom nego bez njega. Pitanje: što bi se dogodilo s odometrijom da enkoder broji samo jedan brid jednog kanala?"}, {"t": 2220, "dio": "3 Robotino", "naslov": "Infracrveni senzori udaljenosti", "str": "upoz", "radnje": [["dio", "irNiz"], ["cekaj", 10], ["tema", "irSenzor"], ["cekaj", 6], ["klizac", "Udaljenost predmeta", 25, 3], ["cekaj", 8], ["klizac", "Udaljenost predmeta", 6, 4], ["cekaj", 10], ["klizac", "Udaljenost predmeta", 2, 3], ["cekaj", 10], ["natrag"]], "klik": "Dio Infracrveni senzori udaljenosti (9 kom) i animacija; klizač udaljenosti predmeta.", "tekst": "U donjem dijelu osnovice je devet infracrvenih senzora udaljenosti, razmaknutih za 40 stupnjeva po obodu. Mjere od 4 do 30 centimetara načelom triangulacije: što je predmet bliže, to se odbijena zraka vraća pod većim kutom i napon je veći. Krivulja nije linearna, a ispod oko 3 centimetra napon opet pada — senzor tada javlja krivu, veću udaljenost. Zato se predmet koji je preblizu mora prepoznati i drugim senzorom.", "dopuna": "Sjajne i crne površine senzor vidi drukčije: crni mat predmet odbija malo svjetla. Pitanje: kako biste u učionici pokazali da senzor ispod 3 cm laže?"}, {"t": 2310, "dio": "3 Robotino", "naslov": "Odbojnik i laserski skener", "str": "upoz", "radnje": [["dio", "odbojnik"], ["cekaj", 14], ["dio", "laserSkener"], ["cekaj", 8], ["tema", "laserSkener"], ["cekaj", 22], ["natrag"]], "klik": "Dio Odbojnik (sigurnosni rub), zatim Laserski skener i njegova animacija.", "tekst": "Oko donjeg ruba je odbojnik — sigurnosni rub s gumenim profilom. Pritisak spaja dvije vodljive površine i prekida program i vožnju; radi na načelu mirne struje, pa i prekinut kabel zaustavlja robota. Sprijeda je laserski skener: mjeri udaljenost u 240 stupnjeva oko prednje strane, desetak puta u sekundi, do nekoliko metara. Iz tih mjerenja robot gradi kartu prostora i na njoj se lokalizira. Model skenera na našem robotu procijenjen je s fotografije; u novijim izvedbama za CP Factory ugrađuje se sigurnosni skener sa zaštitnim poljem.", "dopuna": "Odbojnik je posljednja zaštita — dodir se već dogodio; skener sprečava dodir. Pitanje: zašto se kao sigurnosni senzor koristi skener sa zaštitnim poljem, a ne kamera?"}, {"t": 2430, "dio": "3 Robotino", "naslov": "Kamera, žiroskop i optički senzori", "str": "upoz", "radnje": [["dio", "kamera"], ["cekaj", 14], ["dio", "ziroskop"], ["cekaj", 14], ["dio", "optickiSenzori"], ["cekaj", 14]], "klik": "Dijelovi: dubinska kamera Intel RealSense D435, žiroskop, optički refleksni senzori.", "tekst": "Na prednjoj ploči je dubinska kamera Intel RealSense D435: uz sliku daje i udaljenost svake točke, pa robot prepoznaje predmete i oznake. U upravljačkoj jedinici je žiroskop koji izravno mjeri kutnu brzinu tijela — operacijski sustav njime ispravlja kut iz odometrije, jer svesmjerni kotači proklizavaju. Na dnu su dva optička refleksna senzora sa svjetlovodima: vide razliku svijetle i tamne podloge i služe za slijeđenje crte.", "dopuna": "Slijeđenje crte dvama senzorima najjednostavniji je primjer povratne veze — idealan za prvi sat robotike s djecom. Pitanje: što robot radi kad oba senzora vide crtu?"}, {"t": 2520, "dio": "3 Robotino", "naslov": "Upravljačka jedinica i WLAN", "str": "upoz", "radnje": [["dio", "upravljackaJedinica"], ["cekaj", 10], ["tema", "upravljackaJedinica"], ["cekaj", 8], ["klikT", "Prekini WLAN"], ["cekaj", 12], ["klikT", "Spoji WLAN"], ["cekaj", 6], ["natrag"]], "klik": "Dio Upravljačka jedinica i animacija „Upravljačka jedinica i tok podataka”: prekid WLAN-a.", "tekst": "Ispod okruglog poklopca je upravljačka jedinica: ugradbeno računalo s Linuxom i mikrokontroler koji upravlja motorima. Robot ima vlastitu WLAN pristupnu točku i web sučelje. Vanjski program — u Pythonu, MATLAB-u ili ROS-u — šalje mu brzine preko REST sučelja. Važno pravilo: naredba se mora ponavljati barem svakih 200 milisekundi. Ako veza pukne, kao sada, robot sam stane — ne nastavlja voziti zadnjom brzinom. To se zove nadzor veze ili watchdog.", "dopuna": "Watchdog postoji i u autima, dizalima i strojevima: sustav koji ne dobiva redovite poruke prelazi u sigurno stanje. Pitanje: gdje biste u školskom robotu ugradili isto pravilo?"}, {"t": 2610, "dio": "3 Robotino", "naslov": "Napajanje, nadogradnja i stanica za punjenje", "str": "upoz", "radnje": [["dio", "baterija1"], ["cekaj", 12], ["dio", "prihvatNosaca"], ["cekaj", 10], ["klik", "#sig-gumbi button:nth-child(1)"], ["cekaj", 4], ["klik", "#t-trake"], ["cekaj", 10], ["klik", "#t-trake"], ["pogled", "stanica"], ["cekaj", 6], ["dio", "stanica"], ["cekaj", 10], ["klik", "#r-pocetno"]], "klik": "Baterija (Festool Li-ion 18 V), prihvat nosača izratka s trakama, signalni stup, stanica za punjenje.", "tekst": "Robotino 4 napajaju do četiri Festool litij-ionske baterije od 18 volti, iste kao u alatu; s punim kompletom radi do desetak sati, a paketi se mijenjaju sa stražnje strane. Na osnovici je nadogradnja za CP Factory: toranj, prihvat nosača izratka s dvije trake, signalni stup, tipkala RESET i START i gljiva nužnog stopa. Stanica za punjenje ima šestopolni kontakt i dva reflektorska markera po kojima je laser pronalazi. Dok je robot na stanici, radi na mrežnom napajanju i ne prazni baterije.", "dopuna": "Signalni stup je jezik robota prema ljudima: crveno greška, narančasto upozorenje, zeleno spreman. Pitanje: što znači kad zeleni segment treperi?"}, {"t": 2730, "dio": "4 Kinematika (preskočivo)", "naslov": "Kako radi: kinematika — vožnja naprijed", "str": "upoz", "radnje": [["dio", "sasija"], ["cekaj", 3], ["tema", "kinematika"], ["cekaj", 8], ["klikT", "Naprijed"], ["cekaj", 22], ["lebdi", "section.tro .tro-ocit"], ["cekaj", 20]], "klik": "Animacija „Kinematika tri svesmjerna kotača”: odozgo robot s tri kotača i strelicama, ispod put robota; desno klizači vx, vy, ω i račun uživo. Gumb „Naprijed”.", "tekst": "Sada račun. Robot ima tri stupnja slobode — vx naprijed, vy ulijevo i ω zakret — i tri motora. Za svaki kotač i pod kutom theta vrijedi: brzina motora m_i jednaka je k puta zbroju minus sinus theta puta vx, plus kosinus theta puta vy, plus r_b puta ω. Konstanta k pretvara metre u sekundi u okretaje motora: 60 puta prijenos kroz dva pi puta polumjer kotača — oko 5100. Za vožnju naprijed 0,3 metra u sekundi: m1 je oko minus 1300, m3 plus 1300, a m2 je nula — kotač 2 stoji okomito na smjer gibanja i samo se kotrlja po valjcima.", "dopuna": "[R] k = 60 · 32 / (2π · 0,060) ≈ 5093 (1/min)/(m/s); m1 = 5093 · (−0,866 · 0,3) ≈ −1323 1/min. Pitanje: koliki je m1 za vx = 0,2 m/s?"}, {"t": 2850, "dio": "4 Kinematika (preskočivo)", "naslov": "Bočna vožnja i okret na mjestu", "str": "upoz", "radnje": [["klikT", "Bočno lijevo"], ["cekaj", 24], ["klikT", "Okret na mjestu"], ["cekaj", 24], ["klikT", "Stop"], ["cekaj", 6]], "klik": "Gumbi „Bočno lijevo” i „Okret na mjestu”; račun uživo desno.", "tekst": "Bočno ulijevo: sada najjače radi motor 2, m2 je minus k puta vy, a motori 1 i 3 imaju polovicu te brzine, suprotnog predznaka. Zbroj doprinosa zakretu je nula, pa se robot ne okreće. Okret na mjestu: sva tri motora imaju istu brzinu, k puta r_b puta ω, i vrte robota oko središta. Udaljenost r_b od središta do kotača proizvođač ne objavljuje — u simulatoru je 13 centimetara, procjena, i na robotu je treba izmjeriti.", "dopuna": "[R] Za vy = 0,3 m/s: m2 = −k · vy ≈ −1528, m1 = m3 ≈ +764 1/min. Pitanje: koliki je ω ako se sva tri motora vrte 1000 1/min, uz rb = 0,13 m?"}, {"t": 2970, "dio": "4 Kinematika (preskočivo)", "naslov": "Dijagonalno uz okretanje", "str": "upoz", "radnje": [["klikT", "Dijagonalno + okret"], ["cekaj", 30], ["klikT", "Luk"], ["cekaj", 24], ["klikT", "Očisti put"], ["cekaj", 4]], "klik": "Gumbi „Dijagonalno + okret” i „Luk”; put robota u donjem crtežu.", "tekst": "Najljepše je kombinirano gibanje: robot vozi dijagonalno i istodobno se okreće oko svoje osi. Diferencijalni robot to ne može. Svesmjerni samo zbroji tri doprinosa u svakom motoru. Pazite na granicu: najveća brzina motora je 3600 okretaja u minuti, pa kad zbroj prijeđe granicu, upravljanje mora sve tri brzine razmjerno smanjiti — inače bi se smjer gibanja iskrivio.", "dopuna": "Ograničenje brzina razmjernim smanjenjem čuva smjer gibanja — robot tada vozi sporije, ali ispravno. Pitanje: što bi se dogodilo da se ograniči samo motor koji je prešao granicu?"}, {"t": 3060, "dio": "4 Kinematika (preskočivo)", "naslov": "Direktna kinematika i odometrija", "str": "upoz", "radnje": [["klikT", "Direktna"], ["cekaj", 8], ["klizac", "m1", -1300, 4], ["cekaj", 6], ["klizac", "m3", 1300, 4], ["cekaj", 20], ["natrag"]], "klik": "Prekidač „Direktna: m → vx, vy, ω”; klizači brzina motora m1 i m3.", "tekst": "Obrnuti smjer zove se direktna kinematika: iz izmjerenih brzina motora računa se gibanje robota. vx je razlika m3 i m1 kroz korijen iz tri puta k, vy i ω slijede slično. Integriranjem kroz vrijeme dobiva se položaj — to je odometrija. Svaka pogreška, proklizavanje valjka ili netočan r_b, nakuplja se, pa robot s vremenom pogrešno misli gdje je. Žiroskop ispravlja kut, a laserski skener s kartom i položaj. Time zatvaramo kinematiku.", "dopuna": "[R] vx = (m3 − m1) / (√3 · k), vy = (m1 + m3 − 2·m2) / (3k), ω = (m1 + m2 + m3) / (3k · rb). Pitanje: kakvo je gibanje kad su m1 = −m3 i m2 = 0?"}, {"t": 3180, "dio": "5 Upravljanje", "naslov": "Simulator laboratorija: raspored", "str": "upr", "radnje": [["str", "upr"], ["cekaj", 3], ["poravnaj"], ["cekaj", 2], ["lebdi", ".rb-izbornik .karta-h"], ["cekaj", 7], ["lebdi", "#uredaj"], ["cekaj", 7], ["lebdi", "#web"], ["cekaj", 7], ["lebdi", "#k-scena .karta-h h2"], ["cekaj", 5]], "klik": "Upravljanje robotom: lijevo deset nizova; u sredini uputa, tipkala i svjetla na robotu, web sučelje; desno laboratorij u 3D-u.", "tekst": "Drugo poglavlje je simulator laboratorija. Lijevo je deset nizova vježbi — od uključivanja do malog programa — i danas ćemo proći svih deset. U sredini su uputa, tipkala i svjetla na robotu i pojednostavljeno web sučelje robota. Desno je laboratorij od pet puta četiri metra: crna crta za slijeđenje, stanica za punjenje uz lijevi zid i prijenosna stanica straga. Svaki korak niza provjerava se sam.", "dopuna": "Simulator je pojednostavljen, ali redoslijed postupaka (uključivanje, RESET, START, lokalizacija) odgovara stvarnom robotu u tvornici."}, {"t": 3240, "dio": "5 Upravljanje", "naslov": "Uključivanje i spajanje na web sučelje", "str": "upr", "radnje": [["niz", "ukljucivanje"], ["cekaj", 3], ["drziEl", "#b-tipkalo", 3.6], ["cekajSim", "upaljen", 10], ["cekaj", 2], ["klik", "#b-spoji"], ["cekaj", 5], ["klik", "#b-reset"], ["cekaj", 4], ["klik", "#b-start"], ["cekajSim", "spreman", 12], ["cekaj", 3]], "klik": "Niz 1: držanje glavnog tipkala 3 s, pokretanje sustava, „Poveži”, RESET, START, lokalizacija.", "tekst": "Uključujem robota: glavno tipkalo treba držati oko tri sekunde, da se ne uključi slučajno. LED prsten treperi dok se računalo podiže, zatim svijetli plavo. Spajam se na web sučelje. Lampica RESET svijetli, a narančasti segment signalnog stupa treperi: sigurnosni krug još nije potvrđen. RESET, pa START. Crveni segment treperi dok robot ne zna gdje je na karti; kad se ugasi i zeleni svijetli stalno, robot je spreman.", "dopuna": "Dugi pritisak za uključivanje i potvrda RESET-om štite od slučajnog pokretanja. Pitanje: koji uređaj kod kuće uključujete dugim pritiskom i zašto?"}, {"t": 3360, "dio": "5 Upravljanje", "naslov": "Vožnja tipkama i kinematika uživo", "str": "upr", "radnje": [["niz", "voznja"], ["cekaj", 3], ["tab", "voznja"], ["cekaj", 2], ["pad", "vx+", 2.5], ["cekaj", 5], ["pad", "vy+", 2.5], ["cekaj", 5], ["pad", "w+", 2.5], ["cekaj", 5], ["skrol", "#k-kin"], ["cekaj", 12]], "klik": "Niz 2, kartica Vožnja: tipke naprijed, lijevo, okret; kartica „Omnidrive — kinematika uživo”.", "tekst": "U kartici Vožnja vozim tipkama: naprijed, ulijevo, okret. Isto radi tipkovnica — W, A, S, D, a Q i E okreću. Ispod web sučelja je kinematika uživo: zadane brzine robota i izračunane brzine triju motora. Ponovite sami što smo maloprije računali — vozite samo naprijed i provjerite da motor 2 miruje.", "dopuna": "Za učionicu: neka sudionici sami otkriju koji motor stoji pri kojoj vožnji, bez formula — samo gledajući brojke."}, {"t": 3480, "dio": "5 Upravljanje", "naslov": "Enkoderi i odometrija: kvadrat 1 × 1 m", "str": "upr", "radnje": [["niz", "odometrija"], ["cekaj", 3], ["tab", "odometrija"], ["cekaj", 3], ["akcija", "kvadrat"], ["cekajSim", "slobodan", 70], ["cekaj", 6], ["klik", "input[data-polje=\"ziro\"]"], ["cekaj", 3], ["akcija", "resetOdo"], ["cekaj", 2], ["akcija", "kvadrat"], ["cekajSim", "slobodan", 70], ["cekaj", 4]], "klik": "Niz 3, kartica Odometrija: „Vozi kvadrat 1 × 1 m” s proklizavanjem, zatim uključen žiroskop i ponovljeni kvadrat.", "tekst": "Robot zna gdje je samo zato što broji okretaje motora — to je odometrija. Enkoder daje 500 impulsa po okretaju motora, a brojanjem svih bridova obaju kanala dobiva se 2000 inkremenata; uz prijenos 32 to je 64 000 inkremenata po okretaju kotača. Robot sada vozi kvadrat od jednog metra s uključenim proklizavanjem. Pri okretanju valjci kližu, pa izračunani kut ne odgovara stvarnom i robot ne završi gdje misli. Uključujem žiroskop i vozim isti kvadrat: žiroskop izravno mjeri zakret tijela robota, pa se pogreška kuta više ne nakuplja. Ispod tablice vidite usporedbu: bez žiroskopa robot promaši cilj za tridesetak centimetara, sa žiroskopom za nekoliko centimetara. Pogreška kuta je najopasnija, jer svaki sljedeći metar vodi sve dalje od cilja.", "dopuna": "[R] Opseg kotača je π · 0,12 ≈ 0,377 m, pa jedan metar znači oko 2,65 okretaja kotača, odnosno oko 170 000 inkremenata. Pitanje: koliki je pomak robota za jedan inkrement, u mikrometrima?"}, {"t": 3630, "dio": "5 Upravljanje", "naslov": "Senzori udaljenosti i odbojnik", "str": "upr", "radnje": [["niz", "senzori"], ["cekaj", 3], ["tab", "senzori"], ["cekaj", 5], ["tab", "voznja"], ["cekaj", 1], ["raspon", "input[data-polje=\"brzTipki\"]", 20, 1], ["padDo", "vx+", "ir15", 20], ["cekaj", 2], ["raspon", "input[data-polje=\"brzTipki\"]", 50, 0.5], ["tab", "senzori"], ["pogled", "robot"], ["cekaj", 10]], "klik": "Niz 4: zrake IR u 3D prikazu, kartica Senzori; vožnja prema zidu dok IR1 ne pokaže 15 cm, pogled Robot.", "tekst": "Zrake infracrvenih senzora su uključene: narančaste su one koje pogađaju prepreku. Kartica Senzori pokazuje svih devet udaljenosti i napone. Vozim prema zidu — prednji senzor pokazuje sve manju udaljenost. U nizu se robot treba zaustaviti na 15 centimetara, zatim uključiti IR zaštitu, a na kraju namjerno udariti u zid da proradi odbojnik.", "dopuna": "Pri većoj brzini zaustavni put je dulji, pa robot s IR zaštitom stane bliže zidu. Pitanje: kako biste odredili najveću sigurnu brzinu za zadanu udaljenost zaustavljanja?"}, {"t": 3750, "dio": "5 Upravljanje", "naslov": "Laserski skener i karta", "str": "upr", "radnje": [["niz", "laser"], ["cekaj", 3], ["klik", "#t-laser"], ["cekaj", 5], ["tab", "voznja"], ["cekaj", 2], ["klik", "#m-mapiraj"], ["cekaj", 2], ["pad", "w+", 6], ["cekaj", 2], ["klik", "#m-karta"], ["cekaj", 3], ["skrol", "#k-karta"], ["cekaj", 12], ["klik", "#t-laser"]], "klik": "Niz 5: zrake lasera, mapiranje i okret na mjestu; karta u kartici „Laserski skener i karta”.", "tekst": "Uključujem zrake lasera i mapiranje, pa okrećem robota na mjestu. Svaki sken upisuje se u kartu prema položaju koji robot misli da ima. Na karti se pojavljuju zidovi i stanice. Uključite li u kartici Odometrija proklizavanje i isključite žiroskop, karta se razmaže — zato pravi roboti položaj stalno ispravljaju usporedbom skena s kartom.", "dopuna": "Gradnja karte i istodobna lokalizacija zove se SLAM i temelj je autonomnih robota. Pitanje: zašto karta razmazana zbog proklizavanja izgleda kao duplicirani zidovi?"}, {"t": 3900, "dio": "5 Upravljanje", "naslov": "Slijeđenje crte optičkim senzorima", "str": "upr", "radnje": [["niz", "crta"], ["cekaj", 4], ["tab", "crta"], ["cekaj", 3], ["lebdi", "#web"], ["cekaj", 3], ["akcija", "crta"], ["cekaj", 45], ["akcija", "crta"], ["cekaj", 3]], "klik": "Niz 6, kartica Crta: dva optička senzora na dnu, DI1 i DI2, „Slijeđenje crte” i krug po stazi.", "tekst": "Na dnu robota su dva optička senzora, lijevo i desno od crte. Svaki javlja samo svijetlo ili tamno, na digitalni ulaz. Logika je najjednostavnija povratna veza: lijevi vidi crtu — okreni lijevo, desni vidi crtu — okreni desno, nijedan — ravno. Robot sada obilazi stazu. Zakret mora biti dovoljno brz za najmanji polumjer staze: kutna brzina mora biti barem brzina podijeljena s polumjerom, i još s rezervom jer senzori kasne. Na stvarnom robotu crtu se može pratiti i kamerom.", "dopuna": "[R] Uz v = 0,3 m/s i najmanji polumjer staze 0,5 m treba ω ≥ 0,6 rad/s samo da se prati zavoj. Pitanje: što se dogodi kad su oba senzora istodobno na crti, npr. na raskrižju?"}, {"t": 4050, "dio": "5 Upravljanje", "naslov": "Pristajanje na stanicu za punjenje", "str": "upr", "radnje": [["niz", "pristajanje"], ["cekaj", 3], ["tab", "voznja"], ["cekaj", 2], ["padDo", "w+", "markeri", 10], ["cekaj", 1], ["tab", "punjenje"], ["cekaj", 3], ["akcija", "dock"], ["cekajSim", "dock", 40], ["cekaj", 5]], "klik": "Niz 7, kartica Punjenje: okret dok laser ne vidi oba markera, „Pristani (Dock)”; robot se poravna i pristane.", "tekst": "Baterija je pri kraju i robot mora na punjenje. Laser traži dva reflektorska markera stanice. Algoritam ima tri koraka: zakreni se ravno prema stanici, vozi bočno dok ne dođeš na njezinu normalu, pa vozi ravno do kontakta. Bočni korak je moguć samo zato što je robot svesmjeran. Kad stigne povratni kod 2 i kontakt, robot se puni.", "dopuna": "Reflektorski markeri daju vrlo jak odraz, pa ih laser razlikuje od zida. Pitanje: što bi se dogodilo da netko stavi sjajnu limenku pokraj stanice?"}, {"t": 4200, "dio": "5 Upravljanje", "naslov": "Predaja nosača prijenosnoj stanici", "str": "upr", "radnje": [["niz", "predaja"], ["cekaj", 4], ["tab", "nosac"], ["cekaj", 3], ["akcija", "prilaz"], ["cekajSim", "slobodan", 40], ["cekaj", 3], ["akcija", "fino"], ["cekajSim", "slobodan", 30], ["cekaj", 3], ["akcija", "predaj"], ["cekajSim", "slobodan", 30], ["cekaj", 4]], "klik": "Niz 8, kartica Nosač: „Prilaz”, „Fino pozicioniranje” (BG4–BG6), „Predaj nosač” (handshake BG2/BG3, trake, BG1).", "tekst": "Ovo je posao Robotina u tvornici: nosač izratka predaje stanici. Prihvat i trake idu poprijeko, pa robot stanici prilazi bočno. Fino pozicioniranje: dva bočna senzora daju kut prema licu stanice, srednji daje udaljenost. Kad su prva dva jednaka, robot je usporedan sa stanicom. Zatim optički handshake — robot pali odašiljač, stanica odgovara — i trake prebacuju nosač. Senzor BG1 potvrđuje da je prihvat prazan.", "dopuna": "Optički handshake je jednobitna veza bez kabela i bez mreže — radi i kad WLAN zakaže. Pitanje: zašto robot smije krenuti tek kad BG1 potvrdi nosač?"}, {"t": 4350, "dio": "5 Upravljanje", "naslov": "Mali program: predaja, vožnja, pristajanje", "str": "upr", "radnje": [["niz", "program"], ["cekaj", 4], ["akcija", "pgPrimjer"], ["cekaj", 6], ["akcija", "pgPokreni"], ["cekajSim", "slobodan", 95], ["cekaj", 3]], "klik": "Niz 10, kartica Program: primjer programa (Predaj nosač → Vozi do → Pristani) i ▶ Pokreni.", "tekst": "Sve što smo radili ručno sada slažemo u program od blokova: predaj nosač, vozi do sredine, pristani. Blokovi se izvode redom i svaki čeka da prethodni završi — kao koraci i prijelazi u Grafcetu, kakav se crta u Festovom programu Robotino View. Dok je robot zauzet, zeleni segment treperi. Ako ga prekine prepreka ili nužni stop, uzrok se ukloni i program pokrene ponovno.", "dopuna": "Program od blokova je isti način razmišljanja kao Grafcet u PLC-u: korak, uvjet prijelaza, sljedeći korak. Pitanje: koji blok dodati da robot ne krene dok nosač nije u prihvatu?"}, {"t": 4470, "dio": "5 Upravljanje", "naslov": "Nužni stop i ponovno pokretanje", "str": "upr", "radnje": [["niz", "estop"], ["cekaj", 3], ["klik", "#b-gljiva"], ["cekaj", 7], ["klik", "#b-reset"], ["cekaj", 6], ["klik", "#b-gljiva"], ["cekaj", 4], ["klik", "#b-reset"], ["cekaj", 4], ["klik", "#b-start"], ["cekaj", 8]], "klik": "Niz 9: gljiva nužnog stopa, RESET dok je gljiva pritisnuta (ništa), otpuštanje, RESET, START; signalni stup.", "tekst": "Na kraju sigurnost. Gljiva nužnog stopa isključuje sve aktuatore, i pogon i trake. Dok je pritisnuta, ni RESET ništa ne mijenja. Otpuštanje gljive ne pokreće robota samo od sebe — treba potvrditi RESET-om i tek onda START. Prekinuti zadatak se ne nastavlja sam, pokreće se ponovno. Prije RESET-a na stvarnom robotu uvijek provjerite zašto je stop pritisnut.", "dopuna": "Nužni stop ne smije se koristiti kao obično zaustavljanje — za to služi STOP u programu. Pitanje: zašto otpuštanje gljive ne smije samo pokrenuti robota?"}, {"t": 4590, "dio": "6 Robotino u CP Factory", "naslov": "Robotino u pametnoj tvornici", "str": "cpfu", "radnje": [["str", "cpfu"], ["cekaj", 3], ["poravnaj"], ["cekaj", 2], ["klik", "#stablo [data-sk=\"5\"]"], ["cekaj", 4], ["pogled", "robotino"], ["cekaj", 8], ["lebdi", "#k-tekst"], ["cekaj", 10]], "klik": "Pametna tvornica CP Factory → Upoznavanje sustava: skupina ROBOTINO, pogled „Robotino”.", "tekst": "Isti robot radi u pametnoj tvornici CP Factory. Linija ima regalno skladište, modul grananja i robotsku montažnu stanicu, a Robotino povezuje modul grananja s ostatkom prostora. Na modulu grananja nosač može skrenuti u krak, a na vrhu kraka ga preuzima Robotino. Naloge mu ne daje izravno sustav za upravljanje proizvodnjom, nego Fleet Manager, koji zna naučene položaje stanica i stanje baterije.", "dopuna": "U CP Factoryju Robotino zamjenjuje dio transportne trake: raspored stanica može se mijenjati bez nove opreme. Pitanje: koji podatak Fleet Manager mora znati o svakoj stanici?"}, {"t": 4680, "dio": "6 Robotino u CP Factory", "naslov": "Kako radi: predaja nosača Robotinu", "str": "cpfu", "radnje": [["tema", "predajaRobotinu"], ["cekaj", 3], ["klikT", "Pokreni slijed", "section.tcf .tcf-upr"], ["cekaj", 40], ["natrag"], ["cekaj", 2]], "klik": "Animacija „Predaja nosača mobilnom robotu”: skretnica, poziv Robotina, pristajanje, handshake, trake.", "tekst": "Animacija pokazuje cijeli slijed: skretnica šalje nosač u krak, modul grananja preko sustava za upravljanje traži Robotina, robot pristaje uz krak, optički handshake potvrđuje da su obje strane spremne — izlaz PLC-a modula prema robotu i ulaz od robota — i trake prebacuju nosač. Isti handshake vidjeli smo maloprije u simulatoru laboratorija.", "dopuna": "Docking-Kit na modulu grananja uvjet je za predaju; modul kobota u ovoj opremi ga nema, pa mu Robotino ne može predati nosač. Pitanje: što bi trebalo dodati modulu da i on prima nosače od Robotina?"}, {"t": 4800, "dio": "6 Robotino u CP Factory", "naslov": "Simulator linije: nalog s transportom Robotinom", "str": "cpfs", "radnje": [["str", "cpfs"], ["cekaj", 3], ["poravnaj"], ["cekaj", 2], ["niz", "robotino"], ["cekaj", 3], ["izbor", "#m-tip", "robotino"], ["cekaj", 2], ["klik", "#m-posalji"], ["cekaj", 2], ["klik", "[data-brzina=\"5\"]"], ["cekaj", 2], ["pogled", "branch"], ["cekaj", 30], ["skrol", "#k-robotino"], ["cekaj", 40]], "klik": "Simulator linije, niz „Predaja nosača Robotinu na BRANCH-u”: nalog iz MES-a, ubrzanje ×5, pogled „BRANCH i Robotino”, kartica Robotino · Fleet Manager.", "tekst": "U simulatoru cijele linije šaljem nalog koji uključuje transport Robotinom i ubrzavam vrijeme pet puta. Skladište izdaje paletu na nosač, nosač skreće u krak, a Robotino odlazi sa stanice za punjenje, pristaje i preuzima ga. Na kartici Robotino vidite brzine triju motora — istu kinematiku koju smo računali. Brojevi operacija za transport Robotinom nisu objavljeni, pa su u simulatoru označeni kao podatak koji nedostaje.", "dopuna": "Ubrzanje simulacije ne mijenja redoslijed događaja, samo ih prikazuje brže. Pitanje: koliko dugo bi isti nalog trajao u stvarnoj tvornici, ako u simulatoru uz ubrzanje ×5 traje oko minutu?"}, {"t": 4980, "dio": "7 AR i zadatak", "naslov": "Robotino u proširenoj stvarnosti", "str": "ar", "radnje": [["str", "ar"], ["cekaj", 4], ["okret", 20], ["skrol", "#ar"], ["cekaj", 10]], "klik": "Robotino u proširenoj stvarnosti: 3D prikaz i QR kod.", "tekst": "Treće poglavlje je Robotino u proširenoj stvarnosti. Na računalu ga okrećete mišem, a na mobitelu skenirate QR kod, usmjerite kameru prema podu i postavite robota u stvarnoj veličini. Robot ostaje usidren na podu dok ga obilazite, pa vidite koliko je velik i gdje su mu senzori.", "dopuna": "Na mobitelu u Chromeu robot se sidri na pod i ostaje na mjestu dok ga obilazite. Pitanje: koliko prostora treba robotu promjera 45 cm za okret na mjestu?"}, {"t": 5100, "dio": "7 AR i zadatak", "naslov": "Gdje dalje", "str": "index", "radnje": [["str", "index"], ["cekaj", 3], ["skrol", ".moduli"], ["cekaj", 20]], "klik": "Naslovnica područja: poglavlja Robotina i poveznice na CP Factory, KUKA KR 6 i UR3e.", "tekst": "Sve što smo danas vidjeli ostaje na stranicama: upoznavanje robota, simulator laboratorija s deset nizova, AR i simulator linije CP Factory. Nizovi pamte napredak u vašem pregledniku. Za one koji imaju pristup Festovoj platformi LX: tečaj Autonomous Mobile Robotics with Robotino 4 ima petnaest vježbi na stvarnom robotu, od puštanja u rad do autonomnog prilaza markerima.", "dopuna": "U CP Factoryju Robotino povezuje stanice umjesto transportne trake, pa se raspored proizvodnje mijenja bez promjene opreme."}, {"t": 5220, "dio": "7 AR i zadatak", "naslov": "Sažetak i zadatak", "str": "index", "radnje": [["skrolY", 0], ["cekaj", 3], ["lebdi", "#goals li:nth-child(1)"], ["cekaj", 10], ["lebdi", "#goals li:nth-child(2)"], ["cekaj", 10], ["lebdi", "#goals li:nth-child(3)"], ["cekaj", 10], ["lebdi", "#goals li:nth-child(4)"], ["cekaj", 10], ["lebdi", "#goals li:nth-child(5)"], ["cekaj", 10]], "klik": "Blok „Moći ću” — povratak na ishode.", "tekst": "Ukratko: kotač je najučinkovitiji način kretanja po ravnom, standardni kotač ima bočno ograničenje, a švedski ga uklanja valjcima. Robotino s tri omni kotača holonoman je i giba se u svim smjerovima, a brzine motora slijede iz jednostavne kinematike. Odometrija se kvari proklizavanjem, a ispravljaju je žiroskop i laser. U tvornici Robotino vozi nosače između stanica i predaje ih optičkim handshakeom. Zadatak za vas: u simulatoru prođite nizove 1, 2 i 3 i izračunajte brzinu motora 1 za vožnju naprijed od 0,2 metra u sekundi. Hvala na pažnji.", "dopuna": "Zadatak riješite u simulatoru na mobitelu ili računalu; nizovi pamte napredak u pregledniku."}]; window.KRAJ = 5400;</script>
<script>
(function () {
'use strict';
const S = window.SCENARIJ, KRAJ = window.KRAJ;
const q = new URLSearchParams(location.search);
const BRZ = Math.max(0.1, parseFloat(q.get('brzina') || '1'));
const KANAL = 'ftq-predavanje-robotino';
const STR = { index: 'index.html', upoz: 'upoznavanje-robota.html', upr: 'upravljanje-robotom.html', ar: '../ar/robotino/index.html', kot: '../mobilna-robotika/2-3-roboti-na-kotacima.html', man: '../mobilna-robotika/3-2-manevrabilnost.html', cpfu: '../cp-factory/upoznavanje-sustava.html', cpfs: '../cp-factory/simulator-linije.html' };
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function korakU(t) { let i = 0; for (let j = 0; j < S.length; j++) if (S[j].t <= t) i = j; return i; }
let bc = null; try { bc = new BroadcastChannel(KANAL); } catch (e) { bc = null; }

/* =================================================================== čitač */
if (q.has('citac')) {
  document.body.className = 'citac';
  document.body.insertAdjacentHTML('beforeend',
    '<div class="c-vrh"><span class="znak">FORTRONI<b>Q</b></span><span class="vr" id="c-vr">00:00</span><span class="st" id="c-st">čekam režisera…</span>' +
    '<div class="desno"><button id="c-prije" title="Prethodni korak">⏮</button><button id="c-igraj" title="Pokreni / pauza (razmaknica)">▶ / ⏸</button><button id="c-dalje" title="Sljedeći korak">⏭</button>' +
    '<button id="c-m5">−5 s</button><button id="c-p5">+5 s</button><button id="c-manje">A−</button><button id="c-vece">A+</button><button id="c-tema">◐</button></div></div><div class="c-popis" id="c-popis"></div>');
  const popis = document.getElementById('c-popis');
  popis.innerHTML = S.map((k, i) => '<article class="c-k" id="k' + i + '"><div class="gl"><span class="t">' + mmss(k.t) + '</span><span class="dio">' + esc(k.dio) + '</span><h2>' + esc(k.naslov) + '</h2></div>' +
    '<p class="klik">' + esc(k.klik) + '</p><p class="tekst">' + esc(k.tekst) + '</p>' + (k.dopuna ? '<p class="dop"><b>Dopuna / pitanje: </b>' + esc(k.dopuna) + '</p>' : '') + '<div class="napr"><i></i></div></article>').join('');
  let vel = 1.45; try { vel = parseFloat(localStorage.getItem('ftq-citac-vel')) || 1.45; } catch (e) { /* ništa */ }
  const vPost = () => { document.documentElement.style.setProperty('--vel', vel + 'rem'); try { localStorage.setItem('ftq-citac-vel', String(vel)); } catch (e) { /* ništa */ } };
  vPost();
  document.getElementById('c-manje').onclick = () => { vel = Math.max(0.9, vel - 0.1); vPost(); };
  document.getElementById('c-vece').onclick = () => { vel = Math.min(3, vel + 0.1); vPost(); };
