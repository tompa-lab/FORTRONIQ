<!doctype html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Čitač i OBS — Mobilni robot Robotino</title>
<style>
/* Čitač za drugi zaslon s upravljanjem OBS-om (obs-websocket v5). Otvara se kao lokalna datoteka u Chromeu. */
:root{--paper:#FFFFFF;--ink:#10394A;--body:#55717F;--rule:#D7E1E6;--teal:#17656E;--cyan:#2ECAD4;--bar:#132026;--bar-ink:#E7EEF1;--warn:#B54708;--ok:#1C7C54;--font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.vrh{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);padding:10px 16px}
.red{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.znak b{color:var(--cyan)}
.vr{font:700 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums}
.st{font-size:.85rem;opacity:.8}
.desno{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.vrh button,.vrh select,.vrh input{font:inherit;font-size:.88rem;background:transparent;color:var(--bar-ink);border:1px solid rgba(231,238,241,.35);border-radius:8px;padding:5px 10px}
.vrh button{cursor:pointer}
.vrh button:hover,.vrh button:focus-visible{border-color:var(--cyan);color:var(--cyan);outline:none}
.vrh button.akt{background:var(--cyan);color:#06262B;border-color:var(--cyan)}
.vrh button.rec{border-color:#F04438;color:#FDA29B}.vrh button.rec.akt{background:#F04438;color:#fff}
.vrh select option{color:#10394A}
.obs{margin-top:8px;border-top:1px solid rgba(231,238,241,.18);padding-top:8px}
.obs summary{cursor:pointer;font-size:.88rem;opacity:.9}
.obs .red{margin-top:8px}
.oznaka{font-size:.78rem;opacity:.7}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:#667085;margin-right:6px;vertical-align:middle}
.lamp.ok{background:#3CCB7F}.lamp.greska{background:#F04438}
#poruka{font-size:.82rem;opacity:.85;min-height:1.2em}
.kadrovi{display:flex;flex-wrap:wrap;gap:6px}
.popis{max-width:1100px;margin:0 auto;padding:14px 16px 60vh}
.k{scroll-margin-top:calc(var(--vrh,120px) + 12px);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.k.gotov{opacity:.35}
.gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.t{font:700 1rem var(--mono);color:var(--teal);font-variant-numeric:tabular-nums}
.dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.k h2{margin:0;font-size:1.25rem}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0 0}
.plan span{font:500 .78rem var(--mono);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;color:var(--body)}
.plan span.sad{border-color:var(--teal);color:var(--teal)}
.klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;max-width:70ch}
.dop{font-size:calc(var(--vel,1.45rem)*.82);line-height:1.5;margin:.7rem 0 0;color:var(--body);max-width:70ch}
.dop b{color:var(--ink)}
.napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.napr i{display:block;height:100%;width:0;background:var(--teal)}
/* uređivač kadrova */
#urednik{position:fixed;inset:0;z-index:20;background:rgba(5,14,18,.88);display:none;align-items:center;justify-content:center;padding:16px}
#urednik.otv{display:flex}
.ur-okvir{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;max-width:1300px;width:100%;max-height:100%;overflow:auto}
.ur-okvir h3{margin:0 0 6px}
.ur-okvir p{margin:.2rem 0 .6rem;color:var(--body);font-size:.9rem}
.ur-okvir button{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ur-okvir button.akt{background:var(--teal);color:#fff;border-color:var(--teal)}
#platno{display:block;width:auto;max-width:100%;max-height:62vh;height:auto;margin:10px 0;border-radius:8px;cursor:crosshair;background:#000;touch-action:none}
@media (max-width:680px){.tekst{font-size:1.15rem}.vr{font-size:1.2rem}.vrh{position:static}}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>
<body>
<div class="vrh">
 <div class="red"><span class="znak">FORTRONI<b>Q</b></span><span class="vr" id="vr">00:00 / 90:00</span><span class="st" id="st">pauza</span>
  <div class="desno"><button id="b-prije" title="Prethodni korak (←)">⏮</button><button id="b-igraj" title="Pokreni ili pauziraj (razmaknica)">▶ Pokreni</button><button id="b-dalje" title="Sljedeći korak (→)">⏭</button><button id="b-m5">−5 s</button><button id="b-p5">+5 s</button><button id="b-manje" title="Manje pismo">A−</button><button id="b-vece" title="Veće pismo">A+</button><button id="b-tema" title="Svijetlo ili tamno">◐</button></div></div>

  <label class="oznaka"><input type="checkbox" id="c-auto" checked> automatski</label>

 <details class="obs" id="obs-ploca" open><summary><span class="lamp" id="lamp"></span><span id="obs-st">OBS nije spojen</span></summary>
  <div class="red"><input id="i-url" size="20" value="ws://127.0.0.1:4455" aria-label="Adresa OBS WebSocket poslužitelja"><input id="i-loz" type="password" size="16" placeholder="lozinka iz OBS-a" aria-label="Lozinka"><label class="oznaka"><input type="checkbox" id="c-pamti"> zapamti</label><button id="b-spoji">Spoji</button>
   <span class="oznaka">Snimani zaslon:</span><select id="s-izvor"><option value="">— spoji se —</option></select><button id="b-novi" title="Napravi novi izvor snimanja zaslona">+ izvor</button>
   <span class="oznaka">Kamera:</span><select id="s-kam"><option value="">bez kamere</option></select></div>
  <div class="red"><button id="b-pripremi">Pripremi scene u OBS-u</button><button id="b-uredi">Namjesti kadrove</button>
   <label class="oznaka"><input type="checkbox" id="c-natpis" checked> natpis koraka na snimci</label>
   <label class="oznaka"><input type="checkbox" id="c-cekaj"> čekaj ⏭ na kraju koraka</label>
   <label class="oznaka"><input type="checkbox" id="c-pauzarec"> pauza sata pauzira snimanje</label>
   <div class="desno"><button id="b-pogl" title="Preuzmi poglavlja za YouTube iz stvarnih vremena snimke">Poglavlja (.txt)</button><button id="b-srt" title="Preuzmi naslove koraka kao titlove">Naslovi (.srt)</button></div></div>
  <div id="poruka" role="status"></div>
 </details>
</div>
<main class="popis" id="popis"></main>
<div id="urednik" role="dialog" aria-modal="true" aria-labelledby="ur-n"><div class="ur-okvir">
 <h3 id="ur-n">Namjesti kadrove</h3>
 <p>Odaberi kadar, pa na snimci povuci pravokutnik (omjer je zaključan na omjer snimke). Snimka je trenutni prikaz izvora iz OBS-a — prije toga na snimanom zaslonu otvori autopilot.</p>
 <div class="kadrovi" id="ur-kadrovi"></div>
 <canvas id="platno" width="1280" height="720"></canvas>
 <div class="kadrovi"><button id="ur-osvjezi">Nova snimka</button><button id="ur-zadano">Zadano za odabrani</button><button id="ur-spremi" class="akt">Spremi i primijeni</button><button id="ur-zatvori">Zatvori</button></div>
</div></div>
<script>
(function(){
'use strict';
const S=[{"t": 0, "dio": "Uvod", "naslov": "Dobrodošlica i cilj predavanja", "klik": "Naslovnica područja Mobilni robot Robotino.", "tekst": "Dobar dan. Danas je tema mobilni robot koji se ne mora okretati da bi krenuo u stranu. To je Festo Robotino, robot koji stoji u didaktičkoj tvornici i vozi nosače izradaka između stanica. Prvo ćemo vidjeti na kakvim kotačima voze mobilni roboti i zašto je svesmjerni, švedski kotač poseban. Zatim ćemo Robotina rastaviti dio po dio, izračunati koliko se brzo vrti svaki motor i na kraju njime upravljati u simulatoru i staviti ga u prostor u proširenoj stvarnosti. Sve radi u običnom pregledniku, pa sve možete ponoviti sami, na računalu ili na mobitelu.", "dopuna": "Mobilni robot je robot koji mijenja mjesto, za razliku od robotske ruke koja je pričvršćena za pod. Pitanje: gdje ste u zadnje vrijeme vidjeli mobilnog robota — u trgovini, bolnici, skladištu?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Mobilni robot Robotino", "Kotači, svesmjerni pogon, građa i upravljanje"]}, {"t": 90, "dio": "Uvod", "naslov": "Što ćemo moći nakon predavanja", "klik": "Blok „Moći ću” — pet ishoda (pokazivač prelazi preko svakoga).", "tekst": "Na vrhu stranice je pet ishoda, a danas im dodajemo i šesti: razlikovati vrste kotača i rasporede pogona mobilnih robota. Nakon sata trebali biste znati nabrojati dijelove Robotina i pokazati ih na robotu; objasniti građu pogonske jedinice i svesmjernog kotača; izračunati brzine motora iz zadane brzine robota i obrnuto; objasniti rad senzora, odbojnika, laserskog skenera i sigurnosnog kruga s nužnim stopom; te voziti robota u simulatoru i pristati na stanicu za punjenje. Na kraju sata te ćemo ishode provjeriti.", "dopuna": "Ishodi su napisani glagolima koje se može provjeriti: nabrojati, objasniti, izračunati, voziti. Zapišite ih — na kraju sata svaki ćemo označiti.", "kadrovi": [[0, "cijeli"]]}, {"t": 180, "dio": "Uvod", "naslov": "Plan sata i poglavlja", "klik": "Popis poglavlja Robotina: Upoznavanje robota, Upravljanje robotom, Robot u proširenoj stvarnosti.", "tekst": "Sat ima sedam dijelova. Prvo kotači mobilnih robota općenito, iz područja Mobilna robotika. Zatim svesmjerni kotač izbliza, pa Robotino dio po dio u poglavlju Upoznavanje robota. Četvrti dio je kinematika — kako se iz željenog gibanja računaju brzine motora; tu ima formula, i tko želi, može ga preskočiti. Peti dio je upravljanje robotom u simulatoru laboratorija — proći ćemo svih deset nizova. Šesti dio je Robotino u pametnoj tvornici CP Factory, a sedmi robot u proširenoj stvarnosti i zadatak za vas.", "dopuna": "Sve stranice rade bez instalacije, u pregledniku, i pamte napredak. Četvrti dio s formulama može se preskočiti; sve ostalo može se pokazati polaznicima istim redom.", "kadrovi": [[0, "cijeli"]]}, {"t": 270, "dio": "1 Kotači", "naslov": "Zašto kotač", "klik": "Mobilna robotika, jedinica 2.3 Roboti na kotačima — odjeljak „Zašto kotač pobjeđuje”.", "tekst": "Gotovo svaki mobilni robot koji doista radi — u skladištu, bolnici ili tvornici — vozi na kotačima. Razlog je jednostavan: dodirna točka kotača ne kliže po podlozi, nego se u svakom trenutku stvara nova. Zato je otpor kotrljanja po tvrdoj podlozi pet do deset puta manji nego kod hodanja, a kotač treba jedan motor i jedan enkoder umjesto tri. Pitanje zato nije hoće li robot imati kotače, nego koliko kotača, koje vrste i koji od njih imaju pogon. Ta tri odgovora određuju kako se robot giba, kako se okreće i koliko točno zna gdje je.", "dopuna": "Hodajući roboti postoje i napreduju, ali u zgradama gotovo i nema drugih izvedbi osim kotača. Pitanje: na kakvoj podlozi kotač gubi prednost pred nogama?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 1: Kotači mobilnih robota", "Vrste kotača, rasporedi, manevrabilnost i holonomnost"]}, {"t": 360, "dio": "1 Kotači", "naslov": "Četiri vrste kotača: standardni", "klik": "Odjeljak „Četiri vrste kotača”: odabran standardni kotač; crtež i opis desno.", "tekst": "Svaki kotač mobilnog robota pripada jednoj od četiriju skupina, a razlika među njima nije u obliku nego u tome u kojim se smjerovima smije gibati. Prvi je standardni kotač: os vrtnje mu je čvrsto vezana za tijelo. Najčešći je, najjeftiniji i najizdržljiviji. Ključno je njegovo bočno ograničenje — koliko god jako bio pogonjen, ne može se pomaknuti u smjeru svoje osi, jer je trenje u tom smjeru mnogo veće nego u smjeru kotrljanja. To nije nedostatak, nego temeljno svojstvo, i cijela kinematika mobilnih robota gradi se upravo na njemu.", "dopuna": "Bočno ograničenje je razlog zašto automobil ne može parkirati postrance. Pitanje: koji biste predmet iz učionice upotrijebili da djeci pokažete bočno ograničenje kotača?", "kadrovi": [[0, "cijeli"]]}, {"t": 450, "dio": "1 Kotači", "naslov": "Zakretni i kuglasti kotač", "klik": "Odabran zakretni (castor), zatim kuglasti kotač.", "tekst": "Zakretni kotač poznajete s kolica u trgovini: skretna os mu je pomaknuta od dodirne točke, pa se pri promjeni smjera sam okrene za vozilom. Dok se poravnava, nakratko vuče vozilo u stranu — kod finog pozicioniranja to se vidi kao odstupanje od nekoliko milimetara. Zato se koristi kao oslonac, ne kao pogon. Kuglasti kotač je kugla u ležištu s valjčićima: nema povlašten smjer i ne opire se nijednom gibanju. Ali ne može se pogoniti, malo nosi i skuplja prašinu, pa je treći oslonac malih robota.", "dopuna": "Na mnogim školskim robotima kuglasti kotač je treći oslonac uz dva pogonska kotača. Pitanje: zašto taj oslonac ne smije biti pogonjen?", "kadrovi": [[0, "cijeli"]]}, {"t": 540, "dio": "1 Kotači", "naslov": "Švedski kotač", "klik": "Odabran švedski kotač: obod s valjcima pod kutom.", "tekst": "Četvrti je švedski kotač — jedini koji uklanja bočno ograničenje, i to domišljato. Obod mu nose slobodni valjci. Kotač i dalje aktivno gura samo u smjeru vrtnje, ali se u drugom smjeru može slobodno kotrljati po valjcima. Valjci mogu stajati pod pravim kutom prema osi kotača — to je svesmjerni ili omni kotač, kakav ima Robotino — ili pod kutom od 45 stupnjeva — to je mecanum kotač, kakav imaju viličari i platforme koje se primiču polici. Naziv „švedski” dolazi od švedske tvrtke Mecanum, u kojoj je takav kotač izumljen sedamdesetih. Cijena je trošenje valjaka, buka, veća potrošnja i slabija procjena položaja iz okretaja kotača.", "dopuna": "Kut valjaka određuje kako se sile raspoređuju: pri 90° kotač bočno ne prenosi silu, pri 45° prenosi polovicu u svakom smjeru. Pitanje: zašto je svesmjerno vozilo bučnije od običnog?", "kadrovi": [[0, "cijeli"]]}, {"t": 630, "dio": "1 Kotači", "naslov": "Rasporedi: diferencijalni i tricikl", "klik": "Odjeljak „Rasporedi kotača i pogona”: diferencijalni pogon, zatim tricikl.", "tekst": "Vrste kotača kombiniraju se u rasporede, a pet ih pokriva gotovo sve što se susreće u praksi. Najčešći je diferencijalni pogon: dva neovisno pogonjena kotača na istoj osi i jedan ili dva slobodna oslonca. Smjer se mijenja samo razlikom brzina kotača, robot se okreće u mjestu, a račun gibanja je najjednostavniji mogući. Tricikl ima jedan prednji kotač koji je istodobno pogonjen i skretan. On se ne okreće u mjestu: pri nultoj brzini zakret prednjeg kotača ne pomiče vozilo. Tipičan je za viličare.", "dopuna": "Većina obrazovnih robota (mBot, Lego, eMIR) ima diferencijalni pogon. Pitanje: koliko motora i koliko enkodera treba diferencijalnom robotu?", "kadrovi": [[0, "cijeli"]]}, {"t": 720, "dio": "1 Kotači", "naslov": "Ackermannov, sinkroni i svesmjerni pogon", "klik": "Ackermannov pogon, sinkroni pogon i svesmjerni pogon s četiri kotača.", "tekst": "Ackermannov pogon je automobil: dva skretna prednja kotača zakreću se za različite kutove tako da svi kotači imaju zajedničko središte zakretanja — inače bi unutarnji kotač u zavoju strugao. Sinkroni pogon zakreće sve kotače zajedno, pa tijelo zadržava orijentaciju dok vozilo mijenja smjer; mehanizam je složen i danas je rijedak. Svesmjerni pogon ima tri ili četiri švedska kotača postavljena tako da se njihove bočne komponente zbrajaju. Vozilo se giba naprijed, postrance i ukoso, a ne mora se zakretati. Na crtežu su četiri kotača s valjcima pod 45 stupnjeva — to je mecanum raspored. Robotino ima tri kotača, a valjci su mu okomiti na os kotača.", "dopuna": "Ackermannov pogon je najbolji za velike brzine na otvorenom, svesmjerni za precizno primicanje u zatvorenom. Pitanje: koji biste raspored odabrali za robota koji dostavlja hranu u bolnici, a koji za robota koji primiče paletu stroju?", "kadrovi": [[0, "cijeli"]]}, {"t": 810, "dio": "1 Kotači", "naslov": "Od motora do kotača: prijenos i moment", "klik": "Odjeljak „Od motora do kotača”: klizači motor 3100 1/min, prijenos ≈ 32, polumjer 6 cm; zatim prijenos 60.", "tekst": "Motor gotovo nikad nije spojen izravno na kotač. Elektromotor radi najbolje pri nekoliko tisuća okretaja u minuti, a kotač treba stotinjak i velik moment — tu razliku premošćuje prijenosnik. Postavimo brojeve kao na Robotinu: motor oko 3100 okretaja u minuti, prijenos oko 32 (klizač ide u koracima po pet, pa je ovdje 30), polumjer kotača 6 centimetara. Kotač se vrti stotinjak okretaja u minuti, a robot vozi nešto manje od 0,7 metara u sekundi. Udvostručim li prijenosni omjer, vučna se sila udvostruči, a brzina prepolovi. Isti motor daje ili brzinu ili silu, nikad oboje.", "dopuna": "[R] Uz motor 3100 1/min, prijenos 32 i kotač Ø120 mm: kotač se vrti 3100/32 ≈ 97 1/min, a obodna brzina je π · 0,12 · 97 / 60 ≈ 0,61 m/s. Pitanje: koliko bi bila brzina uz prijenos 16, kao na Robotinu 2?", "kadrovi": [[0, "cijeli"]]}, {"t": 930, "dio": "1 Kotači", "naslov": "Trenutačno središte zakretanja", "klik": "Mobilna robotika, jedinica 3.2 Manevrabilnost — trenutačno središte zakretanja; klizači brzina lijevog i desnog kotača.", "tekst": "Svako gibanje vozila u ravnini može se u svakom trenutku opisati kao vrtnja oko jedne točke — trenutačnog središta zakretanja. Kod standardnih kotača ono leži na presjeku osi svih kotača. Gledajte: kad su brzine jednake, središte je u beskonačnosti i vozilo ide ravno. Kad su brzine različite, vozi u luku. Kad su jednake i suprotne, središte je između kotača i vozilo se okreće u mjestu. Kad jedan kotač stoji, vozilo se okreće oko njega. Kod svesmjernog robota to središte može biti bilo gdje — i to je cijela njegova prednost.", "dopuna": "Isti pojam postoji i kod mehanizama: trenutačni pol brzina. Pitanje: gdje je trenutačno središte zakretanja kad automobil vozi u krugu na parkiralištu?", "kadrovi": [[0, "cijeli"]]}, {"t": 1020, "dio": "1 Kotači", "naslov": "Pokretljivost, upravljivost i manevrabilnost", "klik": "Odjeljak „Dva broja”: diferencijalni, Ackermannov i svesmjerni raspored.", "tekst": "Manevarsku sposobnost opisuju dva broja. Stupanj pokretljivosti broji koliko se stupnjeva slobode može iskoristiti odmah, bez zakretanja kotača; stupanj upravljivosti broji koliko se kotača može neovisno zakretati. Zbroj je manevrabilnost. Diferencijalni pogon ima dva plus nula, Ackermannov jedan plus jedan — zbroj je isti, a ponašanje posve različito. Svesmjerni ima tri plus nula: sve tri slobode u ravnini dostupne su odmah.", "dopuna": "Najveća manevrabilnost u ravnini je 3, jer vozilo na podu ima tri stupnja slobode: x, y i zakret. Pitanje: koliko stupnjeva slobode ima dron?", "kadrovi": [[0, "cijeli"]]}, {"t": 1080, "dio": "1 Kotači", "naslov": "Holonomnost: isti zadatak, dva vozila", "klik": "Odjeljak „Holonomnost”: zadatak „Pomak u stranu”, zatim „Parkiranje uz policu” — diferencijalno i svesmjerno vozilo.", "tekst": "Holonomno je vozilo koje se iz mirovanja može pomaknuti u bilo kojem smjeru i pritom slobodno birati zakret. Vozila sa standardnim kotačima nisu holonomna — to ne znači da neka mjesta ne mogu doseći, nego da je put do njih dulji i traži manevar, kao parkiranje automobila. Pogledajte pomak u stranu: diferencijalno vozilo mora se okrenuti, voziti i okrenuti natrag, a svesmjerno jednostavno klizne ulijevo. Zato svesmjerni robot može prići stanici bočno — a upravo to Robotino radi kad predaje nosač izratka.", "dopuna": "Za planiranje putanje holonomnost je velika olakšica: planer smije crtati ravne crte između točaka. Pitanje: koji je zadatak u učionici teži za diferencijalnog robota nego za svesmjernog?", "kadrovi": [[0, "cijeli"]]}, {"t": 1170, "dio": "2 Svesmjerni kotač", "naslov": "Upoznavanje Robotina: raspored stranice", "klik": "Mobilni robot Robotino — Upoznavanje robota: lijevo izbornik (96 dijelova u 7 skupina), u sredini 3D prikaz, desno objašnjenje.", "tekst": "Prelazimo na Robotina. Stranica je složena isto kao kod kobota: lijevo izbornik s 96 dijelova u sedam skupina, u sredini trodimenzionalni model, desno objašnjenje. Ovo je Robotino 4 u izvedbi za CP Factory: osnovica promjera 45 centimetara i mase 20 kilograma, a na njoj toranj s prihvatom nosača izratka, signalnim stupom i nužnim stopom. Uz njega je stanica za punjenje. Narančasta točka u izborniku označava dio kod kojeg je nešto procijenjeno, jer proizvođač taj podatak ne objavljuje.", "dopuna": "Kvačice uz pregledane dijelove služe kao popis: cilj je da do sljedećeg sata svih 96 dijelova ima kvačicu.", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 2: Svesmjerni kotač", "Valjci, sile, omni i mecanum, pokazna vožnja"]}, {"t": 1230, "dio": "2 Svesmjerni kotač", "naslov": "Tri pogonske jedinice", "klik": "Pogled Pogon; pogonske jedinice 1, 2 i 3; pogled odozgo.", "tekst": "Robotino ima tri neovisne pogonske jedinice, razmaknute za 120 stupnjeva. Kotač 1 je naprijed lijevo, na 60 stupnjeva od osi x robota, kotač 2 straga, na 180 stupnjeva, a kotač 3 naprijed desno, na 300 stupnjeva. Os x gleda naprijed, prema laserskom skeneru. Svaka jedinica ima motor, enkoder, reduktor, zupčasti remen i kotač. Pogled odozgo pokazuje ono najvažnije: kotači nisu usporedni, nego stoje kao stranice trokuta. Zato zbroj njihovih gibanja može dati bilo koji smjer.", "dopuna": "Tri kotača su najmanji broj za holonomno vozilo i uvijek sva tri dodiruju pod, čak i na neravnom podu. Pitanje: što bi se dogodilo s četiri kotača na neravnom podu bez ovjesa?", "kadrovi": [[0, "cijeli"]]}, {"t": 1290, "dio": "2 Svesmjerni kotač", "naslov": "Svesmjerni kotač izbliza", "klik": "Dijelovi Omnidirekcijski kotač K1 i Valjci kotača K1 — opis, podaci i izvor desno.", "tekst": "Kotač Robotina 4 ima promjer 120 milimetara i tijelo od glodanog aluminija. Po obodu nosi 16 bačvastih valjaka s jezgrom od polikarbonata i plaštem od prozirnog poliuretana, a svaki se valjak vrti na dvije brončane čahure. Valjci su okomiti na os kotača i složeni tako da uvijek barem jedan dodiruje pod. Kad se kotač vrti, gura robota u smjeru vrtnje. Kad drugi kotači guraju robota postrance, ovaj se ne opire — kotrlja se po svojim valjcima.", "dopuna": "Valjci su prozirni poliuretanski plašt na tvrdoj jezgri: mekan plašt daje prianjanje, tvrda jezgra nosivost. Pitanje: što se događa s valjcima nakon više stotina sati vožnje po hrapavom podu?", "kadrovi": [[0, "cijeli"]]}, {"t": 1380, "dio": "2 Svesmjerni kotač", "naslov": "Kako radi: svesmjerni kotač", "klik": "Animacija „Svesmjerni (švedski) kotač” na mjestu 3D prikaza: lijevo pogled duž osi, desno odozgo; klizač smjera gibanja α 0° → 30° → 60° → 90°.", "tekst": "Otvaram animaciju. Lijevo je kotač gledan duž osi, desno odozgo, a pod se giba ispod njega. Klizač je smjer gibanja tla prema smjeru vrtnje kotača. Pri nuli kotač se vrti punom brzinom, a valjci miruju. Pri 30 stupnjeva kotač preuzima samo komponentu v puta kosinus alfa, a valjci bočnu komponentu v puta sinus alfa. Što je kut veći, kotač se vrti sporije, a valjci brže. Pri 90 stupnjeva kotač stoji, a robot klizi postrance po valjcima — kotač tada ne smeta ostalima. To je cijeli trik.", "dopuna": "Isto načelo vrijedi za svaki kotač Robotina, samo je svaki okrenut drukčije. Pitanje: pri kojem kutu α kotač pretvara cijelo gibanje u vrtnju, a pri kojem cijelo u kotrljanje valjaka?", "kadrovi": [[0, "cijeli"]]}, {"t": 1530, "dio": "2 Svesmjerni kotač", "naslov": "Sile na kotaču i proklizavanje", "klik": "Prikaz „Sile”: klizač momenta motora; zatim natrag na „Brzine”.", "tekst": "Prebacujem na sile. Motor preko reduktora daje moment, a kotač gura pod silom koja ide samo u smjeru vrtnje — valjci bočnu silu ne prenose. Što je moment veći, to je i potrebna sila trenja veća; kad je prijeđe, kotač proklizava. Kod svesmjernog kotača proklizavanje je češće nego kod standardnog, jer dodirna površina valjka je mala i mijenja se dok se kotač vrti. Zato procjena položaja iz okretaja kotača — odometrija — ovdje griješi više, i Robotino je ispravlja žiroskopom.", "dopuna": "Zato Robotino ima ograničeno ubrzanje u web sučelju: preveliko ubrzanje znači proklizavanje i pogrešnu odometriju. Pitanje: kako biste pokusom izmjerili proklizavanje?", "kadrovi": [[0, "cijeli"]]}, {"t": 1620, "dio": "2 Svesmjerni kotač", "naslov": "Omni i mecanum: 90 i 45 stupnjeva", "klik": "Mobilna robotika 2.3: svesmjerni raspored s četiri kotača pod 45° i kartica švedskog kotača.", "tekst": "Dvije izvedbe švedskog kotača često se miješaju, pa ih usporedimo. Kod omni kotača valjci su okomiti na os kotača; trebaju barem tri kotača pod različitim kutovima, kao na Robotinu. Kod mecanum kotača valjci stoje pod 45 stupnjeva; četiri kotača stoje usporedno, kao na automobilu, a bočno gibanje nastaje kad se lijevi i desni kotači vrte suprotno. Mecanum raspored dobro nosi teret i lako se ugrađuje u pravokutno vozilo; omni s tri kotača je jednostavniji i uvijek dodiruje pod svim kotačima. Pazite: u literaturi se Robotinov kotač ponekad pogrešno zove mecanum — to nije točno.", "dopuna": "Mecanum kotači dolaze u paru lijevih i desnih, s valjcima u zrcalnom smjeru; krivo složeni ne daju bočno gibanje. Pitanje: kako biste na gotovom vozilu provjerili jesu li kotači dobro složeni?", "kadrovi": [[0, "cijeli"]]}, {"t": 1710, "dio": "2 Svesmjerni kotač", "naslov": "Pokazna vožnja Robotina", "klik": "Upoznavanje Robotina, pogled odozgo: pokazna vožnja naprijed i natrag, bočno, okret na mjestu; brzine motora ispisane u prikazu.", "tekst": "Vratimo se Robotinu i pustimo ga da vozi. Gledajte brojke dolje lijevo: to su brzine triju motora izračunate inverznom kinematikom. Pri vožnji naprijed stražnji kotač, broj 2, miruje, a prednji se vrte suprotno istim iznosom. Pri bočnoj vožnji najjače radi upravo stražnji kotač, a prednja dva upola sporije. Pri okretu na mjestu sva tri motora imaju istu brzinu. Robot ne mora birati: zadate mu gibanje, a upravljanje samo razdijeli brzine na kotače.", "dopuna": "Brzine u prikazu su brzine motora, ne kotača — razlika je prijenos 32. Pitanje: koji motor najviše radi pri bočnoj vožnji i zašto baš on?", "kadrovi": [[0, "cijeli"]]}, {"t": 1830, "dio": "3 Robotino", "naslov": "Osnovica i rastavljanje", "klik": "Dio Šasija (nosiva ploča); klizač Rastavi do 70 % pa natrag.", "tekst": "Sada dio po dio. Osnovica je okrugla, promjera 45 centimetara i visine 32,5 centimetra, s kućištem od nehrđajućeg čelika. Prazna ima 20 kilograma, a nosi do 30 kilograma tereta, centrirano. Klizačem Rastavi razmičem sklopove: pokrove, gornju ploču, upravljačku jedinicu, pogonske jedinice, baterije i nadogradnju. Šasija je nosiva ploča na koju je pričvršćeno sve ostalo — i njezina je kartica ujedno ulaz u animaciju kinematike, kojoj se vraćamo u četvrtom dijelu.", "dopuna": "Kućište od nehrđajućeg čelika i zaštita IP 00 znače: robot je za suhe, čiste prostore. Pitanje: što bi trebalo promijeniti da robot radi u prašnoj radionici?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 3: Robotino dio po dio", "Pogon, enkoderi, senzori, upravljanje i napajanje"]}, {"t": 1920, "dio": "3 Robotino", "naslov": "Pogonska jedinica", "klik": "Pogonska jedinica 1 rastavljena (gumb 1): motor M1, planetarni reduktor P1, zupčasti remen R1.", "tekst": "Rastavljam prvu pogonsku jedinicu. Motor je istosmjerni motor s četkicama, Dunkermotoren GR 42x40, na 24 volta: nazivno oko 3100 okretaja u minuti i moment od 5,7 newton-centimetara. Iza njega je dvostupanjski planetarni reduktor, a do kotača moment prenosi zupčasti remen. Ukupni prijenos od motora do kotača je 32 prema 1. Jedna jedinica je zaseban sklop — ako se motor pokvari, mijenja se cijela jedinica, a robot je brzo ponovno u radu.", "dopuna": "Motor s četkicama je jednostavan i jeftin za regulaciju, ali se četkice troše. Pitanje: zašto industrijski kobot ima motore bez četkica, a obrazovni mobilni robot s četkicama?", "kadrovi": [[0, "cijeli"]]}, {"t": 2010, "dio": "3 Robotino", "naslov": "Kako radi: pogonska jedinica", "klik": "Animacija „Pogonska jedinica: motor, reduktor, remen, kotač” na pozornici; klizači brzine i momenta motora.", "tekst": "Animacija pokazuje lanac od motora do kotača. Motor se vrti oko 3000 okretaja u minuti; nakon prijenosa 32 prema 1 kotač se vrti oko 94 okretaja, a obodna brzina je oko 0,6 metara u sekundi. Moment se povećava istim omjerom, umanjen za gubitke — korisnost reduktora je oko 0,8. Zato motor od 20-ak vata može gurati robota od 30 kilograma. Vraćam se na 3D prikaz gumbom „Natrag na 3D prikaz”.", "dopuna": "[R] Moment na kotaču ≈ moment motora · 32 · 0,81; uz 5,7 Ncm to je oko 1,5 Nm, a vučna sila uz polumjer 6 cm oko 25 N po kotaču. Pitanje: koliki se nagib može savladati s 30 kg tereta?", "kadrovi": [[0, "cijeli"]]}, {"t": 2130, "dio": "3 Robotino", "naslov": "Enkoder i regulacija brzine", "klik": "Dio Enkoder E1 i animacija „Inkrementalni enkoder RE 30-2-500”.", "tekst": "Na stražnjem kraju motora je inkrementalni enkoder s 500 impulsa po okretaju i dva kanala, A i B, pomaknuta za četvrtinu razmaka. Iz redoslijeda bridova zna se smjer, a brojanjem svih bridova dobiva se 2000 inkremenata po okretaju motora — uz prijenos 32 to je 64 000 po okretaju kotača, nekoliko mikrometara puta. Mikrokontroler iz toga tisuću puta u sekundi računa brzinu i PI regulatorom podešava napon motora tako da drži zadanu brzinu, bez obzira na teret i nagib.", "dopuna": "Bez povratne veze enkodera robot bi pri istom naponu vozio sporije s teretom nego bez njega. Pitanje: što bi se dogodilo s odometrijom da enkoder broji samo jedan brid jednog kanala?", "kadrovi": [[0, "cijeli"]]}, {"t": 2220, "dio": "3 Robotino", "naslov": "Infracrveni senzori udaljenosti", "klik": "Dio Infracrveni senzori udaljenosti (9 kom) i animacija; klizač udaljenosti predmeta.", "tekst": "U donjem dijelu osnovice je devet infracrvenih senzora udaljenosti, razmaknutih za 40 stupnjeva po obodu. Mjere od 4 do 30 centimetara načelom triangulacije: što je predmet bliže, to se odbijena zraka vraća pod većim kutom i napon je veći. Krivulja nije linearna, a ispod oko 3 centimetra napon opet pada — senzor tada javlja krivu, veću udaljenost. Zato se predmet koji je preblizu mora prepoznati i drugim senzorom.", "dopuna": "Sjajne i crne površine senzor vidi drukčije: crni mat predmet odbija malo svjetla. Pitanje: kako biste u učionici pokazali da senzor ispod 3 cm laže?", "kadrovi": [[0, "cijeli"]]}, {"t": 2310, "dio": "3 Robotino", "naslov": "Odbojnik i laserski skener", "klik": "Dio Odbojnik (sigurnosni rub), zatim Laserski skener i njegova animacija.", "tekst": "Oko donjeg ruba je odbojnik — sigurnosni rub s gumenim profilom. Pritisak spaja dvije vodljive površine i prekida program i vožnju; radi na načelu mirne struje, pa i prekinut kabel zaustavlja robota. Sprijeda je laserski skener: mjeri udaljenost u 240 stupnjeva oko prednje strane, desetak puta u sekundi, do nekoliko metara. Iz tih mjerenja robot gradi kartu prostora i na njoj se lokalizira. Model skenera na našem robotu procijenjen je s fotografije; u novijim izvedbama za CP Factory ugrađuje se sigurnosni skener sa zaštitnim poljem.", "dopuna": "Odbojnik je posljednja zaštita — dodir se već dogodio; skener sprečava dodir. Pitanje: zašto se kao sigurnosni senzor koristi skener sa zaštitnim poljem, a ne kamera?", "kadrovi": [[0, "cijeli"]]}, {"t": 2430, "dio": "3 Robotino", "naslov": "Kamera, žiroskop i optički senzori", "klik": "Dijelovi: dubinska kamera Intel RealSense D435, žiroskop, optički refleksni senzori.", "tekst": "Na prednjoj ploči je dubinska kamera Intel RealSense D435: uz sliku daje i udaljenost svake točke, pa robot prepoznaje predmete i oznake. U upravljačkoj jedinici je žiroskop koji izravno mjeri kutnu brzinu tijela — operacijski sustav njime ispravlja kut iz odometrije, jer svesmjerni kotači proklizavaju. Na dnu su dva optička refleksna senzora sa svjetlovodima: vide razliku svijetle i tamne podloge i služe za slijeđenje crte.", "dopuna": "Slijeđenje crte dvama senzorima najjednostavniji je primjer povratne veze — idealan za prvi sat robotike s djecom. Pitanje: što robot radi kad oba senzora vide crtu?", "kadrovi": [[0, "cijeli"]]}, {"t": 2520, "dio": "3 Robotino", "naslov": "Upravljačka jedinica i WLAN", "klik": "Dio Upravljačka jedinica i animacija „Upravljačka jedinica i tok podataka”: prekid WLAN-a.", "tekst": "Ispod okruglog poklopca je upravljačka jedinica: ugradbeno računalo s Linuxom i mikrokontroler koji upravlja motorima. Robot ima vlastitu WLAN pristupnu točku i web sučelje. Vanjski program — u Pythonu, MATLAB-u ili ROS-u — šalje mu brzine preko REST sučelja. Važno pravilo: naredba se mora ponavljati barem svakih 200 milisekundi. Ako veza pukne, kao sada, robot sam stane — ne nastavlja voziti zadnjom brzinom. To se zove nadzor veze ili watchdog.", "dopuna": "Watchdog postoji i u autima, dizalima i strojevima: sustav koji ne dobiva redovite poruke prelazi u sigurno stanje. Pitanje: gdje biste u školskom robotu ugradili isto pravilo?", "kadrovi": [[0, "cijeli"]]}, {"t": 2610, "dio": "3 Robotino", "naslov": "Napajanje, nadogradnja i stanica za punjenje", "klik": "Baterija (Festool Li-ion 18 V), prihvat nosača izratka s trakama, signalni stup, stanica za punjenje.", "tekst": "Robotino 4 napajaju do četiri Festool litij-ionske baterije od 18 volti, iste kao u alatu; s punim kompletom radi do desetak sati, a paketi se mijenjaju sa stražnje strane. Na osnovici je nadogradnja za CP Factory: toranj, prihvat nosača izratka s dvije trake, signalni stup, tipkala RESET i START i gljiva nužnog stopa. Stanica za punjenje ima šestopolni kontakt i dva reflektorska markera po kojima je laser pronalazi. Dok je robot na stanici, radi na mrežnom napajanju i ne prazni baterije.", "dopuna": "Signalni stup je jezik robota prema ljudima: crveno greška, narančasto upozorenje, zeleno spreman. Pitanje: što znači kad zeleni segment treperi?", "kadrovi": [[0, "cijeli"]]}, {"t": 2730, "dio": "4 Kinematika (preskočivo)", "naslov": "Kako radi: kinematika — vožnja naprijed", "klik": "Animacija „Kinematika tri svesmjerna kotača”: odozgo robot s tri kotača i strelicama, ispod put robota; desno klizači vx, vy, ω i račun uživo. Gumb „Naprijed”.", "tekst": "Sada račun. Robot ima tri stupnja slobode — vx naprijed, vy ulijevo i ω zakret — i tri motora. Za svaki kotač i pod kutom theta vrijedi: brzina motora m_i jednaka je k puta zbroju minus sinus theta puta vx, plus kosinus theta puta vy, plus r_b puta ω. Konstanta k pretvara metre u sekundi u okretaje motora: 60 puta prijenos kroz dva pi puta polumjer kotača — oko 5100. Za vožnju naprijed 0,3 metra u sekundi: m1 je oko minus 1300, m3 plus 1300, a m2 je nula — kotač 2 stoji okomito na smjer gibanja i samo se kotrlja po valjcima.", "dopuna": "[R] k = 60 · 32 / (2π · 0,060) ≈ 5093 (1/min)/(m/s); m1 = 5093 · (−0,866 · 0,3) ≈ −1323 1/min. Pitanje: koliki je m1 za vx = 0,2 m/s?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 4: Kinematika", "Od željenog gibanja do brzina triju motora"]}, {"t": 2850, "dio": "4 Kinematika (preskočivo)", "naslov": "Bočna vožnja i okret na mjestu", "klik": "Gumbi „Bočno lijevo” i „Okret na mjestu”; račun uživo desno.", "tekst": "Bočno ulijevo: sada najjače radi motor 2, m2 je minus k puta vy, a motori 1 i 3 imaju polovicu te brzine, suprotnog predznaka. Zbroj doprinosa zakretu je nula, pa se robot ne okreće. Okret na mjestu: sva tri motora imaju istu brzinu, k puta r_b puta ω, i vrte robota oko središta. Udaljenost r_b od središta do kotača proizvođač ne objavljuje — u simulatoru je 13 centimetara, procjena, i na robotu je treba izmjeriti.", "dopuna": "[R] Za vy = 0,3 m/s: m2 = −k · vy ≈ −1528, m1 = m3 ≈ +764 1/min. Pitanje: koliki je ω ako se sva tri motora vrte 1000 1/min, uz rb = 0,13 m?", "kadrovi": [[0, "cijeli"]]}, {"t": 2970, "dio": "4 Kinematika (preskočivo)", "naslov": "Dijagonalno uz okretanje", "klik": "Gumbi „Dijagonalno + okret” i „Luk”; put robota u donjem crtežu.", "tekst": "Najljepše je kombinirano gibanje: robot vozi dijagonalno i istodobno se okreće oko svoje osi. Diferencijalni robot to ne može. Svesmjerni samo zbroji tri doprinosa u svakom motoru. Pazite na granicu: najveća brzina motora je 3600 okretaja u minuti, pa kad zbroj prijeđe granicu, upravljanje mora sve tri brzine razmjerno smanjiti — inače bi se smjer gibanja iskrivio.", "dopuna": "Ograničenje brzina razmjernim smanjenjem čuva smjer gibanja — robot tada vozi sporije, ali ispravno. Pitanje: što bi se dogodilo da se ograniči samo motor koji je prešao granicu?", "kadrovi": [[0, "cijeli"]]}, {"t": 3060, "dio": "4 Kinematika (preskočivo)", "naslov": "Direktna kinematika i odometrija", "klik": "Prekidač „Direktna: m → vx, vy, ω”; klizači brzina motora m1 i m3.", "tekst": "Obrnuti smjer zove se direktna kinematika: iz izmjerenih brzina motora računa se gibanje robota. vx je razlika m3 i m1 kroz korijen iz tri puta k, vy i ω slijede slično. Integriranjem kroz vrijeme dobiva se položaj — to je odometrija. Svaka pogreška, proklizavanje valjka ili netočan r_b, nakuplja se, pa robot s vremenom pogrešno misli gdje je. Žiroskop ispravlja kut, a laserski skener s kartom i položaj. Time zatvaramo kinematiku.", "dopuna": "[R] vx = (m3 − m1) / (√3 · k), vy = (m1 + m3 − 2·m2) / (3k), ω = (m1 + m2 + m3) / (3k · rb). Pitanje: kakvo je gibanje kad su m1 = −m3 i m2 = 0?", "kadrovi": [[0, "cijeli"]]}, {"t": 3180, "dio": "5 Upravljanje", "naslov": "Simulator laboratorija: raspored", "klik": "Upravljanje robotom: lijevo deset nizova; u sredini uputa, tipkala i svjetla na robotu, web sučelje; desno laboratorij u 3D-u.", "tekst": "Drugo poglavlje je simulator laboratorija. Lijevo je deset nizova vježbi — od uključivanja do malog programa — i danas ćemo proći svih deset. U sredini su uputa, tipkala i svjetla na robotu i pojednostavljeno web sučelje robota. Desno je laboratorij od pet puta četiri metra: crna crta za slijeđenje, stanica za punjenje uz lijevi zid i prijenosna stanica straga. Svaki korak niza provjerava se sam.", "dopuna": "Simulator je pojednostavljen, ali redoslijed postupaka (uključivanje, RESET, START, lokalizacija) odgovara stvarnom robotu u tvornici.", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 5: Upravljanje robotom", "Simulator laboratorija — svih deset nizova"]}, {"t": 3240, "dio": "5 Upravljanje", "naslov": "Uključivanje i spajanje na web sučelje", "klik": "Niz 1: držanje glavnog tipkala 3 s, pokretanje sustava, „Poveži”, RESET, START, lokalizacija.", "tekst": "Uključujem robota: glavno tipkalo treba držati oko tri sekunde, da se ne uključi slučajno. LED prsten treperi dok se računalo podiže, zatim svijetli plavo. Spajam se na web sučelje. Lampica RESET svijetli, a narančasti segment signalnog stupa treperi: sigurnosni krug još nije potvrđen. RESET, pa START. Crveni segment treperi dok robot ne zna gdje je na karti; kad se ugasi i zeleni svijetli stalno, robot je spreman.", "dopuna": "Dugi pritisak za uključivanje i potvrda RESET-om štite od slučajnog pokretanja. Pitanje: koji uređaj kod kuće uključujete dugim pritiskom i zašto?", "kadrovi": [[0, "cijeli"]]}, {"t": 3360, "dio": "5 Upravljanje", "naslov": "Vožnja tipkama i kinematika uživo", "klik": "Niz 2, kartica Vožnja: tipke naprijed, lijevo, okret; kartica „Omnidrive — kinematika uživo”.", "tekst": "U kartici Vožnja vozim tipkama: naprijed, ulijevo, okret. Isto radi tipkovnica — W, A, S, D, a Q i E okreću. Ispod web sučelja je kinematika uživo: zadane brzine robota i izračunane brzine triju motora. Ponovite sami što smo maloprije računali — vozite samo naprijed i provjerite da motor 2 miruje.", "dopuna": "Za učionicu: neka sudionici sami otkriju koji motor stoji pri kojoj vožnji, bez formula — samo gledajući brojke.", "kadrovi": [[0, "cijeli"]]}, {"t": 3480, "dio": "5 Upravljanje", "naslov": "Enkoderi i odometrija: kvadrat 1 × 1 m", "klik": "Niz 3, kartica Odometrija: „Vozi kvadrat 1 × 1 m” s proklizavanjem, zatim uključen žiroskop i ponovljeni kvadrat.", "tekst": "Robot zna gdje je samo zato što broji okretaje motora — to je odometrija. Enkoder daje 500 impulsa po okretaju motora, a brojanjem svih bridova obaju kanala dobiva se 2000 inkremenata; uz prijenos 32 to je 64 000 inkremenata po okretaju kotača. Robot sada vozi kvadrat od jednog metra s uključenim proklizavanjem. Pri okretanju valjci kližu, pa izračunani kut ne odgovara stvarnom i robot ne završi gdje misli. Uključujem žiroskop i vozim isti kvadrat: žiroskop izravno mjeri zakret tijela robota, pa se pogreška kuta više ne nakuplja. Ispod tablice vidite usporedbu: bez žiroskopa robot promaši cilj za tridesetak centimetara, sa žiroskopom za nekoliko centimetara. Pogreška kuta je najopasnija, jer svaki sljedeći metar vodi sve dalje od cilja.", "dopuna": "[R] Opseg kotača je π · 0,12 ≈ 0,377 m, pa jedan metar znači oko 2,65 okretaja kotača, odnosno oko 170 000 inkremenata. Pitanje: koliki je pomak robota za jedan inkrement, u mikrometrima?", "kadrovi": [[0, "cijeli"]]}, {"t": 3630, "dio": "5 Upravljanje", "naslov": "Senzori udaljenosti i odbojnik", "klik": "Niz 4: zrake IR u 3D prikazu, kartica Senzori; vožnja prema zidu dok IR1 ne pokaže 15 cm, pogled Robot.", "tekst": "Zrake infracrvenih senzora su uključene: narančaste su one koje pogađaju prepreku. Kartica Senzori pokazuje svih devet udaljenosti i napone. Vozim prema zidu — prednji senzor pokazuje sve manju udaljenost. U nizu se robot treba zaustaviti na 15 centimetara, zatim uključiti IR zaštitu, a na kraju namjerno udariti u zid da proradi odbojnik.", "dopuna": "Pri većoj brzini zaustavni put je dulji, pa robot s IR zaštitom stane bliže zidu. Pitanje: kako biste odredili najveću sigurnu brzinu za zadanu udaljenost zaustavljanja?", "kadrovi": [[0, "cijeli"]]}, {"t": 3750, "dio": "5 Upravljanje", "naslov": "Laserski skener i karta", "klik": "Niz 5: zrake lasera, mapiranje i okret na mjestu; karta u kartici „Laserski skener i karta”.", "tekst": "Uključujem zrake lasera i mapiranje, pa okrećem robota na mjestu. Svaki sken upisuje se u kartu prema položaju koji robot misli da ima. Na karti se pojavljuju zidovi i stanice. Uključite li u kartici Odometrija proklizavanje i isključite žiroskop, karta se razmaže — zato pravi roboti položaj stalno ispravljaju usporedbom skena s kartom.", "dopuna": "Gradnja karte i istodobna lokalizacija zove se SLAM i temelj je autonomnih robota. Pitanje: zašto karta razmazana zbog proklizavanja izgleda kao duplicirani zidovi?", "kadrovi": [[0, "cijeli"]]}, {"t": 3900, "dio": "5 Upravljanje", "naslov": "Slijeđenje crte optičkim senzorima", "klik": "Niz 6, kartica Crta: dva optička senzora na dnu, DI1 i DI2, „Slijeđenje crte” i krug po stazi.", "tekst": "Na dnu robota su dva optička senzora, lijevo i desno od crte. Svaki javlja samo svijetlo ili tamno, na digitalni ulaz. Logika je najjednostavnija povratna veza: lijevi vidi crtu — okreni lijevo, desni vidi crtu — okreni desno, nijedan — ravno. Robot sada obilazi stazu. Zakret mora biti dovoljno brz za najmanji polumjer staze: kutna brzina mora biti barem brzina podijeljena s polumjerom, i još s rezervom jer senzori kasne. Na stvarnom robotu crtu se može pratiti i kamerom.", "dopuna": "[R] Uz v = 0,3 m/s i najmanji polumjer staze 0,5 m treba ω ≥ 0,6 rad/s samo da se prati zavoj. Pitanje: što se dogodi kad su oba senzora istodobno na crti, npr. na raskrižju?", "kadrovi": [[0, "cijeli"]]}, {"t": 4050, "dio": "5 Upravljanje", "naslov": "Pristajanje na stanicu za punjenje", "klik": "Niz 7, kartica Punjenje: okret dok laser ne vidi oba markera, „Pristani (Dock)”; robot se poravna i pristane.", "tekst": "Baterija je pri kraju i robot mora na punjenje. Laser traži dva reflektorska markera stanice. Algoritam ima tri koraka: zakreni se ravno prema stanici, vozi bočno dok ne dođeš na njezinu normalu, pa vozi ravno do kontakta. Bočni korak je moguć samo zato što je robot svesmjeran. Kad stigne povratni kod 2 i kontakt, robot se puni.", "dopuna": "Reflektorski markeri daju vrlo jak odraz, pa ih laser razlikuje od zida. Pitanje: što bi se dogodilo da netko stavi sjajnu limenku pokraj stanice?", "kadrovi": [[0, "cijeli"]]}, {"t": 4200, "dio": "5 Upravljanje", "naslov": "Predaja nosača prijenosnoj stanici", "klik": "Niz 8, kartica Nosač: „Prilaz”, „Fino pozicioniranje” (BG4–BG6), „Predaj nosač” (handshake BG2/BG3, trake, BG1).", "tekst": "Ovo je posao Robotina u tvornici: nosač izratka predaje stanici. Prihvat i trake idu poprijeko, pa robot stanici prilazi bočno. Fino pozicioniranje: dva bočna senzora daju kut prema licu stanice, srednji daje udaljenost. Kad su prva dva jednaka, robot je usporedan sa stanicom. Zatim optički handshake — robot pali odašiljač, stanica odgovara — i trake prebacuju nosač. Senzor BG1 potvrđuje da je prihvat prazan.", "dopuna": "Optički handshake je jednobitna veza bez kabela i bez mreže — radi i kad WLAN zakaže. Pitanje: zašto robot smije krenuti tek kad BG1 potvrdi nosač?", "kadrovi": [[0, "cijeli"]]}, {"t": 4350, "dio": "5 Upravljanje", "naslov": "Mali program: predaja, vožnja, pristajanje", "klik": "Niz 10, kartica Program: primjer programa (Predaj nosač → Vozi do → Pristani) i ▶ Pokreni.", "tekst": "Sve što smo radili ručno sada slažemo u program od blokova: predaj nosač, vozi do sredine, pristani. Blokovi se izvode redom i svaki čeka da prethodni završi — kao koraci i prijelazi u Grafcetu, kakav se crta u Festovom programu Robotino View. Dok je robot zauzet, zeleni segment treperi. Ako ga prekine prepreka ili nužni stop, uzrok se ukloni i program pokrene ponovno.", "dopuna": "Program od blokova je isti način razmišljanja kao Grafcet u PLC-u: korak, uvjet prijelaza, sljedeći korak. Pitanje: koji blok dodati da robot ne krene dok nosač nije u prihvatu?", "kadrovi": [[0, "cijeli"]]}, {"t": 4470, "dio": "5 Upravljanje", "naslov": "Nužni stop i ponovno pokretanje", "klik": "Niz 9: gljiva nužnog stopa, RESET dok je gljiva pritisnuta (ništa), otpuštanje, RESET, START; signalni stup.", "tekst": "Na kraju sigurnost. Gljiva nužnog stopa isključuje sve aktuatore, i pogon i trake. Dok je pritisnuta, ni RESET ništa ne mijenja. Otpuštanje gljive ne pokreće robota samo od sebe — treba potvrditi RESET-om i tek onda START. Prekinuti zadatak se ne nastavlja sam, pokreće se ponovno. Prije RESET-a na stvarnom robotu uvijek provjerite zašto je stop pritisnut.", "dopuna": "Nužni stop ne smije se koristiti kao obično zaustavljanje — za to služi STOP u programu. Pitanje: zašto otpuštanje gljive ne smije samo pokrenuti robota?", "kadrovi": [[0, "cijeli"]]}, {"t": 4590, "dio": "6 Robotino u CP Factory", "naslov": "Robotino u pametnoj tvornici", "klik": "Pametna tvornica CP Factory → Upoznavanje sustava: skupina ROBOTINO, pogled „Robotino”.", "tekst": "Isti robot radi u pametnoj tvornici CP Factory. Linija ima regalno skladište, modul grananja i robotsku montažnu stanicu, a Robotino povezuje modul grananja s ostatkom prostora. Na modulu grananja nosač može skrenuti u krak, a na vrhu kraka ga preuzima Robotino. Naloge mu ne daje izravno sustav za upravljanje proizvodnjom, nego Fleet Manager, koji zna naučene položaje stanica i stanje baterije.", "dopuna": "U CP Factoryju Robotino zamjenjuje dio transportne trake: raspored stanica može se mijenjati bez nove opreme. Pitanje: koji podatak Fleet Manager mora znati o svakoj stanici?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 6: Robotino u CP Factoryju", "Predaja nosača i nalog iz MES-a"]}, {"t": 4680, "dio": "6 Robotino u CP Factory", "naslov": "Kako radi: predaja nosača Robotinu", "klik": "Animacija „Predaja nosača mobilnom robotu”: skretnica, poziv Robotina, pristajanje, handshake, trake.", "tekst": "Animacija pokazuje cijeli slijed: skretnica šalje nosač u krak, modul grananja preko sustava za upravljanje traži Robotina, robot pristaje uz krak, optički handshake potvrđuje da su obje strane spremne — izlaz PLC-a modula prema robotu i ulaz od robota — i trake prebacuju nosač. Isti handshake vidjeli smo maloprije u simulatoru laboratorija.", "dopuna": "Docking-Kit na modulu grananja uvjet je za predaju; modul kobota u ovoj opremi ga nema, pa mu Robotino ne može predati nosač. Pitanje: što bi trebalo dodati modulu da i on prima nosače od Robotina?", "kadrovi": [[0, "cijeli"]]}, {"t": 4800, "dio": "6 Robotino u CP Factory", "naslov": "Simulator linije: nalog s transportom Robotinom", "klik": "Simulator linije, niz „Predaja nosača Robotinu na BRANCH-u”: nalog iz MES-a, ubrzanje ×5, pogled „BRANCH i Robotino”, kartica Robotino · Fleet Manager.", "tekst": "U simulatoru cijele linije šaljem nalog koji uključuje transport Robotinom i ubrzavam vrijeme pet puta. Skladište izdaje paletu na nosač, nosač skreće u krak, a Robotino odlazi sa stanice za punjenje, pristaje i preuzima ga. Na kartici Robotino vidite brzine triju motora — istu kinematiku koju smo računali. Brojevi operacija za transport Robotinom nisu objavljeni, pa su u simulatoru označeni kao podatak koji nedostaje.", "dopuna": "Ubrzanje simulacije ne mijenja redoslijed događaja, samo ih prikazuje brže. Pitanje: koliko dugo bi isti nalog trajao u stvarnoj tvornici, ako u simulatoru uz ubrzanje ×5 traje oko minutu?", "kadrovi": [[0, "cijeli"]]}, {"t": 4980, "dio": "7 AR i zadatak", "naslov": "Robotino u proširenoj stvarnosti", "klik": "Robotino u proširenoj stvarnosti: 3D prikaz i QR kod.", "tekst": "Treće poglavlje je Robotino u proširenoj stvarnosti. Na računalu ga okrećete mišem, a na mobitelu skenirate QR kod, usmjerite kameru prema podu i postavite robota u stvarnoj veličini. Robot ostaje usidren na podu dok ga obilazite, pa vidite koliko je velik i gdje su mu senzori.", "dopuna": "Na mobitelu u Chromeu robot se sidri na pod i ostaje na mjestu dok ga obilazite. Pitanje: koliko prostora treba robotu promjera 45 cm za okret na mjestu?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 7: Proširena stvarnost i dalje", "Robot u prostoru, sažetak i zadatak"]}, {"t": 5100, "dio": "7 AR i zadatak", "naslov": "Gdje dalje", "klik": "Naslovnica područja: poglavlja Robotina i poveznice na CP Factory, KUKA KR 6 i UR3e.", "tekst": "Sve što smo danas vidjeli ostaje na stranicama: upoznavanje robota, simulator laboratorija s deset nizova, AR i simulator linije CP Factory. Nizovi pamte napredak u vašem pregledniku. Za one koji imaju pristup Festovoj platformi LX: tečaj Autonomous Mobile Robotics with Robotino 4 ima petnaest vježbi na stvarnom robotu, od puštanja u rad do autonomnog prilaza markerima.", "dopuna": "U CP Factoryju Robotino povezuje stanice umjesto transportne trake, pa se raspored proizvodnje mijenja bez promjene opreme.", "kadrovi": [[0, "cijeli"]]}, {"t": 5220, "dio": "7 AR i zadatak", "naslov": "Sažetak i zadatak", "klik": "Blok „Moći ću” — povratak na ishode.", "tekst": "Ukratko: kotač je najučinkovitiji način kretanja po ravnom, standardni kotač ima bočno ograničenje, a švedski ga uklanja valjcima. Robotino s tri omni kotača holonoman je i giba se u svim smjerovima, a brzine motora slijede iz jednostavne kinematike. Odometrija se kvari proklizavanjem, a ispravljaju je žiroskop i laser. U tvornici Robotino vozi nosače između stanica i predaje ih optičkim handshakeom. Zadatak za vas: u simulatoru prođite nizove 1, 2 i 3 i izračunajte brzinu motora 1 za vožnju naprijed od 0,2 metra u sekundi. Hvala na pažnji.", "dopuna": "Zadatak riješite u simulatoru na mobitelu ili računalu; nizovi pamte napredak u pregledniku.", "kadrovi": [[0, "naslov"], [6, "cijeli"], [170, "naslov"]], "kartica": ["Sažetak i zadatak", "Mobilni robot Robotino — hvala na pažnji"]}], KRAJ=5400, KD={"cijeli": {"naziv": "Cijeli zaslon", "tipka": "1"}, "naslov": {"naziv": "Naslovna kartica", "tipka": "2"}}, KLJUC='ftq-citac-robotino-obs', KLJUC2='ftq-citac-lx-obs', REZ='ftq-predavanje-robotino';

 else{const k=KAD.find(x=>KD[x].tipka===e.key);if(k)rucniKadar(k)}});

 Object.assign(rz,{t:performance.now(),sat:d.sat,igra:!!d.igra,i:d.i,ceka:!!d.ceka});
 if(!bio){rzCmd('cekaj',$('c-cekaj').checked);igra=false}

/* ---------- SHA-256 i base64 (za prijavu u OBS) ---------- */
function sha256(bytes){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 const w=new Uint32Array(64),r=(x,c)=>(x>>>c)|(x<<(32-c));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0}
  let[a,b,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
 const out=new Uint8Array(32);H.forEach((v,i)=>{out[i*4]=v>>>24;out[i*4+1]=(v>>>16)&255;out[i*4+2]=(v>>>8)&255;out[i*4+3]=v&255});return out}
const utf8=s=>new TextEncoder().encode(s);
const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const obsAuth=(loz,salt,izazov)=>b64(sha256(utf8(b64(sha256(utf8(loz+salt)))+izazov)));

const obs={ws:null,ok:false,n:0,cek:new Map()};

function lamp(st,t){$('lamp').className='lamp '+st;$('obs-st').textContent=t}
function R(tip,pod){return new Promise((res,rej)=>{if(!obs.ok&&tip!=='__'){rej(new Error('OBS nije spojen'));return}
 const id='r'+(++obs.n);obs.cek.set(id,{res,rej,tip});obs.ws.send(JSON.stringify({op:6,d:{requestType:tip,requestId:id,requestData:pod||{}}}));
 setTimeout(()=>{if(obs.cek.has(id)){obs.cek.delete(id);rej(new Error('OBS ne odgovara: '+tip))}},10000)})}
function spoji(){
 if(obs.ws){try{obs.ws.close()}catch(e){}}
 const url=$('i-url').value.trim(),loz=$('i-loz').value;
 if($('c-pamti').checked){sp('url',url);sp('loz',loz)}else{sp('loz','')}
 lamp('','spajam se na '+url+' …');
 let ws;try{ws=new WebSocket(url,'obswebsocket.json')}catch(e){lamp('greska','Neispravna adresa');return}
 obs.ws=ws;obs.ok=false;
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const d=m.d||{};
  if(m.op===0){const id={rpcVersion:1,eventSubscriptions:4|64};

 try{const izv=$('s-izvor').value;const sc=scena('cijeli');if(ids[sc]&&ids[sc].izvor!=null){[sw0,sh0]=await velicinaIzvora(sc,ids[sc].izvor)}
  pl.width=1280;pl.height=Math.round(1280*sh0/sw0);
  /* OBS iscrtava snimanje zaslona samo dok je izvor aktivan: prije snimke prebaci na scenu Cijeli zaslon */
  if(spremno&&trenScena!==scena('cijeli')){await R('SetCurrentProgramScene',{sceneName:scena('cijeli')});trenScena=scena('cijeli');zadKadar='cijeli';oznaciKadar();await new Promise(r=>setTimeout(r,600))}
  const r=await R('GetSourceScreenshot',{sourceName:izv,imageFormat:'jpg',imageWidth:1280,imageCompressionQuality:75});
  const im=new Image();im.onload=()=>{slika=im;urCrtaj()};im.src=r.imageData}catch(e){poruka('Snimka nije uspjela: '+e.message)}}
$('b-uredi').onclick=()=>{regU=JSON.parse(JSON.stringify(reg));$('urednik').classList.add('otv');urOznaci();urCrtaj();urSnimka()};
$('ur-zatvori').onclick=()=>$('urednik').classList.remove('otv');
$('ur-osvjezi').onclick=urSnimka;
$('ur-kadrovi').addEventListener('click',e=>{const b=e.target.closest('button');if(b){urK=b.dataset.k;urOznaci();urCrtaj()}});
$('ur-zadano').onclick=()=>{regU[urK]=KD[urK].r.slice();urCrtaj()};
const tocka=e=>{const r=pl.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
pl.addEventListener('pointerdown',e=>{vuce=tocka(e);pl.setPointerCapture(e.pointerId)});
pl.addEventListener('pointermove',e=>{if(!vuce)return;const[x,y]=tocka(e);let w=Math.abs(x-vuce[0]);const kh=(sw0/sh0)*(CH/CW);
 if(Math.abs(y-vuce[1])/kh>w)w=Math.abs(y-vuce[1])/kh;w=Math.max(.08,Math.min(1,w));const h=w*kh;
 let x0=x<vuce[0]?vuce[0]-w:vuce[0],y0=y<vuce[1]?vuce[1]-h:vuce[1];x0=Math.max(0,Math.min(1-w,x0));y0=Math.max(0,Math.min(1-h,y0));
 regU[urK]=[+x0.toFixed(4),+y0.toFixed(4),+w.toFixed(4)];urCrtaj()});
pl.addEventListener('pointerup',()=>{vuce=null});
$('ur-spremi').onclick=async()=>{reg=JSON.parse(JSON.stringify(regU));sp('reg',reg);
 if(obs.ok){try{const sc=scena('cijeli');if(!ids[sc]||ids[sc].izvor==null)await ucitajIds();const[sw,sh]=await velicinaIzvora(sc,ids[sc].izvor);for(const k of ZOOM)await postaviZoom(k,sw,sh);poruka('Kadrovi spremljeni i primijenjeni u OBS-u.')}catch(e){poruka('Spremljeno, ali nije primijenjeno: '+e.message)}}
 else poruka('Kadrovi spremljeni; primijenit će se kod sljedeće pripreme scena.');
 $('urednik').classList.remove('otv')};

/* ---------- glavna petlja ---------- */
function crtaj(){let s=sad();const i0=ki(s);
 if(!uz()&&igra&&$('c-cekaj').checked&&!ceka&&i0>zadUCekanju){const kraj=S[zadUCekanju+1]?S[zadUCekanju+1].t:KRAJ;if(s>=kraj&&zadUCekanju>=0){sat=kraj-.05;igra=false;ceka=true;s=sat}}
 const i=ki(s),sl=i+1<S.length?S[i+1].t:KRAJ;if(!ceka)zadUCekanju=i;
 if(!uz()&&igra&&s>=KRAJ){sat=KRAJ;igra=false}
 const ig=uz()?rz.igra:igra,ck=uz()?rz.ceka:ceka;
 $('vr').textContent=mm(s)+' / '+mm(KRAJ);
 $('st').textContent=(REZ?(uz()?'autopilot povezan · ':'autopilot nije otvoren · '):'')+(ck?'čeka ⏭ (sljedeći korak)':ig?'sat teče':'pauza')+' · sljedeće za '+mm(sl-s)+(snima?(pauzaOd?' · ❚❚ snimanje pauzirano ':' · ● snima ')+hms(recT()):'')+' · dvoklik na korak = skok';
 $('b-igraj').textContent=ig?'⏸ Pauza':'▶ Pokreni';
 if(i!==zad){document.querySelectorAll('.k').forEach((el,j)=>{el.classList.toggle('sada',j===i);el.classList.toggle('gotov',j<i)});
  const el=$('k'+i);if(el&&zad>=0)el.scrollIntoView({behavior:'smooth',block:'start'});zad=i;zabiljezi(i)}
 if(i!==zadTekst&&obs.ok){tekstovi(i);zadTekst=i}
 const kd=kadarU(s);
 document.querySelectorAll('#k'+i+' .plan span').forEach(e=>e.classList.toggle('sad',+e.dataset.j===kd.j));
 if(rucno&&(rucno.od.i!==kd.i||rucno.od.j!==kd.j))rucno=null;
 const zelja=rucno?rucno.k:kd.k;
 if($('c-auto').checked&&obs.ok&&!rucno&&zelja!==zadKadar){zadKadar=zelja;prebaci(zelja)}
 const b=document.querySelector('#k'+i+' .napr i');if(b)b.style.width=Math.min(100,(s-S[i].t)/(sl-S[i].t)*100)+'%';
 requestAnimationFrame(crtaj)}
const vrhV=()=>document.documentElement.style.setProperty('--vrh',document.querySelector('.vrh').offsetHeight+'px');vrhV();
new ResizeObserver(vrhV).observe(document.querySelector('.vrh'));
requestAnimationFrame(crtaj);
window.__citac={get sat(){return sad()},post,igraj,dalje,obs,get ids(){return ids},get reg(){return reg},R,pripremi,obsAuth,sha256,b64,utf8,poglavlja,ocisti,recT,get rz(){return rz},uz};
})();

<style>/* dodatak čitaču: tempo, kratki/dugi govor, odgovori, kviz s QR kodom */

p.kratko{font-size:calc(var(--vel,1.45rem) * .95);line-height:1.5;margin:.4rem 0;color:var(--ink);border-left:4px solid #E3A33B;padding-left:10px}

@media (max-width:680px){.kviz{grid-template-columns:90px 1fr}}
