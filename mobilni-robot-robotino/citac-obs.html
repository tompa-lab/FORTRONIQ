<script>window.PITANJA={"0": {"kratko": "Danas je tema Festo Robotino, mobilni robot koji ide u stranu bez okretanja. Vidjet ćemo kotače, rastaviti robota, izračunati brzine motora i upravljati njime u simulatoru — sve u pregledniku.", "odgovor": "Primjeri koje polaznici najčešće navedu: robotski usisavač, robot u skladištu koji nosi police, dostavni robot u bolnici ili restoranu, robotska kosilica. Svima je zajedničko da mijenjaju mjesto i moraju znati gdje su.", "kviz": []}, "1": {"kratko": "Pet ishoda na vrhu stranice, plus šesti: razlikovati vrste kotača i rasporede pogona. Na kraju sata ih provjeravamo.", "odgovor": "", "kviz": []}, "2": {"kratko": "Sedam dijelova: kotači, svesmjerni kotač, Robotino dio po dio, kinematika (preskočivo), simulator, CP Factory, AR i zadatak.", "odgovor": "", "kviz": []}, "3": {"kratko": "Gotovo svi mobilni roboti voze na kotačima: otpor kotrljanja je pet do deset puta manji nego kod hodanja. Pitanje je samo koliko kotača, kojih i koji su pogonjeni.", "odgovor": "Na mekoj, neravnoj ili stepenastoj podlozi: pijesak, šljunak, blato, stube, visoki pragovi. Tu noge ili gusjenice prolaze, a kotač propada ili zapinje.", "kviz": []}, "4": {"kratko": "Četiri vrste kotača razlikuju se po smjerovima u kojima se smiju gibati. Standardni kotač ima bočno ograničenje — ne može se pomaknuti u smjeru svoje osi.", "odgovor": "Bilo koji kotač na čvrstoj osi: kotač s kolica, rolera ili skejtborda. Gurnete ga uzduž — kotrlja se; gurnete ga postrance — klizi i opire se. To je bočno ograničenje.", "kviz": [{"id": "r01", "pitanje": "Koji kotač uklanja bočno ograničenje, a može se i pogoniti?", "tocno": "švedski (omni ili mecanum)", "rjesenje": "Standardni i zakretni kotač imaju bočno ograničenje. Kuglasti ga nema, ali se ne može pogoniti. Švedski kotač nosi slobodne valjke po obodu: gura u smjeru vrtnje, a postrance se kotrlja po valjcima."}]}, "5": {"kratko": "Zakretni kotač se sam okrene za vozilom, ali pri tom vuče u stranu — zato je oslonac, ne pogon. Kuglasti nema povlašten smjer, ne može se pogoniti i treći je oslonac malih robota.", "odgovor": "Treći oslonac mora slijediti gibanje koje odrede dva pogonska kotača. Da je pogonjen, borio bi se s njima — robot bi proklizavao i ne bi išao kamo kotači voze.", "kviz": []}, "6": {"kratko": "Švedski kotač ima slobodne valjke po obodu: gura u smjeru vrtnje, a postrance se kotrlja. Valjci pod 90° — omni, kao Robotino; pod 45° — mecanum.", "odgovor": "Valjci stalno ulaze u dodir s podom i izlaze iz njega, pa kotač trese i kucka; uz to se trlja svaki valjak u svojim čahurama. Običan kotač ima jednu glatku dodirnu plohu.", "kviz": []}, "7": {"kratko": "Diferencijalni pogon: dva neovisna kotača na istoj osi, smjer se mijenja razlikom brzina, okreće se u mjestu. Tricikl: jedan prednji kotač vozi i skreće, ne okreće se u mjestu.", "odgovor": "Dva motora i dva enkodera — po jedan za svaki pogonski kotač. Slobodni oslonac nema ni motor ni enkoder.", "kviz": [{"id": "r02", "pitanje": "Kolika je manevrabilnost (pokretljivost + upravljivost) diferencijalnog robota?", "tocno": "2", "rjesenje": "Stupanj pokretljivosti je 2 (naprijed i zakret, bez bočnog), stupanj upravljivosti 0 (nijedan kotač se ne zakreće). Zbroj je 2."}]}, "8": {"kratko": "Ackermann je automobil, sinkroni zakreće sve kotače zajedno, svesmjerni ima tri ili četiri švedska kotača i giba se u svim smjerovima bez zakretanja. Robotino ima tri omni kotača.", "odgovor": "Bolnička dostava vozi duge hodnike i dizala: dovoljan je diferencijalni pogon (jednostavan, jeftin, okreće se u mjestu). Primicanje palete stroju traži bočni pomak s milimetarskom točnošću: svesmjerni pogon.", "kviz": []}, "9": {"kratko": "Motor se vrti nekoliko tisuća okretaja u minuti, kotač stotinjak — razliku premošćuje prijenosnik. Dvostruki prijenos daje dvostruku silu i pola brzine.", "odgovor": "Uz prijenos 16 kotač se vrti dvostruko brže, a robot vozi dvostruko brže, oko 1,2 m/s — ali s pola vučne sile.", "kviz": [{"id": "r03", "pitanje": "Motor 3100 1/min, prijenos 16, kotač Ø 120 mm. Kolika je brzina robota u m/s?", "tocno": "1,22 m/s (± 0,05)", "rjesenje": "Kotač: 3100 / 16 = 193,75 1/min. Obodna brzina: v = π · 0,12 · 193,75 / 60 ≈ 1,22 m/s."}]}, "10": {"kratko": "Svako gibanje vozila u ravnini je trenutačno vrtnja oko jedne točke. Jednake brzine — ravno, suprotne — okret u mjestu. Kod svesmjernog robota ta točka može biti bilo gdje.", "odgovor": "Na produžetku stražnje osi, s unutarnje strane zavoja — tamo gdje se sijeku pravci osi svih kotača. Zato prednji kotači Ackermannovim mehanizmom imaju različite kutove.", "kviz": []}, "11": {"kratko": "Pokretljivost broji slobode dostupne odmah, upravljivost broji neovisno zakretne kotače, zbroj je manevrabilnost. Svesmjerni pogon ima 3 + 0.", "odgovor": "Dron ima šest stupnjeva slobode: tri pomaka (x, y, z) i tri zakreta (valjanje, poniranje, skretanje).", "kviz": []}, "12": {"kratko": "Holonomno vozilo iz mirovanja kreće u bilo kojem smjeru. Diferencijalno za pomak u stranu mora okrenuti, voziti i okrenuti natrag — svesmjerno klizne postrance.", "odgovor": "Svaki bočni pomak uz prepreku: primicanje uz stol ili zid, ulazak u usko parkirno mjesto, poravnanje uz drugu stanicu bez okretanja.", "kviz": []}, "13": {"kratko": "Lijevo 96 dijelova u sedam skupina, u sredini 3D model, desno objašnjenje. Robotino 4 za CP Factory: osnovica Ø 45 cm, 20 kg, toranj s prihvatom nosača.", "odgovor": "", "kviz": []}, "14": {"kratko": "Tri neovisne pogonske jedinice razmaknute 120°: kotač 1 na 60°, kotač 2 na 180°, kotač 3 na 300°. Kotači stoje kao stranice trokuta, pa zbroj daje bilo koji smjer.", "odgovor": "Na neravnom podu jedan od četiri kotača visio bi u zraku i izgubio pogon — robot bi se klackao i skretao. Tri točke uvijek leže u ravnini, četiri ne; zato četverokotačna vozila trebaju ovjes.", "kviz": []}, "15": {"kratko": "Kotač Ø 120 mm, 16 bačvastih valjaka na brončanim čahurama. Okretanjem gura u smjeru vrtnje, a kad ga guraju drugi kotači — kotrlja se po valjcima.", "odgovor": "Plašt se troši i postaje neravan, čahure dobivaju zračnost, valjci počinju zapinjati. Robot tada proklizava i odometrija griješi više — valjci su potrošni dio.", "kviz": []}, "16": {"kratko": "Kotač preuzima komponentu v · cos α, valjci v · sin α. Pri 0° kotač vrti punom brzinom, pri 90° stoji, a robot klizi po valjcima.", "odgovor": "Pri α = 0° cijelo gibanje ide u vrtnju kotača, a valjci miruju. Pri α = 90° cijelo gibanje ide u kotrljanje valjaka, a kotač stoji.", "kviz": []}, "17": {"kratko": "Kotač gura samo u smjeru vrtnje; kad sila prijeđe trenje, kotač proklizava. Kod omni kotača to je češće, pa odometrija griješi više — Robotino je ispravlja žiroskopom.", "odgovor": "Robot vozi zadani put, npr. 2 m ravno, pa se izmjeri stvarni put metrom i usporedi s odometrijom. Razlika podijeljena s putem je proklizavanje; pokus se ponovi uz veće ubrzanje.", "kviz": []}, "18": {"kratko": "Omni: valjci okomiti na os, barem tri kotača pod različitim kutovima — Robotino. Mecanum: valjci pod 45°, četiri kotača usporedno. Robotinov kotač nije mecanum.", "odgovor": "Zadati čistu bočnu vožnju: ako se vozilo giba postrance bez zakretanja, kotači su dobro složeni. Odozgo valjci dodirnih točaka moraju tvoriti oblik X (ili romba), nikad dvije usporedne crte.", "kviz": [{"id": "r04", "pitanje": "Pod kojim su kutom valjci prema osi kotača na Robotinu?", "tocno": "90°", "rjesenje": "Robotino ima omni kotače: valjci su okomiti na os kotača (90°). Valjci pod 45° imaju mecanum kotači."}]}, "19": {"kratko": "Brojke dolje lijevo su brzine triju motora. Naprijed: motor 2 miruje. Bočno: motor 2 najjači. Okret: sva tri jednako.", "odgovor": "Motor 2: stražnji kotač stoji okomito na smjer bočne vožnje, pa preuzima cijelu bočnu brzinu. Prednja dva rade upola, jer im je bočna vožnja pod kutom od 60°.", "kviz": [{"id": "r05", "pitanje": "Koji motor Robotina miruje pri čistoj vožnji naprijed?", "tocno": "motor 2 (stražnji)", "rjesenje": "Kotač 2 stoji okomito na smjer vožnje naprijed: ne treba se vrtjeti, samo se kotrlja po valjcima. Motori 1 i 3 vrte se istim iznosom, suprotnog predznaka."}]}, "20": {"kratko": "Osnovica Ø 45 cm, visina 32,5 cm, kućište od nehrđajućeg čelika, 20 kg, nosi 30 kg. Klizačem Rastavi razmičem sklopove.", "odgovor": "Zatvoriti otvore i filtrirati zrak hlađenja, zaštititi priključke, ugraditi zaštićenije senzore — robot bi trebao viši stupanj zaštite (npr. IP 54) umjesto IP 00.", "kviz": []}, "21": {"kratko": "Istosmjerni motor s četkicama na 24 V, oko 3100 1/min, planetarni reduktor i zupčasti remen, ukupno 32 : 1. Jedinica se mijenja kao cjelina.", "odgovor": "Kobot radi bez prekida tisućama sati i traži točnu regulaciju momenta — motor bez četkica se ne troši. Obrazovni robot radi malo sati, a motor s četkicama je jeftin i jednostavno se regulira.", "kviz": []}, "22": {"kratko": "Motor oko 3000 1/min, kroz prijenos 32 kotač oko 94 1/min, oko 0,6 m/s. Moment raste istim omjerom, uz korisnost oko 0,8.", "odgovor": "Moment na kotaču: 5,7 Ncm · 32 · 0,81 ≈ 148 Ncm ≈ 1,48 Nm; vučna sila: 1,48 / 0,06 ≈ 25 N po kotaču. Pri vožnji naprijed vuku samo kotači 1 i 3, svaki pod 30° prema smjeru: 2 · 25 · cos 30° ≈ 43 N. Robot 20 kg + teret 30 kg = 50 kg, težina ≈ 490 N. Nagib: sin α = 43 / 490 → α ≈ 5°, oko 9 %. Bez otpora kotrljanja — stvarno nešto manje (procjena).", "kviz": [{"id": "r06", "pitanje": "Motor daje 5,7 Ncm, prijenos 32, korisnost 0,81. Koliki je moment na kotaču u Nm?", "tocno": "1,48 Nm (± 0,05)", "rjesenje": "M = 5,7 Ncm · 32 · 0,81 ≈ 147,7 Ncm ≈ 1,48 Nm."}]}, "23": {"kratko": "Enkoder 500 impulsa, dva kanala: brojanjem svih bridova 2000 po okretaju motora, 64 000 po okretaju kotača. PI regulator drži brzinu bez obzira na teret.", "odgovor": "Brojanjem samo jednog brida jednog kanala dobiva se 500 umjesto 2000 inkremenata — razlučivost pada četiri puta. I gore: bez drugog kanala robot ne zna smjer vrtnje, pa vožnju natrag broji kao vožnju naprijed.", "kviz": [{"id": "r07", "pitanje": "Enkoder ima 500 impulsa po okretaju i dva kanala (broje se svi bridovi), prijenos je 32. Koliko inkremenata daje jedan okretaj kotača?", "tocno": "64000", "rjesenje": "500 · 4 = 2000 inkremenata po okretaju motora; 2000 · 32 = 64 000 po okretaju kotača."}]}, "24": {"kratko": "Devet IR senzora po obodu, 4–30 cm, triangulacija. Ispod oko 3 cm napon opet pada i senzor javlja veću udaljenost od stvarne.", "odgovor": "Približavati list papira senzoru i pratiti očitanje u kartici Senzori: do oko 4 cm udaljenost pada, a ispod 3 cm odjednom opet raste — iako je papir sve bliže.", "kviz": [{"id": "r08", "pitanje": "Što javlja IR senzor udaljenosti Robotina kad je predmet bliže od oko 3 cm?", "tocno": "veću udaljenost od stvarne", "rjesenje": "Krivulja napona nije monotona: ispod oko 3 cm napon opet pada, pa senzor javlja veću udaljenost nego što jest. Zato preblizak predmet treba prepoznati drugim senzorom."}]}, "25": {"kratko": "Odbojnik je sigurnosni rub na mirnoj struji — i prekinut kabel zaustavlja robota. Laserski skener mjeri 240° sprijeda i iz toga robot gradi kartu.", "odgovor": "Sigurnosni skener ima certificirano zaštitno polje i sam prekida pogon; ne ovisi o osvjetljenju. Kamera ovisi o svjetlu, treba obradu slike i nije sigurnosni uređaj.", "kviz": []}, "26": {"kratko": "Dubinska kamera RealSense daje sliku i udaljenost, žiroskop mjeri kutnu brzinu i ispravlja kut odometrije, dva optička senzora na dnu služe za slijeđenje crte.", "odgovor": "Ovisi o programu. U najjednostavnijoj logici to nije propisano: robot obično vozi ravno ili zadrži zadnju odluku. Na raskrižju je to opasno — upravo to smo vidjeli kad BubbleRob skrene na krak raskrižja.", "kviz": []}, "27": {"kratko": "Ugradbeno računalo s Linuxom i mikrokontroler motora, vlastiti WLAN i web sučelje. Naredba se mora ponoviti barem svakih 200 ms, inače robot sam stane.", "odgovor": "U programu na robotu: ako zadnja naredba s daljinskog upravljača ili računala stigne prije više od npr. 0,2–0,5 s, motori se zaustave. Isto kao Robotinov watchdog.", "kviz": [{"id": "r09", "pitanje": "Što Robotino radi kad mu vanjski program prestane slati naredbe (pukne WLAN)?", "tocno": "nakon oko 200 ms sam stane", "rjesenje": "Nadzor veze (watchdog): naredba se mora ponavljati barem svakih 200 ms. Kad je nema, robot zaustavi motore."}]}, "28": {"kratko": "Do četiri Festool baterije 18 V, desetak sati rada. Nadogradnja za CP Factory: toranj, prihvat nosača, signalni stup, RESET, START, nužni stop. Stanica ima dva reflektorska markera.", "odgovor": "Zeleni segment koji treperi znači da je robot zauzet — izvodi zadatak. Stalno zeleno znači spreman i u mirovanju.", "kviz": []}, "29": {"kratko": "Tri stupnja slobode, tri motora: m_i = k · (−sin θ_i · vx + cos θ_i · vy + r_b · ω), k ≈ 5100. Za 0,3 m/s naprijed: m1 ≈ −1300, m3 ≈ +1300, m2 = 0.", "odgovor": "k = 60 · 32 / (2π · 0,06) ≈ 5093. Kotač 1 je na 60°: m1 = k · (−sin 60° · vx) = 5093 · (−0,866 · 0,2) ≈ −882 1/min. Motor 3 se vrti +882 1/min, motor 2 miruje.", "kviz": [{"id": "r10", "pitanje": "Robotino vozi naprijed vx = 0,2 m/s (vy = 0, ω = 0). Kolika je brzina motora 1 u 1/min? Uzmite k = 5093 i θ1 = 60°.", "tocno": "-882 1/min (± 10)", "rjesenje": "m1 = k · (−sin 60° · vx) = 5093 · (−0,866 · 0,2) ≈ −882 1/min. Predznak je minus: motor 1 vrti se suprotno od motora 3."}]}, "30": {"kratko": "Bočno: motor 2 vrti −k · vy, motori 1 i 3 pola toga, suprotnog predznaka. Okret: sva tri isto, k · r_b · ω. r_b = 13 cm je procjena.", "odgovor": "Kad su sva tri motora jednaka, robot se samo okreće: m = k · r_b · ω, pa ω = m / (k · r_b) = 1000 / (5093 · 0,13) ≈ 1,51 rad/s, oko 87 °/s — skoro četvrt okreta u sekundi.", "kviz": [{"id": "r11", "pitanje": "Sva tri motora vrte se 1000 1/min, k = 5093, r_b = 0,13 m. Kolika je kutna brzina robota u rad/s?", "tocno": "1,51 rad/s (± 0,05)", "rjesenje": "ω = m / (k · r_b) = 1000 / (5093 · 0,13) ≈ 1,51 rad/s (≈ 87 °/s)."}]}, "31": {"kratko": "Svesmjerni robot može ići dijagonalno i istodobno se okretati — samo zbroji tri doprinosa. Iznad 3600 1/min sve tri brzine se smanjuju razmjerno.", "odgovor": "Omjeri brzina motora bi se promijenili, pa bi robot išao u drugom smjeru i drugačije se okretao nego što je zadano. Razmjerno smanjenje čuva omjere — smjer ostaje, samo je sporije.", "kviz": []}, "32": {"kratko": "Direktna kinematika iz brzina motora računa gibanje robota; integracija daje položaj — odometriju. Pogreške se nakupljaju; žiroskop ispravlja kut, laser položaj.", "odgovor": "Uz m1 = −m3 i m2 = 0: vy = (m1 + m3 − 0) / (3k) = 0 i ω = (m1 + 0 + m3) / (3k · r_b) = 0. Ostaje vx = (m3 − m1) / (√3 · k) = 2 · m3 / (√3 · k). Robot vozi čisto ravno naprijed (ili natrag), bez okretanja — upravo slučaj iz vožnje naprijed.", "kviz": [{"id": "r12", "pitanje": "Kakvo je gibanje Robotina kad je m1 = −m3 i m2 = 0?", "tocno": "ravno naprijed ili natrag, bez okretanja", "rjesenje": "vy = (m1 + m3 − 2·m2) / (3k) = 0 i ω = (m1 + m2 + m3) / (3k · r_b) = 0; ostaje samo vx = (m3 − m1) / (√3 · k)."}]}, "33": {"kratko": "Lijevo deset nizova vježbi, u sredini uputa, tipkala i web sučelje, desno laboratorij 5 × 4 m s crtom, stanicom za punjenje i prijenosnom stanicom.", "odgovor": "", "kviz": []}, "34": {"kratko": "Glavno tipkalo tri sekunde, LED prsten plavo, web sučelje. RESET pa START; kad crveni segment prestane treperiti i zeleni svijetli stalno — robot je spreman.", "odgovor": "Mobitel, televizor, računalo: dugi pritisak sprečava slučajno uključivanje ili isključivanje, npr. u džepu ili kad se tipka okrzne.", "kviz": []}, "35": {"kratko": "Vozim tipkama ili W A S D, Q i E okreću. Ispod je kinematika uživo — provjerite da pri vožnji naprijed motor 2 miruje.", "odgovor": "", "kviz": []}, "36": {"kratko": "Kvadrat 1 m s proklizavanjem: bez žiroskopa robot promaši za tridesetak centimetara, sa žiroskopom za nekoliko. Najopasnija je pogreška kuta.", "odgovor": "Opseg kotača je π · 0,12 ≈ 0,377 m. Jedan okretaj kotača daje 64 000 inkremenata, pa je jedan inkrement 0,377 / 64 000 ≈ 5,9 µm puta.", "kviz": [{"id": "r13", "pitanje": "Kotač Ø 120 mm, 64 000 inkremenata po okretaju kotača. Koliki je pomak robota za jedan inkrement, u mikrometrima?", "tocno": "5,9 µm (± 0,2)", "rjesenje": "Opseg: π · 0,12 ≈ 0,377 m; 0,377 m / 64 000 ≈ 5,9 µm."}, {"id": "r14", "pitanje": "Što žiroskop popravlja u odometriji Robotina?", "tocno": "kut (orijentaciju) robota", "rjesenje": "Žiroskop izravno mjeri kutnu brzinu tijela, pa se pogreška kuta zbog proklizavanja valjaka ne nakuplja. Položaj i dalje ispravlja laser s kartom."}]}, "37": {"kratko": "Narančaste zrake pogađaju prepreku. Vozim prema zidu, stajem na 15 cm, uključujem IR zaštitu, pa namjerno udaram da proradi odbojnik.", "odgovor": "Zaustavni put je reakcija plus kočenje: s = v · t_r + v² / (2a). Najveća sigurna brzina je ona za koju je s manji od udaljenosti na kojoj senzor reagira; izmjeri se pokusom pri nekoliko brzina.", "kviz": []}, "38": {"kratko": "Svaki sken upisuje se u kartu prema položaju koji robot misli da ima. S proklizavanjem i bez žiroskopa karta se razmaže.", "odgovor": "Robot isti zid vidi iz krivo procijenjenog položaja, pa ga upiše pomaknutog ili zakrenutog uz stari — na karti nastanu dva zida jedan uz drugi.", "kviz": []}, "39": {"kratko": "Dva optička senzora: lijevi vidi crtu — lijevo, desni — desno, nijedan — ravno. Kutna brzina mora biti barem v / R, s rezervom.", "odgovor": "Uz v = 0,3 m/s i R = 0,5 m: ω ≥ 0,3 / 0,5 = 0,6 rad/s. Kad oba senzora vide crtu (raskrižje), jednostavna logika nema pravilo — obično se vozi ravno; inače robot skrene na krak.", "kviz": [{"id": "r15", "pitanje": "Robot slijedi crtu brzinom 0,3 m/s, najmanji polumjer staze je 0,5 m. Kolika je najmanja potrebna kutna brzina u rad/s?", "tocno": "0,6 rad/s (± 0,02)", "rjesenje": "ω = v / R = 0,3 / 0,5 = 0,6 rad/s — i još s rezervom, jer senzori kasne."}]}, "40": {"kratko": "Laser nađe dva markera; robot se zakrene prema stanici, vozi bočno na normalu, pa ravno do kontakta. Bočni korak moguć je samo jer je svesmjeran.", "odgovor": "Laser bi limenku mogao prepoznati kao marker: robot bi krivo izračunao položaj stanice i pristao pokraj nje ili ukoso. Zato se markeri provjeravaju i po razmaku među njima.", "kviz": []}, "41": {"kratko": "Robot prilazi bočno, dva bočna senzora daju kut, srednji udaljenost. Optički handshake, trake prebacuju nosač, BG1 potvrđuje prazan prihvat.", "odgovor": "Dok BG1 ne potvrdi, nosač može biti napola na robotu i napola na stanici — vožnja bi ga srušila. Senzor je jedini dokaz da je predaja završena.", "kviz": [{"id": "r16", "pitanje": "Zašto Robotino nakon predaje nosača smije krenuti tek kad senzor BG1 potvrdi?", "tocno": "BG1 potvrđuje da je prihvat prazan, tj. nosač je prešao na stanicu", "rjesenje": "Dok nosač nije potpuno na stanici, vožnja bi ga srušila. BG1 je potvrda završene predaje."}]}, "42": {"kratko": "Program od blokova: predaj nosač, vozi do sredine, pristani. Svaki blok čeka prethodni — kao koraci i prijelazi u Grafcetu.", "odgovor": "Blok „čekaj ulaz” (uvjet) prije vožnje: čekaj da senzor prihvata javi nosač. Isto kao uvjet prijelaza u Grafcetu.", "kviz": []}, "43": {"kratko": "Gljiva isključuje sve aktuatore. Otpuštanje ne pokreće robota: RESET, pa START, a prekinuti zadatak se pokreće ponovno.", "odgovor": "Netko je stop pritisnuo s razlogom — možda je ruka u prihvatu ili netko stoji uz robota. Pokretanje mora biti svjesna odluka čovjeka koji je provjerio da je sigurno.", "kviz": [{"id": "r17", "pitanje": "Gljiva nužnog stopa je otpuštena. Što treba napraviti da Robotino ponovno radi?", "tocno": "potvrditi RESET, pa pritisnuti START", "rjesenje": "Otpuštanje gljive ne pokreće robota. Sigurnosni krug potvrđuje se RESET-om, a rad pokreće START; prekinuti zadatak se pokreće ponovno."}]}, "44": {"kratko": "U CP Factoryju Robotino povezuje modul grananja s ostatkom prostora; naloge mu daje Fleet Manager, koji zna položaje stanica i stanje baterije.", "odgovor": "Naučeni položaj stanice (gdje i pod kojim kutom pristati), je li stanica slobodna i spremna, te koja je vrsta predaje (strana, visina, handshake).", "kviz": []}, "45": {"kratko": "Skretnica šalje nosač u krak, sustav traži Robotina, robot pristaje, optički handshake, trake prebacuju nosač.", "odgovor": "Prijenosni modul s trakom na visini Robotinova prihvata i optički handshake (odašiljač i prijemnik povezani s PLC-om) — docking-kit kakav ima modul grananja.", "kviz": []}, "46": {"kratko": "Šaljem nalog s transportom Robotinom, ubrzanje ×5: skladište izdaje paletu, nosač skreće, Robotino pristaje i preuzima. Brzine motora su ista kinematika.", "odgovor": "Ubrzanje ×5 skraćuje samo prikaz: minuta u simulatoru je oko pet minuta u stvarnoj tvornici.", "kviz": [{"id": "r18", "pitanje": "Nalog u simulatoru uz ubrzanje ×5 traje 1 minutu. Koliko minuta traje u stvarnoj tvornici?", "tocno": "5 min", "rjesenje": "Stvarno vrijeme = simulirano · ubrzanje = 1 min · 5 = 5 min."}]}, "47": {"kratko": "Na mobitelu skenirate QR kod, usmjerite kameru prema podu i postavite robota u stvarnoj veličini.", "odgovor": "Okretom na mjestu Robotino opisuje krug promjera osnovice, 45 cm, jer je toranj unutar nje. Uz razmak od 10 cm sa svake strane: krug od oko 65 cm.", "kviz": []}, "48": {"kratko": "Sve ostaje na stranicama: upoznavanje, simulator s deset nizova, AR i simulator linije. Za LX: tečaj s petnaest vježbi na stvarnom robotu.", "odgovor": "", "kviz": []}, "49": {"kratko": "Kotač je najučinkovitiji, švedski uklanja bočno ograničenje, Robotino je holonoman, odometriju ispravljaju žiroskop i laser. Zadatak: nizovi 1–3 i brzina motora 1 za 0,2 m/s.", "odgovor": "Rješenje zadatka: m1 = k · (−sin 60° · 0,2) ≈ −882 1/min (vidi korak kinematike).", "kviz": []}};window.KVIZ={"kod": "robotino-p1", "baza": "https://fortroniq.hr/kviz/"};window.SCENARIJ_DOD=[{"t": 0, "dio": "Uvod"}, {"t": 90, "dio": "Uvod"}, {"t": 180, "dio": "Uvod"}, {"t": 270, "dio": "1 Kotači"}, {"t": 360, "dio": "1 Kotači"}, {"t": 450, "dio": "1 Kotači"}, {"t": 540, "dio": "1 Kotači"}, {"t": 630, "dio": "1 Kotači"}, {"t": 720, <script>/* Dodatak čitaču (predavanje.html?citac i citac-obs.html): kratki govor prema preostalom vremenu termina,

(function () {
  'use strict';
  var P = window.PITANJA || {}, KV = window.KVIZ || {}, S = window.SCENARIJ_DOD || [], KRAJ = window.KRAJ_DOD || 5400;
  var esc = function (x) { return String(x == null ? '' : x).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); };
  var mm = function (s) { var n = s < 0; s = Math.abs(Math.round(s)); return (n ? '−' : '') + String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
  var LS = 'ftq-dodatak-' + (KV.kod || 'x') + '-';
  var cit = function (k, d) { try { var v = localStorage.getItem(LS + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } };
  var pis = function (k, v) { try { localStorage.setItem(LS + k, JSON.stringify(v)); } catch (e) {} };
  var kartice = function () { return document.querySelectorAll('article[id^="k"]'); };

  /* ---------- 1. kartice: kratki govor, odgovor, kviz ---------- */
  kartice().forEach(function (el) {
    var i = +el.id.slice(1), p = P[i]; if (!p) return;
    var tekst = el.querySelector('.tekst');
    if (p.kratko && tekst) {
      tekst.classList.add('dugo');
      tekst.insertAdjacentHTML('beforebegin', '<p class="kratko"><b class="ozn">KRATKO</b> ' + esc(p.kratko) + '</p>');
      tekst.insertAdjacentHTML('afterbegin', '<b class="ozn">DUGO</b> ');
    }
    var dop = el.querySelector('.dop') || tekst;
    var h = '';
    if (p.odgovor) h += '<p class="odg"><b>Odgovor (pročitaj): </b>' + esc(p.odgovor) + '</p>';
    if (p.kviz && p.kviz.length) {
      h += '<div class="kviz"><div class="kviz-qr" data-i="' + i + '"></div><div class="kviz-p">' + p.kviz.map(function (q) {
        return '<div class="kq" data-id="' + esc(q.id) + '"><div class="kq-n">Kviz ' + esc(q.id) + ' · ' + esc(q.pitanje) + '</div>' +
          '<div class="kq-o"><b>Točno:</b> ' + esc(q.tocno) + '</div><div class="kq-r">' + esc(q.rjesenje) + '</div>' +
          '<div class="kq-g"><button data-a="pitanje" data-id="' + esc(q.id) + '">Otvori uživo</button><button data-a="otkrij">Otkrij odgovor</button><span class="kq-s"></span></div></div>';
      }).join('') + '</div></div>';
    }
    if (h) dop.insertAdjacentHTML('afterend', h);
  });

  traka.className = 'tempo';

    '<label>govor <select id="tp-nacin"><option value="auto">prema vremenu</option><option value="dugo">uvijek dugo</option><option value="kratko">uvijek kratko</option></select></label>' +
    '<button id="tp-reset" title="Sat termina kreće od nule">⟲ termin</button>' +
    '<span class="tp-sav" id="tp-sav"></span>' +
    '<details class="tp-uz"><summary>Kviz uživo</summary><label>Poveznica ploče <input id="tp-ploca" size="44" placeholder="https://fortroniq.hr/kviz/ploca/ABC123/?vt=…"></label>' +
    '<label><input type="checkbox" id="tp-auto"> otvaraj pitanje kad korak počne</label><span id="tp-uzst" class="tp-uzst"></span></details>';
  if (vrh) vrh.appendChild(traka); else document.body.prepend(traka);
  var $ = function (id) { return document.getElementById(id); };
  $('tp-tr').value = cit('trajanje', Math.round(KRAJ / 60));
  $('tp-nacin').value = cit('nacin', 'auto');
  $('tp-ploca').value = cit('ploca', '');
  $('tp-auto').checked = cit('auto', false);
  $('tp-tr').onchange = function () { pis('trajanje', +this.value || Math.round(KRAJ / 60)); };
  $('tp-nacin').onchange = function () { pis('nacin', this.value); };
  $('tp-ploca').onchange = function () { pis('ploca', this.value.trim()); qrSve(); uzStatus(); };
  $('tp-auto').onchange = function () { pis('auto', this.checked); };
  var start = cit('start', null);     /* Date.now() kad je sat predavanja prvi put krenuo */
  $('tp-reset').onclick = function () { start = null; pis('start', null); };

  function sat() {
    if (window.__citac && typeof window.__citac.sat === 'number') return window.__citac.sat;
    var v = document.querySelector('#vr, #c-vr'); if (!v) return 0;
    var m = /^(\d+):(\d+)/.exec(v.textContent); return m ? +m[1] * 60 + +m[2] : 0;
  }
  function trenutni() { var el = document.querySelector('article[id^="k"].sada'); return el ? +el.id.slice(1) : 0; }

  /* ---------- 3. sesija uživo (fortroniq.hr/kviz) ---------- */
  function sesija() {
    var u = $('tp-ploca').value.trim(); if (!u) return null;
    try { var x = new URL(u); var m = /\/kviz\/ploca\/([A-Za-z0-9]{6})/.exec(x.pathname); if (!m) return null;
      return { kod: m[1].toUpperCase(), vt: x.searchParams.get('vt') || '', api: x.origin + '/wp-json/ftq-kviz/v1/', url: x.origin + '/kviz/' + m[1].toUpperCase() + '/' }; } catch (e) { return null; }
  }
  function uzStatus(t) { var s = sesija(); $('tp-uzst').textContent = t || (s ? 'sesija ' + s.kod + ' — QR vodi u sesiju' : 'bez sesije — QR vodi na samostalnu provjeru'); }
  function upravljaj(tijelo, el) {
    var s = sesija(); if (!s) { uzStatus('Najprije zalijepi poveznicu ploče (Kviz uživo).'); return; }
    tijelo.vt = s.vt;
    fetch(s.api + 'sesija/' + s.kod + '/upravljanje', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(tijelo) })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.message || r.status); return j; }); })
      .then(function (d) { var p = d.i >= 0 ? d.pitanja[d.i] : null; var t = p ? 'otvoreno ' + p.id + (d.otkriveno ? ', otkriveno' : '') + ' · odgovora ' + p.ukupno + '/' + d.polaznika : 'nijedno pitanje';
        uzStatus('sesija ' + s.kod + ': ' + t); if (el) el.textContent = t; })
      .catch(function (e) { uzStatus('Greška sesije: ' + e.message); });
  }
  document.addEventListener('click', function (e) {
    var b = e.target.closest('.kq-g button'); if (!b) return;
    e.stopPropagation();
    upravljaj(b.dataset.a === 'pitanje' ? { akcija: 'pitanje', pitanje: b.dataset.id } : { akcija: 'otkrij' }, b.parentNode.querySelector('.kq-s'));
  }, true);
  document.addEventListener('dblclick', function (e) { if (e.target.closest('.kviz')) e.stopPropagation(); }, true);

  /* ---------- 4. QR kodovi ---------- */
  function qrUrl(i) {
    var s = sesija(), p = P[i];
    if (s) return s.url;
    return (KV.baza || 'https://fortroniq.hr/kviz/') + KV.kod + '/?p=' + encodeURIComponent(p.kviz[0].id);
  }
  function qrSve() {
    document.querySelectorAll('.kviz-qr').forEach(function (d) {
      var i = +d.dataset.i, url = qrUrl(i);
      if (d.dataset.url === url) return; d.dataset.url = url;
      try { var q = qrcode(0, 'M'); q.addData(url); q.make(); d.innerHTML = q.createSvgTag({ cellSize: 4, margin: 2, scalable: true }) + '<div class="qr-u">' + esc(url.replace(/^https?:\/\//, '')) + '</div>'; }
      catch (e) { d.textContent = url; }
    });
  }
  qrSve(); uzStatus();

  /* ---------- 5. petlja: tempo i način govora ---------- */
  var zadI = -1, zadMove = 0, prosliSat = 0;
  function petlja() {
    var s = sat(), i = trenutni();
    if (s < 1 && prosliSat > 30) { start = null; pis('start', null); }
    if (start == null && s > prosliSat + 0.5) { start = Date.now() - s * 1000; pis('start', start); }
    prosliSat = s;
    var T = (+$('tp-tr').value || Math.round(KRAJ / 60)) * 60;
    var st = $('tp-st'), nac = $('tp-nacin').value, kratko = nac === 'kratko';
    if (start != null) {
      var stv = (Date.now() - start) / 1000, ostT = T - stv, ostP = KRAJ - s, zao = ostP - ostT;
      if (nac === 'auto') kratko = zao > 60;
      st.innerHTML = 'termin ' + mm(stv) + ' / ' + mm(T) + ' · ostalo ' + mm(ostT) + ' · po planu ' + mm(ostP) + ' · ' +
        (Math.abs(zao) < 30 ? '<b class="ok">u planu</b>' : zao > 0 ? '<b class="kasni">kasniš ' + mm(zao) + '</b>' : '<b class="ok">ispred plana ' + mm(-zao) + ' — ima vremena za dopunu i pitanja</b>');
      /* prijedlog preskakanja */
      var sav = '';
      if (zao > 180) {
        var odD = null, doD = null, ime = '';
        for (var j = i + 1; j < S.length; j++) if (/presko/i.test(S[j].dio)) { if (odD === null) { odD = S[j].t; ime = S[j].dio; } doD = j + 1 < S.length ? S[j + 1].t : KRAJ; }
          else if (odD !== null) break;
        if (odD !== null) sav = 'Prijedlog: preskoči „' + esc(ime) + '” (−' + mm(doD - odD) + ')' + (window.__citac && window.__citac.post ? ' <button data-skok="' + doD + '" data-od="' + odD + '">preskoči kad dođe</button>' : '');
      }
      if (kratko) sav = (sav ? sav + ' · ' : '') + 'čitaj KRATKO pa ⏭';
      if ($('tp-sav').dataset.h !== sav) { $('tp-sav').innerHTML = sav; $('tp-sav').dataset.h = sav; }
    } else st.textContent = 'termin počinje kad krene sat predavanja';
    document.body.classList.toggle('govor-kratko', kratko);
    /* preskakanje cjeline kad dođe na red */
    if (window.__skok && s >= window.__skok.od - 0.5 && s < window.__skok.do && window.__citac && window.__citac.post) { window.__citac.post(window.__skok.do); window.__skok = null; }
    if (i !== zadI) {
      zadI = i;
      if ($('tp-auto').checked && P[i] && P[i].kviz && P[i].kviz.length && sesija()) upravljaj({ akcija: 'pitanje', pitanje: P[i].kviz[0].id });
    }
    setTimeout(petlja, 500);
  }
  document.addEventListener('click', function (e) { var b = e.target.closest('[data-skok]'); if (b) { window.__skok = { od: +b.dataset.od, do: +b.dataset.skok }; b.textContent = 'preskočit ću'; } });
  petlja();
})();
</script>

</html>
