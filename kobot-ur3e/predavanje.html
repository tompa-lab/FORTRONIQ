<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Predavanje — Kobot UR3e | FORTRONIQ</title>
<link rel="icon" href="../favicon.ico">
<style>
:root{--paper:#fff;--ink:#10394A;--body:#5D7C90;--rule:#DCE4E8;--teal:#17656E;--teal-d:#0F4A52;--cyan:#2ECAD4;--bar:#17181A;--tanko:#EEF4F6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body.reziser{overflow:hidden;background:#000}
#okvir{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#fff}
#kursor{position:fixed;left:0;top:0;z-index:50;width:26px;height:26px;pointer-events:none;transform:translate(960px,540px);transition:transform .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#kursor svg{display:block;width:26px;height:26px}
#kursor.skriven{opacity:0}
.val{position:fixed;z-index:49;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #2ECAD4;pointer-events:none;animation:val .55s ease-out forwards}
@keyframes val{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
#traka{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:10px;background:rgba(16,24,28,.88);color:#E9EDEF;border:1px solid rgba(46,202,212,.5);border-radius:12px;padding:8px 12px;font-size:14px;transition:opacity .4s;max-width:min(760px,calc(100vw - 28px))}
#traka.skrij{opacity:0;pointer-events:none}
#traka button{font:inherit;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:4px 10px;cursor:pointer}
#traka button:hover{border-color:#2ECAD4;color:#2ECAD4}
#traka .vr{font-variant-numeric:tabular-nums;font-weight:600;min-width:110px}
#traka .nas{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(9,22,26,.86)}
#start[hidden]{display:none}
.karta{background:var(--paper);color:var(--ink);border-radius:16px;max-width:720px;width:calc(100% - 32px);padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.karta h1{margin:0 0 6px;font-size:1.6rem;letter-spacing:-.02em}
.karta .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem;color:var(--body)}.karta .znak b{color:var(--cyan)}
.karta p,.karta li{color:var(--body);line-height:1.55;font-size:.97rem}
.karta ol{padding-left:1.2rem;margin:.6rem 0 1rem}
.gumbi{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.gumb{font:inherit;font-weight:600;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.7rem 1.3rem;cursor:pointer}
.gumb.tanki{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.gumb:focus-visible,#traka button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
kbd{font:600 .85em "IBM Plex Mono",ui-monospace,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 .35em;color:var(--ink)}
/* ---------------- čitač */
body.citac{background:var(--paper)}
.c-vrh{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:var(--bar);color:#E9EDEF}
.c-vrh .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.c-vrh .znak b{color:var(--cyan)}
.c-vrh .vr{font:700 1.5rem/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.c-vrh .st{font-size:.85rem;color:#9DB6C2}
.c-vrh button{font:inherit;font-size:.9rem;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:5px 10px;cursor:pointer}
.c-vrh button:hover{border-color:#2ECAD4;color:#2ECAD4}
.c-vrh .desno{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.c-popis{max-width:1100px;margin:0 auto;padding:14px 18px 60vh}
.c-k{border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.c-k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.c-k.gotov{opacity:.35}
.c-k .gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.c-k .t{font:700 1rem "IBM Plex Mono",ui-monospace,monospace;color:var(--teal)}
.c-k .dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.c-k h2{margin:0;font-size:1.25rem;color:var(--ink)}
.c-k .klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.c-k .tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;color:var(--ink)}
.c-k .dop{font-size:calc(var(--vel,1.45rem) * .82);line-height:1.5;margin:.7rem 0 0;color:var(--body)}
.c-k .dop b{color:var(--ink)}
.c-k .napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.c-k .napr i{display:block;height:100%;width:0;background:var(--teal)}
@media (max-width:680px){.c-k .tekst{font-size:1.15rem}.c-vrh .vr{font-size:1.2rem}}
</style>
</head>
<body>
<script>window.SCENARIJ = [{"t": 0, "dio": "Uvod", "naslov": "Dobrodošlica i cilj predavanja", "str": "index", "radnje": [["str", "index"], ["cekaj", 3]], "klik": "Naslovnica područja Kobot UR3e: naslov, opis i ilustracija.", "tekst": "Dobar dan. Danas upoznajemo suradnički robot, kobot, Universal Robots UR3e — najmanji robot serije e-Series. Proći ćemo ga od vanjštine do najsitnijeg dijela: šest zglobova, svaki s motorom, valnim prijenosnikom, kočnicom, dva enkodera i elektronikom; zatim senzor sile na prirubnici, upravljački ormar i privjesak za učenje. Nakon toga robot ćemo pokrenuti, pomicati i programirati, a na kraju ga staviti u prostor u proširenoj stvarnosti. Sve što ćete vidjeti radi u običnom pregledniku, pa sve možete ponoviti sami, kod kuće ili na mobitelu.", "dopuna": "Kobot je robot projektiran za rad u istom prostoru s čovjekom, bez zaštitne ograde — ali uz procjenu rizika. Pitanje za vas: gdje ste već vidjeli robota bez ograde i što ga razlikuje od klasičnog industrijskog robota?"}, {"t": 90, "dio": "Uvod", "naslov": "Što ćemo moći nakon predavanja", "str": "index", "radnje": [["lebdi", "#goals li:nth-child(1)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(2)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(3)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(4)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(5)"]], "klik": "Blok „Moći ću” — pet ishoda (pokazivač prelazi preko svakoga).", "tekst": "Na vrhu stranice je pet ishoda. Nakon današnjeg sata trebali biste znati nabrojati dijelove kobota i pokazati ih na robotu; objasniti građu zgloba — motor, valni prijenosnik, kočnicu, enkodere i elektroniku; opisati upravljački ormar, privjesak za učenje i sigurnosne funkcije; izračunati položaj alata iz kutova zglobova pomoću DH parametara; i na kraju programirati jednostavan zadatak točkama puta i pokrenuti ga u simulatoru i u proširenoj stvarnosti. Te ćemo ishode na kraju sata provjeriti.", "dopuna": "Ishodi su napisani glagolima koje možemo provjeriti: nabrojati, objasniti, opisati, izračunati, programirati. Zapišite ih — na kraju sata svaki ćemo označiti."}, {"t": 180, "dio": "Uvod", "naslov": "Tri poglavlja", "str": "index", "radnje": [["skrol", ".moduli"], ["cekaj", 3], ["lebdi", ".moduli li:nth-child(1) .gumb"], ["cekaj", 12], ["lebdi", ".moduli li:nth-child(2) .gumb"], ["cekaj", 12], ["lebdi", ".moduli li:nth-child(3) .gumb"], ["cekaj", 12], ["klik", ".moduli li:nth-child(1) .gumb"]], "klik": "Popis poglavlja: 1 Upoznavanje robota, 2 Upravljanje robotom, 3 Robot u proširenoj stvarnosti; klik na „Otvori” uz prvo.", "tekst": "Sadržaj ima tri poglavlja. Prvo, Upoznavanje robota, robot je dio po dio, s animacijama „Kako radi” koje pokazuju načelo rada svakog sklopa. Drugo, Upravljanje robotom, ima privjesak za učenje nalik pravom PolyScopeu i devet nizova vježbi — od uključivanja do programa i sigurnosti. Treće je robot u proširenoj stvarnosti: na mobitelu ga postavite na stol ili pod u stvarnoj veličini. Krećemo s prvim poglavljem.", "dopuna": "Sadržaj je otvoren: ništa ne treba instalirati, radi u pregledniku na računalu i mobitelu, a napredak se pamti u pregledniku. Predlažem da ga nakon sata prođete sami, istim redom."}, {"t": 240, "dio": "1 Upoznavanje", "naslov": "Raspored stranice", "str": "upoz", "radnje": [["str", "upoz"], ["cekaj", 6], ["skrolY", 360], ["cekaj", 8], ["poravnaj"], ["cekaj", 3], ["lebdi", ".uz-izbornik .karta-h"], ["cekaj", 8], ["lebdi", "#k-scena .karta-h h2"], ["cekaj", 8], ["lebdi", "#kartica .karta-h"]], "klik": "Stranica Upoznavanje robota: lijevo izbornik dijelova (91 stavka), u sredini 3D prikaz, desno objašnjenje.", "tekst": "Stranica je složena kao radni prikaz u tri stupca. Lijevo je izbornik s 91 dijelom robota — stavke sa strelicom otvaraju podizbornik, a uz svaku pregledanu stavku pojavi se kvačica. U sredini je trodimenzionalni model, a desno objašnjenje odabranog dijela. Kad kliknete dio u izborniku, model se sam okrene prema njemu i istakne ga. Gornji brojač pokazuje koliko je stavki pregledano.", "dopuna": "Kvačice uz pregledane stavke služe kao vaš popis: cilj je da do sljedećeg sata svih 91 stavki ima kvačicu."}, {"t": 315, "dio": "1 Upoznavanje", "naslov": "Pogledi i rukovanje 3D prikazom", "str": "upoz", "radnje": [["pogled", "sve"], ["cekaj", 7], ["pogled", "sprijeda"], ["cekaj", 7], ["pogled", "bok"], ["cekaj", 7], ["pogled", "odozgo"], ["cekaj", 7], ["pogled", "robot"], ["cekaj", 5], ["okret", 14], ["lebdi3d", 0.52, 0.42], ["cekaj", 4], ["lebdi3d", 0.47, 0.62], ["cekaj", 4]], "klik": "Gumbi pogleda Sve, Sprijeda, Bok, Odozgo, Robot; okretanje mišem; prelazak mišem preko modela pokazuje naziv dijela.", "tekst": "Gumbima iznad prikaza mijenjate pogled: Sve — robot, ormar i privjesak; Sprijeda, Bok i Odozgo; Robot — samo ruka. Mišem povucite za okretanje, kotačićem zumirate, a desnom tipkom pomičete prikaz. Kad mišem prijeđete preko modela, pojavi se naziv dijela, a klikom ga odaberete. Na mobitelu sve isto radi prstima.", "dopuna": "Model je građen iz DH parametara proizvođača, pa su razmaci osi točni; vanjski oblici i unutrašnjost su naša procjena. Pitanje: koji pogled biste odabrali da pokažete doseg robota iznad stola?"}, {"t": 420, "dio": "1 Upoznavanje", "naslov": "Cijeli robot i položaji", "str": "upoz", "radnje": [["meni", 2], ["cekaj", 10], ["klik", "[data-polozaj=\"ispruzen\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"sklopljen\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"nula\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"pocetni\"]"], ["cekaj", 6]], "klik": "Stavka „Cijeli robot”; gumbi Položaj: Ispružen, Sklopljen, Nulti (q = 0), Početni položaj.", "tekst": "UR3e je najmanji robot serije e-Series: masa s kabelom 11,2 kilograma, nosivost 3 kilograma, doseg 500 milimetara, ponovljivost ±0,03 milimetra prema ISO 9283 i najveća brzina alata 3 metra u sekundi. Zaštita je IP54. Šest zglobova iste je koncepcije, u tri veličine, a povezuju ih aluminijske cijevi. Gumbima Položaj vidite robot ispružen, sklopljen i u nultom položaju — sve kutove nula, kada je ruka vodoravno ispružena. Početni položaj je uspravan robot.", "dopuna": "Ponovljivost ±0,03 mm nije isto što i točnost — robot se vraća u istu točku vrlo precizno, ali apsolutni položaj u prostoru može odstupati više. Pitanje: zašto je za većinu zadataka ponovljivost važnija od apsolutne točnosti?"}, {"t": 540, "dio": "1 Upoznavanje", "naslov": "Pomicanje zglobova, osi i DH okviri", "str": "upoz", "radnje": [["izbor", "#z-izbor", "1"], ["klik", "#z-pomakni"], ["cekaj", 12], ["klik", "#z-svi"], ["cekaj", 60], ["klik", "#z-stop"], ["cekaj", 3], ["kvacica", "#p-osi"], ["cekaj", 12], ["kvacica", "#p-osi"], ["kvacica", "#p-dh"], ["cekaj", 14], ["kvacica", "#p-dh"]], "klik": "Izbornik Zglob, gumbi „Pomakni zglob” i „Svi zglobovi redom”, „Stani”; kvačice „osi zglobova” i „DH okviri”.", "tekst": "Odaberite zglob i kliknite „Pomakni zglob” — robot zakrene samo taj zglob. „Svi zglobovi redom” pokrene šest zglobova jedan za drugim, od Basea do Wrista 3, pa se lijepo vidi koji dio ruke pokreće koji zglob. Kvačica „osi zglobova” crta osi vrtnje, a „DH okviri” koordinatne okvire po Denavitu i Hartenbergu — crvena os x, zelena y, plava z. Os z svakog okvira je os vrtnje sljedećeg zgloba. Ispod modela je stalno ispisano šest kutova i položaj alata u milimetrima.", "dopuna": "Primijetite redoslijed: Base, Shoulder i Elbow određuju gdje je zapešće, a tri zgloba zapešća kako je okrenut alat. Pitanje: koji zglob najviše mijenja visinu alata kad je ruka ispružena?"}, {"t": 690, "dio": "1 Upoznavanje", "naslov": "Kako radi: DH okviri i izravna kinematika", "str": "upoz", "radnje": [["tema"], ["cekaj", 10], ["klizac", "Shoulder", -45, 6], ["cekaj", 8], ["klizac", "Elbow", 60, 6], ["cekaj", 8], ["klizac", "Base", 40, 5], ["cekaj", 10], ["klikT", "Nulti položaj (sve 0°)"], ["cekaj", 12], ["klikT", "Početni (0, −90, 0, −90, 0, 0)"], ["cekaj", 12], ["klizac", "Okret pogleda", -60, 5], ["cekaj", 16], ["tema"]], "klik": "Animacija na pozornici; desno klizači šest kutova, gumbi Nulti i Početni, okret pogleda; ispod očitanje TCP-a i DH tablica.", "tekst": "Gumb „Kako radi” otvara animaciju na mjestu 3D prikaza, a desno su klizači. Pomičem rame, lakat i bazu i pratim okvire. Položaj prirubnice računa se izravnom kinematikom: umnožak šest matrica, svaka s četiri DH parametra — kut θ, pomak d, duljina a i zakret α. Za UR3e proizvođač objavljuje d1 151,85 milimetara, a2 minus 243,55, a3 minus 213,2, d4 131,05, d5 85,35 i d6 92,1 milimetara. U nultom položaju robot je vodoravno ispružen: x je −456,75, y −223,15, z 66,5 milimetara. Taj ćemo izračun ponoviti u drugom poglavlju.", "dopuna": "Izravna kinematika ide od kutova prema položaju i uvijek ima jedno rješenje. Obrnuto — inverzna kinematika — za UR ima do osam rješenja za isti položaj alata. Pitanje: što mislite, kako upravljanje bira jedno od njih?"}, {"t": 870, "dio": "1 Upoznavanje", "naslov": "Postolje i kabel", "str": "upoz", "radnje": [["meni", 3], ["cekaj", 20]], "klik": "Stavka „Postolje i kabel” — model se okrene prema postolju.", "tekst": "Postolje je okrugla prirubnica promjera 128 milimetara kojom se robot vijcima pričvrsti za stol, postolje ili stroj. Robot se smije montirati u bilo kojem položaju — na pod, zid ili strop — a položaj se upisuje u instalaciju, da upravljanje dobro računa gravitaciju. Iz boka izlazi kabel od 6 metara prema ormaru; ne smije biti napregnut, prignječen ni oštro savijen.", "dopuna": "U praksi je vođenje kabela čest uzrok kvarova: kabel koji se pri svakom ciklusu savija na istom mjestu s vremenom pukne. Pitanje: kako biste vodili kabel na robotu koji visi sa stropa?"}, {"t": 930, "dio": "1 Upoznavanje", "naslov": "Zglob Base: rastavljanje i unutrašnjost", "str": "upoz", "radnje": [["meni", 4], ["cekaj", 10], ["klik", "#z-rastavi"], ["cekaj", 22], ["klik", "#p-odabrano"], ["cekaj", 12], ["klik", "#p-sve"], ["cekaj", 4], ["klik", "#z-rastavi"], ["cekaj", 5], ["klik", "#z-unutra"], ["cekaj", 22], ["klik", "#z-unutra"], ["cekaj", 3]], "klik": "Stavka „Zglob Base”; gumbi „Rastavi zglob”, „Samo odabrano / Prikaži sve”, „Prikaži unutrašnjost”.", "tekst": "Zglob Base okreće cijelu ruku oko okomite osi. To je zglob veličine 2 — najveće izvedbe — s najvećim momentom 54 njutnmetra, opsegom ±360° i brzinom ±180° u sekundi. Svih šest zglobova građeno je jednako: motor, valni prijenosnik, kočnica, dva enkodera i elektronika u zajedničkom kućištu sa šupljom sredinom za kabele. „Rastavi zglob” razmakne dijelove duž osi, „Samo odabrano” sakrije ostatak robota, a „Prikaži unutrašnjost” učini kućište prozirnim. Napomena: unutarnje mjere zgloba proizvođač ne objavljuje — prikaz je načelni.", "dopuna": "Isti zglob u tri veličine znači manje različitih rezervnih dijelova i jednostavniji servis — zglob se mijenja kao cjelina. Pitanje: koje su prednosti, a koji nedostaci takve modularne gradnje?"}, {"t": 1080, "dio": "1 Upoznavanje", "naslov": "Kako radi: zglob od struje do kuta", "str": "upoz", "radnje": [["tema"], ["cekaj", 8], ["klikT", "Pokreni tok"], ["cekaj", 22], ["klikT", "Sljedeći"], ["cekaj", 12], ["klikT", "Sljedeći"], ["cekaj", 12], ["klikT", "Sljedeći"], ["cekaj", 12], ["klikT", "Sljedeći"], ["cekaj", 12], ["tema"]], "klik": "Animacija presjeka zgloba: „Pokreni tok” (energija narančasto, signali enkodera plavo), „Prethodni / Sljedeći”, klik na broj dijela.", "tekst": "Uzdužni presjek zgloba pokazuje lanac od struje do kuta. Narančasto teče energija: priključci, elektronika, motor, kroz otpuštenu kočnicu, valni prijenosnik do izlazne prirubnice. Plavo se vraćaju signali: enkoder motora javlja kut rotora za komutaciju, a enkoder zgloba stvarni kut iza prijenosnika. Tipkom „Sljedeći” prolazimo dio po dio.", "dopuna": "Šuplja sredina zgloba nije slučajna: kroz nju prolaze kabeli prema sljedećim zglobovima, pa robot nema vanjskih kabela koji bi zapinjali."}, {"t": 1200, "dio": "1 Upoznavanje", "naslov": "Motor bez četkica i komutacija", "str": "upoz", "radnje": [["meni", 6], ["cekaj", 8], ["tema"], ["cekaj", 8], ["klizac", "Struja", 7, 4], ["cekaj", 10], ["klikT", "Blok (6 koraka)"], ["cekaj", 14], ["klikT", "Sinusna"], ["cekaj", 8], ["klikT", "Pomaknut 90°"], ["cekaj", 14], ["klikT", "Pomaknut 180°"], ["cekaj", 10], ["klikT", "Ispravan"], ["cekaj", 6], ["tema"]], "klik": "Stavka „Motor”; animacija: klizač struje, komutacija Sinusna / Blok, kut iz enkodera Ispravan / Pomaknut 90° / 180°.", "tekst": "Pogon je motor bez četkica: stator s namotima u kućištu, rotor s trajnim magnetima na šupljem vratilu. Elektronika uključuje struju u namote prema kutu rotora — to je komutacija. Kod sinusne komutacije polje statora vrti se jednoliko ispred rotora; kod blok-komutacije skače u šest koraka po 60°, pa moment pulsira. Ako je kut iz enkodera pomaknut za 90°, polje stoji u smjeru rotora i motor ne daje moment iako teče puna struja; uz 180° vrti se unatrag. Zato je enkoder motora toliko važan. Motor se vrti brzo, s malim momentom — moment daje tek prijenosnik.", "dopuna": "Motor bez četkica nema mehaničkog komutatora koji se troši; posao komutatora preuzimaju elektronika i enkoder. Pitanje: što bi se dogodilo s motorom da enkoder motora pri pokretanju javlja krivi kut?"}, {"t": 1350, "dio": "1 Upoznavanje", "naslov": "Valni prijenosnik i njegova tri dijela", "str": "upoz", "radnje": [["meni", 7], ["cekaj", 14], ["meni", 8], ["cekaj", 14], ["meni", 9], ["cekaj", 14], ["meni", 10], ["cekaj", 14], ["meni", 7], ["cekaj", 4]], "klik": "Stavka „Valni prijenosnik” i podstavke Generator vala, Flexspline, Circular spline (svaka se istakne u modelu).", "tekst": "Valni ili harmonični prijenosnik u jednom stupnju smanjuje brzinu i povećava moment, bez zračnosti. Ima tri dijela. Generator vala je eliptični disk s tankostijenim kugličnim ležajem na vratilu motora. Flexspline je tankostijena čelična čaša s vanjskim zubima koja se elastično deformira. Circular spline je kruti prsten s unutarnjim zubima. Flexspline ima dva zuba manje od prstena, pa za jedan okret generatora zaostane za dva zuba. Prijenosni omjer je z flex kroz razliku zubi: 200 kroz 2 daje 100. Harmonic Drive je objavio da je UR-u isporučivao prijenosnike omjera 100:1 — za UR3e točan omjer nije objavljen.", "dopuna": "Za usporedbu: omjer 100 planetarnim prijenosnikom traži dva ili tri stupnja, a valni ga postiže u jednom, u kućištu tankom kao zglob. Pitanje: koja je cijena toga — što se u flexsplineu događa milijunima puta tijekom životnog vijeka?"}, {"t": 1440, "dio": "1 Upoznavanje", "naslov": "Kako radi: valni prijenosnik", "str": "upoz", "radnje": [["tema"], ["cekaj", 6], ["klikT", "Pokreni"], ["cekaj", 24], ["klikT", "200 / 202"], ["cekaj", 16], ["klikT", "30 / 32"], ["cekaj", 10], ["klikT", "Jedan okretaj ulaza"], ["cekaj", 22], ["klikT", "Njihanje (usporedba zračnosti)"], ["cekaj", 34], ["klikT", "Stalna vrtnja"], ["cekaj", 4], ["tema"]], "klik": "Animacija: Pokreni, Jedan okretaj ulaza, Na početak; broj zubi 30/32, 60/62, 200/202; gibanje Stalna vrtnja / Njihanje; klizači brzine i momenta motora.", "tekst": "Pokrećem vrtnju. Crveni zub flexsplinea i oznake na prstenu pokazuju da se izlaz za svaki okretaj generatora pomakne za točno dva zuba, i to suprotno od ulaza. Uvećani detalj desno gore prati veliku os elipse — ondje su zubi u punom zahvatu, na oba boka. Uz 200 i 202 zuba omjer je 100. „Jedan okretaj ulaza” to pokazuje korak po korak. Sad njihanje: planetarni prijenosnik pri svakoj promjeni smjera najprije prijeđe zračnost, a valni odmah slijedi ulaz. Zato robot s valnim prijenosnikom ima ponovljivost od nekoliko stotinki milimetra.", "dopuna": "Izlaz se vrti suprotno od ulaza jer flexspline zaostaje za generatorom. Pitanje: koliko okretaja generatora treba za jedan okretaj izlaza uz 200 i 202 zuba, a koliko uz 30 i 32?"}, {"t": 1620, "dio": "1 Upoznavanje", "naslov": "Kočnica zgloba", "str": "upoz", "radnje": [["meni", 11], ["cekaj", 10], ["tema"], ["cekaj", 6], ["klikT", "Isključeno"], ["cekaj", 14], ["klizac", "Vanjski moment", 60, 5], ["cekaj", 10], ["klizac", "Vanjski moment", 115, 5], ["cekaj", 12], ["klizac", "Vanjski moment", 0, 3], ["klikT", "Uključeno"], ["cekaj", 6], ["klikT", "Test kočnice"], ["cekaj", 22], ["tema"]], "klik": "Stavka „Kočnica”; animacija: napajanje kočnice Uključeno / Isključeno, klizač vanjskog momenta, „Test kočnice”.", "tekst": "Kočnica drži zglob kad robot nije pod napajanjem. Na vratilu motora je prsten s krilcima; kad nestane napajanja, iz elektromagneta izađe zatik i krilce udari u njega. Krilce nije čvrsto na vratilu nego preko tarne spojke: dok je vanjski moment malen, zglob se pomakne samo do naslona na zatik; kad moment prijeđe granicu, vratilo proklizava. Zato se zakočeni robot u nuždi može rukom pogurati — uz klik, i ne više od 160°. Pri pokretanju robota kočnice se otpuštaju uz mali trzaj zglobova, a upravljanje ih testira; kvar javlja porukom „Brake test failed”.", "dopuna": "Zato servisne upute kažu da se zakočeni zglob smije rukom prisilno pomaknuti samo u nuždi, npr. kad je čovjek priklješten. Pitanje: zašto je kočnica izvedena tako da koči kad nestane napajanja, a ne obrnuto?"}, {"t": 1785, "dio": "1 Upoznavanje", "naslov": "Dva enkodera", "str": "upoz", "radnje": [["meni", 12], ["cekaj", 8], ["meni", 13], ["cekaj", 8], ["tema"], ["cekaj", 6], ["klikT", "Pokreni"], ["cekaj", 18], ["klikT", "Preskakanje zubi"], ["klikT", "Izazovi kvar"], ["cekaj", 18], ["klikT", "Poništi"], ["cekaj", 4], ["klikT", "Kvar enkodera zgloba"], ["klikT", "Izazovi kvar"], ["cekaj", 18], ["klikT", "Poništi"], ["cekaj", 3], ["tema"]], "klik": "Stavke „Enkoder motora” i „Enkoder zgloba”; animacija: Pokreni, vrsta kvara (Bez kvara / Preskakanje zubi / Kvar enkodera zgloba), Izazovi kvar, Poništi.", "tekst": "Svaki zglob ima dva enkodera. Enkoder motora mjeri kut rotora — za komutaciju i brzinu. Enkoder zgloba mjeri stvarni kut iza prijenosnika. Disk enkodera motora vrti se sto puta brže, a krivulje kut motora kroz omjer i kut zgloba se poklapaju. Kod preskakanja zubi izlaz naglo zaostane, a kod kvara enkodera zgloba očitanje počne skakati — razlika prijeđe prag i zglob se zaustavlja. U PolyScopeu se to javlja kao „Joint encoder error” ili „Sudden position change detected on the joint-encoder”.", "dopuna": "Dva enkodera daju i sigurnost: upravljanje stalno uspoređuje dva neovisna mjerenja istog gibanja. Pitanje: koji kvar može otkriti samo usporedba obaju enkodera?"}, {"t": 1935, "dio": "1 Upoznavanje", "naslov": "Elektronika i kaskadna regulacija", "str": "upoz", "radnje": [["meni", 14], ["cekaj", 8], ["tema"], ["cekaj", 6], ["klikT", "Pomakni zglob na 90°"], ["cekaj", 16], ["klizac", "Pojačanje položaja", 10, 4], ["klikT", "Pomakni zglob na 90°"], ["cekaj", 16], ["klizac", "Pojačanje položaja", 40, 3], ["klikT", "Teret 3 kg"], ["cekaj", 16], ["klikT", "Uvećano (takt 2 ms)"], ["cekaj", 14], ["klikT", "Cijelo gibanje"], ["tema"]], "klik": "Stavka „Elektronika”; animacija kaskadne regulacije: „Pomakni zglob na 90°”, „Teret 3 kg”, klizači Kp i Kv, prikaz Cijelo gibanje / Uvećano (takt 2 ms).", "tekst": "Elektronika upravlja motorom izravno u zglobu, a s ormarom razmjenjuje zadane i stvarne vrijednosti 500 puta u sekundi. Regulacija je kaskadna: vanjska petlja položaja, unutar nje brzina, a najdublje struja. Pokrećem zglob na 90°: puna crta je stvarni kut, crtkana zadani. Uz malo pojačanje položaja Kp stvarni kut zaostaje više; uz veće prati bolje. „Teret 3 kg” naglo doda moment težine — gledajte kako ga regulacija svlada. U uvećanom prikazu vidi se da se zadana vrijednost mijenja u koracima od 2 milisekunde.", "dopuna": "Kaskadna regulacija postoji zato što unutarnja petlja — struja — mora biti puno brža od vanjske; tako vanjska petlja vidi pogon kao „idealan”. Pitanje: što se vidi na grafu kad je pojačanje brzine Kv premalo?"}, {"t": 2085, "dio": "1 Upoznavanje", "naslov": "Ostali zglobovi: tri veličine", "str": "upoz", "radnje": [["meni", 15], ["cekaj", 6], ["klik", "#z-pomakni"], ["cekaj", 14], ["meni", 26], ["cekaj", 12], ["meni", 37], ["cekaj", 12], ["meni", 59], ["cekaj", 6], ["klik", "#z-pomakni"], ["cekaj", 14]], "klik": "Stavke Zglob Shoulder, Elbow, Wrist 1, Wrist 3; „Pomakni zglob”.", "tekst": "Rame, Shoulder, također je veličine 2, 54 njutnmetra — gravitacijom je najopterećeniji zglob jer drži cijelu ruku na najvećem kraku. Lakat, Elbow, je veličine 1, a tri zgloba zapešća veličine 0, najmanja. Prema listu podataka svi imaju opseg ±360°, osim Wrista 3 koji se vrti beskonačno. Za lakat priručnik PolyScopea navodi ±160° — na stranici su navedena oba podatka jer se izvori ne slažu.", "dopuna": "Momenti zglobova: veličina 2 do 54 Nm, manji zglobovi bitno manje — zato nosivost ovisi i o položaju tereta, ne samo o masi."}, {"t": 2190, "dio": "1 Upoznavanje", "naslov": "Cijevi i prirubnica alata", "str": "upoz", "radnje": [["meni", 70], ["cekaj", 10], ["meni", 71], ["cekaj", 8], ["meni", 72], ["cekaj", 6], ["kvacica", "#p-dh"], ["cekaj", 22], ["kvacica", "#p-dh"]], "klik": "Stavke Cijev nadlaktice, Cijev podlaktice, Prirubnica alata; kvačica „DH okviri”.", "tekst": "Nadlaktica i podlaktica su aluminijske cijevi kroz koje prolaze kabeli; razmak osi ramena i lakta je DH parametar a2, 243,55 milimetara. Prirubnica alata izvedena je po normi EN ISO 9409-1-50-4-M6: četiri navoja M6 na promjeru 50 i provrt za zatik. Bez alata ishodište alatnog sustava je u središtu prirubnice, os z gleda prema van. Kad montirate alat, u instalaciji upisujete TCP i masu tereta.", "dopuna": "Normirana prirubnica znači da se hvataljke drugih proizvođača montiraju bez adaptera. Pitanje: što morate upisati u instalaciju čim promijenite alat?"}, {"t": 2280, "dio": "1 Upoznavanje", "naslov": "Senzor sile i momenta", "str": "upoz", "radnje": [["meni", 73], ["cekaj", 8], ["tema"], ["cekaj", 6], ["klikT", "Pritisak prstom"], ["cekaj", 6], ["klizac", "Sila prsta", 30, 5], ["cekaj", 8], ["klizac", "Duljina alata", 180, 5], ["cekaj", 10], ["klikT", "Teret 3 kg"], ["cekaj", 8], ["klizac", "Pomak težišta", 50, 5], ["cekaj", 12], ["tema"]], "klik": "Stavka „Senzor sile i momenta”; animacija: slučaj Bez opterećenja / Pritisak prstom / Teret 3 kg, klizači sile, kraka, težišta i nagiba.", "tekst": "UR3e ima ugrađen senzor sile i momenta iza prirubnice: sile do ±30 njutna, momenti do ±10 njutnmetara, u tri osi. Pritisak prstom na vrh alata daje silu i moment koji raste s krakom — M jednako F puta L. Teret od 3 kilograma teži 29,4 njutna, pa je očitanje gotovo na granici opsega, a ako težište nije u osi prirubnice, nastaje i moment. Senzor se rabi za umetanje, spajanje, praćenje plohe — zadatke u kojima robot mora osjetiti dodir.", "dopuna": "Senzor sile omogućuje i „vođenje silom”: robot održava zadanu silu pritiska dok prati plohu, npr. pri brušenju. Pitanje: zašto je nepodešena masa tereta problem za mjerenje sile?"}, {"t": 2400, "dio": "1 Upoznavanje", "naslov": "Alatni priključak (Tool I/O)", "str": "upoz", "radnje": [["meni", 74], ["cekaj", 8], ["tema"], ["cekaj", 6], ["klikT", "Zatvori"], ["cekaj", 10], ["klikT", "B: 12 V, NPN, AI"], ["cekaj", 6], ["klikT", "Zatvori"], ["cekaj", 10], ["klikT", "12 V"], ["klikT", "Sinking (NPN)"], ["klikT", "Zatvori"], ["cekaj", 10], ["klikT", "Otvori"], ["cekaj", 6], ["tema"]], "klik": "Stavka „Alatni priključak”; animacija: hvataljke A/B/C, Zatvori / Otvori, napon alata 0/12/24 V, način izlaza NPN/PNP/Push-pull, analogni ulazi.", "tekst": "Na zadnjem zglobu je konektor M8 s 8 polova: napajanje alata 12 ili 24 V do 600 miliampera, dva digitalna ulaza, dva izlaza i dva analogna ulaza. Za pametne alate postoji sučelje RS-485. U animaciji biram hvataljku i podešavam priključak kao u instalaciji. Ako se napon ili način izlaza ne slažu s hvataljkom — na primjer hvataljka traži 12 V i NPN, a priključak daje 24 V i PNP — hvataljka ne reagira. Kad uskladim napon i način, zatvara se i otvara.", "dopuna": "Prije spajanja hvataljke uvijek provjerite tri stvari: napon (12 ili 24 V), način izlaza (NPN, PNP, push-pull) i najveću struju. Pitanje: što će se dogoditi ako hvataljka traži više od 600 mA?"}, {"t": 2505, "dio": "1 Upoznavanje", "naslov": "Upravljački ormar", "str": "upoz", "radnje": [["meni", 75], ["cekaj", 12], ["meni", 76], ["cekaj", 8], ["meni", 78], ["cekaj", 8], ["meni", 79], ["cekaj", 8], ["meni", 80], ["cekaj", 8], ["meni", 75], ["cekaj", 3], ["tema"], ["cekaj", 6], ["klikT", "Ubrzava"], ["cekaj", 10], ["klikT", "Koči"], ["cekaj", 14], ["klikT", "E-stop"], ["cekaj", 14], ["klikT", "Poništi E-stop"], ["cekaj", 4], ["klikT", "Miruje"], ["tema"]], "klik": "Stavka „Upravljački ormar” (vrata se otvore) i dijelovi: izvor napajanja, sigurnosna ploča, Energy Eater, računalo; animacija: stanje Miruje / Ubrzava / Koči, E-stop.", "tekst": "Ormar serije e-Series ima masu 12 kilograma i zaštitu IP44, a napaja se iz mreže 100 do 240 V. Kad ga odaberete, vrata se u modelu otvore. Unutra su izvor napajanja, upravljačka ploča, sigurnosna ploča s dva kanala, Energy Eater i računalo s PolyScopeom, uz priključnice za ulaze i izlaze. U animaciji: pri kočenju motori rade kao generatori, energija se vraća u ormar i napon raste — prema našem tumačenju Energy Eater tu energiju pretvara u toplinu. Na E-stop oba sigurnosna kanala se otvore i sigurnosna ploča isključi napajanje robota.", "dopuna": "Redundancija sigurnosne ploče znači da kvar jednog kanala ne isključuje zaštitu, nego ga sustav otkrije usporedbom kanala."}, {"t": 2685, "dio": "1 Upoznavanje", "naslov": "Privjesak za učenje i nužno zaustavljanje", "str": "upoz", "radnje": [["meni", 83], ["cekaj", 10], ["meni", 84], ["cekaj", 8], ["meni", 85], ["cekaj", 6], ["tema"], ["cekaj", 6], ["klikT", "E-stop"], ["klikT", "Zaustavi"], ["cekaj", 14], ["klikT", "Ispočetka"], ["klikT", "Zaštitno zaustavljanje"], ["klikT", "Zaustavi"], ["cekaj", 14], ["klikT", "Ispočetka"], ["klikT", "Granični moment zgloba"], ["klikT", "Zaustavi"], ["cekaj", 14], ["tema"]], "klik": "Stavke Privjesak za učenje, Dodirni zaslon, Gljiva; animacija kategorija zaustavljanja: E-stop, Zaštitno zaustavljanje, Granični moment zgloba; Zaustavi / Ispočetka.", "tekst": "Privjesak za učenje ima dodirni zaslon od 12 inča s PolyScopeom, gljivu za nužno zaustavljanje i gumb za slobodno vođenje; kabel je dug 4,5 metra. Gljiva pokreće zaustavljanje kategorije 1: robot se kontrolirano zaustavi na putanji, a tek onda se isključi napajanje motora. Zaštitno zaustavljanje je kategorije 2 — robot stane, a pogoni ostaju pod napajanjem, pa se nastavlja odmah. Prekoračenje tvorničkog graničnog momenta zgloba izaziva kategoriju 0: napajanje se odmah isključi, robot staje najbrže, ali ne po putanji.", "dopuna": "Kategorija 1 pri E-stopu je kompromis: robot staje kontrolirano, po putanji, pa ne udara u okolinu, a tek zatim gubi napajanje. Pitanje: zašto se za E-stop ne koristi kategorija 2?"}, {"t": 2835, "dio": "1 Upoznavanje", "naslov": "Slobodno vođenje i 3PE", "str": "upoz", "radnje": [["meni", 86], ["cekaj", 6], ["tema"], ["cekaj", 5], ["klikT", "Freedrive"], ["cekaj", 6], ["klizac", "Shoulder", -60, 5], ["cekaj", 6], ["klikT", "Plane"], ["cekaj", 8], ["klikT", "Rotation"], ["cekaj", 8], ["klikT", "Bez kompenzacije"], ["cekaj", 12], ["tema"], ["meni", 87], ["cekaj", 6], ["tema"], ["cekaj", 4], ["klikT", "2 — lagano"], ["cekaj", 8], ["klikT", "3 — jako"], ["cekaj", 8], ["klikT", "1 — pusti"], ["cekaj", 6], ["tema"]], "klik": "Stavke Gumb Freedrive i 3PE; animacije: stanje Kočnice zatvorene / Freedrive / Bez kompenzacije, načini Free, Plane, Translation, Rotation; 3PE položaji 1–3.", "tekst": "Gumb Freedrive na stražnjoj strani privjeska uključuje slobodno vođenje: robot vodite rukom, a motori kompenziraju gravitaciju. Gibanje se može ograničiti: Free — svi zglobovi slobodni; Plane — vrh samo u vodoravnoj ravnini; Translation — orijentacija ostaje ista; Rotation — vrh miruje. „Bez kompenzacije” pokazuje što bi bilo kad motori ne bi držali težinu. Tri-položajni uređaj, 3PE, dopušta gibanje u ručnom načinu samo u srednjem položaju — pusti li ga čovjek ili ga u strahu stisne do kraja, robot staje. Brzina alata u ručnom načinu najviše je 250 milimetara u sekundi.", "dopuna": "Slobodno vođenje je najbrži način učenja točaka: alat rukom dovedete do predmeta i spremite točku. Pitanje: zašto je za to ključno da je nosivost točno upisana?"}, {"t": 3000, "dio": "1 Upoznavanje", "naslov": "Sigurnosne funkcije", "str": "upoz", "radnje": [["meni", 88], ["cekaj", 8], ["meni", 89], ["cekaj", 6], ["tema"], ["cekaj", 5], ["klikT", "Pokreni program"], ["cekaj", 12], ["klikT", "Čovjek u putanji"], ["cekaj", 16], ["klikT", "Poništi"], ["klikT", "Ručni (250 mm/s)"], ["cekaj", 12], ["tema"]], "klik": "Stavke Sigurnost i Sigurnosne funkcije; animacija: Pokreni program, Čovjek u putanji, način Automatski / Ručni, klizači brzine i udaljenosti čovjeka.", "tekst": "Sigurnost je ugrađena u upravljanje: 23 podesive sigurnosne funkcije, izvedene redundantno, razine PLd, kategorija 3. Nadziru položaj, brzinu, silu, količinu gibanja, snagu te vrijeme i put zaustavljanja. „Čovjek u putanji” prikazuje dodir: sila raste dok ne prijeđe granicu, a tada robot staje. Važno: ugrađena sigurnost ne zamjenjuje procjenu rizika cijele primjene — oštar alat ili težak teret opasni su i pri maloj sili.", "dopuna": "Kobot ne znači automatski siguran: sigurnim ga čini cijela primjena — alat, teret, brzina i prostor oko njega. Pitanje: koje biste sigurnosne funkcije postavili za robot koji radi uz montažni stol?"}, {"t": 3105, "dio": "1 Upoznavanje", "naslov": "Podaci o robotu i izvori", "str": "upoz", "radnje": [["meni", 91], ["cekaj", 6], ["skrol", "#podaci"], ["cekaj", 18], ["skrolY", 99999], ["cekaj", 14]], "klik": "Stavka „Podaci o robotu” — stranica se spusti na tablice podataka, DH parametre i mase članaka; na dnu popis izvora.", "tekst": "Na dnu stranice su tablice: osnovni podaci robota, zglobova, ormara i privjeska, DH parametri i mase članaka. Svaki podatak povezan je s izvorom — list podataka UR3e, priručnik PolyScopea, servisni priručnik, UR-ovi članci o DH parametrima i momentima zglobova. Gdje proizvođač nešto ne objavljuje, na stranici piše da je prikaz načelni. Time završavamo prvo poglavlje.", "dopuna": "Navika koju vrijedi steći: svaki podatak u tehničkom dokumentu ima izvor, a ondje gdje proizvođač šuti, to se jasno kaže."}, {"t": 3180, "dio": "2 Upravljanje", "naslov": "Raspored stranice Upravljanje robotom", "str": "upr", "radnje": [["str", "upr"], ["cekaj", 6], ["poravnaj"], ["cekaj", 4], ["lebdi", ".ur-izbornik .karta-h"], ["cekaj", 8], ["lebdi", "#privjesak"], ["cekaj", 8], ["lebdi", "#k-scena .karta-h h2"], ["cekaj", 8]], "klik": "Lijevo devet nizova, u sredini privjesak za učenje i uputa koraka, desno robot na stolu.", "tekst": "Drugo poglavlje: lijevo je devet nizova vježbi, u sredini privjesak za učenje nalik PolyScopeu, ispod njega uputa trenutnog koraka, a desno robot na stolu, s ormarom, kockom i odlagalištem. Svaki niz vodi korak po korak: kad korak izvedete ispravno, uputa sama prelazi na sljedeći. Privjesak i robot rade i bez niza — slobodno istražujte kartice.", "dopuna": "Privjesak je pojednostavljeni crtež, ali raspored kartica i redoslijed postupaka odgovaraju stvarnom PolyScopeu 5, pa se znanje izravno prenosi na pravi robot."}, {"t": 3240, "dio": "2 Upravljanje", "naslov": "Niz 1: Pokretanje — privjesak i zaslon za pokretanje", "str": "upr", "radnje": [["niz", "pokretanje"], ["cekaj", 6], ["klik", "#b-power"], ["dokorak", 1, 15], ["cekaj", 6], ["klik", ".ps-status"], ["dokorak", 2, 6], ["cekaj", 6], ["upisi", "[data-polje=\"payload\"]", "0.60", "Tab"], ["cekaj", 3], ["klik", "[data-akcija=\"payloadSet\"]"], ["dokorak", 3, 6], ["cekaj", 6]], "klik": "Niz „Pokretanje”: tipka za napajanje privjeska, gumb „Power off” lijevo dolje, polje Payload 0.60 i Set.", "tekst": "Prvi niz je pokretanje. Uključujem privjesak tipkom za napajanje; zajedno s njim pokreće se računalo u ormaru, ali robot je još bez napajanja. Gumb u donjoj traci pokazuje stanje robota: Power off, Idle ili Normal. Dodirom otvaram zaslon za pokretanje. Prvo provjeravam nosivost: na prirubnici je hvataljka od 0,60 kilograma. Upravljanje iz mase računa kompenzaciju gravitacije i procjenu sile — kriva nosivost znači da robot pri slobodnom vođenju „pada” ili „se diže”.", "dopuna": "Na stvarnom robotu ovo je prvi korak svakog dana. Pitanje: što bi se dogodilo pri slobodnom vođenju da upišete 0 kg, a na prirubnici je hvataljka od 0,6 kg?"}, {"t": 3330, "dio": "2 Upravljanje", "naslov": "Niz 1: Pokretanje — ON, START, Exit", "str": "upr", "radnje": [["klik", "[data-akcija=\"initON\"]"], ["dokorak", 4, 10], ["cekaj", 6], ["klik", "[data-akcija=\"initSTART\"]"], ["dokorak", 5, 10], ["cekaj", 10], ["klik", "[data-akcija=\"initExit\"]"], ["cekaj", 6]], "klik": "Gumbi ON (Idle), START (otpuštanje kočnica, trzaj zglobova u 3D prikazu), Exit.", "tekst": "Gumbom ON ormar daje napon motorima — robot je u stanju Idle, kočnice su još zakočene. START otpušta kočnice: gledajte zglobove — malo se trznu, jer se svaki zglob zakrene da se zatik izvuče iz krilca. To je ono što smo vidjeli u animaciji kočnice. Robot je u stanju Normal, spreman za rad. Zatvaram zaslon gumbom Exit.", "dopuna": "Tri stanja vrijedi zapamtiti: Power off, Idle i Normal. Pitanje: u kojem stanju robot drži položaj kočnicama, a u kojem motorima?"}, {"t": 3450, "dio": "2 Upravljanje", "naslov": "Niz 2: Ručno pomicanje po zglobovima", "str": "upr", "radnje": [["niz", "zglobovi"], ["cekaj", 6], ["klik", "[data-tab=\"Move\"]"], ["cekaj", 6], ["drzi", "zglob:0:1", 3, "korak"], ["cekaj", 6], ["drzi", "zglob:1:1", 2, "korak"], ["cekaj", 6], ["drzi", "zglob:5:1", 5, "korak"], ["cekaj", 6]], "klik": "Kartica Move; gumbi + i − uz svaki zglob (drže se), klizač Speed.", "tekst": "Kartica Move. Uz svaki zglob su gumbi plus i minus — robot se giba samo dok gumb držite. Okrećem Base na +45°, zatim rame na −60°: pazite na stol, dodir sa stolom izaziva zaštitno zaustavljanje. Pa Wrist 3 na +90° — on okreće prirubnicu s hvataljkom. Brzinu mijenjate klizačem Speed u donjoj traci.", "dopuna": "Gibanje samo dok se gumb drži je načelo „čovjek u petlji”: pustite li gumb, robot staje."}, {"t": 3540, "dio": "2 Upravljanje", "naslov": "Niz 2: Upis kuta i Home", "str": "upr", "radnje": [["upisi", "[data-polje=\"q2\"]", "60", "Enter"], ["cekaj", 12], ["drzi", "home", 14, "korak"], ["cekaj", 8]], "klik": "Polje kuta uz Elbow (upis 60 i Enter); gumb Home (drži se).", "tekst": "Kut se može i upisati: upisujem 60 uz Elbow i potvrđujem — robot sam zglobno ode u taj položaj. Gumbom Home vraćam robota u početni položaj spremljen u instalaciji; gumb se drži dok robot ne stane, da operater stalno ima kontrolu.", "dopuna": "Home nije nulti položaj: nulti je kad su svi kutovi nula, a Home je položaj koji sami odredite u instalaciji."}, {"t": 3630, "dio": "2 Upravljanje", "naslov": "Niz 3: Pomicanje alata u sustavu Base", "str": "upr", "radnje": [["niz", "alat"], ["cekaj", 6], ["klik", "[data-tab=\"Move\"]"], ["klik", "[data-akcija=\"feature\"][data-v=\"Base\"]"], ["cekaj", 6], ["drzi", "lin:2:1", 1.2, "korak"], ["cekaj", 6], ["drzi", "lin:1:-1", 1.2, "korak"], ["cekaj", 6], ["drzi", "rot:2:1", 2.6, "korak"], ["cekaj", 6]], "klik": "Kartica Move, koordinatni sustav Base; gumbi +Z, −Y i RZ.", "tekst": "Sad pomičemo alat, ne zglobove. U sustavu Base ishodište je u sredini podnožja, os z je os zgloba Base. Gumb +Z diže alat 50 milimetara — gledajte: giba se svih šest zglobova zajedno, jer upravljanje u svakom trenutku računa inverznu kinematiku. Zatim −Y za 40 milimetara, pa zakret oko osi z: vrh alata ostaje na mjestu, mijenja se samo orijentacija, odnosno rotacijski vektor rx, ry, rz.", "dopuna": "Pri gibanju alata ne birate kojim se zglobom giba — to radi inverzna kinematika. Pitanje: zašto se pri pravocrtnom pomaku alata gibaju svi zglobovi?"}, {"t": 3750, "dio": "2 Upravljanje", "naslov": "Niz 3: Sustav Tool", "str": "upr", "radnje": [["klik", "[data-akcija=\"feature\"][data-v=\"Tool\"]"], ["cekaj", 8], ["drzi", "lin:2:1", 0.9, "korak"], ["cekaj", 10]], "klik": "Koordinatni sustav Tool; gumb +Z (alat ide prema stolu).", "tekst": "Prebacujem na sustav Tool: osi su vezane uz alat, a os z alata ide iz prirubnice prema prstima hvataljke. Isti gumb +Z sada vozi alat prema dolje, jer je alat okrenut prema stolu. To je česta zabuna u praksi: uvijek provjerite koji je sustav odabran.", "dopuna": "Sustav Tool je praktičan za prilaz predmetu: „naprijed po osi alata” uvijek je prema predmetu, kako god je alat okrenut."}, {"t": 3840, "dio": "2 Upravljanje", "naslov": "Niz 4: Slobodno vođenje", "str": "upr", "radnje": [["niz", "freedrive"], ["cekaj", 6], ["klik", "#b-freedrive"], ["cekaj", 6], ["vuci", -130, -60], ["cekaj", 6], ["klik", "[data-akcija=\"fdNacin\"][data-v=\"Plane\"]"], ["cekaj", 6], ["vuci", 100, 40], ["cekaj", 6], ["klik", "[data-akcija=\"fdNacin\"][data-v=\"Rotation\"]"], ["vuci", 120, 0], ["cekaj", 6], ["klik", "#b-freedrive"], ["cekaj", 6]], "klik": "Gumb Freedrive na boku privjeska; povlačenje robota mišem za alat; načini Free, Plane, Rotation u kartici Move.", "tekst": "Uključujem Freedrive i vučem robota mišem za alat — na stvarnom robotu to radite rukom. U načinu Free giba se sve. U načinu Plane alat ide samo vodoravno, visina ostaje ista — korisno kad treba prijeći preko stola. U načinu Rotation vrh miruje, mijenja se samo orijentacija. Kad pustim Freedrive, robot ostaje u položaju; zglobovi ga drže motorima.", "dopuna": "U praksi se slobodno vođenje kombinira s finim pomakom gumbima: rukom grubo, gumbima precizno."}, {"t": 4020, "dio": "2 Upravljanje", "naslov": "Niz 5: Program — naredba Move i točke puta", "str": "upr", "radnje": [["niz", "program"], ["cekaj", 6], ["klik", "[data-tab=\"Program\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"dodaj\"][data-tip=\"move\"]"], ["cekaj", 6], ["klik", "[data-tab=\"Move\"]"], ["drzi", "zglob:0:1", 0.6, "vrijeme"], ["klik", "[data-tab=\"Program\"]"], ["cvor", "Waypoint_1"], ["cekaj", 3], ["klik", "[data-akcija=\"setWp\"]"], ["cekaj", 8]], "klik": "Kartica Program: gumb Move ispod stabla, čvor Waypoint_1, Set waypoint.", "tekst": "Peti niz je prvi program. Program je stablo naredbi. Dodajem naredbu Move — nastaje MoveJ s točkom puta Waypoint_1, crvenom dok nije postavljena. Robota pomaknem u željeni položaj, vratim se u Program, odaberem Waypoint_1 i dodirnem Set waypoint — točka sprema kutove svih šest zglobova i položaj alata.", "dopuna": "Točka puta pamti kutove zglobova, pa robot u nju dolazi uvijek istom konfiguracijom ruke. Pitanje: zašto je to važno kad postoji osam rješenja inverzne kinematike?"}, {"t": 4140, "dio": "2 Upravljanje", "naslov": "Niz 5: Druga točka i pokretanje programa", "str": "upr", "radnje": [["cvor", "MoveJ"], ["klik", "[data-akcija=\"dodajWp\"]"], ["cekaj", 4], ["klik", "[data-tab=\"Move\"]"], ["drzi", "zglob:0:-1", 1.4, "vrijeme"], ["klik", "[data-tab=\"Program\"]"], ["cvor", "Waypoint_2"], ["klik", "[data-akcija=\"setWp\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"play\"]"], ["simul", 25], ["cekaj", 4]], "klik": "Add waypoint, pomak robota, Set waypoint; gumb Play u donjoj traci; narančasta putanja u 3D prikazu.", "tekst": "Odabirem MoveJ i dodajem drugu točku, pomičem robota barem 100 milimetara dalje i postavljam Waypoint_2. Play pokreće program: robot najprije ide do prve točke, zatim do druge. Pokazivač u stablu pokazuje naredbu koja se izvodi, a u 3D prikazu ostaje narančasta putanja alata. Pause zaustavlja program uz zadržan položaj, Stop ga prekida.", "dopuna": "Prije pokretanja programa na stvarnom robotu smanjite brzinu klizačem Speed i držite ruku blizu gljive."}, {"t": 4260, "dio": "2 Upravljanje", "naslov": "Niz 6: MoveJ i MoveL", "str": "upr", "radnje": [["niz", "movel"], ["cekaj", 5], ["klik", "[data-akcija=\"play\"]"], ["simul", 25], ["cekaj", 3], ["cvor", "MoveJ"], ["klik", "[data-akcija=\"vrsta\"][data-v=\"MoveL\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"play\"]"], ["simul", 25], ["cekaj", 3], ["pogled", "odozgo"], ["cekaj", 14], ["klik", "#dalje"], ["pogled", "robot"], ["cekaj", 4]], "klik": "Play s MoveJ (narančasti luk), promjena u MoveL, Play (plavi pravac), pogled Odozgo, Dalje.", "tekst": "Pripremljen je program s MoveJ i dvjema točkama. MoveJ interpolira kutove zglobova: svi zglobovi krenu i stanu zajedno, a alat ide po luku. Mijenjam naredbu u MoveL — brzina se sada zadaje u milimetrima u sekundi alata — i pokrećem ponovno: alat ide po pravcu, plava putanja. Odozgo se razlika jasno vidi. MoveL je najkraći put za alat, ali zglobovi se gibaju složenije; MoveJ je najkraći u zglobovima, obično brži i dalje od singularnosti. Pravilo iz prakse: MoveJ za prijelaze kroz slobodan prostor, MoveL za prilaz predmetu i odmak od njega.", "dopuna": "Pitanje: kojom biste naredbom robot doveli iznad kocke, a kojom ga spustili na nju? Obrazložite."}, {"t": 4440, "dio": "2 Upravljanje", "naslov": "Niz 7: Hvataljka i alatni izlaz", "str": "upr", "radnje": [["niz", "uzmi"], ["cekaj", 5], ["klik", "[data-tab=\"I/O\"]"], ["cekaj", 4], ["klik", "[data-akcija=\"do\"][data-v=\"0\"]"], ["cekaj", 8], ["klik", "[data-akcija=\"do\"][data-v=\"0\"]"], ["cekaj", 8]], "klik": "Kartica I/O: alatni izlaz DO0 (On zatvara, Off otvara hvataljku); ulazi DI0 i DI1.", "tekst": "Sedmi niz: uzmi i ostavi. Hvataljka je spojena na alatni priključak: izlaz DO0 uključen zatvara prste, isključen ih otvara — to je naša pretpostavka o spoju. Ulaz DI1 javlja da je hvataljka otvorena, a DI0 da drži predmet.", "dopuna": "Stanje hvataljke vidi se na ulazima: program može provjeriti je li predmet uhvaćen prije nego što krene dalje."}, {"t": 4500, "dio": "2 Upravljanje", "naslov": "Niz 7: Naredbe Set i Wait, pokretanje", "str": "upr", "radnje": [["klik", "[data-tab=\"Program\"]"], ["cvor", "Waypoint_2"], ["klik", "[data-akcija=\"dodaj\"][data-tip=\"set\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"dodaj\"][data-tip=\"wait\"]"], ["cekaj", 6], ["cvor", "Waypoint_5"], ["klik", "[data-akcija=\"dodaj\"][data-tip=\"set\"]"], ["klik", "[data-akcija=\"setVal\"][data-v=\"Off\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"play\"]"], ["simul", 40], ["cekaj", 4]], "klik": "Kartica Program: iza Waypoint_2 naredbe Set (Tool DO0 = On) i Wait; iza Waypoint_5 Set (DO0 = Off); Play.", "tekst": "U pripremljeni program iza točke kod kocke dodajem naredbu Set — Tool DO0 uključeno — i iza nje Wait od pola sekunde, da se prsti stignu zatvoriti. Bez čekanja robot bi krenuo gore prije nego što stisne kocku. Iza točke kod odlagališta dodajem Set DO0 isključeno. Pokrećem: robot ide do kocke, hvata je, nosi i ostavlja na zelenom odlagalištu. Ako ne uspije, „Vrati kocku” vraća je na mjesto.", "dopuna": "Umjesto fiksnog čekanja bolje je čekati ulaz „predmet uhvaćen” — program je tada i brži i sigurniji. Pitanje: kako biste to napisali naredbom Wait?"}, {"t": 4650, "dio": "2 Upravljanje", "naslov": "Niz 8: Sigurnosne granice i ravnina", "str": "upr", "radnje": [["niz", "sigurnost"], ["cekaj", 5], ["klik", "[data-tab=\"Installation\"]"], ["klik", "[data-akcija=\"instSub\"][data-v=\"limits\"]"], ["cekaj", 5], ["upisi", "[data-polje=\"sigSila\"]", "100", "Tab"], ["upisi", "[data-polje=\"sigBrz\"]", "500", "Tab"], ["klik", "[data-akcija=\"apply\"]"], ["cekaj", 6], ["klik", "[data-akcija=\"instSub\"][data-v=\"planes\"]"], ["kvacica", "[data-polje=\"ravAkt\"]"], ["upisi", "[data-polje=\"ravH\"]", "100", "Tab"], ["klik", "[data-akcija=\"apply\"]"], ["cekaj", 6], ["klik", "[data-tab=\"Move\"]"], ["drzi", "lin:2:-1", 5, "korak"], ["cekaj", 6], ["klik", "[data-akcija=\"enable\"]"], ["cekaj", 4]], "klik": "Installation › Safety › Robot Limits (sila 100 N, brzina 500 mm/s, Apply); Planes (ravnina 100 mm); Move −Z do zaustavljanja; Enable robot.", "tekst": "Osmi niz je sigurnost. U instalaciji, u Robot Limits, postavljam granicu sile 100 njutna i brzine alata 500 milimetara u sekundi. Na stvarnom robotu te postavke štiti lozinka, a svaka promjena mijenja kontrolni zbroj. Zatim uključujem sigurnosnu ravninu 100 milimetara iznad stola. Spuštam alat: kad dotakne ravninu, slijedi zaštitno zaustavljanje — kategorija 2, pa nakon potvrde Enable robot rad odmah nastavljamo.", "dopuna": "Sigurnosna ravnina štiti stol i ruke operatera ispod radne visine. Pitanje: što je razlika između sigurnosne granice i ograničenja u programu?"}, {"t": 4770, "dio": "2 Upravljanje", "naslov": "Niz 8: Granica sile, E-stop i 3PE", "str": "upr", "radnje": [["drzi", "lin:1:1", 7, "korak"], ["cekaj", 5], ["klik", "[data-akcija=\"enable\"]"], ["drzi", "lin:1:-1", 0.4, "vrijeme"], ["cekaj", 4], ["klik", "#gljiva"], ["cekaj", 8], ["klik", "#gljiva"], ["klik", "[data-akcija=\"estopOk\"]"], ["klik", "[data-akcija=\"initON\"]"], ["cekaj", 4], ["klik", "[data-akcija=\"initSTART\"]"], ["cekaj", 5], ["klik", "[data-akcija=\"initExit\"]"], ["cekaj", 2], ["klik", "[data-tab=\"Installation\"]"], ["klik", "[data-akcija=\"instSub\"][data-v=\"hardware\"]"], ["kvacica", "[data-polje=\"tri\"]"], ["klik", "[data-akcija=\"apply\"]"], ["cekaj", 2], ["klik", "[data-tab=\"Move\"]"], ["klik", "#b-3pe"], ["drzi", "lin:2:1", 0.3, "vrijeme"], ["cekaj", 2], ["klik", "#b-3pe"], ["cekaj", 2], ["klik", "#b-3pe"], ["cekaj", 2], ["klik", "[data-akcija=\"nacin\"]"], ["cekaj", 3]], "klik": "Move +Y prema prepreci (granica sile), Enable, odmak; gljiva E-stop, otpuštanje i ponovno pokretanje (ON, START); Installation › Hardware: 3PE; gumb 3PE na boku privjeska (lagano, jako, pusti); gumb načina rada Automatic.", "tekst": "Vozim alat vodoravno prema crvenoj prepreci: procjena sile raste i pri 100 njutna robot staje. Potvrđujem i odmičem alat. Sad gljiva za nužno zaustavljanje: kategorija 1 — robot je bez napajanja i kočnice su zakočene, pa ga treba ponovno uključiti i otpustiti kočnice. Na kraju prebacujem način rada u Automatic: u ručnom načinu alat ne smije brže od 250 milimetara u sekundi i treba držati 3PE, a u automatskom vrijede granice iz instalacije.", "dopuna": "Pitanje: nakon kojeg od triju zaustavljanja koje smo vidjeli treba ponovno uključiti robota, a nakon kojeg se samo potvrdi?"}, {"t": 4890, "dio": "2 Upravljanje", "naslov": "Niz 9: Kinematika — provjera DH tablicom", "str": "upr", "radnje": [["niz", "kinematika"], ["cekaj", 5], ["klik", "[data-tab=\"Move\"]"], ["upisi", "[data-polje=\"q0\"]", "30", "Enter"], ["cekaj", 3], ["upisi", "[data-polje=\"q1\"]", "-70", "Enter"], ["cekaj", 3], ["upisi", "[data-polje=\"q2\"]", "80", "Enter"], ["cekaj", 3], ["upisi", "[data-polje=\"q3\"]", "-100", "Enter"], ["cekaj", 3], ["upisi", "[data-polje=\"q4\"]", "-90", "Enter"], ["cekaj", 3], ["upisi", "[data-polje=\"q5\"]", "0", "Enter"], ["dokorak", 1, 10], ["cekaj", 4], ["skrol", "#k-kin"], ["cekaj", 6], ["dh"], ["cekaj", 3], ["klik", "#dh-provjeri"], ["cekaj", 10], ["poravnaj"], ["cekaj", 4]], "klik": "Upis kutova 30, −70, 80, −100, −90, 0 u kartici Move; tablica DH ispod upute: polja X, Y, Z i gumb Provjeri.", "tekst": "Zadnji niz povezuje teoriju i robot. Postavljam zglobove na 30, −70, 80, −100, −90 i 0 stupnjeva. Položaj alata je skriven dok ga ne izračunate. Iz DH tablice množite šest matrica — ili koristite zatvoreni oblik za UR koji je napisan u pomoći — i upisujete X, Y i Z prirubnice; dopušteno odstupanje je jedan milimetar. Provjera prolazi. Primijetite: privjesak pokazuje TCP, koji je 100 milimetara dalje duž osi z alata, pa se Z razlikuje kad alat nije okomit. To je zadatak za samostalni rad.", "dopuna": "Zadatak za doma: izračunajte X, Y i Z prirubnice za zadane kutove ručno ili u Excelu, pa provjerite u nizu 9."}, {"t": 5040, "dio": "3 Proširena stvarnost", "naslov": "Robot u proširenoj stvarnosti — 3D prikaz i klizači", "str": "ar", "radnje": [["str", "ar"], ["cekaj", 6], ["skrol", ".karta"], ["cekaj", 4], ["raspon", "#os1", 60, 4], ["raspon", "#os2", -60, 4], ["raspon", "#os3", 90, 4], ["cekaj", 4], ["klik", "#pocetni"], ["cekaj", 6], ["klik", "#gibanje"], ["cekaj", 22], ["klik", "#gibanje"], ["klik", "#doseg"], ["cekaj", 14], ["klik", "#doseg"], ["cekaj", 3]], "klik": "Stranica AR: 3D prikaz, klizači šest zglobova, gumbi Početni položaj, Pokaži gibanje, Doseg.", "tekst": "Treće poglavlje: isti robot kao samostalna stranica za proširenu stvarnost. Klizačima pomičete svaki zglob, gumb „Pokaži gibanje” vrti programirani ciklus, a „Doseg” prikazuje radni prostor od 500 milimetara — korisno kad planirate gdje robot stoji u stanici.", "dopuna": "Proširena stvarnost korisna je prije kupnje ili postavljanja robota: vidi se stane li robot u prostor i doseže li sve točke."}, {"t": 5145, "dio": "3 Proširena stvarnost", "naslov": "Na mobitelu: robot u stvarnoj veličini", "str": "ar", "radnje": [["skrol", "#ar"], ["cekaj", 6], ["lebdi", "#qr"], ["cekaj", 30], ["skrol", ".karta"], ["cekaj", 4]], "klik": "Kartica „Robot u tvom prostoru”: QR kod i upute (Android: WebXR, iPhone: Quick Look).", "tekst": "Skenirajte QR kod mobitelom. Na Androidu, u Chromeu, dodirnete „Postavi robota i pomiči osi”, usmjerite kameru prema podu ili stolu i dodirnete krug — robot stoji u stvarnoj veličini, možete ga obilaziti, a klizačima na dnu zaslona pomičete osi. Na iPhoneu se otvara Quick Look. Ako umjesto gumba vidite samo QR kod, u Chromeu isključite „Web-mjesto za računala”.", "dopuna": "Zadatak: postavite robota na svoj radni stol i provjerite doseže li sve kutove stola."}, {"t": 5265, "dio": "Kraj", "naslov": "Sažetak i zadatak", "str": "index", "radnje": [["str", "index"], ["cekaj", 4], ["skrol", "#goals"], ["cekaj", 20], ["skrol", ".moduli"], ["cekaj", 10]], "klik": "Povratak na naslovnicu; ishodi „Moći ću”.", "tekst": "Sažmimo. Kobot UR3e ima šest zglobova iste građe: motor bez četkica, valni prijenosnik omjera oko 100 bez zračnosti, kočnicu sa zatikom i tarnom spojkom, dva enkodera i elektroniku. Na prirubnici je senzor sile, u ormaru upravljanje s 500 Hz i sigurnosna ploča s dva kanala, a programira se privjeskom. Za samostalni rad: prođite svih devet nizova do kraja i riješite zadatak s DH tablicom. Hvala na pažnji — u sljedećem bloku radimo uvod u Industriju 4.0 na platformi Festo LX.", "dopuna": "Provjerimo ishode: svatko neka u jednoj rečenici objasni zašto zglob ima dva enkodera."}]; window.KRAJ = 5400;</script>
<script>
(function () {
'use strict';
const S = window.SCENARIJ, KRAJ = window.KRAJ;
const q = new URLSearchParams(location.search);
const BRZ = Math.max(0.1, parseFloat(q.get('brzina') || '1'));
const KANAL = 'ftq-predavanje-ur3e';
const STR = { index: 'index.html', upoz: 'upoznavanje-robota.html', upr: 'upravljanje-robotom.html', ar: '../ar/ur3e/index.html' };
const mmss = (s) => { s = Math.max(0, Math.floor(s)); return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0'); };
const esc = (x) => String(x).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function korakU(t) { let i = 0; for (let j = 0; j < S.length; j++) if (S[j].t <= t) i = j; return i; }
let bc = null; try { bc = new BroadcastChannel(KANAL); } catch (e) { bc = null; }

/* =================================================================== čitač */
if (q.has('citac')) {
  document.body.className = 'citac';
  document.body.insertAdjacentHTML('beforeend',
    '<div class="c-vrh"><span class="znak">FORTRONI<b>Q</b></span><span class="vr" id="c-vr">00:00</span><span class="st" id="c-st">čekam režisera…</span>' +
    '<div class="desno"><button id="c-prije" title="Prethodni korak">⏮</button><button id="c-igraj" title="Pokreni / pauza (razmaknica)">▶ / ⏸</button><button id="c-dalje" title="Sljedeći korak">⏭</button>' +
    '<button id="c-m5">−5 s</button><button id="c-p5">+5 s</button><button id="c-manje">A−</button><button id="c-vece">A+</button><button id="c-tema">◐</button></div></div><div class="c-popis" id="c-popis"></div>');
  const popis = document.getElementById('c-popis');
  popis.innerHTML = S.map((k, i) => '<article class="c-k" id="k' + i + '"><div class="gl"><span class="t">' + mmss(k.t) + '</span><span class="dio">' + esc(k.dio) + '</span><h2>' + esc(k.naslov) + '</h2></div>' +
    '<p class="klik">' + esc(k.klik) + '</p><p class="tekst">' + esc(k.tekst) + '</p>' + (k.dopuna ? '<p class="dop"><b>Dopuna / pitanje: </b>' + esc(k.dopuna) + '</p>' : '') + '<div class="napr"><i></i></div></article>').join('');
  let vel = 1.45; try { vel = parseFloat(localStorage.getItem('ftq-citac-vel')) || 1.45; } catch (e) { /* ništa */ }
  const vPost = () => { document.documentElement.style.setProperty('--vel', vel + 'rem'); try { localStorage.setItem('ftq-citac-vel', String(vel)); } catch (e) { /* ništa */ } };
  vPost();
  document.getElementById('c-manje').onclick = () => { vel = Math.max(0.9, vel - 0.1); vPost(); };
  document.getElementById('c-vece').onclick = () => { vel = Math.min(3, vel + 0.1); vPost(); };
  document.getElementById('c-tema').onclick = () => { const r = document.documentElement; r.dataset.theme = r.dataset.theme === 'dark' ? 'light' : 'dark'; };
  /* vlastiti sat (za puštanje snimljenog videa) ili sat režisera */
  let zadnjePoruka = 0, sat = 0, igra = false, t0 = 0, zadnjiI = -1;
  const vlastiti = () => performance.now() - zadnjePoruka > 2000;
  function sad() { return vlastiti() ? (igra ? sat + (performance.now() - t0) / 1000 * BRZ : sat) : sat; }
  function postavi(s) { sat = Math.max(0, Math.min(KRAJ, s)); t0 = performance.now(); }
  function cmd(c, a) { if (!vlastiti() && bc) { bc.postMessage({ cmd: c, a }); return; }
    const s = sad();
    if (c === 'igraj') { if (igra) { sat = s; igra = false; } else { t0 = performance.now(); igra = true; } }
    if (c === 'dalje') { const i = korakU(s); postavi(i + 1 < S.length ? S[i + 1].t : KRAJ); }
    if (c === 'prije') { const i = korakU(s); postavi(s - S[i].t > 3 || i === 0 ? S[i].t : S[i - 1].t); }
    if (c === 'pomak') postavi(s + a);
  }
  document.getElementById('c-igraj').onclick = () => cmd('igraj');
  document.getElementById('c-dalje').onclick = () => cmd('dalje');
  document.getElementById('c-prije').onclick = () => cmd('prije');
  document.getElementById('c-m5').onclick = () => cmd('pomak', -5);
  document.getElementById('c-p5').onclick = () => cmd('pomak', 5);
  addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); cmd('igraj'); } else if (e.key === 'ArrowRight') cmd('dalje'); else if (e.key === 'ArrowLeft') cmd('prije'); });
  if (bc) bc.onmessage = (e) => { const d = e.data || {}; if (typeof d.sat === 'number') { zadnjePoruka = performance.now(); sat = d.sat; igra = !!d.igra; } };
  function crtaj() {
    const s = sad(), i = korakU(s), sl = i + 1 < S.length ? S[i + 1].t : KRAJ;
    document.getElementById('c-vr').textContent = mmss(s) + ' / ' + mmss(KRAJ);
    document.getElementById('c-st').textContent = (vlastiti() ? 'vlastiti sat (uz video) — ' : 'povezano s režiserom — ') + (igra ? 'teče' : 'pauza') + ' · sljedeće za ' + mmss(sl - s);
    if (i !== zadnjiI) {
      document.querySelectorAll('.c-k').forEach((el, j) => { el.classList.toggle('sada', j === i); el.classList.toggle('gotov', j < i); });
      const el = document.getElementById('k' + i); if (el) el.scrollIntoView({ behavior: zadnjiI < 0 ? 'auto' : 'smooth', block: 'start' });
      zadnjiI = i;
    }
    const b = document.querySelector('#k' + i + ' .napr i'); if (b) b.style.width = Math.min(100, (s - S[i].t) / (sl - S[i].t) * 100) + '%';
    requestAnimationFrame(crtaj);
  }
  requestAnimationFrame(crtaj);
  return;
}

/* =================================================================== režiser (autopilot) */
document.body.className = 'reziser';
document.body.insertAdjacentHTML('beforeend',
  '<iframe id="okvir" title="Sadržaj predavanja" src="index.html"></iframe>' +
