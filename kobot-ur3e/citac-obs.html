<!doctype html>
<html lang="hr">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Čitač i OBS — Kobot UR3e</title>
<style>
/* Čitač za drugi zaslon s upravljanjem OBS-om (obs-websocket v5). Otvara se kao lokalna datoteka u Chromeu. */
:root{--paper:#FFFFFF;--ink:#10394A;--body:#55717F;--rule:#D7E1E6;--teal:#17656E;--cyan:#2ECAD4;--bar:#132026;--bar-ink:#E7EEF1;--warn:#B54708;--ok:#1C7C54;--font:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;--mono:"IBM Plex Mono",Consolas,ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#4FD3DB;--bar:#081014;--warn:#F79009;--ok:#3CCB7F;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--font)}
.vrh{position:sticky;top:0;z-index:5;background:var(--bar);color:var(--bar-ink);padding:10px 16px}
.red{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.znak b{color:var(--cyan)}
.vr{font:700 1.5rem/1 var(--mono);font-variant-numeric:tabular-nums}
.st{font-size:.85rem;opacity:.8}
.desno{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.vrh button,.vrh select,.vrh input{font:inherit;font-size:.88rem;background:transparent;color:var(--bar-ink);border:1px solid rgba(231,238,241,.35);border-radius:8px;padding:5px 10px}
.vrh button{cursor:pointer}
.vrh button:hover,.vrh button:focus-visible{border-color:var(--cyan);color:var(--cyan);outline:none}
.vrh button.akt{background:var(--cyan);color:#06262B;border-color:var(--cyan)}
.vrh button.rec{border-color:#F04438;color:#FDA29B}.vrh button.rec.akt{background:#F04438;color:#fff}
.vrh select option{color:#10394A}
.obs{margin-top:8px;border-top:1px solid rgba(231,238,241,.18);padding-top:8px}
.obs summary{cursor:pointer;font-size:.88rem;opacity:.9}
.obs .red{margin-top:8px}
.oznaka{font-size:.78rem;opacity:.7}
.lamp{display:inline-block;width:10px;height:10px;border-radius:50%;background:#667085;margin-right:6px;vertical-align:middle}
.lamp.ok{background:#3CCB7F}.lamp.greska{background:#F04438}
#poruka{font-size:.82rem;opacity:.85;min-height:1.2em}
.kadrovi{display:flex;flex-wrap:wrap;gap:6px}
.popis{max-width:1100px;margin:0 auto;padding:14px 16px 60vh}
.k{scroll-margin-top:calc(var(--vrh,120px) + 12px);border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.k.gotov{opacity:.35}
.gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.t{font:700 1rem var(--mono);color:var(--teal);font-variant-numeric:tabular-nums}
.dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.k h2{margin:0;font-size:1.25rem}
.plan{display:flex;flex-wrap:wrap;gap:6px;margin:.5rem 0 0}
.plan span{font:500 .78rem var(--mono);border:1px solid var(--rule);border-radius:6px;padding:2px 7px;color:var(--body)}
.plan span.sad{border-color:var(--teal);color:var(--teal)}
.klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;max-width:70ch}
.dop{font-size:calc(var(--vel,1.45rem)*.82);line-height:1.5;margin:.7rem 0 0;color:var(--body);max-width:70ch}
.dop b{color:var(--ink)}
.napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.napr i{display:block;height:100%;width:0;background:var(--teal)}
/* uređivač kadrova */
#urednik{position:fixed;inset:0;z-index:20;background:rgba(5,14,18,.88);display:none;align-items:center;justify-content:center;padding:16px}
#urednik.otv{display:flex}
.ur-okvir{background:var(--paper);color:var(--ink);border-radius:14px;padding:16px;max-width:1300px;width:100%;max-height:100%;overflow:auto}
.ur-okvir h3{margin:0 0 6px}
.ur-okvir p{margin:.2rem 0 .6rem;color:var(--body);font-size:.9rem}
.ur-okvir button{font:inherit;font-size:.9rem;border:1px solid var(--rule);background:transparent;color:var(--ink);border-radius:8px;padding:6px 12px;cursor:pointer}
.ur-okvir button.akt{background:var(--teal);color:#fff;border-color:var(--teal)}
#platno{display:block;width:auto;max-width:100%;max-height:62vh;height:auto;margin:10px 0;border-radius:8px;cursor:crosshair;background:#000;touch-action:none}
@media (max-width:680px){.tekst{font-size:1.15rem}.vr{font-size:1.2rem}.vrh{position:static}}
@media (prefers-reduced-motion:reduce){.k{transition:none}}
</style>
</head>
<body>
<div class="vrh">
 <div class="red"><span class="znak">FORTRONI<b>Q</b></span><span class="vr" id="vr">00:00 / 90:00</span><span class="st" id="st">pauza</span>
  <div class="desno"><button id="b-prije" title="Prethodni korak (←)">⏮</button><button id="b-igraj" title="Pokreni ili pauziraj (razmaknica)">▶ Pokreni</button><button id="b-dalje" title="Sljedeći korak (→)">⏭</button><button id="b-m5">−5 s</button><button id="b-p5">+5 s</button><button id="b-manje" title="Manje pismo">A−</button><button id="b-vece" title="Veće pismo">A+</button><button id="b-tema" title="Svijetlo ili tamno">◐</button></div></div>
 <div class="red" style="margin-top:8px"><span class="oznaka">Kadar:</span><div class="kadrovi" id="kadrovi"></div>
  <label class="oznaka"><input type="checkbox" id="c-auto" checked> automatski</label>

 <details class="obs" id="obs-ploca" open><summary><span class="lamp" id="lamp"></span><span id="obs-st">OBS nije spojen</span></summary>
  <div class="red"><input id="i-url" size="20" value="ws://127.0.0.1:4455" aria-label="Adresa OBS WebSocket poslužitelja"><input id="i-loz" type="password" size="16" placeholder="lozinka iz OBS-a" aria-label="Lozinka"><label class="oznaka"><input type="checkbox" id="c-pamti"> zapamti</label><button id="b-spoji">Spoji</button>
   <span class="oznaka">Snimani zaslon:</span><select id="s-izvor"><option value="">— spoji se —</option></select><button id="b-novi" title="Napravi novi izvor snimanja zaslona">+ izvor</button>
   <span class="oznaka">Kamera:</span><select id="s-kam"><option value="">bez kamere</option></select></div>
  <div class="red"><button id="b-pripremi">Pripremi scene u OBS-u</button><button id="b-uredi">Namjesti kadrove</button>
   <label class="oznaka"><input type="checkbox" id="c-natpis" checked> natpis koraka na snimci</label>
   <label class="oznaka"><input type="checkbox" id="c-cekaj"> čekaj ⏭ na kraju koraka</label>
   <label class="oznaka"><input type="checkbox" id="c-pauzarec"> pauza sata pauzira snimanje</label>
   <div class="desno"><button id="b-pogl" title="Preuzmi poglavlja za YouTube iz stvarnih vremena snimke">Poglavlja (.txt)</button><button id="b-srt" title="Preuzmi naslove koraka kao titlove">Naslovi (.srt)</button></div></div>
  <div id="poruka" role="status"></div>
 </details>
</div>
<main class="popis" id="popis"></main>
<div id="urednik" role="dialog" aria-modal="true" aria-labelledby="ur-n"><div class="ur-okvir">
 <h3 id="ur-n">Namjesti kadrove</h3>
 <p>Odaberi kadar, pa na snimci povuci pravokutnik (omjer je zaključan na omjer snimke). Snimka je trenutni prikaz izvora iz OBS-a — prije toga na snimanom zaslonu otvori autopilot.</p>
 <div class="kadrovi" id="ur-kadrovi"></div>
 <canvas id="platno" width="1280" height="720"></canvas>
 <div class="kadrovi"><button id="ur-osvjezi">Nova snimka</button><button id="ur-zadano">Zadano za odabrani</button><button id="ur-spremi" class="akt">Spremi i primijeni</button><button id="ur-zatvori">Zatvori</button></div>
</div></div>
<script>
(function(){
'use strict';
const S=[{"t": 0, "dio": "Uvod", "naslov": "Dobrodošlica i cilj predavanja", "klik": "Naslovnica područja Kobot UR3e: naslov, opis i ilustracija.", "tekst": "Dobar dan. Danas upoznajemo suradnički robot, kobot, Universal Robots UR3e — najmanji robot serije e-Series. Proći ćemo ga od vanjštine do najsitnijeg dijela: šest zglobova, svaki s motorom, valnim prijenosnikom, kočnicom, dva enkodera i elektronikom; zatim senzor sile na prirubnici, upravljački ormar i privjesak za učenje. Nakon toga robot ćemo pokrenuti, pomicati i programirati, a na kraju ga staviti u prostor u proširenoj stvarnosti. Sve što ćete vidjeti radi u običnom pregledniku, pa sve možete ponoviti sami, kod kuće ili na mobitelu.", "dopuna": "Kobot je robot projektiran za rad u istom prostoru s čovjekom, bez zaštitne ograde — ali uz procjenu rizika. Pitanje za vas: gdje ste već vidjeli robota bez ograde i što ga razlikuje od klasičnog industrijskog robota?", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Kobot UR3e", "Građa, pogoni i upravljanje suradničkog robota"]}, {"t": 90, "dio": "Uvod", "naslov": "Što ćemo moći nakon predavanja", "klik": "Blok „Moći ću” — pet ishoda (pokazivač prelazi preko svakoga).", "tekst": "Na vrhu stranice je pet ishoda. Nakon današnjeg sata trebali biste znati nabrojati dijelove kobota i pokazati ih na robotu; objasniti građu zgloba — motor, valni prijenosnik, kočnicu, enkodere i elektroniku; opisati upravljački ormar, privjesak za učenje i sigurnosne funkcije; izračunati položaj alata iz kutova zglobova pomoću DH parametara; i na kraju programirati jednostavan zadatak točkama puta i pokrenuti ga u simulatoru i u proširenoj stvarnosti. Te ćemo ishode na kraju sata provjeriti.", "dopuna": "Ishodi su napisani glagolima koje možemo provjeriti: nabrojati, objasniti, opisati, izračunati, programirati. Zapišite ih — na kraju sata svaki ćemo označiti.", "kadrovi": [[0, "cijeli"]]}, {"t": 180, "dio": "Uvod", "naslov": "Tri poglavlja", "klik": "Popis poglavlja: 1 Upoznavanje robota, 2 Upravljanje robotom, 3 Robot u proširenoj stvarnosti; klik na „Otvori” uz prvo.", "tekst": "Sadržaj ima tri poglavlja. Prvo, Upoznavanje robota, robot je dio po dio, s animacijama „Kako radi” koje pokazuju načelo rada svakog sklopa. Drugo, Upravljanje robotom, ima privjesak za učenje nalik pravom PolyScopeu i devet nizova vježbi — od uključivanja do programa i sigurnosti. Treće je robot u proširenoj stvarnosti: na mobitelu ga postavite na stol ili pod u stvarnoj veličini. Krećemo s prvim poglavljem.", "dopuna": "Sadržaj je otvoren: ništa ne treba instalirati, radi u pregledniku na računalu i mobitelu, a napredak se pamti u pregledniku. Predlažem da ga nakon sata prođete sami, istim redom.", "kadrovi": [[0, "cijeli"]]}, {"t": 240, "dio": "1 Upoznavanje", "naslov": "Raspored stranice", "klik": "Stranica Upoznavanje robota: lijevo izbornik dijelova (91 stavka), u sredini 3D prikaz, desno objašnjenje.", "tekst": "Stranica je složena kao radni prikaz u tri stupca. Lijevo je izbornik s 91 dijelom robota — stavke sa strelicom otvaraju podizbornik, a uz svaku pregledanu stavku pojavi se kvačica. U sredini je trodimenzionalni model, a desno objašnjenje odabranog dijela. Kad kliknete dio u izborniku, model se sam okrene prema njemu i istakne ga. Gornji brojač pokazuje koliko je stavki pregledano.", "dopuna": "Kvačice uz pregledane stavke služe kao vaš popis: cilj je da do sljedećeg sata svih 91 stavki ima kvačicu.", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 1: Upoznavanje robota", "Zglobovi, pogoni, senzori, upravljački ormar i privjesak"]}, {"t": 315, "dio": "1 Upoznavanje", "naslov": "Pogledi i rukovanje 3D prikazom", "klik": "Gumbi pogleda Sve, Sprijeda, Bok, Odozgo, Robot; okretanje mišem; prelazak mišem preko modela pokazuje naziv dijela.", "tekst": "Gumbima iznad prikaza mijenjate pogled: Sve — robot, ormar i privjesak; Sprijeda, Bok i Odozgo; Robot — samo ruka. Mišem povucite za okretanje, kotačićem zumirate, a desnom tipkom pomičete prikaz. Kad mišem prijeđete preko modela, pojavi se naziv dijela, a klikom ga odaberete. Na mobitelu sve isto radi prstima.", "dopuna": "Model je građen iz DH parametara proizvođača, pa su razmaci osi točni; vanjski oblici i unutrašnjost su naša procjena. Pitanje: koji pogled biste odabrali da pokažete doseg robota iznad stola?", "kadrovi": [[0, "cijeli"]]}, {"t": 420, "dio": "1 Upoznavanje", "naslov": "Cijeli robot i položaji", "klik": "Stavka „Cijeli robot”; gumbi Položaj: Ispružen, Sklopljen, Nulti (q = 0), Početni položaj.", "tekst": "UR3e je najmanji robot serije e-Series: masa s kabelom 11,2 kilograma, nosivost 3 kilograma, doseg 500 milimetara, ponovljivost ±0,03 milimetra prema ISO 9283 i najveća brzina alata 3 metra u sekundi. Zaštita je IP54. Šest zglobova iste je koncepcije, u tri veličine, a povezuju ih aluminijske cijevi. Gumbima Položaj vidite robot ispružen, sklopljen i u nultom položaju — sve kutove nula, kada je ruka vodoravno ispružena. Početni položaj je uspravan robot.", "dopuna": "Ponovljivost ±0,03 mm nije isto što i točnost — robot se vraća u istu točku vrlo precizno, ali apsolutni položaj u prostoru može odstupati više. Pitanje: zašto je za većinu zadataka ponovljivost važnija od apsolutne točnosti?", "kadrovi": [[0, "cijeli"]]}, {"t": 540, "dio": "1 Upoznavanje", "naslov": "Pomicanje zglobova, osi i DH okviri", "klik": "Izbornik Zglob, gumbi „Pomakni zglob” i „Svi zglobovi redom”, „Stani”; kvačice „osi zglobova” i „DH okviri”.", "tekst": "Odaberite zglob i kliknite „Pomakni zglob” — robot zakrene samo taj zglob. „Svi zglobovi redom” pokrene šest zglobova jedan za drugim, od Basea do Wrista 3, pa se lijepo vidi koji dio ruke pokreće koji zglob. Kvačica „osi zglobova” crta osi vrtnje, a „DH okviri” koordinatne okvire po Denavitu i Hartenbergu — crvena os x, zelena y, plava z. Os z svakog okvira je os vrtnje sljedećeg zgloba. Ispod modela je stalno ispisano šest kutova i položaj alata u milimetrima.", "dopuna": "Primijetite redoslijed: Base, Shoulder i Elbow određuju gdje je zapešće, a tri zgloba zapešća kako je okrenut alat. Pitanje: koji zglob najviše mijenja visinu alata kad je ruka ispružena?", "kadrovi": [[0, "cijeli"]]}, {"t": 690, "dio": "1 Upoznavanje", "naslov": "Kako radi: DH okviri i izravna kinematika", "klik": "Animacija na pozornici; desno klizači šest kutova, gumbi Nulti i Početni, okret pogleda; ispod očitanje TCP-a i DH tablica.", "tekst": "Gumb „Kako radi” otvara animaciju na mjestu 3D prikaza, a desno su klizači. Pomičem rame, lakat i bazu i pratim okvire. Položaj prirubnice računa se izravnom kinematikom: umnožak šest matrica, svaka s četiri DH parametra — kut θ, pomak d, duljina a i zakret α. Za UR3e proizvođač objavljuje d1 151,85 milimetara, a2 minus 243,55, a3 minus 213,2, d4 131,05, d5 85,35 i d6 92,1 milimetara. U nultom položaju robot je vodoravno ispružen: x je −456,75, y −223,15, z 66,5 milimetara. Taj ćemo izračun ponoviti u drugom poglavlju.", "dopuna": "Izravna kinematika ide od kutova prema položaju i uvijek ima jedno rješenje. Obrnuto — inverzna kinematika — za UR ima do osam rješenja za isti položaj alata. Pitanje: što mislite, kako upravljanje bira jedno od njih?", "kadrovi": [[0, "cijeli"]]}, {"t": 870, "dio": "1 Upoznavanje", "naslov": "Postolje i kabel", "klik": "Stavka „Postolje i kabel” — model se okrene prema postolju.", "tekst": "Postolje je okrugla prirubnica promjera 128 milimetara kojom se robot vijcima pričvrsti za stol, postolje ili stroj. Robot se smije montirati u bilo kojem položaju — na pod, zid ili strop — a položaj se upisuje u instalaciju, da upravljanje dobro računa gravitaciju. Iz boka izlazi kabel od 6 metara prema ormaru; ne smije biti napregnut, prignječen ni oštro savijen.", "dopuna": "U praksi je vođenje kabela čest uzrok kvarova: kabel koji se pri svakom ciklusu savija na istom mjestu s vremenom pukne. Pitanje: kako biste vodili kabel na robotu koji visi sa stropa?", "kadrovi": [[0, "cijeli"]]}, {"t": 930, "dio": "1 Upoznavanje", "naslov": "Zglob Base: rastavljanje i unutrašnjost", "klik": "Stavka „Zglob Base”; gumbi „Rastavi zglob”, „Samo odabrano / Prikaži sve”, „Prikaži unutrašnjost”.", "tekst": "Zglob Base okreće cijelu ruku oko okomite osi. To je zglob veličine 2 — najveće izvedbe — s najvećim momentom 54 njutnmetra, opsegom ±360° i brzinom ±180° u sekundi. Svih šest zglobova građeno je jednako: motor, valni prijenosnik, kočnica, dva enkodera i elektronika u zajedničkom kućištu sa šupljom sredinom za kabele. „Rastavi zglob” razmakne dijelove duž osi, „Samo odabrano” sakrije ostatak robota, a „Prikaži unutrašnjost” učini kućište prozirnim. Napomena: unutarnje mjere zgloba proizvođač ne objavljuje — prikaz je načelni.", "dopuna": "Isti zglob u tri veličine znači manje različitih rezervnih dijelova i jednostavniji servis — zglob se mijenja kao cjelina. Pitanje: koje su prednosti, a koji nedostaci takve modularne gradnje?", "kadrovi": [[0, "cijeli"]]}, {"t": 1080, "dio": "1 Upoznavanje", "naslov": "Kako radi: zglob od struje do kuta", "klik": "Animacija presjeka zgloba: „Pokreni tok” (energija narančasto, signali enkodera plavo), „Prethodni / Sljedeći”, klik na broj dijela.", "tekst": "Uzdužni presjek zgloba pokazuje lanac od struje do kuta. Narančasto teče energija: priključci, elektronika, motor, kroz otpuštenu kočnicu, valni prijenosnik do izlazne prirubnice. Plavo se vraćaju signali: enkoder motora javlja kut rotora za komutaciju, a enkoder zgloba stvarni kut iza prijenosnika. Tipkom „Sljedeći” prolazimo dio po dio.", "dopuna": "Šuplja sredina zgloba nije slučajna: kroz nju prolaze kabeli prema sljedećim zglobovima, pa robot nema vanjskih kabela koji bi zapinjali.", "kadrovi": [[0, "cijeli"]]}, {"t": 1200, "dio": "1 Upoznavanje", "naslov": "Motor bez četkica i komutacija", "klik": "Stavka „Motor”; animacija: klizač struje, komutacija Sinusna / Blok, kut iz enkodera Ispravan / Pomaknut 90° / 180°.", "tekst": "Pogon je motor bez četkica: stator s namotima u kućištu, rotor s trajnim magnetima na šupljem vratilu. Elektronika uključuje struju u namote prema kutu rotora — to je komutacija. Kod sinusne komutacije polje statora vrti se jednoliko ispred rotora; kod blok-komutacije skače u šest koraka po 60°, pa moment pulsira. Ako je kut iz enkodera pomaknut za 90°, polje stoji u smjeru rotora i motor ne daje moment iako teče puna struja; uz 180° vrti se unatrag. Zato je enkoder motora toliko važan. Motor se vrti brzo, s malim momentom — moment daje tek prijenosnik.", "dopuna": "Motor bez četkica nema mehaničkog komutatora koji se troši; posao komutatora preuzimaju elektronika i enkoder. Pitanje: što bi se dogodilo s motorom da enkoder motora pri pokretanju javlja krivi kut?", "kadrovi": [[0, "cijeli"]]}, {"t": 1350, "dio": "1 Upoznavanje", "naslov": "Valni prijenosnik i njegova tri dijela", "klik": "Stavka „Valni prijenosnik” i podstavke Generator vala, Flexspline, Circular spline (svaka se istakne u modelu).", "tekst": "Valni ili harmonični prijenosnik u jednom stupnju smanjuje brzinu i povećava moment, bez zračnosti. Ima tri dijela. Generator vala je eliptični disk s tankostijenim kugličnim ležajem na vratilu motora. Flexspline je tankostijena čelična čaša s vanjskim zubima koja se elastično deformira. Circular spline je kruti prsten s unutarnjim zubima. Flexspline ima dva zuba manje od prstena, pa za jedan okret generatora zaostane za dva zuba. Prijenosni omjer je z flex kroz razliku zubi: 200 kroz 2 daje 100. Harmonic Drive je objavio da je UR-u isporučivao prijenosnike omjera 100:1 — za UR3e točan omjer nije objavljen.", "dopuna": "Za usporedbu: omjer 100 planetarnim prijenosnikom traži dva ili tri stupnja, a valni ga postiže u jednom, u kućištu tankom kao zglob. Pitanje: koja je cijena toga — što se u flexsplineu događa milijunima puta tijekom životnog vijeka?", "kadrovi": [[0, "cijeli"]]}, {"t": 1440, "dio": "1 Upoznavanje", "naslov": "Kako radi: valni prijenosnik", "klik": "Animacija: Pokreni, Jedan okretaj ulaza, Na početak; broj zubi 30/32, 60/62, 200/202; gibanje Stalna vrtnja / Njihanje; klizači brzine i momenta motora.", "tekst": "Pokrećem vrtnju. Crveni zub flexsplinea i oznake na prstenu pokazuju da se izlaz za svaki okretaj generatora pomakne za točno dva zuba, i to suprotno od ulaza. Uvećani detalj desno gore prati veliku os elipse — ondje su zubi u punom zahvatu, na oba boka. Uz 200 i 202 zuba omjer je 100. „Jedan okretaj ulaza” to pokazuje korak po korak. Sad njihanje: planetarni prijenosnik pri svakoj promjeni smjera najprije prijeđe zračnost, a valni odmah slijedi ulaz. Zato robot s valnim prijenosnikom ima ponovljivost od nekoliko stotinki milimetra.", "dopuna": "Izlaz se vrti suprotno od ulaza jer flexspline zaostaje za generatorom. Pitanje: koliko okretaja generatora treba za jedan okretaj izlaza uz 200 i 202 zuba, a koliko uz 30 i 32?", "kadrovi": [[0, "cijeli"]]}, {"t": 1620, "dio": "1 Upoznavanje", "naslov": "Kočnica zgloba", "klik": "Stavka „Kočnica”; animacija: napajanje kočnice Uključeno / Isključeno, klizač vanjskog momenta, „Test kočnice”.", "tekst": "Kočnica drži zglob kad robot nije pod napajanjem. Na vratilu motora je prsten s krilcima; kad nestane napajanja, iz elektromagneta izađe zatik i krilce udari u njega. Krilce nije čvrsto na vratilu nego preko tarne spojke: dok je vanjski moment malen, zglob se pomakne samo do naslona na zatik; kad moment prijeđe granicu, vratilo proklizava. Zato se zakočeni robot u nuždi može rukom pogurati — uz klik, i ne više od 160°. Pri pokretanju robota kočnice se otpuštaju uz mali trzaj zglobova, a upravljanje ih testira; kvar javlja porukom „Brake test failed”.", "dopuna": "Zato servisne upute kažu da se zakočeni zglob smije rukom prisilno pomaknuti samo u nuždi, npr. kad je čovjek priklješten. Pitanje: zašto je kočnica izvedena tako da koči kad nestane napajanja, a ne obrnuto?", "kadrovi": [[0, "cijeli"]]}, {"t": 1785, "dio": "1 Upoznavanje", "naslov": "Dva enkodera", "klik": "Stavke „Enkoder motora” i „Enkoder zgloba”; animacija: Pokreni, vrsta kvara (Bez kvara / Preskakanje zubi / Kvar enkodera zgloba), Izazovi kvar, Poništi.", "tekst": "Svaki zglob ima dva enkodera. Enkoder motora mjeri kut rotora — za komutaciju i brzinu. Enkoder zgloba mjeri stvarni kut iza prijenosnika. Disk enkodera motora vrti se sto puta brže, a krivulje kut motora kroz omjer i kut zgloba se poklapaju. Kod preskakanja zubi izlaz naglo zaostane, a kod kvara enkodera zgloba očitanje počne skakati — razlika prijeđe prag i zglob se zaustavlja. U PolyScopeu se to javlja kao „Joint encoder error” ili „Sudden position change detected on the joint-encoder”.", "dopuna": "Dva enkodera daju i sigurnost: upravljanje stalno uspoređuje dva neovisna mjerenja istog gibanja. Pitanje: koji kvar može otkriti samo usporedba obaju enkodera?", "kadrovi": [[0, "cijeli"]]}, {"t": 1935, "dio": "1 Upoznavanje", "naslov": "Elektronika i kaskadna regulacija", "klik": "Stavka „Elektronika”; animacija kaskadne regulacije: „Pomakni zglob na 90°”, „Teret 3 kg”, klizači Kp i Kv, prikaz Cijelo gibanje / Uvećano (takt 2 ms).", "tekst": "Elektronika upravlja motorom izravno u zglobu, a s ormarom razmjenjuje zadane i stvarne vrijednosti 500 puta u sekundi. Regulacija je kaskadna: vanjska petlja položaja, unutar nje brzina, a najdublje struja. Pokrećem zglob na 90°: puna crta je stvarni kut, crtkana zadani. Uz malo pojačanje položaja Kp stvarni kut zaostaje više; uz veće prati bolje. „Teret 3 kg” naglo doda moment težine — gledajte kako ga regulacija svlada. U uvećanom prikazu vidi se da se zadana vrijednost mijenja u koracima od 2 milisekunde.", "dopuna": "Kaskadna regulacija postoji zato što unutarnja petlja — struja — mora biti puno brža od vanjske; tako vanjska petlja vidi pogon kao „idealan”. Pitanje: što se vidi na grafu kad je pojačanje brzine Kv premalo?", "kadrovi": [[0, "cijeli"]]}, {"t": 2085, "dio": "1 Upoznavanje", "naslov": "Ostali zglobovi: tri veličine", "klik": "Stavke Zglob Shoulder, Elbow, Wrist 1, Wrist 3; „Pomakni zglob”.", "tekst": "Rame, Shoulder, također je veličine 2, 54 njutnmetra — gravitacijom je najopterećeniji zglob jer drži cijelu ruku na najvećem kraku. Lakat, Elbow, je veličine 1, a tri zgloba zapešća veličine 0, najmanja. Prema listu podataka svi imaju opseg ±360°, osim Wrista 3 koji se vrti beskonačno. Za lakat priručnik PolyScopea navodi ±160° — na stranici su navedena oba podatka jer se izvori ne slažu.", "dopuna": "Momenti zglobova: veličina 2 do 54 Nm, manji zglobovi bitno manje — zato nosivost ovisi i o položaju tereta, ne samo o masi.", "kadrovi": [[0, "cijeli"]]}, {"t": 2190, "dio": "1 Upoznavanje", "naslov": "Cijevi i prirubnica alata", "klik": "Stavke Cijev nadlaktice, Cijev podlaktice, Prirubnica alata; kvačica „DH okviri”.", "tekst": "Nadlaktica i podlaktica su aluminijske cijevi kroz koje prolaze kabeli; razmak osi ramena i lakta je DH parametar a2, 243,55 milimetara. Prirubnica alata izvedena je po normi EN ISO 9409-1-50-4-M6: četiri navoja M6 na promjeru 50 i provrt za zatik. Bez alata ishodište alatnog sustava je u središtu prirubnice, os z gleda prema van. Kad montirate alat, u instalaciji upisujete TCP i masu tereta.", "dopuna": "Normirana prirubnica znači da se hvataljke drugih proizvođača montiraju bez adaptera. Pitanje: što morate upisati u instalaciju čim promijenite alat?", "kadrovi": [[0, "cijeli"]]}, {"t": 2280, "dio": "1 Upoznavanje", "naslov": "Senzor sile i momenta", "klik": "Stavka „Senzor sile i momenta”; animacija: slučaj Bez opterećenja / Pritisak prstom / Teret 3 kg, klizači sile, kraka, težišta i nagiba.", "tekst": "UR3e ima ugrađen senzor sile i momenta iza prirubnice: sile do ±30 njutna, momenti do ±10 njutnmetara, u tri osi. Pritisak prstom na vrh alata daje silu i moment koji raste s krakom — M jednako F puta L. Teret od 3 kilograma teži 29,4 njutna, pa je očitanje gotovo na granici opsega, a ako težište nije u osi prirubnice, nastaje i moment. Senzor se rabi za umetanje, spajanje, praćenje plohe — zadatke u kojima robot mora osjetiti dodir.", "dopuna": "Senzor sile omogućuje i „vođenje silom”: robot održava zadanu silu pritiska dok prati plohu, npr. pri brušenju. Pitanje: zašto je nepodešena masa tereta problem za mjerenje sile?", "kadrovi": [[0, "cijeli"]]}, {"t": 2400, "dio": "1 Upoznavanje", "naslov": "Alatni priključak (Tool I/O)", "klik": "Stavka „Alatni priključak”; animacija: hvataljke A/B/C, Zatvori / Otvori, napon alata 0/12/24 V, način izlaza NPN/PNP/Push-pull, analogni ulazi.", "tekst": "Na zadnjem zglobu je konektor M8 s 8 polova: napajanje alata 12 ili 24 V do 600 miliampera, dva digitalna ulaza, dva izlaza i dva analogna ulaza. Za pametne alate postoji sučelje RS-485. U animaciji biram hvataljku i podešavam priključak kao u instalaciji. Ako se napon ili način izlaza ne slažu s hvataljkom — na primjer hvataljka traži 12 V i NPN, a priključak daje 24 V i PNP — hvataljka ne reagira. Kad uskladim napon i način, zatvara se i otvara.", "dopuna": "Prije spajanja hvataljke uvijek provjerite tri stvari: napon (12 ili 24 V), način izlaza (NPN, PNP, push-pull) i najveću struju. Pitanje: što će se dogoditi ako hvataljka traži više od 600 mA?", "kadrovi": [[0, "cijeli"]]}, {"t": 2505, "dio": "1 Upoznavanje", "naslov": "Upravljački ormar", "klik": "Stavka „Upravljački ormar” (vrata se otvore) i dijelovi: izvor napajanja, sigurnosna ploča, Energy Eater, računalo; animacija: stanje Miruje / Ubrzava / Koči, E-stop.", "tekst": "Ormar serije e-Series ima masu 12 kilograma i zaštitu IP44, a napaja se iz mreže 100 do 240 V. Kad ga odaberete, vrata se u modelu otvore. Unutra su izvor napajanja, upravljačka ploča, sigurnosna ploča s dva kanala, Energy Eater i računalo s PolyScopeom, uz priključnice za ulaze i izlaze. U animaciji: pri kočenju motori rade kao generatori, energija se vraća u ormar i napon raste — prema našem tumačenju Energy Eater tu energiju pretvara u toplinu. Na E-stop oba sigurnosna kanala se otvore i sigurnosna ploča isključi napajanje robota.", "dopuna": "Redundancija sigurnosne ploče znači da kvar jednog kanala ne isključuje zaštitu, nego ga sustav otkrije usporedbom kanala.", "kadrovi": [[0, "cijeli"]]}, {"t": 2685, "dio": "1 Upoznavanje", "naslov": "Privjesak za učenje i nužno zaustavljanje", "klik": "Stavke Privjesak za učenje, Dodirni zaslon, Gljiva; animacija kategorija zaustavljanja: E-stop, Zaštitno zaustavljanje, Granični moment zgloba; Zaustavi / Ispočetka.", "tekst": "Privjesak za učenje ima dodirni zaslon od 12 inča s PolyScopeom, gljivu za nužno zaustavljanje i gumb za slobodno vođenje; kabel je dug 4,5 metra. Gljiva pokreće zaustavljanje kategorije 1: robot se kontrolirano zaustavi na putanji, a tek onda se isključi napajanje motora. Zaštitno zaustavljanje je kategorije 2 — robot stane, a pogoni ostaju pod napajanjem, pa se nastavlja odmah. Prekoračenje tvorničkog graničnog momenta zgloba izaziva kategoriju 0: napajanje se odmah isključi, robot staje najbrže, ali ne po putanji.", "dopuna": "Kategorija 1 pri E-stopu je kompromis: robot staje kontrolirano, po putanji, pa ne udara u okolinu, a tek zatim gubi napajanje. Pitanje: zašto se za E-stop ne koristi kategorija 2?", "kadrovi": [[0, "cijeli"]]}, {"t": 2835, "dio": "1 Upoznavanje", "naslov": "Slobodno vođenje i 3PE", "klik": "Stavke Gumb Freedrive i 3PE; animacije: stanje Kočnice zatvorene / Freedrive / Bez kompenzacije, načini Free, Plane, Translation, Rotation; 3PE položaji 1–3.", "tekst": "Gumb Freedrive na stražnjoj strani privjeska uključuje slobodno vođenje: robot vodite rukom, a motori kompenziraju gravitaciju. Gibanje se može ograničiti: Free — svi zglobovi slobodni; Plane — vrh samo u vodoravnoj ravnini; Translation — orijentacija ostaje ista; Rotation — vrh miruje. „Bez kompenzacije” pokazuje što bi bilo kad motori ne bi držali težinu. Tri-položajni uređaj, 3PE, dopušta gibanje u ručnom načinu samo u srednjem položaju — pusti li ga čovjek ili ga u strahu stisne do kraja, robot staje. Brzina alata u ručnom načinu najviše je 250 milimetara u sekundi.", "dopuna": "Slobodno vođenje je najbrži način učenja točaka: alat rukom dovedete do predmeta i spremite točku. Pitanje: zašto je za to ključno da je nosivost točno upisana?", "kadrovi": [[0, "cijeli"]]}, {"t": 3000, "dio": "1 Upoznavanje", "naslov": "Sigurnosne funkcije", "klik": "Stavke Sigurnost i Sigurnosne funkcije; animacija: Pokreni program, Čovjek u putanji, način Automatski / Ručni, klizači brzine i udaljenosti čovjeka.", "tekst": "Sigurnost je ugrađena u upravljanje: 23 podesive sigurnosne funkcije, izvedene redundantno, razine PLd, kategorija 3. Nadziru položaj, brzinu, silu, količinu gibanja, snagu te vrijeme i put zaustavljanja. „Čovjek u putanji” prikazuje dodir: sila raste dok ne prijeđe granicu, a tada robot staje. Važno: ugrađena sigurnost ne zamjenjuje procjenu rizika cijele primjene — oštar alat ili težak teret opasni su i pri maloj sili.", "dopuna": "Kobot ne znači automatski siguran: sigurnim ga čini cijela primjena — alat, teret, brzina i prostor oko njega. Pitanje: koje biste sigurnosne funkcije postavili za robot koji radi uz montažni stol?", "kadrovi": [[0, "cijeli"]]}, {"t": 3105, "dio": "1 Upoznavanje", "naslov": "Podaci o robotu i izvori", "klik": "Stavka „Podaci o robotu” — stranica se spusti na tablice podataka, DH parametre i mase članaka; na dnu popis izvora.", "tekst": "Na dnu stranice su tablice: osnovni podaci robota, zglobova, ormara i privjeska, DH parametri i mase članaka. Svaki podatak povezan je s izvorom — list podataka UR3e, priručnik PolyScopea, servisni priručnik, UR-ovi članci o DH parametrima i momentima zglobova. Gdje proizvođač nešto ne objavljuje, na stranici piše da je prikaz načelni. Time završavamo prvo poglavlje.", "dopuna": "Navika koju vrijedi steći: svaki podatak u tehničkom dokumentu ima izvor, a ondje gdje proizvođač šuti, to se jasno kaže.", "kadrovi": [[0, "cijeli"]]}, {"t": 3180, "dio": "2 Upravljanje", "naslov": "Raspored stranice Upravljanje robotom", "klik": "Lijevo devet nizova, u sredini privjesak za učenje i uputa koraka, desno robot na stolu.", "tekst": "Drugo poglavlje: lijevo je devet nizova vježbi, u sredini privjesak za učenje nalik PolyScopeu, ispod njega uputa trenutnog koraka, a desno robot na stolu, s ormarom, kockom i odlagalištem. Svaki niz vodi korak po korak: kad korak izvedete ispravno, uputa sama prelazi na sljedeći. Privjesak i robot rade i bez niza — slobodno istražujte kartice.", "dopuna": "Privjesak je pojednostavljeni crtež, ali raspored kartica i redoslijed postupaka odgovaraju stvarnom PolyScopeu 5, pa se znanje izravno prenosi na pravi robot.", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 2: Upravljanje robotom", "Pomicanje, programiranje i nizovi na privjesku"]}, {"t": 3240, "dio": "2 Upravljanje", "naslov": "Niz 1: Pokretanje — privjesak i zaslon za pokretanje", "klik": "Niz „Pokretanje”: tipka za napajanje privjeska, gumb „Power off” lijevo dolje, polje Payload 0.60 i Set.", "tekst": "Prvi niz je pokretanje. Uključujem privjesak tipkom za napajanje; zajedno s njim pokreće se računalo u ormaru, ali robot je još bez napajanja. Gumb u donjoj traci pokazuje stanje robota: Power off, Idle ili Normal. Dodirom otvaram zaslon za pokretanje. Prvo provjeravam nosivost: na prirubnici je hvataljka od 0,60 kilograma. Upravljanje iz mase računa kompenzaciju gravitacije i procjenu sile — kriva nosivost znači da robot pri slobodnom vođenju „pada” ili „se diže”.", "dopuna": "Na stvarnom robotu ovo je prvi korak svakog dana. Pitanje: što bi se dogodilo pri slobodnom vođenju da upišete 0 kg, a na prirubnici je hvataljka od 0,6 kg?", "kadrovi": [[0, "cijeli"]]}, {"t": 3330, "dio": "2 Upravljanje", "naslov": "Niz 1: Pokretanje — ON, START, Exit", "klik": "Gumbi ON (Idle), START (otpuštanje kočnica, trzaj zglobova u 3D prikazu), Exit.", "tekst": "Gumbom ON ormar daje napon motorima — robot je u stanju Idle, kočnice su još zakočene. START otpušta kočnice: gledajte zglobove — malo se trznu, jer se svaki zglob zakrene da se zatik izvuče iz krilca. To je ono što smo vidjeli u animaciji kočnice. Robot je u stanju Normal, spreman za rad. Zatvaram zaslon gumbom Exit.", "dopuna": "Tri stanja vrijedi zapamtiti: Power off, Idle i Normal. Pitanje: u kojem stanju robot drži položaj kočnicama, a u kojem motorima?", "kadrovi": [[0, "cijeli"]]}, {"t": 3450, "dio": "2 Upravljanje", "naslov": "Niz 2: Ručno pomicanje po zglobovima", "klik": "Kartica Move; gumbi + i − uz svaki zglob (drže se), klizač Speed.", "tekst": "Kartica Move. Uz svaki zglob su gumbi plus i minus — robot se giba samo dok gumb držite. Okrećem Base na +45°, zatim rame na −60°: pazite na stol, dodir sa stolom izaziva zaštitno zaustavljanje. Pa Wrist 3 na +90° — on okreće prirubnicu s hvataljkom. Brzinu mijenjate klizačem Speed u donjoj traci.", "dopuna": "Gibanje samo dok se gumb drži je načelo „čovjek u petlji”: pustite li gumb, robot staje.", "kadrovi": [[0, "cijeli"]]}, {"t": 3540, "dio": "2 Upravljanje", "naslov": "Niz 2: Upis kuta i Home", "klik": "Polje kuta uz Elbow (upis 60 i Enter); gumb Home (drži se).", "tekst": "Kut se može i upisati: upisujem 60 uz Elbow i potvrđujem — robot sam zglobno ode u taj položaj. Gumbom Home vraćam robota u početni položaj spremljen u instalaciji; gumb se drži dok robot ne stane, da operater stalno ima kontrolu.", "dopuna": "Home nije nulti položaj: nulti je kad su svi kutovi nula, a Home je položaj koji sami odredite u instalaciji.", "kadrovi": [[0, "cijeli"]]}, {"t": 3630, "dio": "2 Upravljanje", "naslov": "Niz 3: Pomicanje alata u sustavu Base", "klik": "Kartica Move, koordinatni sustav Base; gumbi +Z, −Y i RZ.", "tekst": "Sad pomičemo alat, ne zglobove. U sustavu Base ishodište je u sredini podnožja, os z je os zgloba Base. Gumb +Z diže alat 50 milimetara — gledajte: giba se svih šest zglobova zajedno, jer upravljanje u svakom trenutku računa inverznu kinematiku. Zatim −Y za 40 milimetara, pa zakret oko osi z: vrh alata ostaje na mjestu, mijenja se samo orijentacija, odnosno rotacijski vektor rx, ry, rz.", "dopuna": "Pri gibanju alata ne birate kojim se zglobom giba — to radi inverzna kinematika. Pitanje: zašto se pri pravocrtnom pomaku alata gibaju svi zglobovi?", "kadrovi": [[0, "cijeli"]]}, {"t": 3750, "dio": "2 Upravljanje", "naslov": "Niz 3: Sustav Tool", "klik": "Koordinatni sustav Tool; gumb +Z (alat ide prema stolu).", "tekst": "Prebacujem na sustav Tool: osi su vezane uz alat, a os z alata ide iz prirubnice prema prstima hvataljke. Isti gumb +Z sada vozi alat prema dolje, jer je alat okrenut prema stolu. To je česta zabuna u praksi: uvijek provjerite koji je sustav odabran.", "dopuna": "Sustav Tool je praktičan za prilaz predmetu: „naprijed po osi alata” uvijek je prema predmetu, kako god je alat okrenut.", "kadrovi": [[0, "cijeli"]]}, {"t": 3840, "dio": "2 Upravljanje", "naslov": "Niz 4: Slobodno vođenje", "klik": "Gumb Freedrive na boku privjeska; povlačenje robota mišem za alat; načini Free, Plane, Rotation u kartici Move.", "tekst": "Uključujem Freedrive i vučem robota mišem za alat — na stvarnom robotu to radite rukom. U načinu Free giba se sve. U načinu Plane alat ide samo vodoravno, visina ostaje ista — korisno kad treba prijeći preko stola. U načinu Rotation vrh miruje, mijenja se samo orijentacija. Kad pustim Freedrive, robot ostaje u položaju; zglobovi ga drže motorima.", "dopuna": "U praksi se slobodno vođenje kombinira s finim pomakom gumbima: rukom grubo, gumbima precizno.", "kadrovi": [[0, "cijeli"]]}, {"t": 4020, "dio": "2 Upravljanje", "naslov": "Niz 5: Program — naredba Move i točke puta", "klik": "Kartica Program: gumb Move ispod stabla, čvor Waypoint_1, Set waypoint.", "tekst": "Peti niz je prvi program. Program je stablo naredbi. Dodajem naredbu Move — nastaje MoveJ s točkom puta Waypoint_1, crvenom dok nije postavljena. Robota pomaknem u željeni položaj, vratim se u Program, odaberem Waypoint_1 i dodirnem Set waypoint — točka sprema kutove svih šest zglobova i položaj alata.", "dopuna": "Točka puta pamti kutove zglobova, pa robot u nju dolazi uvijek istom konfiguracijom ruke. Pitanje: zašto je to važno kad postoji osam rješenja inverzne kinematike?", "kadrovi": [[0, "cijeli"]]}, {"t": 4140, "dio": "2 Upravljanje", "naslov": "Niz 5: Druga točka i pokretanje programa", "klik": "Add waypoint, pomak robota, Set waypoint; gumb Play u donjoj traci; narančasta putanja u 3D prikazu.", "tekst": "Odabirem MoveJ i dodajem drugu točku, pomičem robota barem 100 milimetara dalje i postavljam Waypoint_2. Play pokreće program: robot najprije ide do prve točke, zatim do druge. Pokazivač u stablu pokazuje naredbu koja se izvodi, a u 3D prikazu ostaje narančasta putanja alata. Pause zaustavlja program uz zadržan položaj, Stop ga prekida.", "dopuna": "Prije pokretanja programa na stvarnom robotu smanjite brzinu klizačem Speed i držite ruku blizu gljive.", "kadrovi": [[0, "cijeli"]]}, {"t": 4260, "dio": "2 Upravljanje", "naslov": "Niz 6: MoveJ i MoveL", "klik": "Play s MoveJ (narančasti luk), promjena u MoveL, Play (plavi pravac), pogled Odozgo, Dalje.", "tekst": "Pripremljen je program s MoveJ i dvjema točkama. MoveJ interpolira kutove zglobova: svi zglobovi krenu i stanu zajedno, a alat ide po luku. Mijenjam naredbu u MoveL — brzina se sada zadaje u milimetrima u sekundi alata — i pokrećem ponovno: alat ide po pravcu, plava putanja. Odozgo se razlika jasno vidi. MoveL je najkraći put za alat, ali zglobovi se gibaju složenije; MoveJ je najkraći u zglobovima, obično brži i dalje od singularnosti. Pravilo iz prakse: MoveJ za prijelaze kroz slobodan prostor, MoveL za prilaz predmetu i odmak od njega.", "dopuna": "Pitanje: kojom biste naredbom robot doveli iznad kocke, a kojom ga spustili na nju? Obrazložite.", "kadrovi": [[0, "cijeli"]]}, {"t": 4440, "dio": "2 Upravljanje", "naslov": "Niz 7: Hvataljka i alatni izlaz", "klik": "Kartica I/O: alatni izlaz DO0 (On zatvara, Off otvara hvataljku); ulazi DI0 i DI1.", "tekst": "Sedmi niz: uzmi i ostavi. Hvataljka je spojena na alatni priključak: izlaz DO0 uključen zatvara prste, isključen ih otvara — to je naša pretpostavka o spoju. Ulaz DI1 javlja da je hvataljka otvorena, a DI0 da drži predmet.", "dopuna": "Stanje hvataljke vidi se na ulazima: program može provjeriti je li predmet uhvaćen prije nego što krene dalje.", "kadrovi": [[0, "cijeli"]]}, {"t": 4500, "dio": "2 Upravljanje", "naslov": "Niz 7: Naredbe Set i Wait, pokretanje", "klik": "Kartica Program: iza Waypoint_2 naredbe Set (Tool DO0 = On) i Wait; iza Waypoint_5 Set (DO0 = Off); Play.", "tekst": "U pripremljeni program iza točke kod kocke dodajem naredbu Set — Tool DO0 uključeno — i iza nje Wait od pola sekunde, da se prsti stignu zatvoriti. Bez čekanja robot bi krenuo gore prije nego što stisne kocku. Iza točke kod odlagališta dodajem Set DO0 isključeno. Pokrećem: robot ide do kocke, hvata je, nosi i ostavlja na zelenom odlagalištu. Ako ne uspije, „Vrati kocku” vraća je na mjesto.", "dopuna": "Umjesto fiksnog čekanja bolje je čekati ulaz „predmet uhvaćen” — program je tada i brži i sigurniji. Pitanje: kako biste to napisali naredbom Wait?", "kadrovi": [[0, "cijeli"]]}, {"t": 4650, "dio": "2 Upravljanje", "naslov": "Niz 8: Sigurnosne granice i ravnina", "klik": "Installation › Safety › Robot Limits (sila 100 N, brzina 500 mm/s, Apply); Planes (ravnina 100 mm); Move −Z do zaustavljanja; Enable robot.", "tekst": "Osmi niz je sigurnost. U instalaciji, u Robot Limits, postavljam granicu sile 100 njutna i brzine alata 500 milimetara u sekundi. Na stvarnom robotu te postavke štiti lozinka, a svaka promjena mijenja kontrolni zbroj. Zatim uključujem sigurnosnu ravninu 100 milimetara iznad stola. Spuštam alat: kad dotakne ravninu, slijedi zaštitno zaustavljanje — kategorija 2, pa nakon potvrde Enable robot rad odmah nastavljamo.", "dopuna": "Sigurnosna ravnina štiti stol i ruke operatera ispod radne visine. Pitanje: što je razlika između sigurnosne granice i ograničenja u programu?", "kadrovi": [[0, "cijeli"]]}, {"t": 4770, "dio": "2 Upravljanje", "naslov": "Niz 8: Granica sile, E-stop i 3PE", "klik": "Move +Y prema prepreci (granica sile), Enable, odmak; gljiva E-stop, otpuštanje i ponovno pokretanje (ON, START); Installation › Hardware: 3PE; gumb 3PE na boku privjeska (lagano, jako, pusti); gumb načina rada Automatic.", "tekst": "Vozim alat vodoravno prema crvenoj prepreci: procjena sile raste i pri 100 njutna robot staje. Potvrđujem i odmičem alat. Sad gljiva za nužno zaustavljanje: kategorija 1 — robot je bez napajanja i kočnice su zakočene, pa ga treba ponovno uključiti i otpustiti kočnice. Na kraju prebacujem način rada u Automatic: u ručnom načinu alat ne smije brže od 250 milimetara u sekundi i treba držati 3PE, a u automatskom vrijede granice iz instalacije.", "dopuna": "Pitanje: nakon kojeg od triju zaustavljanja koje smo vidjeli treba ponovno uključiti robota, a nakon kojeg se samo potvrdi?", "kadrovi": [[0, "cijeli"]]}, {"t": 4890, "dio": "2 Upravljanje", "naslov": "Niz 9: Kinematika — provjera DH tablicom", "klik": "Upis kutova 30, −70, 80, −100, −90, 0 u kartici Move; tablica DH ispod upute: polja X, Y, Z i gumb Provjeri.", "tekst": "Zadnji niz povezuje teoriju i robot. Postavljam zglobove na 30, −70, 80, −100, −90 i 0 stupnjeva. Položaj alata je skriven dok ga ne izračunate. Iz DH tablice množite šest matrica — ili koristite zatvoreni oblik za UR koji je napisan u pomoći — i upisujete X, Y i Z prirubnice; dopušteno odstupanje je jedan milimetar. Provjera prolazi. Primijetite: privjesak pokazuje TCP, koji je 100 milimetara dalje duž osi z alata, pa se Z razlikuje kad alat nije okomit. To je zadatak za samostalni rad.", "dopuna": "Zadatak za doma: izračunajte X, Y i Z prirubnice za zadane kutove ručno ili u Excelu, pa provjerite u nizu 9.", "kadrovi": [[0, "cijeli"]]}, {"t": 5040, "dio": "3 Proširena stvarnost", "naslov": "Robot u proširenoj stvarnosti — 3D prikaz i klizači", "klik": "Stranica AR: 3D prikaz, klizači šest zglobova, gumbi Početni položaj, Pokaži gibanje, Doseg.", "tekst": "Treće poglavlje: isti robot kao samostalna stranica za proširenu stvarnost. Klizačima pomičete svaki zglob, gumb „Pokaži gibanje” vrti programirani ciklus, a „Doseg” prikazuje radni prostor od 500 milimetara — korisno kad planirate gdje robot stoji u stanici.", "dopuna": "Proširena stvarnost korisna je prije kupnje ili postavljanja robota: vidi se stane li robot u prostor i doseže li sve točke.", "kadrovi": [[0, "naslov"], [6, "cijeli"]], "kartica": ["Cjelina 3: Proširena stvarnost", "Robot u prostoru — na računalu i mobitelu"]}, {"t": 5145, "dio": "3 Proširena stvarnost", "naslov": "Na mobitelu: robot u stvarnoj veličini", "klik": "Kartica „Robot u tvom prostoru”: QR kod i upute (Android: WebXR, iPhone: Quick Look).", "tekst": "Skenirajte QR kod mobitelom. Na Androidu, u Chromeu, dodirnete „Postavi robota i pomiči osi”, usmjerite kameru prema podu ili stolu i dodirnete krug — robot stoji u stvarnoj veličini, možete ga obilaziti, a klizačima na dnu zaslona pomičete osi. Na iPhoneu se otvara Quick Look. Ako umjesto gumba vidite samo QR kod, u Chromeu isključite „Web-mjesto za računala”.", "dopuna": "Zadatak: postavite robota na svoj radni stol i provjerite doseže li sve kutove stola.", "kadrovi": [[0, "cijeli"]]}, {"t": 5265, "dio": "Kraj", "naslov": "Sažetak i zadatak", "klik": "Povratak na naslovnicu; ishodi „Moći ću”.", "tekst": "Sažmimo. Kobot UR3e ima šest zglobova iste građe: motor bez četkica, valni prijenosnik omjera oko 100 bez zračnosti, kočnicu sa zatikom i tarnom spojkom, dva enkodera i elektroniku. Na prirubnici je senzor sile, u ormaru upravljanje s 500 Hz i sigurnosna ploča s dva kanala, a programira se privjeskom. Za samostalni rad: prođite svih devet nizova do kraja i riješite zadatak s DH tablicom. Hvala na pažnji — u sljedećem bloku radimo uvod u Industriju 4.0 na platformi Festo LX.", "dopuna": "Provjerimo ishode: svatko neka u jednoj rečenici objasni zašto zglob ima dva enkodera.", "kadrovi": [[0, "naslov"], [6, "cijeli"], [125, "naslov"]], "kartica": ["Sažetak i zadatak", "Kobot UR3e — hvala na pažnji"]}], KRAJ=5400, KD={"cijeli": {"naziv": "Cijeli zaslon", "tipka": "1"}, "naslov": {"naziv": "Naslovna kartica", "tipka": "2"}}, KLJUC='ftq-citac-kobot-obs', KLJUC2='ftq-citac-lx-obs', REZ='ftq-predavanje-ur3e';
const PREF='FTQ · ';
const scena=k=>PREF+KD[k].naziv;
const KAD=Object.keys(KD), ZOOM=KAD.filter(k=>KD[k].r);
const $=id=>document.getElementById(id);
const mm=s=>{s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
const esc=x=>String(x).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ki=t=>{let i=0;for(let j=0;j<S.length;j++)if(S[j].t<=t)i=j;return i};
const sp=(k,v)=>{try{localStorage.setItem(KLJUC+'-'+k,JSON.stringify(v))}catch(e){}};
const ucitaj=(k,d)=>{try{const v=localStorage.getItem(KLJUC+'-'+k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const poruka=t=>{$('poruka').textContent=t};
/* zapamćeno u drugom čitaču na istoj domeni (lozinka, adresa, izvor) — da se ne upisuje ponovno */
const ucitaj2=(k,d)=>{const v=ucitaj(k,null);if(v!=null&&v!=='')return v;if(!KLJUC2)return d;try{const x=localStorage.getItem(KLJUC2+'-'+k);return x==null?d:JSON.parse(x)}catch(e){return d}};
/* veza s autopilotom (režiserom) na istoj domeni: njegov sat vodi čitač, gumbi čitača upravljaju njime */
let bc=null;try{if(REZ)bc=new BroadcastChannel(REZ)}catch(e){bc=null}
const rz={t:-1e9,sat:0,igra:false,i:-1,ceka:false};

/* ---------- SHA-256 i base64 (za prijavu u OBS) ---------- */
function sha256(bytes){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];
 const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];
 const l=bytes.length,n=((l+9+63)>>6)<<6,m=new Uint8Array(n);m.set(bytes);m[l]=0x80;const dv=new DataView(m.buffer);dv.setUint32(n-4,l*8>>>0);dv.setUint32(n-8,Math.floor(l/0x20000000));
 const w=new Uint32Array(64),r=(x,c)=>(x>>>c)|(x<<(32-c));
 for(let o=0;o<n;o+=64){for(let i=0;i<16;i++)w[i]=dv.getUint32(o+i*4);
  for(let i=16;i<64;i++){const a=w[i-15],b=w[i-2];w[i]=(w[i-16]+(r(a,7)^r(a,18)^(a>>>3))+w[i-7]+(r(b,17)^r(b,19)^(b>>>10)))>>>0}
  let[a,b,c,d,e,f,g,h]=H;
  for(let i=0;i<64;i++){const t1=(h+(r(e,6)^r(e,11)^r(e,25))+((e&f)^(~e&g))+K[i]+w[i])>>>0,t2=((r(a,2)^r(a,13)^r(a,22))+((a&b)^(a&c)^(b&c)))>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0}
  H[0]=(H[0]+a)>>>0;H[1]=(H[1]+b)>>>0;H[2]=(H[2]+c)>>>0;H[3]=(H[3]+d)>>>0;H[4]=(H[4]+e)>>>0;H[5]=(H[5]+f)>>>0;H[6]=(H[6]+g)>>>0;H[7]=(H[7]+h)>>>0}
 const out=new Uint8Array(32);H.forEach((v,i)=>{out[i*4]=v>>>24;out[i*4+1]=(v>>>16)&255;out[i*4+2]=(v>>>8)&255;out[i*4+3]=v&255});return out}
const utf8=s=>new TextEncoder().encode(s);
const b64=u=>{let s='';u.forEach(x=>s+=String.fromCharCode(x));return btoa(s)};
const obsAuth=(loz,salt,izazov)=>b64(sha256(utf8(b64(sha256(utf8(loz+salt)))+izazov)));

/* ---------- OBS WebSocket v5 ---------- */
const obs={ws:null,ok:false,n:0,cek:new Map()};
let spremno=false,snima=false,rec0=0,pauzaOd=0,pauzaUk=0,trenScena='',CW=1920,CH=1080,tekstVrsta='',bojaVrsta='',ids={};
function lamp(st,t){$('lamp').className='lamp '+st;$('obs-st').textContent=t}
function R(tip,pod){return new Promise((res,rej)=>{if(!obs.ok&&tip!=='__'){rej(new Error('OBS nije spojen'));return}
 const id='r'+(++obs.n);obs.cek.set(id,{res,rej,tip});obs.ws.send(JSON.stringify({op:6,d:{requestType:tip,requestId:id,requestData:pod||{}}}));
 setTimeout(()=>{if(obs.cek.has(id)){obs.cek.delete(id);rej(new Error('OBS ne odgovara: '+tip))}},10000)})}
function spoji(){
 if(obs.ws){try{obs.ws.close()}catch(e){}}
 const url=$('i-url').value.trim(),loz=$('i-loz').value;
 if($('c-pamti').checked){sp('url',url);sp('loz',loz)}else{sp('loz','')}
 lamp('','spajam se na '+url+' …');
 let ws;try{ws=new WebSocket(url,'obswebsocket.json')}catch(e){lamp('greska','Neispravna adresa');return}
 obs.ws=ws;obs.ok=false;
 ws.onmessage=ev=>{let m;try{m=JSON.parse(ev.data)}catch(e){return}const d=m.d||{};
  if(m.op===0){const id={rpcVersion:1,eventSubscriptions:4|64};
   if(d.authentication){if(!loz){lamp('greska','OBS traži lozinku');ws.close();return}id.authentication=obsAuth(loz,d.authentication.salt,d.authentication.challenge)}
   ws.send(JSON.stringify({op:1,d:id}))}
  else if(m.op===2){obs.ok=true;lamp('ok','OBS spojen');nakonSpajanja().catch(e=>poruka('Greška: '+e.message))}
  else if(m.op===7){const c=obs.cek.get(d.requestId);if(!c)return;obs.cek.delete(d.requestId);
   if(d.requestStatus&&d.requestStatus.result)c.res(d.responseData||{});else{const er=new Error(c.tip+': '+((d.requestStatus&&d.requestStatus.comment)||'pogreška '+(d.requestStatus&&d.requestStatus.code)));er.code=d.requestStatus&&d.requestStatus.code;c.rej(er)}}
  else if(m.op===5){const e=d.eventData||{};
   if(d.eventType==='CurrentProgramSceneChanged'){trenScena=e.sceneName;oznaciKadar()}
   else if(d.eventType==='RecordStateChanged'){if(e.outputState==='OBS_WEBSOCKET_OUTPUT_STARTED'){snima=true;rec0=performance.now();pauzaOd=0;pauzaUk=0;zapisPoglavlja=[];zabiljezi(ki(sad()))}
    else if(e.outputState==='OBS_WEBSOCKET_OUTPUT_PAUSED'){if(!pauzaOd)pauzaOd=performance.now()}
    else if(e.outputState==='OBS_WEBSOCKET_OUTPUT_RESUMED'){if(pauzaOd){pauzaUk+=performance.now()-pauzaOd;pauzaOd=0}}
    else if(e.outputState==='OBS_WEBSOCKET_OUTPUT_STOPPED'){snima=false;poruka('Snimanje zaustavljeno'+(e.outputPath?': '+e.outputPath:'')+'. Poglavlja su spremna za preuzimanje.')}
    $('b-rec').classList.toggle('akt',snima);$('b-rec').textContent=snima?'■ Zaustavi':'● Snimaj'}}};
 ws.onclose=ev=>{obs.ok=false;spremno=false;obs.cek.forEach(c=>c.rej(new Error('veza prekinuta')));obs.cek.clear();
  lamp('greska',ev.code===4009?'Kriva lozinka':ev.code===1006?'Nema veze — je li OBS otvoren i WebSocket uključen?':'Veza prekinuta ('+ev.code+')')};
 ws.onerror=()=>{};
}

/* ---------- priprema scena ---------- */
const ABGR=hex=>{const n=parseInt(hex.slice(1),16);return((0xFF000000|((n&255)<<16)|(n&0xFF00)|(n>>16))>>>0)};
const BOJE={tamna:'#0C3F47',teal:'#17656E',cyan:'#2ECAD4',bijela:'#FFFFFF',svijetla:'#BFEFF2'};
function tekstPostavke(t,vel,boja,opc){const s={text:t,font:{face:'Segoe UI',size:Math.round(vel),style:opc&&opc.tanko?'Regular':'Bold',flags:opc&&opc.tanko?0:1},color:ABGR(boja),color1:ABGR(boja),color2:ABGR(boja),opacity:100,outline:false};
 if(opc&&opc.sirina){s.extents=true;s.extents_cx=Math.round(opc.sirina);s.extents_cy=Math.round(opc.visina||vel*1.6);s.extents_wrap=true;s.wrap=true}return s}
const bojaPostavke=(hex,w,h)=>({color:ABGR(hex),width:Math.round(w),height:Math.round(h)});
async function popisUlaza(){return new Set(((await R('GetInputList')).inputs||[]).map(i=>i.inputName))}
async function stavi(sc,ime,vrsta,post,ulazi){
 if(ulazi.has(ime)){if(post)await R('SetInputSettings',{inputName:ime,inputSettings:post,overlay:true});return(await R('CreateSceneItem',{sceneName:sc,sourceName:ime})).sceneItemId}
 const r=await R('CreateInput',{sceneName:sc,inputName:ime,inputKind:vrsta,inputSettings:post||{}});ulazi.add(ime);return r.sceneItemId}
const polozaj=(sc,id,x,y,dod)=>R('SetSceneItemTransform',{sceneName:sc,sceneItemId:id,sceneItemTransform:Object.assign({positionX:Math.round(x),positionY:Math.round(y),alignment:5,rotation:0,scaleX:1,scaleY:1},dod||{})});
async function velicinaIzvora(sc,id){let t=(await R('GetSceneItemTransform',{sceneName:sc,sceneItemId:id})).sceneItemTransform||{};
 if(!t.sourceWidth){await new Promise(r=>setTimeout(r,400));t=(await R('GetSceneItemTransform',{sceneName:sc,sceneItemId:id})).sceneItemTransform||{}}
 return[t.sourceWidth||CW,t.sourceHeight||CH]}
let reg=Object.assign({},...ZOOM.map(k=>({[k]:KD[k].r.slice()})),ucitaj('reg',{}));
function okvirKadra(k,sw,sh){const[x,y,w]=reg[k];let h=w*(sw/sh)*(CH/CW);let yy=y;if(yy+h>1)yy=Math.max(0,1-h);return{x,y:yy,w,h:Math.min(1,h)}}
async function postaviZoom(k,sw,sh){const sc=scena(k),id=ids[sc]&&ids[sc].izvor;if(id==null)return;const o=okvirKadra(k,sw,sh);
 const cl=Math.round(o.x*sw),ct=Math.round(o.y*sh),cr=Math.max(0,Math.round(sw-(o.x+o.w)*sw)),cb=Math.max(0,Math.round(sh-(o.y+o.h)*sh));
 const vw=sw-cl-cr,vh=sh-ct-cb;
 await R('SetSceneItemTransform',{sceneName:sc,sceneItemId:id,sceneItemTransform:{boundsType:'OBS_BOUNDS_NONE',cropLeft:cl,cropTop:ct,cropRight:cr,cropBottom:cb,scaleX:CW/vw,scaleY:CH/vh,positionX:0,positionY:0,alignment:5,rotation:0}})}
async function pripremi(){
 const izvor=$('s-izvor').value;if(!izvor){poruka('Prvo odaberi izvor snimanja zaslona (ili klikni + izvor).');return}
 poruka('Pripremam scene …');$('b-pripremi').disabled=true;
 try{
  const v=await R('GetVideoSettings');CW=v.baseWidth;CH=v.baseHeight;const u=CH/1080;
  const vrste=(await R('GetInputKindList',{unversioned:false})).inputKinds||[];
  tekstVrsta=['text_gdiplus_v3','text_gdiplus_v2','text_gdiplus','text_ft2_source_v2','text_ft2_source'].find(x=>vrste.includes(x))||'text_gdiplus_v3';
  bojaVrsta=['color_source_v3','color_source_v2','color_source'].find(x=>vrste.includes(x))||'color_source_v3';
  const postoje=new Set(((await R('GetSceneList')).scenes||[]).map(s=>s.sceneName));
  for(const k of KAD){const sc=scena(k);
   if(postoje.has(sc)){const it=(await R('GetSceneItemList',{sceneName:sc})).sceneItems||[];for(const i of it)await R('RemoveSceneItem',{sceneName:sc,sceneItemId:i.sceneItemId})}
   else await R('CreateScene',{sceneName:sc})}
  const ulazi=await popisUlaza();ids={};
  const kamera=$('s-kam').value;
  for(const k of KAD.filter(x=>x!=='naslov')){const sc=scena(k);ids[sc]={};
   const id=await R('CreateSceneItem',{sceneName:sc,sourceName:izvor});ids[sc].izvor=id.sceneItemId;
   if(k==='cijeli')await R('SetSceneItemTransform',{sceneName:sc,sceneItemId:id.sceneItemId,sceneItemTransform:{boundsType:'OBS_BOUNDS_SCALE_INNER',boundsWidth:CW,boundsHeight:CH,boundsAlignment:0,positionX:0,positionY:0,alignment:5,cropLeft:0,cropTop:0,cropRight:0,cropBottom:0,rotation:0}});
   if(kamera){const kid=await R('CreateSceneItem',{sceneName:sc,sourceName:kamera});ids[sc].kamera=kid.sceneItemId;
    await R('SetSceneItemTransform',{sceneName:sc,sceneItemId:kid.sceneItemId,sceneItemTransform:{boundsType:'OBS_BOUNDS_SCALE_OUTER',boundsWidth:Math.round(CW*.2),boundsHeight:Math.round(CW*.2*9/16),boundsAlignment:0,positionX:Math.round(CW*.78),positionY:Math.round(CH*.03),alignment:5,rotation:0}})}
   ids[sc].traka=await stavi(sc,PREF+'traka natpisa',bojaVrsta,bojaPostavke(BOJE.tamna,CW*.6,CH*.075),ulazi);await polozaj(sc,ids[sc].traka,CW*.03,CH*.87);
   ids[sc].crta=await stavi(sc,PREF+'crta natpisa',bojaVrsta,bojaPostavke(BOJE.cyan,CW*.006,CH*.075),ulazi);await polozaj(sc,ids[sc].crta,CW*.03,CH*.87);
   ids[sc].natpis=await stavi(sc,PREF+'natpis',tekstVrsta,tekstPostavke('',40*u,BOJE.bijela,{sirina:CW*.56,visina:CH*.06}),ulazi);await polozaj(sc,ids[sc].natpis,CW*.045,CH*.882)}
  const sn=scena('naslov');ids[sn]={};
  ids[sn].poz=await stavi(sn,PREF+'podloga kartice',bojaVrsta,bojaPostavke(BOJE.tamna,CW,CH),ulazi);await polozaj(sn,ids[sn].poz,0,0);
  ids[sn].znak=await stavi(sn,PREF+'znak',tekstVrsta,tekstPostavke('F O R T R O N I ',36*u,BOJE.bijela),ulazi);await polozaj(sn,ids[sn].znak,CW*.07,CH*.08);
  ids[sn].znakq=await stavi(sn,PREF+'znak Q',tekstVrsta,tekstPostavke('Q',36*u,BOJE.cyan),ulazi);
  const[zw]=await velicinaIzvora(sn,ids[sn].znak);await polozaj(sn,ids[sn].znakq,CW*.07+(zw&&zw<CW?zw:36*u*8*.75),CH*.08);
  ids[sn].veliki=await stavi(sn,PREF+'naslov kartice',tekstVrsta,tekstPostavke('',84*u,BOJE.bijela,{sirina:CW*.84,visina:CH*.28}),ulazi);await polozaj(sn,ids[sn].veliki,CW*.07,CH*.36);
  ids[sn].crta=await stavi(sn,PREF+'crta kartice',bojaVrsta,bojaPostavke(BOJE.cyan,CW*.16,Math.max(4,5*u)),ulazi);await polozaj(sn,ids[sn].crta,CW*.07,CH*.33);
  ids[sn].mali=await stavi(sn,PREF+'podnaslov kartice',tekstVrsta,tekstPostavke('',54*u,BOJE.svijetla,{sirina:CW*.84,visina:CH*.2,tanko:true}),ulazi);await polozaj(sn,ids[sn].mali,CW*.07,CH*.66);
  const[sw,sh]=await velicinaIzvora(scena('cijeli'),ids[scena('cijeli')].izvor);
  for(const k of ZOOM)await postaviZoom(k,sw,sh);
  await prijelaz();sp('ids',ids);spremno=true;lamp('ok','OBS spojen · platno '+CW+'×'+CH+' · scene FTQ pripremljene');setTimeout(()=>{$('obs-ploca').open=false},2500);
  await natpisVidljiv();zad=-1;zadKadar='';zadTekst=-1;
  poruka('Scene su pripremljene: '+KAD.map(scena).join(', ')+'. Izvor '+sw+'×'+sh+'.'+(ZOOM.length?' Kadrove namjesti gumbom „Namjesti kadrove”.':''));
 }catch(e){poruka('Greška pri pripremi: '+e.message)}finally{$('b-pripremi').disabled=false}}
async function prijelaz(){try{const t=(await R('GetSceneTransitionList')).transitions||[];
 const mv=t.find(x=>x.transitionKind==='move_transition'),fd=t.find(x=>x.transitionKind==='fade_transition');const izb=mv||fd;
 if(izb){await R('SetCurrentSceneTransition',{transitionName:izb.transitionName});await R('SetCurrentSceneTransitionDuration',{transitionDuration:mv?600:350})}}catch(e){}}
async function ucitajIds(){ids={};for(const k of KAD){const sc=scena(k);const it=(await R('GetSceneItemList',{sceneName:sc})).sceneItems||[];ids[sc]={};
 for(const i of it){const n=i.sourceName;const map={[PREF+'traka natpisa']:'traka',[PREF+'crta natpisa']:'crta',[PREF+'natpis']:'natpis',[PREF+'podloga kartice']:'poz',[PREF+'naslov kartice']:'veliki',[PREF+'podnaslov kartice']:'mali'};
  if(map[n])ids[sc][map[n]]=i.sceneItemId;else if(k!=='naslov'&&!n.startsWith(PREF)){if(ids[sc].izvor==null&&n===$('s-izvor').value)ids[sc].izvor=i.sceneItemId;else if(n===$('s-kam').value)ids[sc].kamera=i.sceneItemId}}}}
async function natpisVidljiv(){if(!obs.ok)return;const da=$('c-natpis').checked;
 for(const k of KAD.filter(x=>x!=='naslov')){const sc=scena(k);if(!ids[sc])continue;for(const d of['traka','crta','natpis'])if(ids[sc][d]!=null)await R('SetSceneItemEnabled',{sceneName:sc,sceneItemId:ids[sc][d],sceneItemEnabled:da}).catch(()=>{})}}
$('b-pripremi').onclick=pripremi;
$('b-novi').onclick=async()=>{try{const vr=(await R('GetInputKindList',{unversioned:false})).inputKinds||[];
 const v=['monitor_capture','xshm_input','screen_capture','pipewire-desktop-capture-source'].find(x=>vr.includes(x));if(!v){poruka('OBS nema vrstu izvora za snimanje zaslona.');return}
 const sc=(await R('GetCurrentProgramScene')).currentProgramSceneName;const ime=PREF+'zaslon';
 await R('CreateInput',{sceneName:sc,inputName:ime,inputKind:v,inputSettings:{}});
 $('s-izvor').add(new Option(ime,ime,true,true));$('s-izvor').value=ime;sp('izvor',ime);
 poruka('Napravljen izvor „'+ime+'” u sceni „'+sc+'”. U OBS-u provjeri da snima pravi monitor (desni klik → Svojstva), pa klikni „Pripremi scene”.')}catch(e){poruka(e.code===601?'Izvor „FTQ · zaslon” već postoji — odaberi ga u popisu.':'Greška: '+e.message)}};

/* ---------- kadrovi po vremenu ---------- */
let zadKadar='',rucno=null,zadTekst=-1;
function kadarU(s){const i=ki(s),k=S[i];let r=k.kadrovi[0]?k.kadrovi[0][1]:'cijeli',j=0;k.kadrovi.forEach((p,n)=>{if(k.t+p[0]<=s){r=p[1];j=n}});return{k:r,i,j}}
function oznaciKadar(){document.querySelectorAll('#kadrovi button').forEach(b=>b.classList.toggle('akt',scena(b.dataset.k)===trenScena))}
function rucniKadar(k){rucno={k,od:kadarU(sad())};prebaci(k)}
function prebaci(k){zadKadar=k;if(!obs.ok||!spremno)return;const sc=scena(k);if(sc===trenScena)return;R('SetCurrentProgramScene',{sceneName:sc}).then(()=>{trenScena=sc;oznaciKadar()}).catch(e=>poruka(e.code===600?'Scena „'+sc+'” ne postoji — klikni „Pripremi scene u OBS-u”.':'Greška: '+e.message))}
$('kadrovi').addEventListener('click',e=>{const b=e.target.closest('button');if(b)rucniKadar(b.dataset.k)});
function tekstovi(i){if(!obs.ok||!spremno)return;const k=S[i];const kt=k.kartica||[k.dio,k.naslov];
 R('SetInputSettings',{inputName:PREF+'natpis',inputSettings:{text:k.naslov},overlay:true}).catch(()=>{});
 R('SetInputSettings',{inputName:PREF+'naslov kartice',inputSettings:{text:kt[0]},overlay:true}).catch(()=>{});
 R('SetInputSettings',{inputName:PREF+'podnaslov kartice',inputSettings:{text:kt[1]},overlay:true}).catch(()=>{})}

/* ---------- snimanje i poglavlja ---------- */
let zapisPoglavlja=ucitaj('poglavlja',[]);
/* vrijeme snimke: bez trajanja pauza (OBS javlja PAUSED/RESUMED) */
function recT(){const n=performance.now();return (n-rec0-pauzaUk-(pauzaOd?n-pauzaOd:0))/1000}
function zabiljezi(i){if(!snima)return;const t=recT();if(zapisPoglavlja.length&&zapisPoglavlja[zapisPoglavlja.length-1].i===i)return;zapisPoglavlja.push({i,t});sp('poglavlja',zapisPoglavlja)}
$('b-rec').onclick=()=>{R(snima?'StopRecord':'StartRecord').catch(e=>poruka('Greška: '+e.message))};
$('b-sve').onclick=async()=>{if(uz()){try{if(!snima)await R('StartRecord');rzCmd('kreni');zad=-1}catch(e){poruka('Greška: '+e.message)}return}
 if(REZ)poruka('Autopilot nije otvoren — sat teče samo u čitaču. Za predavanje otvori autopilot na snimanom zaslonu.');post(0);igraj(false);zad=-1;try{if(!snima)await R('StartRecord');igraj(true)}catch(e){poruka('Greška: '+e.message)}};
function preuzmi(ime,tekst){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([tekst],{type:'text/plain;charset=utf-8'}));a.download=ime;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
const hms=s=>{s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor(s%3600/60),x=s%60;return(h?h+':'+String(m).padStart(2,'0'):String(m).padStart(2,'0'))+':'+String(x).padStart(2,'0')};
/* čišćenje: kratki skokovi (< 20 s) se zanemaruju, poglavlja idu redom koraka */
function ocisti(z){if(!z.length)return z;const kraj=Math.max(z[z.length-1].t+30,snima?recT():0);
 const seg=z.map((p,n)=>({i:p.i,t0:p.t,t1:n+1<z.length?z[n+1].t:kraj})),dug=seg.filter(s=>s.t1-s.t0>=20);
 const koraci=[...new Set(dug.map(s=>s.i))].sort((a,b)=>a-b),out=[];
 for(const i of koraci){const prije=Math.max(0,...dug.filter(s=>s.i<i).map(s=>s.t1));const c=dug.find(s=>s.i===i&&s.t0>=prije-0.01)||dug.filter(s=>s.i===i).pop();
  if(!out.length||c.t0>out[out.length-1].t)out.push({i,t:c.t0})}
 if(out.length)out[0].t=0;return out}
function poglavlja(){const z=zapisPoglavlja.length?ocisti(zapisPoglavlja):S.map((k,i)=>({i,t:k.t}));const red=[];let zadDio='';
 z.forEach((p,n)=>{const k=S[p.i];const t=n===0?0:p.t;if(red.length&&t-red[red.length-1].t<10)return;red.push({t,n:(k.dio!==zadDio?k.dio+' — ':'')+k.naslov});zadDio=k.dio});
 return red.map(r=>hms(r.t)+' '+r.n).join('\n')+'\n'}
$('b-pogl').onclick=()=>{preuzmi('poglavlja-youtube.txt',poglavlja());if(!zapisPoglavlja.length)poruka('Nema zapisa snimanja — poglavlja su iz vremena scenarija.')};
const srtT=s=>{const ms=Math.round(s*1000);const h=Math.floor(ms/3600000),m=Math.floor(ms%3600000/60000),x=Math.floor(ms%60000/1000),r=ms%1000;return[h,m,x].map(v=>String(v).padStart(2,'0')).join(':')+','+String(r).padStart(3,'0')};
$('b-srt').onclick=()=>{const z=zapisPoglavlja.length?ocisti(zapisPoglavlja):S.map((k,i)=>({i,t:k.t}));
 preuzmi('naslovi-koraka.srt',z.map((p,n)=>(n+1)+'\n'+srtT(p.t)+' --> '+srtT(p.t+5)+'\n'+S[p.i].naslov+'\n').join('\n'))};

/* ---------- uređivač kadrova ---------- */
let urK=ZOOM[0],slika=null,sw0=CW,sh0=CH,vuce=null,regU=null;
const pl=$('platno'),cx=pl.getContext('2d');
$('ur-kadrovi').innerHTML=ZOOM.map(k=>'<button data-k="'+k+'">'+esc(KD[k].naziv)+'</button>').join('');
function urOznaci(){document.querySelectorAll('#ur-kadrovi button').forEach(b=>b.classList.toggle('akt',b.dataset.k===urK))}
function urCrtaj(){cx.fillStyle='#000';cx.fillRect(0,0,pl.width,pl.height);if(slika)cx.drawImage(slika,0,0,pl.width,pl.height);
 for(const k of ZOOM){const o=okvirKadraU(k);cx.lineWidth=k===urK?4:2;cx.strokeStyle=k===urK?'#2ECAD4':'rgba(255,255,255,.6)';cx.setLineDash(k===urK?[]:[8,6]);
  cx.strokeRect(o.x*pl.width,o.y*pl.height,o.w*pl.width,o.h*pl.height);cx.setLineDash([]);cx.fillStyle=k===urK?'#2ECAD4':'rgba(255,255,255,.8)';cx.font='600 22px Segoe UI, sans-serif';cx.fillText(KD[k].naziv,o.x*pl.width+8,o.y*pl.height+26)}}
function okvirKadraU(k){const s=reg;reg=regU;const o=okvirKadra(k,sw0,sh0);reg=s;return o}
async function urSnimka(){if(!obs.ok){poruka('Spoji OBS za snimku izvora.');return}
 try{const izv=$('s-izvor').value;const sc=scena('cijeli');if(ids[sc]&&ids[sc].izvor!=null){[sw0,sh0]=await velicinaIzvora(sc,ids[sc].izvor)}
  pl.width=1280;pl.height=Math.round(1280*sh0/sw0);
  /* OBS iscrtava snimanje zaslona samo dok je izvor aktivan: prije snimke prebaci na scenu Cijeli zaslon */
  if(spremno&&trenScena!==scena('cijeli')){await R('SetCurrentProgramScene',{sceneName:scena('cijeli')});trenScena=scena('cijeli');zadKadar='cijeli';oznaciKadar();await new Promise(r=>setTimeout(r,600))}
  const r=await R('GetSourceScreenshot',{sourceName:izv,imageFormat:'jpg',imageWidth:1280,imageCompressionQuality:75});
  const im=new Image();im.onload=()=>{slika=im;urCrtaj()};im.src=r.imageData}catch(e){poruka('Snimka nije uspjela: '+e.message)}}
$('b-uredi').onclick=()=>{regU=JSON.parse(JSON.stringify(reg));$('urednik').classList.add('otv');urOznaci();urCrtaj();urSnimka()};
$('ur-zatvori').onclick=()=>$('urednik').classList.remove('otv');
$('ur-osvjezi').onclick=urSnimka;
$('ur-kadrovi').addEventListener('click',e=>{const b=e.target.closest('button');if(b){urK=b.dataset.k;urOznaci();urCrtaj()}});
$('ur-zadano').onclick=()=>{regU[urK]=KD[urK].r.slice();urCrtaj()};
const tocka=e=>{const r=pl.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
pl.addEventListener('pointerdown',e=>{vuce=tocka(e);pl.setPointerCapture(e.pointerId)});
pl.addEventListener('pointermove',e=>{if(!vuce)return;const[x,y]=tocka(e);let w=Math.abs(x-vuce[0]);const kh=(sw0/sh0)*(CH/CW);
 if(Math.abs(y-vuce[1])/kh>w)w=Math.abs(y-vuce[1])/kh;w=Math.max(.08,Math.min(1,w));const h=w*kh;
 let x0=x<vuce[0]?vuce[0]-w:vuce[0],y0=y<vuce[1]?vuce[1]-h:vuce[1];x0=Math.max(0,Math.min(1-w,x0));y0=Math.max(0,Math.min(1-h,y0));
 regU[urK]=[+x0.toFixed(4),+y0.toFixed(4),+w.toFixed(4)];urCrtaj()});
pl.addEventListener('pointerup',()=>{vuce=null});
$('ur-spremi').onclick=async()=>{reg=JSON.parse(JSON.stringify(regU));sp('reg',reg);
 if(obs.ok){try{const sc=scena('cijeli');if(!ids[sc]||ids[sc].izvor==null)await ucitajIds();const[sw,sh]=await velicinaIzvora(sc,ids[sc].izvor);for(const k of ZOOM)await postaviZoom(k,sw,sh);poruka('Kadrovi spremljeni i primijenjeni u OBS-u.')}catch(e){poruka('Spremljeno, ali nije primijenjeno: '+e.message)}}
 else poruka('Kadrovi spremljeni; primijenit će se kod sljedeće pripreme scena.');
 $('urednik').classList.remove('otv')};

/* ---------- glavna petlja ---------- */
function crtaj(){let s=sad();const i0=ki(s);
 if(!uz()&&igra&&$('c-cekaj').checked&&!ceka&&i0>zadUCekanju){const kraj=S[zadUCekanju+1]?S[zadUCekanju+1].t:KRAJ;if(s>=kraj&&zadUCekanju>=0){sat=kraj-.05;igra=false;ceka=true;s=sat}}
 const i=ki(s),sl=i+1<S.length?S[i+1].t:KRAJ;if(!ceka)zadUCekanju=i;
 if(!uz()&&igra&&s>=KRAJ){sat=KRAJ;igra=false}
 const ig=uz()?rz.igra:igra,ck=uz()?rz.ceka:ceka;
 $('vr').textContent=mm(s)+' / '+mm(KRAJ);
 $('st').textContent=(REZ?(uz()?'autopilot povezan · ':'autopilot nije otvoren · '):'')+(ck?'čeka ⏭ (sljedeći korak)':ig?'sat teče':'pauza')+' · sljedeće za '+mm(sl-s)+(snima?(pauzaOd?' · ❚❚ snimanje pauzirano ':' · ● snima ')+hms(recT()):'')+' · dvoklik na korak = skok';
 $('b-igraj').textContent=ig?'⏸ Pauza':'▶ Pokreni';
 if(i!==zad){document.querySelectorAll('.k').forEach((el,j)=>{el.classList.toggle('sada',j===i);el.classList.toggle('gotov',j<i)});
  const el=$('k'+i);if(el&&zad>=0)el.scrollIntoView({behavior:'smooth',block:'start'});zad=i;zabiljezi(i)}
 if(i!==zadTekst&&obs.ok){tekstovi(i);zadTekst=i}
 const kd=kadarU(s);
 document.querySelectorAll('#k'+i+' .plan span').forEach(e=>e.classList.toggle('sad',+e.dataset.j===kd.j));
 if(rucno&&(rucno.od.i!==kd.i||rucno.od.j!==kd.j))rucno=null;
 const zelja=rucno?rucno.k:kd.k;
 if($('c-auto').checked&&obs.ok&&!rucno&&zelja!==zadKadar){zadKadar=zelja;prebaci(zelja)}
 const b=document.querySelector('#k'+i+' .napr i');if(b)b.style.width=Math.min(100,(s-S[i].t)/(sl-S[i].t)*100)+'%';
 requestAnimationFrame(crtaj)}
const vrhV=()=>document.documentElement.style.setProperty('--vrh',document.querySelector('.vrh').offsetHeight+'px');vrhV();
new ResizeObserver(vrhV).observe(document.querySelector('.vrh'));
requestAnimationFrame(crtaj);
window.__citac={get sat(){return sad()},post,igraj,dalje,obs,get ids(){return ids},get reg(){return reg},R,pripremi,obsAuth,sha256,b64,utf8,poglavlja,ocisti,recT,get rz(){return rz},uz};
})();
