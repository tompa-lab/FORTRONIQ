<!DOCTYPE html>
<html lang="hr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Predavanje — Industrijski robot ABB IRB 120 | FORTRONIQ</title>
<link rel="icon" href="../favicon.ico">
<style>
:root{--paper:#fff;--ink:#10394A;--body:#5D7C90;--rule:#DCE4E8;--teal:#17656E;--teal-d:#0F4A52;--cyan:#2ECAD4;--bar:#17181A;--tanko:#EEF4F6}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}}
:root[data-theme="dark"]{--paper:#0E1A1F;--ink:#E6F1F4;--body:#9DB6C2;--rule:#24363E;--teal:#2ECAD4;--teal-d:#7FE3E9;--tanko:#14262D}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--paper);color:var(--ink);font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body.reziser{overflow:hidden;background:#000}
#okvir{position:fixed;inset:0;width:100vw;height:100vh;border:0;background:#fff}
#kursor{position:fixed;left:0;top:0;z-index:50;width:26px;height:26px;pointer-events:none;transform:translate(960px,540px);transition:transform .6s cubic-bezier(.4,0,.2,1);filter:drop-shadow(0 2px 3px rgba(0,0,0,.35))}
#kursor svg{display:block;width:26px;height:26px}
#kursor.skriven{opacity:0}
.val{position:fixed;z-index:49;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;border:3px solid #2ECAD4;pointer-events:none;animation:val .55s ease-out forwards}
@keyframes val{from{transform:scale(.3);opacity:1}to{transform:scale(1.4);opacity:0}}
#traka{position:fixed;left:14px;bottom:14px;z-index:60;display:flex;align-items:center;gap:10px;background:rgba(16,24,28,.88);color:#E9EDEF;border:1px solid rgba(46,202,212,.5);border-radius:12px;padding:8px 12px;font-size:14px;transition:opacity .4s;max-width:min(760px,calc(100vw - 28px))}
#traka.skrij{opacity:0;pointer-events:none}
#traka button{font:inherit;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:4px 10px;cursor:pointer}
#traka button:hover{border-color:#2ECAD4;color:#2ECAD4}
#traka .vr{font-variant-numeric:tabular-nums;font-weight:600;min-width:110px}
#traka .nas{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#start{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;background:rgba(9,22,26,.86)}
#start[hidden]{display:none}
.karta{background:var(--paper);color:var(--ink);border-radius:16px;max-width:720px;width:calc(100% - 32px);padding:28px 30px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.karta h1{margin:0 0 6px;font-size:1.6rem;letter-spacing:-.02em}
.karta .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem;color:var(--body)}.karta .znak b{color:var(--cyan)}
.karta p,.karta li{color:var(--body);line-height:1.55;font-size:.97rem}
.karta ol{padding-left:1.2rem;margin:.6rem 0 1rem}
.gumbi{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.gumb{font:inherit;font-weight:600;background:var(--teal);color:#fff;border:0;border-radius:999px;padding:.7rem 1.3rem;cursor:pointer}
.gumb.tanki{background:transparent;color:var(--teal);border:1px solid var(--teal)}
.gumb:focus-visible,#traka button:focus-visible{outline:3px solid var(--cyan);outline-offset:2px}
kbd{font:600 .85em "IBM Plex Mono",ui-monospace,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:5px;padding:0 .35em;color:var(--ink)}
/* ---------------- čitač */
body.citac{background:var(--paper)}
.c-vrh{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 18px;background:var(--bar);color:#E9EDEF}
.c-vrh .znak{letter-spacing:.17em;font-weight:700;font-size:.8rem}.c-vrh .znak b{color:var(--cyan)}
.c-vrh .vr{font:700 1.5rem/1 "IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
.c-vrh .st{font-size:.85rem;color:#9DB6C2}
.c-vrh button{font:inherit;font-size:.9rem;background:transparent;color:#E9EDEF;border:1px solid rgba(233,237,239,.35);border-radius:8px;padding:5px 10px;cursor:pointer}
.c-vrh button:hover{border-color:#2ECAD4;color:#2ECAD4}
.c-vrh .desno{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.c-popis{max-width:1100px;margin:0 auto;padding:14px 18px 60vh}
.c-k{border:1px solid var(--rule);border-radius:14px;padding:16px 20px;margin:0 0 12px;opacity:.55;transition:opacity .3s,border-color .3s}
.c-k.sada{opacity:1;border-color:var(--teal);box-shadow:0 0 0 2px var(--teal) inset}
.c-k.gotov{opacity:.35}
.c-k .gl{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px}
.c-k .t{font:700 1rem "IBM Plex Mono",ui-monospace,monospace;color:var(--teal)}
.c-k .dio{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--body);font-weight:600}
.c-k h2{margin:0;font-size:1.25rem;color:var(--ink)}
.c-k .klik{margin:.5rem 0 .6rem;font-size:.92rem;color:var(--body);border-left:3px solid var(--cyan);padding-left:10px}
.c-k .tekst{font-size:var(--vel,1.45rem);line-height:1.5;margin:.4rem 0 0;color:var(--ink)}
.c-k .dop{font-size:calc(var(--vel,1.45rem) * .82);line-height:1.5;margin:.7rem 0 0;color:var(--body)}
.c-k .dop b{color:var(--ink)}
.c-k .napr{height:5px;border-radius:3px;background:var(--rule);margin-top:12px;overflow:hidden}
.c-k .napr i{display:block;height:100%;width:0;background:var(--teal)}
@media (max-width:680px){.c-k .tekst{font-size:1.15rem}.c-vrh .vr{font-size:1.2rem}}
</style>

<body>
<script>window.SCENARIJ = [{"t": 0, "dio": "Uvod", "naslov": "Dobrodošlica i cilj predavanja", "str": "index", "radnje": [["str", "index"], ["cekaj", 3]], "klik": "Naslovnica područja Industrijski robot ABB IRB 120.", "tekst": "Dobar dan. Danas upoznajemo industrijski robot ABB IRB 120 — malog, šestoosnog robota koji se godinama koristio za montažu, rukovanje sitnim dijelovima i u nastavi. Proći ćemo ga iznutra: članke, motore s kočnicama, prijenosnike i zupčaste remene, mjerni sustav s baterijom i kalibraciju, zatim upravljački ormar IRC5 Compact i privjesak FlexPendant. Nakon toga računamo izravnu i inverznu kinematiku, pogledamo stvarnog robota u laboratoriju, robota u petlji s PLC-om, programiranje u RobotStudiju, i na kraju kamo ide robotika — prema fizičkoj umjetnoj inteligenciji. Sve što ćete vidjeti radi u pregledniku, pa sve možete ponoviti sami.", "dopuna": "Pitanje za vas: po čemu se industrijski robot poput IRB 120 razlikuje od kobota UR3e koji smo već upoznali — u zaštiti, brzini i načinu programiranja?"}, {"t": 90, "dio": "Uvod", "naslov": "Što ćemo moći nakon predavanja", "str": "index", "radnje": [["lebdi", "#goals li:nth-child(1)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(2)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(3)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(4)"], ["cekaj", 12], ["lebdi", "#goals li:nth-child(5)"]], "klik": "Blok „Moći ću” — pet ishoda (pokazivač prelazi preko svakoga).", "tekst": "Na vrhu stranice je pet ishoda. Nakon današnjeg sata trebali biste nabrojati dijelove robota IRB 120 i pokazati ih na modelu; objasniti pogon osi — motor, kočnicu, prijenosnik i zupčasti remen; opisati mjerni sustav, bateriju i kalibraciju; opisati ormar IRC5 Compact, privjesak, načine rada i sigurnosni lanac; i objasniti programiranje izvan robota u RobotStudiju te kako se simulacija povezuje sa stvarnim robotom. Na kraju sata ishode ćemo provjeriti.", "dopuna": "Zapišite ishode — na kraju sata svaki ćemo označiti."}, {"t": 180, "dio": "Uvod", "naslov": "Poglavlja područja", "str": "index", "radnje": [["skrol", ".moduli"], ["cekaj", 3], ["lebdi", ".moduli li:nth-child(1) .gumb"], ["cekaj", 6], ["lebdi", ".moduli li:nth-child(2) .gumb"], ["cekaj", 6], ["lebdi", ".moduli li:nth-child(3) .gumb"], ["cekaj", 6], ["lebdi", ".moduli li:nth-child(4) .gumb"], ["cekaj", 6], ["lebdi", ".moduli li:nth-child(5) .gumb"], ["cekaj", 6], ["lebdi", ".moduli li:nth-child(6) .gumb"], ["cekaj", 6], ["klik", ".moduli li:nth-child(1) .gumb"]], "klik": "Popis poglavlja: Upoznavanje, Upravljanje (u petlji), Kinematika, RobotStudio, proširena stvarnost, Prema fizičkoj AI; klik na prvo.", "tekst": "Područje ima šest poglavlja. Upoznavanje robota je robot dio po dio, s animacijama „Kako radi”. Upravljanje vodi na simulator robota u petlji s virtualnim privjeskom i PLC-om. Kinematika računa uživo, od kutova do alata i natrag. RobotStudio je ABB-ov alat za programiranje izvan robota. Tu su i robot u proširenoj stvarnosti i stranica o fizičkoj umjetnoj inteligenciji. Ispod poglavlja su još četiri primjene: crtanje, glodanje, 3D ispis i skeniranje. Krećemo s upoznavanjem.", "dopuna": ""}, {"t": 240, "dio": "1 Upoznavanje", "naslov": "Raspored stranice", "str": "upoz", "radnje": [["str", "upoz"], ["cekaj", 6], ["poravnaj"], ["cekaj", 3], ["lebdi", ".uz-izbornik .karta-h"], ["cekaj", 8], ["lebdi", "#k-scena .karta-h h2"], ["cekaj", 8], ["lebdi", "#kartica .karta-h"]], "klik": "Stranica Upoznavanje robota: lijevo izbornik dijelova (81 stavka), u sredini 3D prikaz, desno objašnjenje.", "tekst": "Stranica ima tri stupca. Lijevo je izbornik s 81 stavkom — od cijelog robota preko svake osi do ormara i privjeska; stavke sa strelicom otvaraju podizbornik, a uz pregledane se pojavi kvačica. U sredini je trodimenzionalni model. Vanjski oblik robota dolazi iz ABB-ovih CAD podataka, pojednostavljen za mobitel, a unutrašnjost je naš načelni crtež. Desno je objašnjenje odabranog dijela. Kad kliknete stavku, model se okrene prema njoj i istakne je.", "dopuna": ""}, {"t": 300, "dio": "1 Upoznavanje", "naslov": "Pogledi i rukovanje 3D prikazom", "str": "upoz", "radnje": [["pogled", "sve"], ["cekaj", 6], ["pogled", "sprijeda"], ["cekaj", 6], ["pogled", "bok"], ["cekaj", 6], ["pogled", "odozgo"], ["cekaj", 6], ["pogled", "robot"], ["cekaj", 4], ["okret", 12], ["lebdi3d", 0.48, 0.45], ["cekaj", 4]], "klik": "Gumbi pogleda Sve, Sprijeda, Bok, Odozgo, Robot; polagano okretanje; prelazak mišem pokazuje naziv dijela.", "tekst": "Gumbima iznad prikaza mijenjate pogled: Sve — robot, ormar i privjesak; zatim sprijeda, bočno i odozgo; i samo robot. Mišem povucite za okretanje, kotačićem zumirate, desnom tipkom pomičete prikaz. Kad prijeđete mišem preko modela, pojavi se naziv dijela, a klikom ga odaberete. Na mobitelu je sve isto, prstima.", "dopuna": ""}, {"t": 390, "dio": "1 Upoznavanje", "naslov": "Cijeli robot i položaji", "str": "upoz", "radnje": [["meni", 2], ["cekaj", 10], ["klik", "[data-polozaj=\"nula\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"sklopljen\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"kalibracijski\"]"], ["cekaj", 9], ["klik", "[data-polozaj=\"pocetni\"]"], ["cekaj", 6]], "klik": "Stavka „Cijeli robot”; gumbi Položaj: Nulti, Sklopljen, Kalibracijski, Početni.", "tekst": "IRB 120 ima masu 25 kilograma, nosivost 3 kilograma — 4 kilograma kad zapešće gleda okomito dolje — i doseg 580 milimetara, mjeren do središta zapešća. Ponovljivost položaja je 0,01 milimetra prema ISO 9283. Postolje je 180 puta 180 milimetara, robot je visok oko 700 milimetara, zaštita je IP30, a postoji i izvedba za čisti prostor razreda ISO 5. Montira se na pod, zid ili naopako, pod bilo kojim kutom. U nultom položaju donja ruka stoji uspravno, a gornja vodoravno; kalibracijski položaj je onaj iz priručnika za kalibraciju. ABB je robot predstavio 2009., a danas ga vodi kao ukinut model; nasljednik je IRB 1200.", "dopuna": "Ponovljivost 0,01 mm nije točnost: robot se vrlo precizno vraća u istu točku, ali apsolutni položaj u prostoru može odstupati više. Pitanje: zašto je za većinu zadataka važnija ponovljivost?"}, {"t": 510, "dio": "1 Upoznavanje", "naslov": "Kako radi: sferno zapešće", "str": "upoz", "radnje": [["tema"], ["cekaj", 8], ["klizac", "Os 2", 30, 5], ["cekaj", 6], ["klizac", "Os 3", -30, 5], ["cekaj", 6], ["klizac", "Os 5", 40, 5], ["cekaj", 8], ["klikT", "Os 5 na 0°"], ["cekaj", 14], ["klikT", "Nulti položaj"], ["cekaj", 10], ["tema"]], "klik": "Animacija „Sferno zapešće”: klizači osi 2, 3 i 5, gumbi „Os 5 na 0°” i „Nulti položaj”.", "tekst": "Osi 4, 5 i 6 sijeku se u jednoj točki — središtu zapešća. U nultoj pozi ono je 302 milimetra ispred osi 1 i 630 milimetara iznad poda, a prirubnica je još 72 milimetra dalje. Zato je zapešće sferno: osi 1 do 3 određuju gdje je središte zapešća, a osi 4 do 6 kako je alat okrenut. Na tome počiva i inverzna kinematika koju radimo poslije. Kad os 5 dođe na nulu, osi 4 i 6 leže na istom pravcu — to je singularni položaj zapešća: dvije osi rade isto gibanje i robot pri pravocrtnom gibanju mora naglo zakretati.", "dopuna": "Pitanje: zašto proizvođači gotovo uvijek grade zapešće kao sferno, iako bi drugačiji raspored osi dao veću slobodu oblikovanja?"}, {"t": 660, "dio": "1 Upoznavanje", "naslov": "Postolje, priključci i korisnički vodovi", "str": "upoz", "radnje": [["meni", 3], ["cekaj", 12], ["meni", 4], ["cekaj", 14], ["meni", 7], ["cekaj", 14], ["meni", 11], ["cekaj", 12]], "klik": "Stavke Postolje, Priključci R1.MP i R1.SMB, Korisnički priključci i zrak, Priključci na gornjoj ruci.", "tekst": "Postolje se pričvrsti s četiri vijka M10 i dva zatika. Na stražnjoj strani su priključci kabela prema ormaru: R1.MP nosi napajanje motora i kočnica, a R1.SMB signale mjernog sustava. Za alat robot ima ugrađene vodove: četiri crijeva za zrak, vanjskog promjera 4 milimetra, do 5 bara, i deset signalnih vodiča — od priključka R1.CP/CS na postolju kroz robota do R3.CP/CS na gornjoj ruci, 49 volta i 500 miliampera. Tako hvataljka ili ventil na alatu nemaju vanjskih kabela koji bi zapinjali.", "dopuna": ""}, {"t": 780, "dio": "1 Upoznavanje", "naslov": "Kako radi: mjerni sustav i baterija", "str": "upoz", "radnje": [["meni", 5], ["cekaj", 8], ["tema"], ["cekaj", 10], ["klikT", "Isključi ormar"], ["cekaj", 12], ["klikT", "Pomakni os rukom"], ["cekaj", 12], ["klikT", "Isprazni bateriju"], ["cekaj", 14], ["klikT", "Ažuriraj brojač okretaja"], ["cekaj", 12], ["tema"]], "klik": "Stavka „Ploča sučelja enkodera”; animacija: Isključi ormar, Pomakni os rukom, Isprazni bateriju, Ažuriraj brojač okretaja.", "tekst": "Svaki motor ima mjerni pretvornik kuta. Signali idu na ploču sučelja enkodera u postolju robota, odatle signalnim kabelom na priključak R1.SMB u ormaru i do osnog računala. Pretvornik zna kut unutar jednog okretaja motora, a broj okretaja broji elektronika — i pamti ga kad je ormar isključen, zahvaljujući bateriji u robotu. Kad se baterija isprazni, robot javlja upozorenje 38213 „Battery charge low”, a nakon gubitka napajanja broj okretaja treba ažurirati. ABB propisuje zamjenu baterije svakih 36 mjeseci ili na to upozorenje.", "dopuna": "Pitanje: što bi se dogodilo da robot nakon prazne baterije krene bez ažuriranja brojača okretaja?"}, {"t": 930, "dio": "1 Upoznavanje", "naslov": "Članci robota", "str": "upoz", "radnje": [["meni", 8], ["cekaj", 9], ["meni", 9], ["cekaj", 9], ["meni", 10], ["cekaj", 9], ["meni", 12], ["cekaj", 9], ["meni", 13], ["cekaj", 9], ["meni", 14], ["cekaj", 9]], "klik": "Stavke Okretno kućište, Donja ruka, Gornja ruka, Kućište zapešća, Nagibno kućište, Prirubnica alata.", "tekst": "Robot je lanac članaka: postolje, okretno kućište koje se vrti oko osi 1, donja ruka oko osi 2, gornja ruka oko osi 3, zatim kućište zapešća, nagibno kućište i prirubnica alata. Između osi 2 i 3 je 270 milimetara, lakat je pomaknut 70 milimetara, od lakta do središta zapešća je 302, a do prirubnice još 72 milimetra. Prirubnica je mjesto gdje se pričvršćuje alat i gdje je ishodište alatnog koordinatnog sustava tool0. Svaka stavka u izborniku istakne svoj članak u modelu.", "dopuna": ""}, {"t": 1050, "dio": "1 Upoznavanje", "naslov": "Os 1: pogon iznutra", "str": "upoz", "radnje": [["meni", 15], ["cekaj", 8], ["izbor", "#z-izbor", "0"], ["klik", "#z-unutra"], ["cekaj", 12], ["meni", 16], ["cekaj", 8], ["meni", 18], ["cekaj", 8], ["meni", 19], ["cekaj", 8], ["klik", "#z-pomakni"], ["cekaj", 14], ["klik", "#z-unutra"], ["cekaj", 3]], "klik": "Stavka „Os 1” i podstavke Motor, Kočnica, Mjerenje kuta; „Prikaži unutrašnjost”, „Pomakni os”.", "tekst": "Os 1 okreće cijelu ruku: opseg ±165°, najveća brzina 250° u sekundi. Prema ABB-ovu popisu rezervnih dijelova, osi 1 i 2 pogone okretni izmjenični motori s ugrađenim prijenosnikom — motor i prijenosnik mijenjaju se kao jedna cjelina. Na stražnjem kraju motora je kočnica, a uz nju mjerni pretvornik kuta. „Prikaži unutrašnjost” učini kućište prozirnim, a „Pomakni os” zakrene samo tu os; rotor u modelu vrti se brže od izlaza, jer prijenosnik smanjuje brzinu. Smještaj i mjere unutarnjih dijelova su naša procjena — ABB ih ne objavljuje.", "dopuna": "Zamjena motora i prijenosnika kao cjeline skraćuje servis, ali poskupljuje rezervni dio. Pitanje: što je u proizvodnji važnije?"}, {"t": 1200, "dio": "1 Upoznavanje", "naslov": "Kako radi: valni prijenosnik", "str": "upoz", "radnje": [["meni", 17], ["cekaj", 8], ["tema"], ["cekaj", 8], ["klikT", "Jedan okretaj ulaza"], ["cekaj", 14], ["klikT", "200 / 202"], ["cekaj", 8], ["klikT", "Pokreni"], ["cekaj", 14], ["klikT", "Njihanje (usporedba zračnosti)"], ["cekaj", 14], ["tema"]], "klik": "Stavka „Prijenosnik”; animacija valnog prijenosnika: Jedan okretaj ulaza, 200 / 202, Pokreni, Njihanje.", "tekst": "ABB u priručniku ne piše kakav je prijenosnik u kojoj osi. No sve osi IRB 120 podmazuju se mašću Harmonic grease 4B No.2, koja se koristi za valne prijenosnike — pa zaključujemo da su valni. To je naš zaključak, ne podatak proizvođača. Valni prijenosnik ima tri dijela: eliptični generator vala, tankostijeni fleksibilni zupčanik i kruti prsten s dva zuba više. Za jedan okretaj ulaza izlaz zaostane za dva zuba — uz 200 i 202 zuba omjer je 100. Prijenosnik je kompaktan, u jednom stupnju i bez zračnosti, što je za robota s ponovljivošću od stotinke milimetra presudno.", "dopuna": "Pitanje: koja je cijena valnog prijenosnika — što se događa u fleksibilnom zupčaniku milijunima puta tijekom životnog vijeka?"}, {"t": 1350, "dio": "1 Upoznavanje", "naslov": "Kako radi: motor i regulacija", "str": "upoz", "radnje": [["meni", 16], ["cekaj", 6], ["tema"], ["cekaj", 6], ["klikT", "Blok (6 koraka)"], ["cekaj", 10], ["klikT", "Sinusna"], ["cekaj", 6], ["klikT", "Pomaknut 90°"], ["cekaj", 10], ["klikT", "Ispravan"], ["cekaj", 4], ["tema"], ["meni", 15], ["cekaj", 4], ["tema"], ["cekaj", 6], ["klikT", "Pomakni zglob na 90°"], ["cekaj", 12], ["klizac", "Pojačanje položaja", 12, 4], ["klikT", "Pomakni zglob na 90°"], ["cekaj", 12], ["tema"]], "klik": "Animacija motora (komutacija Sinusna / Blok, kut Ispravan / Pomaknut 90°), zatim animacija kaskadne regulacije (Pomakni na 90°, pojačanje Kp).", "tekst": "Motor treba struju u namotima u pravom trenutku, prema kutu rotora — to je komutacija. Ako elektronika krivo zna kut, motor ne daje moment iako teče puna struja. Regulacija je kaskadna: vanjska petlja uspoređuje zadani i stvarni kut i daje zadanu brzinu, srednja daje zadanu struju, a unutarnja struju regulira. Premalo pojačanje položaja znači da os zaostaje za zadanim, preveliko da prebaci. ABB ne objavljuje takt ni pojačanja regulatora IRC5 — vrijednosti u animaciji su primjer.", "dopuna": ""}, {"t": 1470, "dio": "1 Upoznavanje", "naslov": "Osi 2 i 3", "str": "upoz", "radnje": [["meni", 20], ["cekaj", 8], ["izbor", "#z-izbor", "1"], ["klik", "#z-pomakni"], ["cekaj", 12], ["meni", 25], ["cekaj", 8], ["izbor", "#z-izbor", "2"], ["klik", "#z-unutra"], ["cekaj", 10], ["klik", "#z-pomakni"], ["cekaj", 12], ["klik", "#z-unutra"], ["cekaj", 3]], "klik": "Stavke „Os 2” i „Os 3”; izbornik Os, „Pomakni os”, „Prikaži unutrašnjost”.", "tekst": "Os 2 diže i spušta donju ruku: ±110°, 250° u sekundi. To je gravitacijom najopterećenija os — drži masu cijele ruke i tereta na najvećem kraku. Os 3 okreće gornju ruku: od plus 70 do minus 110 stupnjeva, također 250° u sekundi. Kod osi 3 motor ne sjedi na samoj osi: prema ABB-u to je motorna jedinica s remenicom i zupčasti remen, a prijenosnik osi 3 nalazi se u donjoj ruci. Motor je tako bliže osi 2, pa ruka ima manji moment tromosti.", "dopuna": "Pitanje: zašto je motor osi 3 smješten uz rame, a ne uz lakat?"}, {"t": 1590, "dio": "1 Upoznavanje", "naslov": "Kako radi: zupčasti remen osi 3 i 5", "str": "upoz", "radnje": [["meni", 28], ["cekaj", 8], ["tema"], ["cekaj", 8], ["klikT", "Pokreni"], ["cekaj", 10], ["klizac", "Napetost remena", 15, 4], ["cekaj", 12], ["klizac", "Napetost remena", 95, 4], ["cekaj", 10], ["klizac", "Napetost remena", 55, 3], ["cekaj", 6], ["klikT", "Os 5"], ["cekaj", 10], ["tema"]], "klik": "Stavka „Zupčasti remen”; animacija: Pokreni, klizač napetosti (premala, prevelika, u granicama), Os 5.", "tekst": "Remen prenosi vrtnju s male remenice na motoru na veću remenicu ulaza prijenosnika. Ukupni omjer je umnožak omjera remena i prijenosnika. Premala napetost znači da remen preskače zube i os gubi položaj — upravljanje to vidi kao odstupanje položaja. Prevelika napetost troši ležajeve. ABB propisuje pregled zupčastih remena svakih 36 mjeseci i opisuje postupak podešavanja napetosti remena osi 3 i 5. Broj zuba remenica u animaciji je primjer.", "dopuna": "Pitanje: kako biste na stvarnom robotu provjerili napetost remena bez rastavljanja?"}, {"t": 1740, "dio": "1 Upoznavanje", "naslov": "Osi 4, 5 i 6 i rastavljanje robota", "str": "upoz", "radnje": [["meni", 31], ["cekaj", 7], ["meni", 36], ["cekaj", 7], ["meni", 42], ["cekaj", 7], ["pogled", "robot"], ["cekaj", 3], ["klik", "#z-rastavi"], ["cekaj", 16], ["klik", "#z-rastavi"], ["cekaj", 4], ["klik", "#z-svi"], ["cekaj", 40], ["klik", "#z-stop"], ["cekaj", 3]], "klik": "Stavke Os 4, Os 5, Os 6; „Rastavi robota”; „Sve osi redom”, „Stani”.", "tekst": "Zapešće ima tri osi. Os 4 zakreće kućište zapešća: ±160°, 320° u sekundi. Os 5 naginje zapešće: ±120°, 320° u sekundi; i ona ima motor s remenom, a prijenosnik je u gornjoj ruci. Os 6 okreće prirubnicu: zadano ±400°, a softverski do ±242 okretaja; brzina 420° u sekundi. Brža izvedba IRB 120T ima na osima 4, 5 i 6 420, 590 i 600° u sekundi. „Rastavi robota” razmakne članke duž lanca, a „Sve osi redom” pokrene osi od prve do šeste — dobro se vidi koji dio ruke pokreće koja os.", "dopuna": ""}, {"t": 1890, "dio": "1 Upoznavanje", "naslov": "Kako radi: kočnice i otpuštanje kočnica", "str": "upoz", "radnje": [["meni", 55], ["cekaj", 8], ["tema"], ["cekaj", 8], ["klikT", "Motors On"], ["cekaj", 12], ["klikT", "Drži: otpuštanje kočnica"], ["cekaj", 14], ["klikT", "Ispočetka"], ["cekaj", 8], ["tema"]], "klik": "Stavka „Tipka za otpuštanje kočnica”; animacija kočnice: Motors On, Drži: otpuštanje kočnica, Ispočetka.", "tekst": "Motori osi imaju kočnice koje drže robota kad su motori isključeni. IRB 120 nema tipke za otpuštanje kočnica na samom robotu: na prednjoj ploči ormara IRC5 Compact, ispod poklopca, jedna tipka otpušta kočnice svih osi odjednom. Drugi način je vanjskih 24 volta na priključak R1.MP. Pozor: bez kočnica ruka pada pod vlastitom težinom — prije otpuštanja ruku treba poduprijeti. To se radi samo za izvlačenje robota nakon sudara ili kod servisa.", "dopuna": "Pitanje: tko u laboratoriju smije otpustiti kočnice i što mora biti pripremljeno prije toga?"}, {"t": 2010, "dio": "1 Upoznavanje", "naslov": "Kabelski snop, prihvatnica i podmazivanje", "str": "upoz", "radnje": [["meni", 47], ["cekaj", 12], ["kvacica", "#p-alat"], ["meni", 49], ["cekaj", 12], ["kvacica", "#p-alat"], ["cekaj", 3]], "klik": "Stavke „Unutarnji kabelski snop” i „Prihvatnica (primjer alata)”; kvačica „prihvatnica”.", "tekst": "Kabeli i crijeva prolaze kroz unutrašnjost robota od postolja do zapešća, pa se pri gibanju savijaju i uvijaju — zato kabelski snop ima vodilice i prigušnice. Prihvatnica u modelu je naš primjer: paralelna hvataljka s prstima, kakvu koristimo u simulatorima crtanja i paletizacije. Prijenosnici su podmazani mašću, ne uljem: prema ABB-u 58 grama u osi 1, 40 u osi 2, 11 u osi 3, te 3,5, 5 i 3,5 grama u osima 4, 5 i 6. Generalni servis ABB predviđa oko 30 000 sati rada.", "dopuna": ""}, {"t": 2070, "dio": "1 Upoznavanje", "naslov": "Kako radi: kalibracija", "str": "upoz", "radnje": [["meni", 48], ["cekaj", 8], ["tema"], ["cekaj", 8], ["klikT", "Ažuriranje brojača okretaja"], ["cekaj", 6], ["klizac", "Kut odabrane osi", 6, 3], ["cekaj", 6], ["klikT", "Na oznaku"], ["cekaj", 8], ["klikT", "Ažuriraj osi 1–3"], ["cekaj", 10], ["klikT", "Ažuriraj osi 4–6"], ["cekaj", 10], ["klikT", "Kalibracija"], ["cekaj", 12], ["tema"]], "klik": "Stavka „Kalibracija”; animacija: Ažuriranje brojača okretaja, klizač kuta od oznake, Na oznaku, Ažuriraj osi 1–3 i 4–6, Kalibracija.", "tekst": "Kalibracija postoji na dvije razine. Ažuriranje brojača okretaja treba nakon prazne baterije ili zamjene dijela: os se dovede na sinkronizacijsku oznaku, s točnošću unutar pola okretaja motora, pa se brojač ažurira s privjeska — osi 1 do 3 i 4 do 6 u skupinama. Prava kalibracija određuje točan nulti kut. ABB je u novijim izdanjima priručnika kao standardni postupak uveo Axis Calibration; starije izdanje opisuje finu kalibraciju s kalibracijskim alatom. Kalibracijski položaji iz priručnika su: os 1 −170,2°, os 2 −115,1°, os 3 +75,8°, os 4 −174,7°, os 5 −90° i os 6 +90°.", "dopuna": "Pitanje: koja je razlika između ažuriranja brojača okretaja i kalibracije, i kad treba koje?"}, {"t": 2220, "dio": "1 Upoznavanje", "naslov": "Upravljački ormar IRC5 Compact", "str": "upoz", "radnje": [["meni", 50], ["cekaj", 6], ["pogled", "ormar"], ["cekaj", 8], ["meni", 51], ["cekaj", 6], ["meni", 52], ["cekaj", 6], ["meni", 53], ["cekaj", 6], ["meni", 54], ["cekaj", 6], ["meni", 56], ["cekaj", 6], ["meni", 57], ["cekaj", 6], ["meni", 58], ["cekaj", 6], ["meni", 61], ["cekaj", 6], ["meni", 62], ["cekaj", 6]], "klik": "Stavka „Upravljački ormar IRC5 Compact”, pogled Ormar; podstavke: glavna sklopka, preklopnik, Motors On, gljiva, glavno i osno računalo, pogonska jedinica, sigurnosna ploča, sklopnici.", "tekst": "IRC5 Compact je mali ormar za male robote. Druga generacija ima oko 310 puta 449 puta 442 milimetra — ABB-ov list iz 2023. navodi visinu 320 — i masu oko 28 kilograma; izvori se tu malo razlikuju. Napaja se jednofaznih 220 ili 230 volta, zaštite IP20. Sprijeda su glavna sklopka, preklopnik načina rada, tipka Motors On, gljiva za nužno zaustavljanje i, ispod poklopca, otpuštanje kočnica. Unutra su glavno računalo s RobotWareom, osno računalo koje računa regulaciju osi, pogonska jedinica s pretvaračima za motore, napajanje 24 volta, I/O ploča sa 16 ulaza i 16 izlaza, sigurnosna ploča, sklopnici, otpornik za kočenje, mrežni filtar i ventilatori.", "dopuna": ""}, {"t": 2370, "dio": "1 Upoznavanje", "naslov": "Kako radi: tok energije i signala u ormaru", "str": "upoz", "radnje": [["meni", 50], ["cekaj", 4], ["tema"], ["cekaj", 10], ["klikT", "Motors On"], ["cekaj", 16], ["klikT", "Kočenje"], ["cekaj", 16], ["tema"]], "klik": "Animacija „ormarIRC5”: Motors On, Kočenje.", "tekst": "Energija ide iz mreže kroz mrežni filtar u napajanje i pogonsku jedinicu, a odatle kroz sklopnike i kabel R1.MP do motora. Signali idu drugim putem: glavno računalo planira gibanje, osno računalo regulira osi, privjesak je spojen mrežom na priključak LAN1, a mjerni sustav vraća kutove kroz R1.SMB. Kad robot koči, motori rade kao generatori — tu energiju troši otpornik za kočenje.", "dopuna": ""}, {"t": 2460, "dio": "1 Upoznavanje", "naslov": "Kako radi: sigurnosni lanac", "str": "upoz", "radnje": [["meni", 77], ["cekaj", 6], ["tema"], ["cekaj", 8], ["klikT", "Ručni"], ["cekaj", 8], ["klikT", "Motors On"], ["cekaj", 12], ["klikT", "Automatski"], ["cekaj", 8], ["klikT", "Motors On"], ["cekaj", 10], ["tema"]], "klik": "Stavka „Sigurnosni lanac”; animacija: Ručni / Automatski, Motors On.", "tekst": "IRC5 ima dva jednaka sigurnosna lanca. U njima su ulazi za nužno zaustavljanje, automatsko zaustavljanje, opće zaustavljanje, uređaj za omogućavanje i granične sklopke. Motori smiju dobiti napajanje tek kad su oba lanca zatvorena: tada se uključe sklopnici motora, a poseban sklopnik otpušta kočnice. Ako se lanci ne slažu — jedan zatvoren, drugi otvoren — ormar to otkrije kao kvar i ne dopušta Motors On. U automatskom načinu vrata zaštitne ograde obično su vezana na automatsko zaustavljanje.", "dopuna": "Pitanje: zašto su lanci dva i jednaki, umjesto jednog jačeg?"}, {"t": 2580, "dio": "1 Upoznavanje", "naslov": "Kako radi: načini rada", "str": "upoz", "radnje": [["meni", 76], ["cekaj", 6], ["tema"], ["cekaj", 8], ["klikT", "Auto"], ["cekaj", 8], ["klikT", "Ručni (smanjena brzina)"], ["cekaj", 6], ["klizac", "Programirana brzina", 1000, 4], ["cekaj", 10], ["klikT", "Ručni 100 % (opcija)"], ["cekaj", 10], ["tema"]], "klik": "Stavka „Načini rada”; animacija: Auto, Ručni (smanjena brzina), klizač programirane brzine, Ručni 100 %.", "tekst": "Robot ima tri načina rada. Automatski — program se izvodi, a u ćeliji nema nikoga. Ručni sa smanjenom brzinom — za učenje točaka i probu programa: brzina alata ograničena je na 250 milimetara u sekundi, koliko god programirali. Treći, ručni s punom brzinom, je opcija i nije dostupan svugdje; traži držanje tipke „hold-to-run” i uređaja za omogućavanje. Način se bira preklopnikom s ključem na ormaru.", "dopuna": "Pitanje: zašto je ograničenje od 250 mm/s izabrano baš tako — koliko daleko robot prijeđe dok čovjek reagira?"}, {"t": 2700, "dio": "1 Upoznavanje", "naslov": "Privjesak FlexPendant i uređaj za omogućavanje", "str": "upoz", "radnje": [["meni", 68], ["cekaj", 8], ["meni", 69], ["cekaj", 5], ["meni", 70], ["cekaj", 5], ["meni", 73], ["cekaj", 5], ["meni", 74], ["cekaj", 5], ["meni", 72], ["cekaj", 5], ["tema"], ["cekaj", 6], ["klikT", "Ručni"], ["klikT", "2 — lagano"], ["cekaj", 8], ["klikT", "3 — jako"], ["cekaj", 8], ["klikT", "1 — pusti"], ["cekaj", 6], ["tema"]], "klik": "Stavka „Privjesak FlexPendant” i podstavke; animacija tripoložajnog uređaja: 2 — lagano, 3 — jako, 1 — pusti.", "tekst": "FlexPendant ima oko kilogram, dodirni zaslon u boji, palicu za ručno vođenje, gljivu za nužno zaustavljanje, četiri programirljive tipke, tipke Start, Stop i korak naprijed i natrag, te USB priključak. Na stražnjoj strani je tripoložajni uređaj za omogućavanje: gibanje u ručnom načinu dopušteno je samo u srednjem položaju. Pušteno ili jako stisnuto znači stop — u opasnosti čovjek ili pusti ruku ili je grčevito stisne. Iz jakog pritiska ne može se izravno natrag u gibanje: tipku treba pustiti do kraja.", "dopuna": ""}, {"t": 2850, "dio": "1 Upoznavanje", "naslov": "Kako radi: kategorije zaustavljanja", "str": "upoz", "radnje": [["meni", 78], ["cekaj", 6], ["tema"], ["cekaj", 6], ["klikT", "ES/AS/GS, kat. 0"], ["klikT", "Zaustavi"], ["cekaj", 12], ["klikT", "Ispočetka"], ["klikT", "ES/AS/GS, kat. 1"], ["klikT", "Zaustavi"], ["cekaj", 12], ["klikT", "Ispočetka"], ["klikT", "Stop programa"], ["klikT", "Zaustavi"], ["cekaj", 10], ["tema"]], "klik": "Stavka „Kategorije zaustavljanja”; animacija: kategorija 0, kategorija 1, Stop programa.", "tekst": "Norme razlikuju kategorije zaustavljanja. Kategorija 0: napajanje motora odmah se prekida, a robot zaustavljaju kočnice. Kategorija 1: robot se najprije kontrolirano zaustavi, pa se tek onda prekida napajanje. Na IRC5 ulazi nužnog, automatskog i općeg zaustavljanja mogu se konfigurirati kao kategorija 0 ili 1. Tipka Stop na privjesku samo zaustavi program — motori ostaju pod napajanjem; to nije sigurnosna funkcija.", "dopuna": ""}, {"t": 2940, "dio": "1 Upoznavanje", "naslov": "RobotWare, održavanje i podaci", "str": "upoz", "radnje": [["meni", 79], ["cekaj", 10], ["meni", 80], ["cekaj", 10], ["meni", 81], ["cekaj", 6], ["skrol", "#podaci"], ["cekaj", 14]], "klik": "Stavke „RobotWare i RobotStudio”, „Održavanje”, „Podaci o robotu”; tablice podataka s izvorima.", "tekst": "Softver ormara zove se RobotWare; na IRC5 su to generacije 5 i 6, a programi se pišu u ABB-ovom jeziku RAPID. Održavanje ukratko: pregled remena i zamjena baterije svakih 36 mjeseci, generalni servis oko 30 000 sati. Ispod 3D prikaza su tablice: osnovni podaci, osi s opsegom, brzinom i količinom masti, ormar i privjesak — svaki podatak s brojem izvora. Izvori su ABB-ovi dokumenti: specifikacija proizvoda, list podataka i priručnici.", "dopuna": ""}, {"t": 3030, "dio": "2 Kinematika", "naslov": "Izravna kinematika: kutovi osi", "str": "kin", "radnje": [["str", "kin"], ["cekaj", 5], ["poravnaj"], ["cekaj", 3], ["raspon", "#klizaci input[data-i=\"0\"]", 40, 4], ["cekaj", 6], ["raspon", "#klizaci input[data-i=\"1\"]", 30, 4], ["cekaj", 6], ["raspon", "#klizaci input[data-i=\"2\"]", -25, 4], ["cekaj", 6], ["raspon", "#klizaci input[data-i=\"4\"]", 60, 4], ["cekaj", 6], ["lebdi", "#izl-izravna"], ["cekaj", 8]], "klik": "Stranica Kinematika robota, kartica Izravna: klizači q1–q6, desno položaj, središte zapešća, Euler ZYX, kvaternion.", "tekst": "Drugo poglavlje: kinematika. Izravna kinematika iz šest kutova osi računa gdje je prirubnica i kako je okrenuta. Pomičem os 1, pa os 2, os 3 i os 5. Desno se uživo mijenja položaj prirubnice u milimetrima, položaj središta zapešća, orijentacija kao Eulerovi kutovi ZYX — kako ih prikazuje RobotStudio — i kvaternion kakav piše u RAPID-u. Zadnji redak uspoređuje položaj iz 3D modela i iz našeg računa: odstupanje je nula, model i račun se slažu.", "dopuna": ""}, {"t": 3150, "dio": "2 Kinematika", "naslov": "Nulta poza i matrica T06", "str": "kin", "radnje": [["klik", "[data-poza=\"nula\"]"], ["cekaj", 10], ["lebdi", "#izl-izravna"], ["cekaj", 6], ["klik", ".kin-mat summary"], ["cekaj", 12], ["klik", "[data-poza=\"pocetna\"]"], ["cekaj", 8], ["klik", "[data-poza=\"nasumicna\"]"], ["cekaj", 8], ["klik", ".kin-mat summary"], ["cekaj", 3]], "klik": "Gumbi Nulta poza, Alat prema dolje, Nasumična poza; matrica T06 u rasklopnom dijelu.", "tekst": "U nultoj pozi prirubnica je na x 374, y 0, z 630 milimetara: 302 plus 72 naprijed, a 290 plus 270 plus 70 gore. Matrica T06 je umnožak šest matrica A, po jedna za svaki redak DH tablice. Gornji lijevi dio 3 puta 3 je orijentacija — stupci su osi x, y i z alata izražene u bazi — a desni stupac je položaj. „Alat prema dolje” je poza iz koje se najčešće radi: os 5 na 90°, pa os z alata gleda u pod.", "dopuna": ""}, {"t": 3270, "dio": "2 Kinematika", "naslov": "DH tablica IRB 120", "str": "kin", "radnje": [["skrolT", "Izravna kinematika"], ["cekaj", 6], ["skrol", ".uz-tbl-omot"], ["cekaj", 30], ["poravnaj"], ["cekaj", 3]], "klik": "Tekst ispod simulatora: formula T06 i DH tablica (a, α, d, pomak, θ).", "tekst": "Svaki redak DH tablice opisuje prijelaz iz jednog koordinatnog sustava u sljedeći četirima brojevima: zakret θ oko z, pomak d uzduž z, pomak a uzduž nove osi x i zakret α oko nje. Za IRB 120: d1 je 290, a2 270, a3 70, d4 302, d6 72 milimetra. Uz os 2 je pomak od minus 90°, a uz os 6 od 180°, jer ABB-ova nulta poza nije ona koju bi dalo samo DH pravilo. Isti lanac korak po korak, s momentima u motorima, gradi se u alatu „Kinematika i dinamika industrijskog robota” u području Industrijska robotika.", "dopuna": ""}, {"t": 3360, "dio": "2 Kinematika", "naslov": "Inverzna kinematika: osam rješenja", "str": "kin", "radnje": [["klik", "#t-inverzna"], ["cekaj", 4], ["klik", "[data-cilj=\"dolje\"]"], ["cekaj", 10], ["lebdi", "#rjesenja"], ["cekaj", 10], ["klik", "#rjesenja [data-rj=\"2\"]"], ["cekaj", 10], ["klik", "#rjesenja [data-rj=\"0\"]"], ["cekaj", 10], ["klik", "#rjesenja [data-rj=\"2\"]"], ["cekaj", 6]], "klik": "Kartica Inverzna: primjer „alat dolje ispred robota”, tablica 8 rješenja (rame, lakat, zapešće, u granicama ili izvan), „Prikaži”.", "tekst": "Inverzna kinematika radi obrnuto: zadam položaj i orijentaciju alata — ovdje točku 380, 0, 200 milimetara s alatom okomito dolje — a program traži kutove osi. Pronašao je osam rješenja: rame naprijed ili natrag, lakat gore ili dolje, zapešće s pozitivnom ili negativnom osi 5. U granicama osi ostalo je samo jedno — ostala bi tražila kut izvan opsega. Klikom na „Prikaži” robot se pomakne u to rješenje. Svako rješenje provjereno je izravnom kinematikom.", "dopuna": "Pitanje: ako su dva rješenja u granicama osi, koje biste izabrali za pick & place i zašto?"}, {"t": 3510, "dio": "2 Kinematika", "naslov": "Kako se rješava i singularnosti", "str": "kin", "radnje": [["klik", "[data-cilj=\"bok\"]"], ["cekaj", 10], ["klik", "#rjesenja [data-rj=\"1\"]"], ["cekaj", 6], ["klik", "[data-cilj=\"daleko\"]"], ["cekaj", 8], ["lebdi", "#ik-stanje"], ["cekaj", 6], ["skrolT", "Inverzna kinematika"], ["cekaj", 20], ["skrol", ".okvir.pazi"], ["cekaj", 14]], "klik": "Primjeri „alat vodoravno, ulijevo” i „izvan dosega”; tekst o rješavanju u četiri koraka i okvir „Singularni položaji”.", "tekst": "Kako se to računa? Zbog sfernog zapešća zadaća se raspada na dvije. Od prirubnice se vratimo 72 milimetra uz os alata do središta zapešća. Os 1 gleda prema njemu — dva rješenja. Rame, lakat i zapešće čine trokut, pa kosinusni poučak daje lakat gore ili dolje. Ostatak orijentacije rade osi 4 do 6 — opet dva rješenja. Dva puta dva puta dva je osam. Ako je točka izvan dosega, rješenja nema. Upravljanje bira rješenje prema konfiguraciji spremljenoj u točki — u RAPID-u robtarget nosi i confdata — pa točka snimljena s laktom gore ne preskoči u lakat dolje.", "dopuna": "Pitanje: u kojoj točki ispred robota biste očekivali singularnost ramena?"}, {"t": 3630, "dio": "3 Stvarni robot", "naslov": "Robot u laboratoriju", "str": "lab", "radnje": [["str", "lab"], ["cekaj", 5], ["skrolEl", "#robot"], ["cekaj", 30], ["skrolEl", "#privjesak"], ["cekaj", 30]], "klik": "Stranica „IRB 120 u laboratoriju”: fotografije stvarnog robota, prihvatnice, ormara i privjeska.", "tekst": "Treće poglavlje: isti robot, stvarni, u laboratoriju. Na fotografijama su robot na stolu s našom prihvatnicom — paralelna hvataljka s prstima, krak sa sisaljkom i držač flomastera, isprintani 3D pisačem prema istom modelu koji vidite u simulatoru — zatim ormar IRC5 Compact i privjesak. Usporedite zaslon privjeska sa simulatorom „robot u petlji”: iste kartice, isti izbornici i iste poruke. To je cilj — da se na stvarnom robotu snađete jer ste sve već prošli u pregledniku.", "dopuna": ""}, {"t": 3750, "dio": "3 Stvarni robot", "naslov": "Od G-koda do crteža na stvarnom robotu", "str": "lab", "radnje": [["skrolEl", "#program"], ["cekaj", 40], ["skrolEl", "#crtanje"], ["cekaj", 40]], "klik": "Sekcije o programu i crtanju: G-kod iz simulatora, pretvorba u RAPID, nulta točka teksta, proba u zraku, ispis.", "tekst": "Na stvarnom robotu ponovili smo cijeli lanac. Prvo sigurnosna kopija sustava. Zatim G-kod iz našeg simulatora crtanja, pretvorba u RAPID-ov modul, učitavanje modula na kontroler i alat — flomaster u bočnom držaču. Nulta točka teksta snimi se tamo gdje vrh flomastera dodiruje ploču; tekst se pomiče samo po x i y. Prvo proba u zraku, iznad ploče, pa tek onda pravi ispis. Na kraju se probni moduli spremaju i uklanjaju, a robot se vraća na prethodni program paletizacije.", "dopuna": ""}, {"t": 3870, "dio": "3 Stvarni robot", "naslov": "Zamke na stvarnom robotu", "str": "lab", "radnje": [["skrolEl", "#zamke"], ["cekaj", 60]], "klik": "Sekcija „Zamke”: što je na stvarnom robotu pošlo krivo i kako smo riješili.", "tekst": "Stvarni robot uvijek iznenadi. Dvije tipične zamke: učitani modul s vlastitom rutinom main sukobljava se s glavnim programom, pa robot ne zna odakle krenuti; i ime modula koje već postoji u sustavu. Rješenje je pokretanje točno određene rutine i jedinstvena imena modula. Simulator te zamke danas javlja istim porukama kao stvarni kontroler — upravo zato što smo ih prvo doživjeli na robotu. Simulator nije zamjena za robota, nego priprema za njega.", "dopuna": "Pitanje: koju biste zamku dodali na popis iz vlastitog iskustva sa strojevima?"}, {"t": 3990, "dio": "4 Robot u petlji", "naslov": "Stanica u petlji s PLC-om", "str": "petlja", "radnje": [["str", "petlja"], ["cekaj", 6], ["skrolEl", "#k-scena"], ["cekaj", 6], ["klik", "#pr-kockice"], ["cekaj", 40], ["skrolEl", "#k-postav"], ["cekaj", 20]], "klik": "Simulator „IRB 120 u petlji”: 3D stanica, primjer paletizacije kockica, postav stanice.", "tekst": "Četvrto poglavlje je poglavlje Upravljanje: simulator robota u petlji. Robot je u stanici s pokretnom trakom, fotoćelijom, okretnim stolom i paletom. Paletizacija kockica radi kao na stvarnom robotu: traka doveze kockicu, fotoćelija je javi PLC-u, PLC javi robotu, robot je uzme i složi u raster. Postav stanice možete mijenjati: samo robot, robot s trakom, ili cijela stanica.", "dopuna": ""}, {"t": 4110, "dio": "4 Robot u petlji", "naslov": "Virtualni FlexPendant, PLC i HMI", "str": "petlja", "radnje": [["skrolEl", "#fp"], ["cekaj", 30], ["skrolEl", "#k-plc"], ["cekaj", 25], ["skrolEl", "#k-hmi"], ["cekaj", 20]], "klik": "Virtualni FlexPendant, PLC s ladder dijagramom i tablicom signala, HMI panel.", "tekst": "Desno je virtualni FlexPendant s istim karticama kao na stvarnom robotu: ručno vođenje, programski urednik, točke i poruke. Programi se pišu u podskupu RAPID-a, uključujući čekanje na ulaze i postavljanje izlaza. Ispod je PLC s ladder dijagramom i tablicom signala između robota i PLC-a — ta tablica je ugovor: isti signali vrijede i kad jednog dana na mjesto emuliranog PLC-a spojimo pravi. I HMI panel s gumbima i stanjem stanice.", "dopuna": ""}, {"t": 4260, "dio": "5 RobotStudio", "naslov": "Programiranje izvan robota", "str": "rs", "radnje": [["str", "rs"], ["cekaj", 5], ["skrolT", "Što je programiranje izvan robota"], ["cekaj", 30]], "klik": "Stranica RobotStudio: tekst „Što je programiranje izvan robota”.", "tekst": "Peto poglavlje: RobotStudio. Robot se programira na dva načina. Učenjem na robotu: programer privjeskom vodi robota do svake točke i sprema je — a robot za to vrijeme ne radi. Ili programiranjem izvan robota: stanica se složi na računalu, točke se izvedu iz CAD modela, program se napiše i isproba u simulaciji, a na robot se prenese gotov. RobotStudio je ABB-ov program za to; programi se pišu u RAPID-u, istom jeziku koji izvodi IRC5.", "dopuna": ""}, {"t": 4380, "dio": "5 RobotStudio", "naslov": "Virtualni kontroler", "str": "rs", "radnje": [["skrolT", "Virtualni kontroler"], ["cekaj", 10], ["skrol", "figure.crtez"], ["cekaj", 30]], "klik": "Odjeljak „Virtualni kontroler” i shema: isti RobotWare u virtualnom i stvarnom kontroleru.", "tekst": "Ključ RobotStudija je virtualni kontroler. Većina simulatora ima vlastiti kod za kinematiku i gibanje. RobotStudio pokreće isti softver RobotWare koji radi u ormaru, samo na računalu. Zato su putanje, brzine i vremena ciklusa u simulaciji vrlo blizu stvarnih, a poruke o greškama iste kao na privjesku. Ono što virtualni kontroler ne zna: stvarni položaj obratka, savijanje alata, trenje u hvataljci, kašnjenje senzora. Zato prvi prolaz na robotu uvijek ide smanjenom brzinom.", "dopuna": "Pitanje: koja dva fizikalna učinka virtualni kontroler sigurno ne vidi, a na stvarnom robotu mogu pokvariti putanju?"}, {"t": 4500, "dio": "5 RobotStudio", "naslov": "Tok rada i kartice programa", "str": "rs", "radnje": [["skrolT", "Tok rada"], ["cekaj", 30], ["skrolT", "Glavne kartice"], ["cekaj", 18]], "klik": "Shema toka rada u osam koraka; tablica glavnih kartica (Home, Modeling, Simulation, Controller, RAPID, Add-Ins).", "tekst": "Tok rada ima osam koraka: stanica s robotom, alatom i obratkom; koordinatni sustavi — tooldata za vrh alata i wobjdata za obradak; točke i putanje, ručno ili AutoPathom iz rubova CAD modela; program u RAPID-u; simulacija sa sudarima, dosegom i vremenom ciklusa; prijenos na kontroler; dotjerivanje točaka privjeskom; i proizvodnja. Petlja simulacija–ispravak ponavlja se dok program ne prođe bez sudara. Kartice programa slijede taj redoslijed: Home i Modeling za stanicu, Simulation, Controller za virtualni i stvarni kontroler, RAPID za kod i Add-Ins za dodatke.", "dopuna": ""}, {"t": 4620, "dio": "5 RobotStudio", "naslov": "Licence i usporedba s našim simulatorima", "str": "rs", "radnje": [["skrolT", "Inačice i licence"], ["cekaj", 20], ["skrolT", "RobotStudio i naši simulatori"], ["cekaj", 25]], "klik": "Tablica inačica i licenci; tablica usporedbe RobotStudija i simulatora u pregledniku.", "tekst": "RobotStudio ima besplatnu osnovnu razinu, Basic i Premium. Za obrazovne ustanove ABB nudi besplatnu licencu s Premium funkcijama, do 100 korisnika, samo za nekomercijalnu uporabu. Najnovija inačica koju smo našli je 2026.2, za Windows 11. Naši simulatori u pregledniku ne pokreću RobotWare — računaju kinematiku vlastitim kodom. Rade bez instalacije, i na mobitelu, ali nisu kopija kontrolera. Preporučeni put: prvo preglednik, za razumijevanje; onda RobotStudio, za pravi program; onda stvarni robot.", "dopuna": "Pitanje: za koji biste zadatak izabrali preglednik, a za koji RobotStudio?"}, {"t": 4710, "dio": "5 RobotStudio", "naslov": "Vježba: složi korake redom", "str": "rs", "radnje": [["skrolEl", "#rs-vjezba"], ["cekaj", 8], ["klikNiz", "#rs-ponuda [data-i=\"N\"]", 0, 7, 6], ["cekaj", 8]], "klik": "Vježba: ispremiješani koraci toka rada, klik redom od prvog do zadnjeg.", "tekst": "Vježba: koraci toka rada su ispremiješani, a vi ih klikate redom kojim se rade. Prvo stanica, pa koordinatni sustavi alata i obratka, pa točke i putanje, pa program, simulacija, prijenos, dotjerivanje i proizvodnja. Pogrešan klik se označi — i to je smisao vježbe: zapitati se što mora postojati prije sljedećeg koraka. Na primjer, točke nemaju smisla dok nije zadan alat, jer se točka uvijek odnosi na vrh alata.", "dopuna": ""}, {"t": 4830, "dio": "5 RobotStudio", "naslov": "RobotStudio HyperReality", "str": "rs", "radnje": [["skrolT", "RobotStudio HyperReality"], ["cekaj", 50]], "klik": "Odjeljak „RobotStudio HyperReality”.", "tekst": "U ožujku 2026. ABB je s NVIDIA-om najavio RobotStudio HyperReality: RobotStudio povezan s knjižnicama platforme Omniverse. Virtualni kontroler i dalje računa gibanje, a Omniverse dodaje fotorealističnu scenu — svjetlo, odsjaje, sjene i kameru. Iz takve scene mogu se automatski napraviti tisuće slika za treniranje modela strojnog vida. ABB navodi točnost prijenosa iz simulacije u stvarnost do 99 %, do 80 % kraće puštanje u rad i do 40 % niže troškove — to su ABB-ove brojke, ne neovisna mjerenja. Početkom studenoga ABB i NVIDIA najavili su i zajednički obrazovni program za fizičku AI, s certifikatom; pojedinosti još nisu objavljene.", "dopuna": "Pitanje: kako biste provjerili tvrdnju od 99 % na vlastitom robotu?"}, {"t": 4920, "dio": "6 Prema fizičkoj AI", "naslov": "Što je fizička AI i gdje smo mi", "str": "fa", "radnje": [["str", "fa"], ["cekaj", 5], ["skrolT", "Što je fizička AI"], ["cekaj", 25], ["skrolT", "Pojmovi iz najnovijih"], ["cekaj", 30]], "klik": "Stranica „Prema fizičkoj AI”: objašnjenje pojma; tablica pojmova s oznakama danas / djelomično / smjer.", "tekst": "Zadnje poglavlje gleda naprijed. Fizička umjetna inteligencija je AI koja ne ostaje na zaslonu, nego upravlja strojem u stvarnom prostoru — robotskom rukom, mobilnim robotom, dronom. Model se uči u simulaciji, na sintetičkim podacima, pa se prenosi na stvarni stroj. U tablici je svaki pojam iz najava uz stanje za IRB 120 kod nas: RobotStudio — danas; virtualni kontroler — samo u RobotStudiju; Omniverse i OpenUSD — smjer; HyperReality — dijelovi postoje odvojeno. Iskreno: naši simulatori programiraju robota, ali još ne uče.", "dopuna": ""}, {"t": 5070, "dio": "6 Prema fizičkoj AI", "naslov": "Put u pet koraka", "str": "fa", "radnje": [["skrolT", "Put u pet koraka"], ["cekaj", 20], ["skrol", ".fa-koraci"], ["cekaj", 40]], "klik": "Shema puta u pet koraka i kartice koraka s poveznicama.", "tekst": "Put ima pet koraka. Prvi, programirani robot — točke, G-kod, RAPID — postoji danas. Drugi, robot u petlji sa signalima i PLC-om, također danas, s emuliranim PLC-om. Treći je percepcija u petlji: kamera u simulatoru vidi predmet, a isti algoritam radi s web-kamerom na stvarnom robotu — u pripremi, a stanica za skeniranje je prvi korak. Četvrti su sintetički podaci u malom: stotinjak slika predmeta iz simulatora pod različitim svjetlom, i na njima jednostavan klasifikator. Peti — virtualni kontroler i HyperReality — smjer, za koji treba jača oprema.", "dopuna": "Pitanje: što bi vaš laboratorij prije napravio — kupio jednu jaku grafičku stanicu ili stavio web-kameru na robota koji već ima?"}, {"t": 5190, "dio": "6 Prema fizičkoj AI", "naslov": "Što to znači za nastavu", "str": "fa", "radnje": [["skrolT", "Što to znači za nastavu"], ["cekaj", 30], ["skrolT", "Tri pitanja"], ["cekaj", 20]], "klik": "Odjeljci „Što to znači za nastavu” i „Tri pitanja za razmišljanje”.", "tekst": "Za nastavu to znači da simulator postaje glavna učionica: u simulaciji se uči ono što se na stvarnom robotu ne može ili ne smije, a stvarni robot dolazi na kraju, kao provjera. Naši simulatori to već rade za kinematiku, programiranje i puštanje u rad; sljedeći korak je da u njima počne i učenje. Na kraju stranice su tri pitanja za razmišljanje — ponesite ih kući.", "dopuna": ""}, {"t": 5280, "dio": "Kraj", "naslov": "Sažetak i zadatak", "str": "index", "radnje": [["str", "index"], ["cekaj", 4], ["skrol", "#goals"], ["cekaj", 20], ["skrol", ".moduli"], ["cekaj", 10]], "klik": "Povratak na naslovnicu; ishodi „Moći ću”.", "tekst": "Sažmimo. IRB 120 je šestoosni robot s osima 1 i 2 pogonjenima motorima s ugrađenim prijenosnikom, osima 3 i 5 preko zupčastog remena, i sfernim zapešćem. Mjerni sustav pamti okretaje uz bateriju, a kalibracija vraća točan nulti kut. Ormar IRC5 Compact ima dva sigurnosna lanca, a privjesak uređaj za omogućavanje. Iz kutova računamo položaj alata, a iz položaja do osam rješenja za kutove. Za samostalni rad: prođite sve stavke Upoznavanja do kvačice i u Kinematici za tri točke po izboru pronađite sva rješenja i objasnite zašto su neka izvan granica. Hvala na pažnji.", "dopuna": ""}]; window.KRAJ = 5400;</script>

  function sad() { return vlastiti() ? (igra ? sat + (performance.now() - t0) / 1000 * BRZ : sat) : sat; }
  function postavi(s) { sat = Math.max(0, Math.min(KRAJ, s)); t0 = performance.now(); }
  function cmd(c, a) { if (!vlastiti() && bc) { bc.postMessage({ cmd: c, a }); return; }
    const s = sad();
    if (c === 'igraj') { if (igra) { sat = s; igra = false; } else { t0 = performance.now(); igra = true; } }
    if (c === 'dalje') { const i = korakU(s); postavi(i + 1 < S.length ? S[i + 1].t : KRAJ); }
    if (c === 'prije') { const i = korakU(s); postavi(s - S[i].t > 3 || i === 0 ? S[i].t : S[i - 1].t); }
    if (c === 'pomak') postavi(s + a);
  }
  document.getElementById('c-igraj').onclick = () => cmd('igraj');
  document.getElementById('c-dalje').onclick = () => cmd('dalje');
  document.getElementById('c-prije').onclick = () => cmd('prije');

  document.getElementById('c-p5').onclick = () => cmd('pomak', 5);
  addEventListener('keydown', (e) => { if (e.key === ' ') { e.preventDefault(); cmd('igraj'); } else if (e.key === 'ArrowRight') cmd('dalje'); else if (e.key === 'ArrowLeft') cmd('prije'); });
  if (bc) bc.onmessage = (e) => { const d = e.data || {}; if (typeof d.sat === 'number') { zadnjePoruka = performance.now(); sat = d.sat; igra = !!d.igra; } };
  function crtaj() {

function tik() {

  if (igra) sat = Math.min(KRAJ, sat + (n - tZadnji) / 1000 * BRZ);
  tZadnji = n;
  if (igra) { let i = korakU(sat);
    /* „čekaj ⏭ na kraju koraka” (uključuje se u čitaču s OBS-om): sat stane prije sljedećeg koraka */
    if (cekajKraj && trenutni >= 0 && i > trenutni) { sat = S[i].t - 0.05; igra = false; ceka = true; i = trenutni; }
    if (igra && i !== trenutni && sat >= S[i].t) pokreniKorak(i); if (sat >= KRAJ) igra = false; }
  document.getElementById('b-vr').textContent = mmss(sat) + ' / ' + mmss(KRAJ);
  document.getElementById('b-nas').textContent = trenutni >= 0 ? S[trenutni].naslov : '';
  document.getElementById('b-igraj').textContent = igra ? '⏸' : '▶';
  requestAnimationFrame(tik);
}
setInterval(() => { if (bc) bc.postMessage({ sat, igra, i: trenutni, ceka }); }, 250);

function kreni() { document.getElementById('start').hidden = true; ceka = false; sat = 0; trenutni = -1; igra = true; tZadnji = performance.now(); }
function skok(i) { ceka = false; i = Math.max(0, Math.min(S.length - 1, i)); sat = S[i].t; trenutni = -1; if (!igra) pokreniKorak(i); }
function postavi(t) { ceka = false; sat = Math.max(0, Math.min(KRAJ, t)); trenutni = -1; if (!igra) pokreniKorak(korakU(sat)); }
document.getElementById('b-igraj').onclick = igrajPauza;
document.getElementById('b-dalje').onclick = dalje;

function tipka(e) {

async function cekaj(s, tk) { let ost = s; let z = performance.now(); while (ost > 0) { await new Promise((r) => setTimeout(r, 50)); provjeri(tk); const n = performance.now(); if (igra) ost -= (n - z) / 1000 * BRZ; z = n; } }
